<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POP! 技术的性质 · 波普答题</title>
<style>
/* ═══════════════════════════════════════
   波普艺术 Pop Art 风格
   漫画网点 · 高饱和色彩 · 粗轮廓
   ═══════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pop-red: #e63946;
  --pop-blue: #1d3557;
  --pop-yellow: #ffd166;
  --pop-cyan: #06d6a0;
  --pop-pink: #ff6b9d;
  --pop-orange: #ff8800;
  --pop-white: #f1faee;
  --pop-dot: #ccc;
  --text: #1a1a1a;
  --text-light: #f0f0f0;
  --font: 'Oswald','Arial Black',sans-serif;
  --font-body: 'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif;
}
html{font-size:20px}
body{
  font-family:var(--font-body);
  background:var(--pop-white);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  justify-content:center;
  position:relative;
}
/* 波普网点背景 */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,var(--pop-dot) 1px,transparent 1px);
  background-size:20px 20px;opacity:.3;
}
/* 漫画云装饰 */
.comic-cloud{
  position:fixed;font-size:8rem;opacity:.04;pointer-events:none;z-index:0;
  font-family:var(--font);font-weight:700;
  text-transform:uppercase;
}
.comic-cloud:nth-child(1){top:20px;left:20px;color:var(--pop-red);transform:rotate(-10deg);}
.comic-cloud:nth-child(2){bottom:80px;right:30px;color:var(--pop-blue);transform:rotate(15deg);font-size:10rem;}
.comic-cloud:nth-child(3){top:40%;right:10px;color:var(--pop-yellow);transform:rotate(-5deg);font-size:5rem;}

#app{
  position:relative;z-index:1;
  width:100%;max-width:880px;
  min-height:100vh;
  padding:24px 16px 50px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}

/* 漫画标题栏 */
.pop-header{
  width:100%;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px;
  background:var(--pop-yellow);
  border:4px solid var(--text);
  position:relative;
  box-shadow:6px 6px 0 var(--text);
}
.pop-header h1{
  font-family:var(--font);
  font-size:1rem;font-weight:700;
  color:var(--pop-red);
  text-transform:uppercase;
  letter-spacing:2px;
  text-shadow:2px 2px 0 rgba(0,0,0,.1);
}
.pop-dots{display:flex;gap:5px;}
.pop-dot{
  width:18px;height:18px;border-radius:50%;
  border:3px solid var(--text);
  transition:all .3s;
}
.pop-dot.done{background:var(--pop-cyan);border-color:var(--text);}
.pop-dot.active{background:var(--pop-red);border-color:var(--text);animation:pop-bounce .5s ease infinite;}
.pop-dot.future{background:var(--pop-white);}
@keyframes pop-bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* 漫画卡片 */
.pop-card{
  width:100%;
  padding:24px 20px;
  background:var(--pop-white);
  border:4px solid var(--text);
  box-shadow:6px 6px 0 var(--text);
  animation:pop-in .35s ease-out;
}
@keyframes pop-in{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.pop-title{
  font-family:var(--font);
  font-size:1.1rem;font-weight:700;text-align:center;margin-bottom:16px;
  color:var(--pop-blue);
  text-transform:uppercase;letter-spacing:3px;
  text-shadow:3px 3px 0 rgba(0,0,0,.06);
  position:relative;
  display:inline-block;width:100%;
}
.pop-title::after{content:'★';color:var(--pop-red);position:absolute;right:0;font-size:.8rem;}

/* 设置 */
.setup-group{display:flex;flex-direction:column;gap:14px;max-width:380px;margin:0 auto;}
.setup-row{display:flex;flex-direction:column;gap:4px;}
.setup-row label{font-family:var(--font);font-size:.7rem;font-weight:600;color:var(--pop-red);letter-spacing:2px;text-transform:uppercase;}
.setup-row select,.setup-row button{
  width:100%;padding:12px 16px;
  background:var(--pop-white);
  border:3px solid var(--text);
  color:var(--text);font-size:.9rem;font-family:var(--font-body);
  cursor:pointer;transition:all .15s;outline:none;font-weight:500;
}
.setup-row select:hover,.setup-row select:focus{border-color:var(--pop-red);background:#fff;}
.setup-row select option{background:#fff;color:var(--text);}
.btn-pop{
  background:var(--pop-red)!important;
  border:3px solid var(--text)!important;
  color:var(--pop-white)!important;font-family:var(--font)!important;
  font-size:.85rem!important;font-weight:700!important;
  letter-spacing:2px;text-transform:uppercase;
  transition:all .1s!important;
  box-shadow:4px 4px 0 var(--text)!important;
}
.btn-pop:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--text)!important;}
.btn-pop:active{transform:translate(4px,4px);box-shadow:none!important;}
.btn-pop:disabled{opacity:.3!important;cursor:not-allowed;transform:none!important;}

/* 点名 - 漫画风格 */
.pick-section{text-align:center;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pick-pop-area{width:100%;max-width:380px;min-height:110px;display:flex;align-items:center;justify-content:center;margin:4px 0;}
.pick-pop-name{
  font-family:var(--font);
  font-size:3.2rem;font-weight:700;z-index:2;
  color:var(--pop-blue);
  text-transform:uppercase;
  letter-spacing:6px;
  text-shadow:4px 4px 0 rgba(0,0,0,.08);
}
.pick-pop-name.rolling{animation:pop-shake .08s infinite;}
@keyframes pop-shake{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
.pick-pop-name.result{
  animation:pop-reveal .4s cubic-bezier(.34,1.56,.64,1);
  color:var(--pop-red);
  text-shadow:4px 4px 0 var(--pop-yellow),-2px-2px 0 rgba(0,0,0,.06);
}
@keyframes pop-reveal{0%{opacity:0;transform:scale(.3) rotate(-20deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.pick-hint{font-family:var(--font);font-size:.7rem;color:var(--text);opacity:.5;margin-top:4px;letter-spacing:2px;}
.pick-class-tag{font-family:var(--font);font-size:.8rem;color:var(--pop-cyan);margin-top:2px;letter-spacing:2px;}
.btn-pop-pick{
  margin-top:10px;padding:10px 40px;
  background:var(--pop-cyan);border:3px solid var(--text);
  color:var(--text);font-family:var(--font);font-size:.7rem;font-weight:700;
  cursor:pointer;letter-spacing:2px;text-transform:uppercase;
  box-shadow:4px 4px 0 var(--text);
  transition:all .1s;
}
.btn-pop-pick:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--text);}
.btn-pop-pick:disabled{opacity:.25;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--text);}

/* 答题 - 漫画气泡 */
.quiz-section{text-align:center;}
.q-pop-num{font-family:var(--font);font-size:.85rem;font-weight:600;color:var(--pop-orange);letter-spacing:2px;}
.q-pop-princ{font-size:.7rem;font-weight:500;color:var(--pop-blue);margin-left:8px;}
.q-pop-text{
  font-size:1rem;line-height:1.7;margin:10px 0 14px;
  text-align:left;padding:16px 18px;
  background:#fff;
  border:3px solid var(--text);
  color:var(--text);font-weight:500;
  position:relative;
}
.q-pop-text::before{
  content:'💬';position:absolute;top:-14px;left:12px;
  font-size:1rem;
}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.option-btn{
  padding:13px 14px;
  background:#fff;
  border:3px solid var(--text);
  color:var(--text);font-size:.9rem;text-align:left;cursor:pointer;
  transition:all .1s;font-family:var(--font-body);line-height:1.5;font-weight:500;
  display:flex;align-items:flex-start;gap:10px;
}
.option-btn .opt-label{
  display:inline-flex;width:28px;height:28px;
  align-items:center;justify-content:center;
  font-family:var(--font);font-size:.7rem;font-weight:700;flex-shrink:0;
  background:var(--pop-yellow);
  border:2px solid var(--text);
  color:var(--text);
}
.option-btn:hover{background:var(--pop-yellow);}
.option-btn.selected{border-color:var(--pop-blue);background:#e8f0fe;}
.option-btn.selected .opt-label{background:var(--pop-blue);color:#fff;}
.option-btn.correct{border-color:var(--pop-cyan)!important;background:rgba(6,208,160,.08)!important;}
.option-btn.correct .opt-label{background:var(--pop-cyan)!important;color:var(--text)!important;}
.option-btn.wrong{border-color:var(--pop-red)!important;background:rgba(230,57,70,.06)!important;}
.option-btn.wrong .opt-label{background:var(--pop-red)!important;color:#fff!important;}
.option-btn.disabled{pointer-events:none;opacity:.35;}
.feedback-box{margin-top:12px;padding:10px 18px;font-size:.88rem;animation:pop-fade .25s;border:3px solid;font-weight:500;}
@keyframes pop-fade{from{opacity:0}to{opacity:1}}
.feedback-box.correct-fb{border-color:var(--pop-cyan);color:var(--text);background:rgba(6,208,160,.06);}
.feedback-box.wrong-fb{border-color:var(--pop-red);color:var(--pop-red);background:rgba(230,57,70,.04);}
.btn-pop-next{
  margin-top:12px;padding:10px 36px;
  background:var(--pop-yellow);border:3px solid var(--text);
  color:var(--text);font-family:var(--font);font-size:.7rem;font-weight:700;
  cursor:pointer;letter-spacing:2px;text-transform:uppercase;
  box-shadow:4px 4px 0 var(--text);
  transition:all .1s;
}
.btn-pop-next:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--text);}

/* 计分 */
.score-section{text-align:center;}
.score-big{
  font-family:var(--font);
  font-size:3.8rem;font-weight:700;
  color:var(--pop-red);
  text-shadow:5px 5px 0 var(--pop-yellow),-3px-3px 0 rgba(0,0,0,.04);
  animation:pop-score .6s cubic-bezier(.34,1.56,.64,1);
  margin:4px 0;
}
@keyframes pop-score{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
.score-label{font-family:var(--font);font-size:.7rem;font-weight:600;color:var(--text);opacity:.6;letter-spacing:2px;}
.score-detail{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
.score-stat{padding:4px 12px;border:2px solid var(--text);font-size:.8rem;font-weight:500;}
.score-stat strong{font-weight:700;color:var(--pop-red);}
.pop-bar-wrap{width:100%;max-width:400px;margin:8px auto;}
.pop-bar-bg{width:100%;height:12px;background:#fff;border:3px solid var(--text);}
.pop-bar-fill{height:100%;background:repeating-linear-gradient(90deg,var(--pop-yellow) 0,var(--pop-yellow) 10px,var(--pop-orange) 10px,var(--pop-orange) 20px);transition:width 1s;}
.pop-bar-label{display:flex;justify-content:space-between;font-family:var(--font);font-size:.8rem;font-weight:600;margin-top:2px;letter-spacing:1px;}

/* 最终 */
.final-section{text-align:center;}
.final-title{font-family:var(--font);font-size:1.2rem;font-weight:700;color:var(--pop-red);margin-bottom:2px;text-transform:uppercase;letter-spacing:3px;text-shadow:3px 3px 0 var(--pop-yellow);}
.final-sub{font-family:var(--font);font-size:.85rem;font-weight:600;color:var(--text);opacity:.5;margin-bottom:14px;letter-spacing:2px;}
.final-table{width:100%;border-collapse:collapse;margin:4px 0 14px;}
.final-table th{padding:8px 10px;text-align:left;font-family:var(--font);font-size:.8rem;font-weight:700;color:var(--pop-blue);border-bottom:3px solid var(--text);letter-spacing:1px;}
.final-table td{padding:8px 10px;border-bottom:2px solid var(--pop-dot);font-size:.85rem;font-weight:500;background:#fff;}
.final-table tr:hover td{background:var(--pop-yellow);}
.final-table .rank-num{font-family:var(--font);font-weight:700;color:var(--pop-red);}
.final-table .rank-score{font-family:var(--font);font-weight:700;color:var(--pop-blue);}

.hidden{display:none!important;}
.toast-container{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.toast{padding:10px 18px;background:#fff;border:3px solid var(--text);font-family:var(--font);font-size:.8rem;font-weight:600;color:var(--text);animation:pop-toast .25s forwards;display:flex;align-items:center;gap:8px;box-shadow:4px 4px 0 var(--text);}
.toast .toast-icon{font-size:.9rem;}
.toast .toast-score{color:var(--pop-red);}
.toast.out{animation:pop-toast-out .2s forwards;}
@keyframes pop-toast{from{transform:translateX(100%) rotate(5deg);opacity:0}to{transform:translateX(0) rotate(0);opacity:1}}
@keyframes pop-toast-out{from{opacity:1}to{transform:translateX(100%) rotate(-5deg);opacity:0}}
.particle-container{position:fixed;inset:0;pointer-events:none;z-index:999;}
.cele-particle{position:fixed;pointer-events:none;animation:pop-part .8s ease-out forwards;border-radius:2px;}
@keyframes pop-part{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0) rotate(180deg)}}

@media(max-width:640px){
  .pop-header h1{font-size:.7rem;}
  .pick-pop-name{font-size:3.4rem;}
  .pick-pop-name.result{font-size:3.8rem;}
  .options-grid{grid-template-columns:1fr;}
  .q-pop-text{font-size:.9rem;}
  .score-big{font-size:2.6rem;}
}

/* 错题解析 */
.review-section{text-align:left;margin-top:10px;border-top:1px solid rgba(255,255,255,.12);padding-top:14px;max-height:400px;overflow-y:auto}
.rev-empty{text-align:center;color:#4ecdc4;font-family:var(--font-mono);font-size:.75rem;padding:20px 0}
.rev-student{font-family:var(--font-mono);font-size:.85rem;font-weight:600;color:#d4a843;margin:10px 0 6px;padding-bottom:4px;border-bottom:1px dashed rgba(255,255,255,.1)}
.rev-item{padding:10px 12px;margin-bottom:8px;background:rgba(0,0,0,.15);border-left:3px solid #ff6b6b;border-radius:0 4px 4px 0}
.rev-q{font-size:.88rem;line-height:1.5;margin-bottom:6px}
.rev-princ{display:inline-block;font-family:var(--font-mono);font-size:.75rem;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1);padding:1px 6px;margin-bottom:6px}
.rev-opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.rev-opt{padding:6px 8px;font-size:.78rem;line-height:1.4;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.08);border-radius:2px;display:flex;align-items:flex-start;gap:6px;color:inherit}
.rev-opt .rev-opt-label{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.8rem;font-weight:700;flex-shrink:0;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.4)}
.rev-opt.rev-chosen{background:rgba(255,107,107,.1);border-color:#ff6b6b}
.rev-opt.rev-chosen .rev-opt-label{background:#ff6b6b;color:#fff;border-color:#ff6b6b}
.rev-opt.rev-right{background:rgba(78,205,196,.1);border-color:#4ecdc4}
.rev-opt.rev-right .rev-opt-label{background:#4ecdc4;color:#1a1a2e;border-color:#4ecdc4}


.gear-icon{display:none}/* hidden */
</style>
</head>
<body>
<div class="comic-cloud">BANG!</div><div class="comic-cloud">WOW!</div><div class="comic-cloud">POP!</div>
<div class="toast-container" id="toastContainer"></div>
<div class="particle-container" id="particleContainer"></div>
<div id="app">
  <header class="pop-header">
    <h1>POP! 技术的性质</h1>
    <div class="pop-dots" id="popDots"></div>
  </header>
  <div class="pop-card" id="sceneSetup">
    <div class="pop-title">SELECT</div>
    <div class="setup-group">
      <div class="setup-row"><label>年级</label><select id="gradeSelect"><option value="高一">高一</option><option value="高二">高二</option></select></div>
      <div class="setup-row"><label>班级</label><select id="classSelect" disabled><option value="">—</option></select></div>
      <div class="setup-row" style="margin-top:6px"><button class="btn-pop" id="btnStart" disabled>START!</button></div>
    </div>
  </div>
  <div class="pop-card hidden" id="scenePick">
    <div class="pop-title" id="pickTitle">PICK</div>
    <div class="pick-section">
      <div class="pick-hint" id="pickHint">点击抽取</div>
      <div class="pick-pop-area"><div class="pick-pop-name" id="pickName">?</div></div>
      <div class="pick-class-tag hidden" id="pickClassTag"></div>
      <button class="btn-pop-pick hidden" id="btnPickStart">PICK!</button>
      <button class="btn-pop-pick hidden" id="btnPickConfirm" style="background:var(--pop-red);color:#fff">OK!</button>
    <button class="btn-pop-pick hidden" id="btnRepick" style="margin-top:8px">↻ 重抽</button>
    </div>
  </div>
  <div class="pop-card hidden" id="sceneQuiz">
    <div class="pop-title" id="quizTitle">QUIZ</div>
    <div class="quiz-section">
      <div><span class="q-pop-num" id="qNumber">1/2</span><span class="q-pop-princ" id="qPrinciple">性质</span></div>
      <div class="q-pop-text" id="qText">—</div>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="feedback-box hidden" id="feedbackBox"></div>
      <button class="btn-pop-next hidden" id="btnNextQ">NEXT</button>
    </div>
  </div>
  <div class="pop-card hidden" id="sceneScore">
    <div class="pop-title">SCORE</div>
    <div class="score-section">
      <div class="score-label">学生</div>
      <div style="font-size:1rem;font-weight:700;color:var(--pop-blue);margin:3px 0 6px" id="scoreStudent"></div>
      <div class="score-big" id="scorePoints">+10</div>
      <div class="score-label" id="scoreLabel">正确 1 题</div>
      <div class="score-detail" id="scoreDetail"></div>
      <div class="pop-bar-wrap"><div class="pop-bar-bg"><div class="pop-bar-fill" id="energyBar" style="width:0%"></div></div><div class="pop-bar-label"><span>EXP</span><span id="energyText">0%</span></div></div>
      <button class="btn-pop-next" id="btnNextRound">NEXT</button>
    </div>
  </div>
  <div class="pop-card hidden" id="sceneFinal">
    <div class="pop-title">★ WINNERS ★</div>
    <div class="final-sub">排行榜</div>
    <div style="overflow-x:auto"><table class="final-table"><thead><tr><th>#</th><th>NAME</th><th>CLASS</th><th>正确</th><th>积分</th></tr></thead><tbody id="finalBody"></tbody></table></div>
        <button class="rev-btn" id="btnReview" style="padding:10px 36px;font-size:.8rem;margin-top:6px;cursor:pointer;border:2px solid #5bc0eb;background:transparent;color:#5bc0eb;font-family:var(--font-mono);border-radius:6px">📋 查看错题解析</button>
    <div class="review-section hidden" id="reviewSection"></div>
<button class="btn-pop" style="padding:10px 36px;font-size:.75rem;cursor:pointer;border:none;" onclick="location.reload()">再玩一次</button>
  </div>
</div>
<script>// 从 URL 路径自动提取教师用户名
const pathMatch = window.location.pathname.match(/\/api\/files\/([^\/]+)\/html\//);
const TEACHER = (pathMatch ? pathMatch[1] : '') || '';
const Q=[{question:"为解决普通电钻振动剧烈导致钻孔出现偏差的问题，人们在原有的电钻的基础上改进设计出带定位器的新型电钻，这说明（ ）",options:{A:"有目的的技术活动推进了技术的发展",B:"这项改进不实用",C:"电钻功能发生了根本性的变化",D:"电钻的技术原理发生改变"},answer:"A",principle:"目的性"},{question:"中科院院士说：我国探月二期工程将研制软着陆器和月球车，对月球进行探测地形、研究表面化学成分和矿物质的活动。此次活动主要属于（ ）",options:{A:"科学活动",B:"技术活动",C:"产品测试活动",D:"产品评价活动"},answer:"B",principle:"实践性"},{question:"新药研发体现着生命科学...参加本项目的单位共有10多个，除了生物类的研究所外，还有资源环保类的南海海洋所、高技术类的上海有机所等。这种整合体现了技术的（ ）",options:{A:"综合性",B:"目的性",C:"两面性",D:"创新性"},answer:"A",principle:"综合性"},{question:"1769年，瓦特在大量试验的基础上研制了第一台单动式蒸汽机，引发了第一次工业革命，同时让他成为一个富有的名人资本家。这是由于技术具有（ ）",options:{A:"创新性",B:"目的性",C:"综合性",D:"专利性"},answer:"D",principle:"专利性"},{question:"1928年，英国细菌学家佛莱明发明了青霉素，开展了抗生素时代，挽救了无数生命；但近年来由于抗生素的滥用，耐药菌株迅猛发展，抗生素束手无策，许多重症感染者因此死亡。这反映了技术的（ ）",options:{A:"技术的两面性",B:"技术的创新性",C:"技术的专利性",D:"技术的目的性"},answer:"A",principle:"两面性"},{question:"如图所示是一款区别于传统加热模式的即热式饮水机，热水无需等待即按即出，快捷省电。下列说法中不恰当的是（ ）",options:{A:"该款饮水机已获得了专利，体现了技术的专利性",B:"加热快但出水口流量小，体现了技术的复杂性",C:"热水无需等待即按即出的设计，符合创新原则",D:"顶部采用透明设计便于观察水量，符合实用原则"},answer:"B",principle:"复杂性"},{question:"智能手机综合运用了电子技术、通信技术、材料科学、软件工程等多学科知识。这体现了技术的（ ）",options:{A:"创新性",B:"目的性",C:"综合性",D:"专利性"},answer:"C",principle:"综合性"},{question:"LED灯替代传统白炽灯，能耗更低、寿命更长。这属于（ ）",options:{A:"技术发明",B:"技术革新",C:"科学发现",D:"艺术创作"},answer:"B",principle:"创新性"},{question:"我国专利法规定，发明专利的保护期限为（ ）",options:{A:"10年",B:"15年",C:"20年",D:"50年"},answer:"C",principle:"专利性"},{question:"关于技术的性质，以下说法不正确的是（ ）",options:{A:"技术活动需要综合运用多学科知识",B:"技术具有两面性，既有积极作用也有负面影响",C:"技术创新就是技术发明",D:"技术专利保护发明人的合法权益"},answer:"C",principle:"创新性"}];
const G=[];for(let i=0;i<5;i++)G.push(Q.slice(i*2,i*2+2));

let S={grade:'高一',class:'',students:[],available:[],picks:[],cr:0,cq:0,sa:'',ans:false,rr:[],total:0},_c=0;
function $(i){return document.getElementById(i)}
function sh(i){$(i).classList.remove('hidden')}
function hd(i){$(i).classList.add('hidden')}
function sf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}
function st(i,m,s){const t=document.createElement('div');t.className='toast';t.innerHTML='<span class="toast-icon">'+i+'</span>'+m+(s?' <span class="toast-pts">'+s+'</span>':'');$('toastContainer').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),250)},3000)}
function fp(x,y,c,cnt){const pc=$('particleContainer');for(let i=0;i<cnt;i++){const e=document.createElement('div');e.className='cele-particle';const a=Math.random()*Math.PI*2,d=60+Math.random()*130;e.style.cssText='left:'+(x||innerWidth/2)+'px;top:'+(y||innerHeight/2)+'px;width:'+(5+Math.random()*7)+'px;height:'+(5+Math.random()*7)+'px;background:'+(c||'var(--bp-cyan)')+';--dx:'+(Math.cos(a)*d)+'px;--dy:'+(Math.sin(a)*d)+'px';pc.appendChild(e);setTimeout(()=>e.remove(),1200)}}
function ud(){try{const h=$('bpBlocks')||$('memBlocks')||$('progressDots')||$('popDots');if(!h)return;h.innerHTML='';for(let i=0;i<5;i++){const e=document.createElement('div');e.className='bp-block'+(i<S.cr?' done':i===S.cr?' active':'');e.innerHTML='';h.appendChild(e)}}catch(e){}}
function sv(g,c,n,p){fetch('/api/scores/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,name:n,points:p,teacher:TEACHER})}).then(r=>r.ok?st('💰','保存','+'+p):st('⚠️','异常')).catch(()=>st('📝','本地'))}
function saveRecord(g,c,s,cc,t,pts,ans,title){fetch('/api/rollcall/save-record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,student:s,type:'互动答题',title:title||'',correctCount:cc,totalQuestions:t,points:pts,answers:ans||[],teacher:TEACHER})}).catch(()=>{})}
async function lc(){const g=$('gradeSelect').value;S.grade=g;const cs=$('classSelect');cs.disabled=true;cs.innerHTML='<option value="">...</option>';try{const r=await fetch('/api/rollcall/classes?grade='+encodeURIComponent(g)+'&teacher='+TEACHER);const cls=await r.json();cs.innerHTML='<option value="">— 选择 —</option>';cls.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o)});cs.disabled=false}catch(e){cs.innerHTML='<option value="">失败</option>'}}
$('gradeSelect').addEventListener('change',lc);$('classSelect').addEventListener('change',async function(){const c=this.value;S.class=c;$('btnStart').disabled=!c;if(c){try{const r=await fetch('/api/rollcall/students?grade='+encodeURIComponent(S.grade)+'&class='+encodeURIComponent(c)+'&teacher='+TEACHER);const data=await r.json();S.students=data.map(s=>s.name)}catch(e){S.students=[];st('⚠️','加载学生失败')}}});
$('btnStart').addEventListener('click',function(){if(!S.class||S.students.length<5){st('⚠️','人数不足');return}hd('sceneSetup');sr(0)});
function sr(ri){S.cr=ri;S.cq=0;_c=0;if(!S.rr[ri])S.rr[ri]={correctCount:0,points:0,answers:[]};S.rr[ri].answers=[];ud();sp()}
function sp(){sh('scenePick');hd('sceneQuiz');hd('sceneScore');hd('sceneFinal');$('pickTitle').textContent=(S.cr+1)+'/5';$('pickHint').textContent='点击抽取';$('pickHint').classList.remove('hidden');$('pickClassTag').classList.add('hidden');$('btnPickStart').classList.remove('hidden');$('btnPickConfirm').classList.add('hidden');$('btnRepick').classList.add('hidden');$('pickName').textContent='——';$('pickName').className='pick-name';$('btnPickStart').disabled=false;$('btnPickStart').textContent='🎲 抽取'}
function rp(){const pool=S.students.length>0?S.students:['---'];const pn=$('pickName');pn.className='pick-name rolling';$('pickHint').textContent='抽取中...';$('btnPickConfirm').classList.add('hidden');$('btnRepick').classList.add('hidden');$('btnPickStart').disabled=true;let rc=0,mx=18+Math.floor(Math.random()*10);let iv=setInterval(()=>{pn.textContent=pool[Math.floor(Math.random()*pool.length)];rc++;if(rc>=mx){clearInterval(iv);fetch('/api/rollcall/pick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,teacher:TEACHER})}).then(d=>d.json()).then(d=>{if(d.error){st('⚠️',d.error);pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false;return}const c=d.student;pn.textContent=c;pn.className='pick-name result';$('pickHint').classList.add('hidden');$('pickClassTag').textContent=S.grade+' · '+S.class;$('pickClassTag').classList.remove('hidden');$('btnPickConfirm').classList.remove('hidden');$('btnRepick').classList.remove('hidden');fp(innerWidth/2,innerHeight/2,'var(--bp-cyan)',30);st('🎯','已选',c);S.picks[S.cr]=c}).catch(()=>{st('⚠️','服务异常');pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false})}},60+Math.random()*40)}

$('btnPickStart').addEventListener('click',function(){this.disabled=true;rp()});
$('btnRepick').addEventListener('click',rp);

$('btnPickConfirm').addEventListener('click',function(){hd('scenePick');sq()});
function sq(){sh('sceneQuiz');S.cq=0;sQ()}
function sQ(){const g=G[S.cr],q=g[S.cq];$('quizTitle').textContent='第'+(S.cr+1)+'组';$('qNumber').textContent=(S.cq+1)+'/2';$('qPrinciple').textContent=q.principle;$('qText').textContent=q.question;S.sa='';S.ans=false;$('feedbackBox').classList.add('hidden');$('btnNextQ').classList.add('hidden');const grid=$('optionsGrid');grid.innerHTML='';['A','B','C','D'].forEach(l=>{const b=document.createElement('button');b.className='option-btn';b.innerHTML='<span class="opt-label">'+l+'</span><span>'+q.options[l]+'</span>';b.dataset.label=l;b.addEventListener('click',()=>hA(l));grid.appendChild(b)})}
function hA(l){if(S.ans)return;S.ans=true;const g=G[S.cr],q=g[S.cq],c=q.answer,ic=l===c;if(ic)_c++;S.rr[S.cr].correctCount=_c;let p=5;if(_c===1)p=10;else if(_c===2)p=15;S.rr[S.cr].points=p;S.rr[S.cr].answers.push({question:q.question,options:q.options,correctAnswer:c,yourAnswer:l,principle:q.principle,isCorrect:ic});const btns=$('optionsGrid').querySelectorAll('.option-btn');btns.forEach(b=>{b.classList.add('disabled');if(b.dataset.label===c)b.classList.add('correct');if(b.dataset.label===l&&!ic)b.classList.add('wrong');if(b.dataset.label===l&&ic)b.classList.add('selected')});const fb=$('feedbackBox');fb.classList.remove('hidden');if(ic){fb.className='feedback-box correct-fb';fb.textContent='✅ '+c+'. '+q.options[c];fp(innerWidth/2,innerHeight-80,'var(--bp-green)',12)}else{fb.className='feedback-box wrong-fb';fb.textContent='❌ 正确答案：'+c+'. '+q.options[c]}$('btnNextQ').classList.remove('hidden');$('btnNextQ').textContent=S.cq===0?'下一题 ▸':'结算'}
$('btnNextQ').addEventListener('click',function(){if(S.cq===0){S.cq=1;sQ()}else{hd('sceneQuiz');sSc()}});
function sSc(){sh('sceneScore');const s=S.picks[S.cr];$('scoreStudent').textContent=s+' · '+S.class;const cr=S.rr[S.cr],cc=cr?.correctCount||0,pts=cr?.points||5;$('scorePoints').textContent='+'+pts;$('scoreLabel').textContent='正确 '+cc+' 题';$('scoreDetail').innerHTML='<div class="score-stat">正确 <strong>'+cc+'</strong></div><div class="score-stat">错误 <strong>'+(2-cc)+'</strong></div><div class="score-stat">保底 <strong>5</strong></div>';sv(S.grade,S.class,s,pts);S.total+=pts;fetch('/api/rollcall/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,student:s,result:'quiz',teacher:TEACHER})}).catch(()=>{});saveRecord(S.grade,S.class,s,cc,2,pts,S.rr[S.cr]?.answers,'技术的发展-蓝图');fp(innerWidth/2,innerHeight/2-100,'var(--bp-gold)',25);$('btnNextRound').textContent=S.cr<4?'下一轮 ▸':'完成'}
$('btnNextRound').addEventListener('click',function(){if(S.cr<4){hd('sceneScore');sr(S.cr+1)}else{hd('sceneScore');sF()}});
function sF(){sh('sceneFinal');$('reviewSection').classList.add('hidden');$('btnReview').textContent='📋 查看错题解析';const tb=$('finalBody');tb.innerHTML='';const rows=S.picks.map((n,i)=>{const cr=S.rr[i];return{name:n,correct:cr?.correctCount||0,points:cr?.points||5}}).sort((a,b)=>b.points-a.points);rows.forEach((r,i)=>{const tr=document.createElement('tr');tr.innerHTML='<td class="rank-num">#'+(i+1)+'</td><td>'+r.name+'</td><td>'+r.correct+'/2</td><td class="rank-score">+'+r.points+'</td>';tb.appendChild(tr)});fp(innerWidth/2,innerHeight/2,'var(--bp-cyan)',50);setTimeout(()=>fp(innerWidth/2,innerHeight/2,'var(--bp-gold)',30),400)}
$('btnReview').addEventListener('click',function(){const rs=$('reviewSection');if(!rs.classList.contains('hidden')){rs.classList.add('hidden');this.textContent='📋 查看错题解析';return}this.textContent='📋 收起解析';buildReview();rs.classList.remove('hidden')});
function buildReview(){const rs=$('reviewSection');rs.innerHTML='';let hasWrong=false;const labels=['A','B','C','D'];S.picks.forEach((n,ri)=>{const cr=S.rr[ri];if(!cr||!cr.answers)return;const wrongs=cr.answers.filter(a=>!a.isCorrect);if(!wrongs.length)return;hasWrong=true;let h='<div class="rev-student">⚙ '+n+' · '+S.class+'</div>';wrongs.forEach(a=>{h+='<div class="rev-item"><span class="rev-princ">'+a.principle+'</span><div class="rev-q">'+a.question+'</div><div class="rev-opt-grid">';labels.forEach(l=>{let cls='rev-opt';if(l===a.yourAnswer)cls+=' rev-chosen';if(l===a.correctAnswer)cls+=' rev-right';h+='<div class="'+cls+'"><span class="rev-opt-label">'+l+'</span><span>'+a.options[l]+'</span></div>'});h+='</div></div>'});rs.innerHTML+=h});if(!hasWrong)rs.innerHTML='<div class="rev-empty">\u2705 \u6240\u6709\u540c\u5b66\u5168\u90e8\u7b54\u5bf9\uff01</div>'}
lc();sh('sceneSetup');ud();
</script>
</body>
</html>
