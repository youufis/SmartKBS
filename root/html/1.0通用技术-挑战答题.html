<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>答题游戏</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .quiz-selector {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .quiz-selector button {
            padding: 10px 20px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s ease;
        }
        .quiz-selector button:hover {
            background: #45a049;
        }
        .quiz-selector button.active {
            background: #2a5298;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            position: relative;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        }
        .question {
            font-size: 1.5em;
            margin-bottom: 20px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option {
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        .option:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }
        .lifelines {
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
        }
        .lifeline {
            padding: 10px 20px;
            background: #ff6f61;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s ease, transform 0.2s ease;
        }
        .lifeline:hover {
            background: #ff3b2f;
            transform: scale(1.05);
        }
        .score {
            margin-top: 20px;
            font-size: 1.2em;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }
        .high-score {
            margin-top: 10px;
            font-size: 1.1em;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }
        .lifeline.disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .correct {
            background: #4CAF50 !important;
        }
        .wrong {
            background: #f44336 !important;
        }
        .animated {
            animation: pop 0.5s ease;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* 自定义弹窗样式 */
        .custom-alert {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease;
        }
        .custom-alert button {
            padding: 10px 20px;
            background: #ff6f61;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .custom-alert button:hover {
            background: #ff3b2f;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translate(-50%, -60%); }
            100% { opacity: 1; transform: translate(-50%, -50%); }
        }
    
.gear-icon{display:none}/* hidden */
</style>
</head>
<body>
    <!-- 题库选择按钮 -->
    <div class="quiz-selector">
        <button id="basicQuiz" class="active">基础题库</button>
        <button id="advancedQuiz">进阶题库</button>
        <button id="enhancedQuiz">增强题库</button>
        <button id="ultimateQuiz">终极题库</button>
    </div>

    <!-- 游戏主界面 -->
    <div class="container">
        <h1>答题游戏</h1>
        <div class="question" id="question">问题加载中...</div>
        <div class="options" id="options">
            <button class="option" id="option1">选项1</button>
            <button class="option" id="option2">选项2</button>
            <button class="option" id="option3">选项3</button>
            <button class="option" id="option4">选项4</button>
        </div>
        <div class="lifelines">
            <button class="lifeline" id="fiftyFifty">50:50</button>
            <button class="lifeline" id="audiencePoll">观众投票</button>
            <button class="lifeline" id="phoneAFriend">打电话给朋友</button>
        </div>
        <div class="score" id="score">得分: 0</div>
        <div class="high-score" id="highScore">最高得分: 0</div>
    </div>

    <script>
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let lifelines = {
            fiftyFifty: true,
            audiencePoll: true,
            phoneAFriend: true
        };

        const questionElement = document.getElementById('question');
        const optionsElements = [
            document.getElementById('option1'),
            document.getElementById('option2'),
            document.getElementById('option3'),
            document.getElementById('option4')
        ];
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const fiftyFiftyButton = document.getElementById('fiftyFifty');
        const audiencePollButton = document.getElementById('audiencePoll');
        const phoneAFriendButton = document.getElementById('phoneAFriend');

        // 题库选择按钮
        const basicQuizButton = document.getElementById('basicQuiz');
        const advancedQuizButton = document.getElementById('advancedQuiz');
        const enhancedQuizButton = document.getElementById('enhancedQuiz');
        const ultimateQuizButton = document.getElementById('ultimateQuiz');

        // 默认加载基础题库
        loadQuestionsFromFile('qjson1.json');

        // 加载题库
        function loadQuestionsFromFile(filePath) {
            fetch(filePath)
                .then(response => response.json())
                .then(data => {
                    questions = data;
                    resetGame();
                    loadRandomQuestion(); // 初始加载随机题目
                    updateHighScoreDisplay(); // 初始化显示最高得分
                })
                .catch(error => {
                    console.error('加载题目失败:', error);
                    showCustomAlert("题目加载失败，请检查文件路径或格式。");
                });
        }

        // 显示自定义弹窗
        function showCustomAlert(message, callback) {
            const alertBox = document.createElement('div');
            alertBox.className = 'custom-alert';
            alertBox.innerHTML = `
                <p>${message}</p>
                <button onclick="this.parentElement.remove()">确定</button>
            `;
            document.body.appendChild(alertBox);
            if (callback) {
                alertBox.querySelector('button').addEventListener('click', callback);
            }
        }

        // 加载随机题目
        function loadRandomQuestion() {
            if (questions.length === 0) {
                questionElement.textContent = "题目加载失败，请刷新页面重试。";
                return;
            }

            const timestamp = Date.now();
            const randomSeed = Math.sin(timestamp) * 10000;
            const random = (randomSeed - Math.floor(randomSeed)) * questions.length;

            // 随机选择一个题目
            currentQuestionIndex = Math.floor(random);
            const q = questions[currentQuestionIndex];
            questionElement.textContent = q.question;

            // 显示选项
            optionsElements.forEach((option, index) => {
                option.textContent = q.options[index];
                option.style.display = 'block';
                option.disabled = false;
                option.classList.remove('correct', 'wrong', 'animated');
            });
        }

        // 检查答案
        function checkAnswer(selectedIndex) {
            const q = questions[currentQuestionIndex];
            const selectedOption = optionsElements[selectedIndex];
            selectedOption.classList.add('animated');

            if (selectedIndex === q.answer) {
                selectedOption.classList.add('correct');
                score += 10; // 每答对一题加10分
                scoreElement.textContent = `得分: ${score}`;

                if (score >= 150) {
                    setTimeout(() => {
                        updateHighScore(); // 更新最高得分
                        showCustomAlert(`恭喜你完成答题！你的最终得分是: ${score}`, () => {
                            resetGame();
                        });
                    }, 1000);
                } else {
                    setTimeout(() => {
                        loadRandomQuestion(); // 加载下一道随机题目
                    }, 1000);
                }
            } else {
                selectedOption.classList.add('wrong');
                setTimeout(() => {
                    updateHighScore(); // 更新最高得分
                    showCustomAlert(`回答错误！游戏结束。你的最终得分是: ${score}`, () => {
                        resetGame();
                    });
                }, 1000);
            }
        }

        // 更新最高得分
        function updateHighScore() {
            const highScore = localStorage.getItem('highScore') || 0;
            if (score > highScore) {
                localStorage.setItem('highScore', score);
                updateHighScoreDisplay();
            }
        }

        // 更新最高得分显示
        function updateHighScoreDisplay() {
            const highScore = localStorage.getItem('highScore') || 0;
            highScoreElement.textContent = `最高得分: ${highScore}`;
        }

        // 重置游戏
        function resetGame() {
            score = 0;
            scoreElement.textContent = `得分: ${score}`;
            lifelines = {
                fiftyFifty: true,
                audiencePoll: true,
                phoneAFriend: true
            };
            fiftyFiftyButton.classList.remove('disabled');
            fiftyFiftyButton.disabled = false;
            audiencePollButton.classList.remove('disabled');
            audiencePollButton.disabled = false;
            phoneAFriendButton.classList.remove('disabled');
            phoneAFriendButton.disabled = false;
            loadRandomQuestion(); // 重新开始游戏
        }

        // 50:50 提示
        function fiftyFifty() {
            if (lifelines.fiftyFifty) {
                const q = questions[currentQuestionIndex];
                let wrongOptions = [0, 1, 2, 3].filter(index => index !== q.answer);
                wrongOptions = wrongOptions.sort(() => Math.random() - 0.5).slice(0, 2);
                wrongOptions.forEach(index => {
                    optionsElements[index].style.display = 'none';
                });
                lifelines.fiftyFifty = false;
                fiftyFiftyButton.classList.add('disabled');
                fiftyFiftyButton.disabled = true;
            }
        }

        // 观众投票提示
        function audiencePoll() {
            if (lifelines.audiencePoll) {
                const q = questions[currentQuestionIndex];
                const pollResults = [0, 0, 0, 0];
                pollResults[q.answer] = Math.floor(Math.random() * 50 + 50);
                for (let i = 0; i < 4; i++) {
                    if (i !== q.answer) {
                        pollResults[i] = Math.floor(Math.random() * (100 - pollResults[q.answer]) / 3);
                    }
                }
                showCustomAlert(`观众投票结果: A: ${pollResults[0]}%, B: ${pollResults[1]}%, C: ${pollResults[2]}%, D: ${pollResults[3]}%`);
                lifelines.audiencePoll = false;
                audiencePollButton.classList.add('disabled');
                audiencePollButton.disabled = true;
            }
        }

        // 打电话给朋友提示
        function phoneAFriend() {
            if (lifelines.phoneAFriend) {
                const q = questions[currentQuestionIndex];
                const friendAnswer = Math.random() < 0.8 ? q.answer : Math.floor(Math.random() * 4);
                showCustomAlert(`你的朋友建议选择: ${String.fromCharCode(65 + friendAnswer)}`);
                lifelines.phoneAFriend = false;
                phoneAFriendButton.classList.add('disabled');
                phoneAFriendButton.disabled = true;
            }
        }

        // 绑定事件
        optionsElements.forEach((option, index) => {
            option.addEventListener('click', () => checkAnswer(index));
        });

        fiftyFiftyButton.addEventListener('click', fiftyFifty);
        audiencePollButton.addEventListener('click', audiencePoll);
        phoneAFriendButton.addEventListener('click', phoneAFriend);

        // 题库选择事件
        basicQuizButton.addEventListener('click', () => {
            loadQuestionsFromFile('qjson1.json');
            setActiveButton(basicQuizButton);
        });
        advancedQuizButton.addEventListener('click', () => {
            loadQuestionsFromFile('qjson2.json');
            setActiveButton(advancedQuizButton);
        });
        enhancedQuizButton.addEventListener('click', () => {
            loadQuestionsFromFile('qjson3.json');
            setActiveButton(enhancedQuizButton);
        });
        ultimateQuizButton.addEventListener('click', () => {
            loadQuestionsFromFile('qjson4.json');
            setActiveButton(ultimateQuizButton);
        });

        // 设置当前激活的题库按钮
        function setActiveButton(activeButton) {
            const buttons = [basicQuizButton, advancedQuizButton, enhancedQuizButton, ultimateQuizButton];
            buttons.forEach(button => button.classList.remove('active'));
            activeButton.classList.add('active');
        }
    </script>
</body>
</html>
