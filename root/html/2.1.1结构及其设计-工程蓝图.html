<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>◆ 结构及其设计 · 工程蓝图</title>
<style>
/* ═══ 工程蓝图 Blueprint ═══ 工业蓝本 · 网格几何 · 结构理性 ═══ */
@import url('https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;600;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bp-blue: #1a5276; --bp-light: #2980b9; --bp-accent: #f39c12;
  --bp-grid: #b0c4de; --bp-bg: #e8eef5; --bp-card: #f5f8fc;
  --bp-text: #1a2a3a; --bp-dim: #5a7a8a;
  --bp-line: #2980b9; --bp-green: #27ae60; --bp-red: #e74c3c;
  --font: 'Inconsolata','Courier New',monospace;
  --font-body: 'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif;
}
html{font-size:20px}
body{font-family:var(--font-body);background:var(--bp-bg);color:var(--bp-text);min-height:100vh;padding:20px;
  background-image:linear-gradient(var(--bp-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bp-grid) 1px,transparent 1px);
  background-size:40px 40px;background-position:-1px -1px}
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 24px;border-radius:6px;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:toastIn .3s ease forwards;font-family:var(--font-body);border-left:4px solid}
.toast.info{background:var(--bp-card);color:var(--bp-text);border-color:var(--bp-light)}
.toast.success{background:#d4edda;color:#155724;border-color:var(--bp-green)}
.toast.error{background:#f8d7da;color:#721c24;border-color:var(--bp-red)}
@keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.particle-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9998}
#app{max-width:680px;margin:0 auto;position:relative}
.bp-header{text-align:center;padding:20px 10px 24px;position:relative}
.bp-header h1{font-family:var(--font);font-size:22px;font-weight:700;color:var(--bp-blue);letter-spacing:2px;text-transform:uppercase;
  border:2px solid var(--bp-blue);display:inline-block;padding:8px 24px;background:var(--bp-card);position:relative}
.bp-header h1::before,.bp-header h1::after{content:'├';position:absolute;font-size:24px;color:var(--bp-light);top:4px}
.bp-header h1::before{left:-14px}.bp-header h1::after{right:-14px;transform:scaleX(-1)}
.bp-card{background:var(--bp-card);border:2px solid var(--bp-line);border-radius:4px;padding:24px;margin-bottom:16px;position:relative}
.bp-card::before{content:'';position:absolute;top:-1px;left:-1px;right:-1px;height:3px;background:repeating-linear-gradient(90deg,var(--bp-light) 0,var(--bp-light) 8px,transparent 8px,transparent 16px)}
.bp-title{font-family:var(--font);font-size:14px;font-weight:700;color:var(--bp-blue);margin-bottom:16px;text-transform:uppercase;letter-spacing:1px}
.bp-icon{color:var(--bp-accent)}
.setup-group{display:flex;flex-direction:column;gap:12px}
.setup-row{display:flex;align-items:center;gap:12px}
.setup-row label{font-size:14px;color:var(--bp-dim);min-width:48px;font-family:var(--font)}
.setup-row select{flex:1;padding:8px 12px;border:2px solid var(--bp-line);border-radius:4px;font-size:14px;background:white;color:var(--bp-text);font-family:var(--font-body);outline:none}
.setup-row select:focus{border-color:var(--bp-accent)}
.bp-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;border:none;border-radius:4px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;font-family:var(--font);text-transform:uppercase;letter-spacing:1px}
.bp-btn-primary{background:var(--bp-blue);color:white;border:2px solid var(--bp-blue)}
.bp-btn-primary:hover{background:var(--bp-light);border-color:var(--bp-light);transform:translateY(-1px)}
.bp-btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.bp-btn-secondary{background:transparent;color:var(--bp-dim);border:2px solid var(--bp-dim)}
.bp-btn-secondary:hover{color:var(--bp-text);border-color:var(--bp-text)}
.bp-btn-accent{background:var(--bp-accent);color:white;border:2px solid var(--bp-accent)}
.bp-btn-accent:hover{background:#e67e22;border-color:#e67e22;transform:translateY(-1px)}
.bp-btn-danger{background:var(--bp-red);color:white;border:2px solid var(--bp-red)}
.bp-btn-danger:hover{background:#c0392b;border-color:#c0392b;transform:translateY(-1px)}
.bp-btn-sm{padding:6px 16px;font-size:14px}
.bp-hidden{display:none!important}
.pick-display{text-align:center;padding:16px 0}
.pick-name{font-family:var(--font);font-size:48px;font-weight:700;color:var(--bp-blue);margin:8px 0}
.pick-name.pick-anim{animation:bpPop .3s ease}
@keyframes bpPop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.pick-tag{display:inline-block;background:var(--bp-light);color:white;padding:4px 16px;border-radius:4px;font-size:14px;font-family:var(--font);letter-spacing:1px}
.pick-actions{display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.setup-actions{margin-top:16px;display:flex;justify-content:center;gap:12px}
.pick-hint{font-family:var(--font);font-size:14px;color:var(--bp-dim);margin-bottom:4px}
.quiz-progress{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.quiz-progress-bar{flex:1;height:6px;background:#e9ecef;border-radius:3px;overflow:hidden}
.quiz-progress-fill{height:100%;background:var(--bp-blue);border-radius:3px;transition:width .3s}
.quiz-progress-text{font-family:var(--font);font-size:14px;color:var(--bp-dim);white-space:nowrap}
.quiz-question{font-size:16px;line-height:1.8;margin-bottom:16px;padding:16px;background:var(--bp-bg);border-left:4px solid var(--bp-light);border-radius:2px}
.quiz-options{display:flex;flex-direction:column;gap:8px}
.quiz-opt{display:flex;align-items:center;gap:12px;padding:12px 16px;border:2px solid var(--bp-grid);border-radius:4px;cursor:pointer;transition:all .2s;background:white}
.quiz-opt:hover{border-color:var(--bp-light);background:var(--bp-bg)}
.quiz-opt.selected{border-color:var(--bp-blue);background:#d6eaf8}
.quiz-opt.correct{border-color:var(--bp-green);background:#d5f5e3}
.quiz-opt.wrong{border-color:var(--bp-red);background:#fadbd8}
.quiz-opt-label{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--bp-grid);color:var(--bp-text);font-weight:700;font-size:15px;font-family:var(--font);flex-shrink:0}
.quiz-opt.selected .quiz-opt-label{background:var(--bp-blue);color:white}
.quiz-opt.correct .quiz-opt-label{background:var(--bp-green);color:white}
.quiz-opt.wrong .quiz-opt-label{background:var(--bp-red);color:white}
.quiz-feedback{padding:12px 16px;border-radius:4px;margin-top:12px;font-size:14px;line-height:1.6;display:none}
.quiz-feedback.show{display:block}
.quiz-feedback.correct{background:#d5f5e3;border:1px solid var(--bp-green);color:#155724}
.quiz-feedback.wrong{background:#fadbd8;border:1px solid var(--bp-red);color:#721c24}
.quiz-feedback .principle{display:block;margin-top:4px;font-size:15px;opacity:.8}
.score-display{text-align:center;padding:20px 0}
.score-name{font-family:var(--font);font-size:24px;font-weight:700;color:var(--bp-blue)}
.score-points{font-family:var(--font);font-size:48px;font-weight:700;color:var(--bp-accent);margin:12px 0}
.score-detail{font-size:14px;color:var(--bp-dim);margin-bottom:16px}
.score-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.review-section{margin-top:16px}
.rev-student{font-family:var(--font);font-size:18px;font-weight:700;color:var(--bp-blue);margin:16px 0 8px;padding:8px 0;border-bottom:2px solid var(--bp-grid)}
.rev-item{margin-bottom:12px;padding:12px;background:var(--bp-bg);border-radius:4px}
.rev-princ{display:block;font-size:14px;color:var(--bp-light);margin-bottom:4px;font-family:var(--font)}
.rev-q{font-size:14px;line-height:1.6;margin-bottom:8px}
.rev-opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.rev-opt{padding:6px 10px;border-radius:3px;font-size:15px;display:flex;align-items:center;gap:6px}
.rev-opt-label{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:14px;font-weight:700;background:#e9ecef;flex-shrink:0}
.rev-chosen .rev-opt-label{background:var(--bp-red);color:white}
.rev-right .rev-opt-label{background:var(--bp-green);color:white}
.rev-empty{text-align:center;padding:24px;font-size:16px;color:var(--bp-green);font-weight:600}
.final-summary{text-align:center;padding:20px 0}
.final-title{font-family:var(--font);font-size:28px;font-weight:700;color:var(--bp-accent);margin-bottom:8px}
.final-stat{font-size:16px;color:var(--bp-dim);margin-bottom:4px}
.final-actions{margin-top:16px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.pick-title{font-size:15px;color:var(--bp-dim);margin-bottom:8px}
@media(max-width:480px){.bp-card{padding:16px}.pick-name{font-size:36px}.score-points{font-size:36px}.quiz-question{font-size:15px}.rev-opt-grid{grid-template-columns:1fr}}

.gear-icon{display:none}/* hidden */
</style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>
<div class="particle-container" id="particleContainer"></div>
<div id="app">
  <header class="bp-header">
    <h1>🔷 结构及其设计 · 工程蓝图</h1>
    <div class="bp-blocks" id="memBlocks"></div>
  </header>
  <div class="bp-card" id="sceneSetup">
    <div class="bp-title"><span class="bp-icon">✦</span> 设置</div>
    <div class="setup-group">
      <div class="setup-row"><label>年级</label><select id="gradeSelect"><option value="高一">高一</option><option value="高二">高二</option></select></div>
      <div class="setup-row"><label>班级</label><select id="classSelect" disabled><option value="">—</option></select></div>
      <div class="setup-row" style="margin-top:6px"><button class="bp-btn bp-btn-primary" id="btnStart" disabled>开始</button></div>
    </div>
  </div>
  <div class="bp-card bp-hidden" id="scenePick">
    <div class="bp-title"><span class="bp-icon">🎯</span> <span id="pickTitle">抽取</span></div>
    <div class="pick-display">
      <div class="pick-hint" id="pickHint">点击抽取</div>
      <div class="pick-name" id="pickName">—</div>
      <div class="pick-tag bp-hidden" id="pickClassTag"></div>
      <div class="pick-actions">
        <button class="bp-btn bp-btn-primary bp-hidden" id="btnPickStart">抽取</button>
        <button class="bp-btn bp-btn-accent bp-hidden" id="btnPickConfirm">确认</button>
        <button class="bp-btn bp-btn-secondary bp-hidden" id="btnRepick">↻ 重抽</button>
      </div>
    </div>
  </div>
  <div class="bp-card bp-hidden" id="sceneQuiz">
    <div class="bp-title"><span class="bp-icon">📝</span> <span id="quizTitle">答题</span></div>
    <div class="quiz-progress">
      <span class="quiz-progress-text" id="qNumber">1/2</span>
      <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="progressFill" style="width:0%"></div></div>
      <span class="quiz-progress-text" id="qPrinciple">原理</span>
    </div>
    <div class="quiz-question" id="qText">—</div>
    <div class="quiz-options" id="optionsGrid"></div>
    <div class="quiz-feedback" id="feedbackBox"></div>
    <button class="bp-btn bp-btn-accent bp-hidden" id="btnNextQ">下一题</button>
  </div>
  <div class="bp-card bp-hidden" id="sceneScore">
    <div class="bp-title"><span class="bp-icon">🏆</span> 结果</div>
    <div class="score-display">
      <div class="score-name" id="scoreStudent"></div>
      <div class="score-points" id="scorePoints">+0</div>
      <div class="score-label" id="scoreLabel"></div>
      <div class="score-detail" id="scoreDetail"></div>
      <button class="bp-btn bp-btn-primary" id="btnNextRound">下一组</button>
    </div>
  </div>
  <div class="bp-card bp-hidden" id="sceneFinal">
    <div class="bp-title"><span class="bp-icon">🌟</span> 完成</div>
    <div class="final-summary">
      <div class="final-title">🏁 全员完成</div>
      <div class="final-stat" id="finalStat"></div>
    </div>
    <div style="overflow-x:auto"><table class="bp-table" id="finalTable" style="width:100%;border-collapse:collapse;margin:8px 0"><thead><tr style="border-bottom:2px solid var(--bp-grid)"><th style="padding:8px 12px;text-align:left;font-family:var(--font);font-size:15px;color:var(--bp-light)">#</th><th style="padding:8px 12px;text-align:left;font-family:var(--font);font-size:15px;color:var(--bp-light)">姓名</th><th style="padding:8px 12px;text-align:left;font-family:var(--font);font-size:15px;color:var(--bp-light)">正确</th><th style="padding:8px 12px;text-align:left;font-family:var(--font);font-size:15px;color:var(--bp-light)">积分</th></tr></thead><tbody id="finalBody"></tbody></table></div>
    <button class="bp-btn bp-btn-secondary" id="btnReview" style="margin-right:8px">📋 查看错题解析</button>
    <button class="bp-btn bp-btn-primary" onclick="location.reload()">再来一次</button>
    <div class="review-section bp-hidden" id="reviewSection"></div>
  </div>
</div>
<script>// 从 URL 路径自动提取教师用户名
const pathMatch = window.location.pathname.match(/\/api\/files\/([^\/]+)\/html\//);
const TEACHER = (pathMatch ? pathMatch[1] : '') || '';
const Q=[{question:"下列物体中，属于壳体结构的是哪一组？①安全帽 ②书本 ③贝壳 ④脚手架",options:{A:"①②",B:"①③",C:"②③",D:"②④"},answer:"B",principle:"壳体结构是指通过壳面来承受载荷的结构，通常表面封闭、内部空腔，如安全帽和贝壳。书本属于实体结构，脚手架属于框架结构。"},{question:"为了方便城镇使用水资源，设计出水管输送方式，设计的水管结构类型是？",options:{A:"框架结构",B:"壳体结构",C:"实心结构",D:"以上都不是"},answer:"B",principle:"水管为空心管状，利用管壁承受内部水压和外部载荷，属于典型的壳体结构。"},{question:"建筑工程中广泛运用三角形，房子、桥梁的桁架大多数由多个三角形构成。这是运用了三角形的什么原理？",options:{A:"三角形稳定",B:"三角形结实",C:"三角形用料少",D:"三角形简单"},answer:"A",principle:"三角形具有几何稳定性，在外力作用下不易变形，是桁架结构中保证结构稳定的基本单元。"},{question:"常用的A形梯不直接采用铝合金片，而用长方形截面的铝合金构件，这说明了什么因素影响着结构的强度？",options:{A:"材料",B:"构件的形状",C:"重心的高低",D:"连接方式"},answer:"B",principle:"构件横截面的形状（如长方形截面）直接影响其抵抗弯曲和变形的能力，这是影响结构强度的形状因素。"},{question:"在自行车车架设计中使用大圆弧过渡的三角形车架，这种设计主要考虑的是？",options:{A:"美观",B:"提高强度",C:"减轻重量",D:"降低成本"},answer:"B",principle:"大圆弧过渡可以减少应力集中，使力传递更加平顺，从而提高车架的结构强度。"},{question:"影响结构稳定性的主要因素不包括？",options:{A:"重心位置",B:"支撑面积",C:"材料的颜色",D:"结构的形状"},answer:"C",principle:"结构的稳定性主要与重心位置（越低越稳）、支撑面积（越大越稳）和结构形状（三角形等）有关，与材料颜色无关。"},{question:"某同学用课本做一个简易板凳，把课本向两侧分开一定角度后倒立放置，形成一个\"A\"字形结构。这种结构稳定的主要原因是？",options:{A:"增大了支撑面积",B:"降低了重心",C:"使用了更多的材料",D:"改变了材料性质"},answer:"A",principle:"A字形结构通过向两侧分开增大了支撑面积，同时重心也在合理范围内，从而提高了稳定性。"},{question:"钢索桥主要由钢索、桥塔、桥面、锚碇等组成。其中承受主要拉力的构件是？",options:{A:"桥塔",B:"桥面",C:"钢索",D:"锚碇"},answer:"C",principle:"在钢索桥中，钢索主要承受拉力，将桥面的重量传递给桥塔和锚碇。桥塔主要受压，桥面受弯，锚碇承受拉力。"},{question:"结构在承受荷载时的基本类型不包括？",options:{A:"拉力",B:"压力",C:"摩擦力",D:"弯曲力"},answer:"C",principle:"结构在承受荷载时的基本受力类型有拉力、压力、剪切力、弯曲力和扭转力。摩擦力不属于结构的基本受力类型。"},{question:"如图所示为某建筑的支撑框架，框架中使用了大量的三角形结构。下列分析中不正确的是？",options:{A:"三角形结构不易变形",B:"三角形结构稳定性好",C:"三角形结构可以节省材料",D:"三角形结构在所有情况下都最稳定"},answer:"D",principle:"三角形结构具有较好的稳定性和不易变形的特点，但其稳定性也是相对的，在极端荷载或材料失效情况下也可能发生破坏。\"在所有情况下都最稳定\"的说法过于绝对。"}];
const G=[];for(let i=0;i<5;i++)G.push(Q.slice(i*2,i*2+2));

let S={grade:'高一',class:'',students:[],available:[],picks:[],cr:0,cq:0,sa:'',ans:false,rr:[],total:0},_c=0;
function $(i){return document.getElementById(i)}
function sh(i){$(i).classList.remove('bp-hidden')}
function hd(i){$(i).classList.add('bp-hidden')}
function sf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}
function st(i,m,s){const t=document.createElement('div');t.className='toast';t.innerHTML='<span class="toast-icon">'+i+'</span>'+m+(s?' <span class="toast-pts">'+s+'</span>':'');$('toastContainer').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),250)},3000)}
function fp(x,y,c,cnt){const pc=$('particleContainer');for(let i=0;i<cnt;i++){const e=document.createElement('div');e.className='cele-particle';const a=Math.random()*Math.PI*2,d=60+Math.random()*130;e.style.cssText='left:'+(x||innerWidth/2)+'px;top:'+(y||innerHeight/2)+'px;width:'+(5+Math.random()*7)+'px;height:'+(5+Math.random()*7)+'px;background:'+(c||'var(--bp-cyan)')+';--dx:'+(Math.cos(a)*d)+'px;--dy:'+(Math.sin(a)*d)+'px';pc.appendChild(e);setTimeout(()=>e.remove(),1200)}}
function ud(){try{const h=$('bpBlocks')||$('memBlocks')||$('progressDots')||$('popDots');if(!h)return;h.innerHTML='';for(let i=0;i<5;i++){const e=document.createElement('div');e.className='bp-block'+(i<S.cr?' done':i===S.cr?' active':'');e.innerHTML='';h.appendChild(e)}}catch(e){}}
function sv(g,c,n,p){fetch('/score-api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,name:n,points:p,teacher:TEACHER})}).then(r=>r.ok?st('💰','保存','+'+p):st('⚠️','异常')).catch(()=>st('📝','本地'))}
function saveRecord(g,c,s,cc,t,pts,ans,title){fetch('/rollcall-api/save-record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,student:s,type:'互动答题',title:title||'',correctCount:cc,totalQuestions:t,points:pts,answers:ans||[],teacher:TEACHER})}).catch(()=>{})}
async function lc(){const g=$('gradeSelect').value;S.grade=g;const cs=$('classSelect');cs.disabled=true;cs.innerHTML='<option value="">...</option>';try{const r=await fetch('/rollcall-api/classes?grade='+encodeURIComponent(g)+'&teacher='+TEACHER);const cls=await r.json();cs.innerHTML='<option value="">— 选择 —</option>';cls.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o)});cs.disabled=false}catch(e){cs.innerHTML='<option value="">失败</option>'}}
$('gradeSelect').addEventListener('change',lc);$('classSelect').addEventListener('change',async function(){const c=this.value;S.class=c;$('btnStart').disabled=!c;if(c){try{const r=await fetch('/rollcall-api/students?grade='+encodeURIComponent(S.grade)+'&class='+encodeURIComponent(c)+'&teacher='+TEACHER);const data=await r.json();S.students=data.map(s=>s.name)}catch(e){S.students=[];st('⚠️','加载学生失败')}}});
$('btnStart').addEventListener('click',function(){if(!S.class||S.students.length<5){st('⚠️','人数不足');return}hd('sceneSetup');sr(0)});
function sr(ri){S.cr=ri;S.cq=0;_c=0;if(!S.rr[ri])S.rr[ri]={correctCount:0,points:0,answers:[]};S.rr[ri].answers=[];ud();sp()}
function sp(){sh('scenePick');hd('sceneQuiz');hd('sceneScore');hd('sceneFinal');$('pickTitle').textContent=(S.cr+1)+'/5';$('pickHint').textContent='点击抽取';$('pickHint').classList.remove('bp-hidden');$('pickClassTag').classList.add('bp-hidden');$('btnPickStart').classList.remove('bp-hidden');$('btnPickConfirm').classList.add('bp-hidden');$('btnRepick').classList.add('bp-hidden');$('pickName').textContent='——';$('pickName').className='pick-name';$('btnPickStart').disabled=false;$('btnPickStart').textContent='🎲 抽取'}
function rp(){const pool=S.students.length>0?S.students:['---'];const pn=$('pickName');pn.className='pick-name rolling';$('pickHint').textContent='抽取中...';$('btnPickConfirm').classList.add('bp-hidden');$('btnRepick').classList.add('bp-hidden');$('btnPickStart').disabled=true;let rc=0,mx=18+Math.floor(Math.random()*10);let iv=setInterval(()=>{pn.textContent=pool[Math.floor(Math.random()*pool.length)];rc++;if(rc>=mx){clearInterval(iv);fetch('/rollcall-api/pick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,teacher:TEACHER})}).then(d=>d.json()).then(d=>{if(d.error){st('⚠️',d.error);pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false;return}const c=d.student;pn.textContent=c;pn.className='pick-name result';$('pickHint').classList.add('bp-hidden');$('pickClassTag').textContent=S.grade+' · '+S.class;$('pickClassTag').classList.remove('bp-hidden');$('btnPickConfirm').classList.remove('bp-hidden');$('btnRepick').classList.remove('bp-hidden');fp(innerWidth/2,innerHeight/2,'var(--bp-cyan)',30);st('🎯','已选',c);S.picks[S.cr]=c}).catch(()=>{st('⚠️','服务异常');pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false})}},60+Math.random()*40)}

$('btnPickStart').addEventListener('click',function(){this.disabled=true;rp()});
$('btnRepick').addEventListener('click',rp);

$('btnPickConfirm').addEventListener('click',function(){hd('scenePick');sq()});
function sq(){sh('sceneQuiz');S.cq=0;sQ()}
function sQ(){const g=G[S.cr],q=g[S.cq];$('quizTitle').textContent='第'+(S.cr+1)+'组';$('qNumber').textContent=(S.cq+1)+'/2';$('qPrinciple').textContent=q.principle;$('qText').textContent=q.question;S.sa='';S.ans=false;$('feedbackBox').classList.add('bp-hidden');$('btnNextQ').classList.add('bp-hidden');const grid=$('optionsGrid');grid.innerHTML='';['A','B','C','D'].forEach(l=>{const b=document.createElement('button');b.className='option-btn';b.innerHTML='<span class="opt-label">'+l+'</span><span>'+q.options[l]+'</span>';b.dataset.label=l;b.addEventListener('click',()=>hA(l));grid.appendChild(b)})}
function hA(l){if(S.ans)return;S.ans=true;const g=G[S.cr],q=g[S.cq],c=q.answer,ic=l===c;if(ic)_c++;S.rr[S.cr].correctCount=_c;let p=5;if(_c===1)p=10;else if(_c===2)p=15;S.rr[S.cr].points=p;S.rr[S.cr].answers.push({question:q.question,options:q.options,correctAnswer:c,yourAnswer:l,principle:q.principle,isCorrect:ic});const btns=$('optionsGrid').querySelectorAll('.option-btn');btns.forEach(b=>{b.classList.add('disabled');if(b.dataset.label===c)b.classList.add('correct');if(b.dataset.label===l&&!ic)b.classList.add('wrong');if(b.dataset.label===l&&ic)b.classList.add('selected')});const fb=$('feedbackBox');fb.classList.remove('bp-hidden');if(ic){fb.className='feedback-box correct-fb';fb.textContent='✅ '+c+'. '+q.options[c];fp(innerWidth/2,innerHeight-80,'var(--bp-green)',12)}else{fb.className='feedback-box wrong-fb';fb.textContent='❌ 正确答案：'+c+'. '+q.options[c]}$('btnNextQ').classList.remove('bp-hidden');$('btnNextQ').textContent=S.cq===0?'下一题 ▸':'结算'}
$('btnNextQ').addEventListener('click',function(){if(S.cq===0){S.cq=1;sQ()}else{hd('sceneQuiz');sSc()}});
function sSc(){sh('sceneScore');const s=S.picks[S.cr];$('scoreStudent').textContent=s+' · '+S.class;const cr=S.rr[S.cr],cc=cr?.correctCount||0,pts=cr?.points||5;$('scorePoints').textContent='+'+pts;$('scoreLabel').textContent='正确 '+cc+' 题';$('scoreDetail').innerHTML='<div class="score-stat">正确 <strong>'+cc+'</strong></div><div class="score-stat">错误 <strong>'+(2-cc)+'</strong></div><div class="score-stat">保底 <strong>5</strong></div>';sv(S.grade,S.class,s,pts);S.total+=pts;fetch('/rollcall-api/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,student:s,result:'quiz',teacher:TEACHER})}).catch(()=>{});saveRecord(S.grade,S.class,s,cc,2,pts,S.rr[S.cr]?.answers,'技术的发展-蓝图');fp(innerWidth/2,innerHeight/2-100,'var(--bp-gold)',25);$('btnNextRound').textContent=S.cr<4?'下一轮 ▸':'完成'}
$('btnNextRound').addEventListener('click',function(){if(S.cr<4){hd('sceneScore');sr(S.cr+1)}else{hd('sceneScore');sF()}});
function sF(){sh('sceneFinal');$('reviewSection').classList.add('bp-hidden');$('btnReview').textContent='📋 查看错题解析';const tb=$('finalBody');tb.innerHTML='';const rows=S.picks.map((n,i)=>{const cr=S.rr[i];return{name:n,correct:cr?.correctCount||0,points:cr?.points||5}}).sort((a,b)=>b.points-a.points);rows.forEach((r,i)=>{const tr=document.createElement('tr');tr.innerHTML='<td class="rank-num">#'+(i+1)+'</td><td>'+r.name+'</td><td>'+r.correct+'/2</td><td class="rank-score">+'+r.points+'</td>';tb.appendChild(tr)});fp(innerWidth/2,innerHeight/2,'var(--bp-cyan)',50);setTimeout(()=>fp(innerWidth/2,innerHeight/2,'var(--bp-gold)',30),400)}
$('btnReview').addEventListener('click',function(){const rs=$('reviewSection');if(!rs.classList.contains('bp-hidden')){rs.classList.add('bp-hidden');this.textContent='📋 查看错题解析';return}this.textContent='📋 收起解析';buildReview();rs.classList.remove('bp-hidden')});
function buildReview(){const rs=$('reviewSection');rs.innerHTML='';let hasWrong=false;const labels=['A','B','C','D'];S.picks.forEach((n,ri)=>{const cr=S.rr[ri];if(!cr||!cr.answers)return;const wrongs=cr.answers.filter(a=>!a.isCorrect);if(!wrongs.length)return;hasWrong=true;let h='<div class="rev-student">⚙ '+n+' · '+S.class+'</div>';wrongs.forEach(a=>{h+='<div class="rev-item"><span class="rev-princ">'+a.principle+'</span><div class="rev-q">'+a.question+'</div><div class="rev-opt-grid">';labels.forEach(l=>{let cls='rev-opt';if(l===a.yourAnswer)cls+=' rev-chosen';if(l===a.correctAnswer)cls+=' rev-right';h+='<div class="'+cls+'"><span class="rev-opt-label">'+l+'</span><span>'+a.options[l]+'</span></div>'});h+='</div></div>'});rs.innerHTML+=h});if(!hasWrong)rs.innerHTML='<div class="rev-empty">\u2705 \u6240\u6709\u540c\u5b66\u5168\u90e8\u7b54\u5bf9\uff01</div>'}
lc();sh('sceneSetup');ud();
</script>
<div class="toast-container" id="toastContainer"></div>
</body>
</html>
