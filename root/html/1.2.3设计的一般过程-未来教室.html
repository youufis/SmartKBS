<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 未来教室 · 设计的一般过程 · 互动答题</title>
<style>
/* ═══════════════════════════════════════
   0. CSS 变量 & 重置 · 玻璃拟态
   ═══════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: #e8edf5;
  --glass-bg: rgba(255,255,255,.55);
  --glass-bg-dark: rgba(255,255,255,.35);
  --glass-border: rgba(255,255,255,.6);
  --glass-shadow: 0 8px 32px rgba(31,38,135,.12);
  --glass-shadow-hover: 0 12px 48px rgba(31,38,135,.2);
  --cyan: #06b6d4;
  --cyan-soft: rgba(6,182,212,.15);
  --purple: #8b5cf6;
  --purple-soft: rgba(139,92,246,.12);
  --gold: #f59e0b;
  --green: #10b981;
  --red: #ef4444;
  --text: #1e293b;
  --text-dim: #64748b;
  --text-bright: #0f172a;
  --radius: 20px;
  --radius-sm: 14px;
  --font: 'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif;
}
html{font-size:20px}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  position:relative;
}

/* 渐变背景 */
body::before{
  content:'';position:fixed;top:-30%;left:-20%;
  width:70%;height:70%;
  background:radial-gradient(circle,rgba(6,182,212,.12),transparent 70%);
  pointer-events:none;z-index:0;
}
body::after{
  content:'';position:fixed;bottom:-20%;right:-10%;
  width:60%;height:60%;
  background:radial-gradient(circle,rgba(139,92,246,.1),transparent 70%);
  pointer-events:none;z-index:0;
}

/* 浮动几何装饰 */
.floating-shape{
  position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  background:rgba(255,255,255,.3);backdrop-filter:blur(4px);
  border:1px solid rgba(255,255,255,.4);
  animation:float-shape 8s ease-in-out infinite alternate;
}
.floating-shape:nth-child(1){width:120px;height:120px;top:15%;right:8%;animation-delay:-2s;}
.floating-shape:nth-child(2){width:80px;height:80px;bottom:20%;left:5%;animation-delay:-4s;border-radius:30% 70% 70% 30%;}
.floating-shape:nth-child(3){width:60px;height:60px;top:40%;left:12%;animation-delay:-6s;border-radius:60% 40% 30% 70%;}
@keyframes float-shape{
  0%{transform:translateY(0) rotate(0deg) scale(1)}
  100%{transform:translateY(-30px) rotate(15deg) scale(1.05)}
}

/* ═══════════════════════════════════════
   1. 主容器
   ═══════════════════════════════════════ */
#app{
  position:relative;z-index:1;
  width:100%;max-width:920px;
  min-height:100vh;
  padding:28px 20px 50px;
  display:flex;flex-direction:column;
  align-items:center;gap:18px;
}

/* ═══════════════════════════════════════
   2. 玻璃卡片通用
   ═══════════════════════════════════════ */
.glass-card{
  background:var(--glass-bg);
  backdrop-filter:blur(20px) saturate(1.8);
  -webkit-backdrop-filter:blur(20px) saturate(1.8);
  border:1px solid var(--glass-border);
  border-radius:var(--radius);
  box-shadow:var(--glass-shadow);
  width:100%;
  padding:28px 24px;
  transition:all .3s;
}
.glass-card-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;
  border-radius:var(--radius);
}
header.glass-card-header h1{
  font-size:1.1rem;font-weight:800;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:1px;
}

/* ═══════════════════════════════════════
   3. 进度指示器
   ═══════════════════════════════════════ */
.round-indicator{display:flex;align-items:center;gap:10px;}
.round-dot{
  width:12px;height:12px;border-radius:50%;
  background:rgba(0,0,0,.08);
  transition:all .4s;
}
.round-dot.done{background:var(--cyan);box-shadow:0 0 12px rgba(6,182,212,.4);}
.round-dot.active{
  background:var(--gold);box-shadow:0 0 18px rgba(245,158,11,.5);
  animation:dot-pulse2 1s ease-in-out infinite;
}
.round-dot.future{background:rgba(0,0,0,.06);}
@keyframes dot-pulse2{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.3)}
}

.scene-title{
  font-size:1.4rem;font-weight:800;text-align:center;margin-bottom:16px;
  color:var(--text-bright);
}

/* ═══════════════════════════════════════
   4. 设置界面
   ═══════════════════════════════════════ */
.setup-group{display:flex;flex-direction:column;gap:14px;max-width:400px;margin:0 auto;}
.setup-row{display:flex;flex-direction:column;gap:6px;}
.setup-row label{
  font-size:.82rem;font-weight:600;
  color:var(--cyan);letter-spacing:1px;
}
.setup-row select,.setup-row button{
  width:100%;padding:14px 18px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.6);
  border:1px solid rgba(255,255,255,.5);
  color:var(--text);font-size:1rem;font-family:var(--font);
  cursor:pointer;transition:all .3s;outline:none;
}
.setup-row select:hover,.setup-row select:focus{
  border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft);
}
.setup-row select option{background:#fff;color:var(--text);}
.btn-primary{
  background:linear-gradient(135deg,var(--cyan),var(--purple))!important;
  border:none!important;color:#fff!important;font-weight:800;
  font-size:1.05rem!important;letter-spacing:2px;
  transition:all .3s!important;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:var(--glass-shadow-hover)!important;}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none!important;}

/* ═══════════════════════════════════════
   5. 玻璃转盘点名
   ═══════════════════════════════════════ */
.pick-section{text-align:center;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pick-roll-area{
  position:relative;width:100%;max-width:480px;
  min-height:150px;display:flex;align-items:center;justify-content:center;
  margin:8px 0;
}
.pick-glass-ring{
  position:absolute;width:160px;height:160px;border-radius:50%;
  background:rgba(255,255,255,.2);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.3);
  animation:glass-spin 4s linear infinite;
}
.pick-glass-ring:nth-child(2){width:130px;height:130px;animation-direction:reverse;animation-duration:5s;background:rgba(139,92,246,.08);}
.pick-glass-ring:nth-child(3){width:190px;height:190px;animation-duration:6s;background:rgba(6,182,212,.06);}
@keyframes glass-spin{to{transform:rotate(360deg)}}
.pick-name{
  font-size:2.8rem;font-weight:800;z-index:2;
  color:var(--text-bright);
  min-width:180px;text-align:center;letter-spacing:3px;
  text-shadow:0 2px 20px rgba(255,255,255,.5);
  transition:all .15s;
}
.pick-name.rolling{animation:name-fade .12s infinite;}
@keyframes name-fade{
  0%,100%{opacity:1}
  50%{opacity:.3}
}
.pick-name.result{
  animation:glass-reveal .6s cubic-bezier(.34,1.56,.64,1);
  background:linear-gradient(135deg,var(--gold),var(--purple));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  font-size:3rem;
}
@keyframes glass-reveal{
  0%{transform:scale(.6) rotateY(120deg);opacity:0;filter:blur(10px)}
  100%{transform:scale(1) rotateY(0);opacity:1;filter:blur(0)}
}
.pick-hint{color:var(--text-dim);font-size:.9rem;margin-top:4px;}
.pick-class-tag{
  display:inline-block;padding:4px 18px;border-radius:100px;
  background:var(--cyan-soft);border:1px solid rgba(6,182,212,.3);
  color:var(--cyan);font-size:.8rem;font-weight:600;margin-top:6px;letter-spacing:1px;
}
.btn-glass{
  margin-top:16px;padding:14px 44px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  border:none;color:#fff;font-size:1.05rem;font-weight:700;
  cursor:pointer;letter-spacing:2px;transition:all .3s;
}
.btn-glass:hover{transform:translateY(-2px);box-shadow:var(--glass-shadow-hover);}
.btn-glass:disabled{opacity:.4;cursor:not-allowed;transform:none;}

/* ═══════════════════════════════════════
   6. 答题区
   ═══════════════════════════════════════ */
.quiz-section{text-align:center;}
.q-number{
  display:inline-block;padding:4px 16px;border-radius:100px;
  background:var(--purple-soft);border:1px solid rgba(139,92,246,.25);
  color:var(--purple);font-size:.8rem;font-weight:600;margin-bottom:8px;
}
.q-principle{
  display:inline-block;padding:3px 14px;border-radius:100px;
  background:var(--cyan-soft);border:1px solid rgba(6,182,212,.25);
  color:var(--cyan);font-size:.75rem;margin-left:8px;
}
.q-text{
  font-size:1.1rem;line-height:1.7;margin:10px 0 18px;
  text-align:left;padding:16px 20px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.4);
  border-left:3px solid var(--cyan);
  color:var(--text);
}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.option-btn{
  padding:14px 18px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.5);
  border:1px solid rgba(255,255,255,.4);
  color:var(--text);font-size:.95rem;text-align:left;cursor:pointer;
  transition:all .25s;font-family:var(--font);line-height:1.5;
  display:flex;align-items:flex-start;gap:10px;
}
.option-btn .opt-label{
  display:inline-flex;width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.6);align-items:center;justify-content:center;
  font-weight:700;font-size:.8rem;flex-shrink:0;
  color:var(--text-dim);
}
.option-btn:hover{
  background:rgba(255,255,255,.75);
  border-color:var(--cyan);
  transform:translateX(4px);
  box-shadow:0 4px 16px rgba(6,182,212,.1);
}
.option-btn.selected{
  border-color:var(--cyan);background:var(--cyan-soft);
  box-shadow:0 0 0 2px rgba(6,182,212,.2);
}
.option-btn.correct{
  border-color:var(--green)!important;
  background:rgba(16,185,129,.12)!important;
  box-shadow:0 0 0 2px rgba(16,185,129,.25)!important;
}
.option-btn.correct .opt-label{background:var(--green);color:#fff;}
.option-btn.wrong{
  border-color:var(--red)!important;
  background:rgba(239,68,68,.1)!important;
  box-shadow:0 0 0 2px rgba(239,68,68,.2)!important;
  animation:shake2 .4s;
}
.option-btn.wrong .opt-label{background:var(--red);color:#fff;}
.option-btn.disabled{pointer-events:none;opacity:.6;}
@keyframes shake2{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}
.feedback-box{
  margin-top:14px;padding:12px 20px;border-radius:var(--radius-sm);
  font-weight:600;font-size:.95rem;animation:glass-in .35s;
}
@keyframes glass-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.feedback-box.correct-fb{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);color:var(--green);}
.feedback-box.wrong-fb{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:var(--red);}
.btn-next-glass{
  margin-top:14px;padding:12px 36px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  border:none;color:#fff;font-size:1rem;font-weight:700;
  cursor:pointer;letter-spacing:2px;transition:all .3s;
}
.btn-next-glass:hover{transform:translateY(-2px);box-shadow:var(--glass-shadow-hover);}

/* ═══════════════════════════════════════
   7. 计分区
   ═══════════════════════════════════════ */
.score-section{text-align:center;}
.score-big{
  font-size:4.5rem;font-weight:900;
  background:linear-gradient(135deg,var(--gold),var(--purple));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  animation:score-pop2 .8s cubic-bezier(.34,1.56,.64,1);
  margin:8px 0;
}
@keyframes score-pop2{
  0%{transform:scale(0) rotate(-15deg);opacity:0}
  60%{transform:scale(1.25) rotate(3deg)}
  100%{transform:scale(1) rotate(0);opacity:1}
}
.score-label{color:var(--text-dim);font-size:.9rem;letter-spacing:1px;}
.score-detail{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:12px 0;}
.score-stat{
  padding:8px 18px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.3);
  color:var(--text-dim);font-size:.85rem;
}
.score-stat strong{color:var(--text-bright);font-size:1.1rem;}

.glass-bar-wrap{width:100%;max-width:480px;margin:10px auto;}
.glass-bar-bg{
  width:100%;height:18px;border-radius:100px;
  background:rgba(0,0,0,.04);
  border:1px solid rgba(255,255,255,.3);
  overflow:hidden;
}
.glass-bar-fill{
  height:100%;border-radius:100px;
  background:linear-gradient(90deg,var(--cyan),var(--purple));
  transition:width 1s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 0 20px var(--cyan-soft);
}
.glass-bar-label{
  display:flex;justify-content:space-between;
  font-size:.78rem;color:var(--text-dim);margin-top:3px;
}

/* ═══════════════════════════════════════
   8. 最终总结
   ═══════════════════════════════════════ */
.final-section{text-align:center;}
.final-title{
  font-size:1.8rem;font-weight:900;margin-bottom:4px;
  background:linear-gradient(135deg,var(--gold),var(--purple),var(--cyan));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.final-sub{color:var(--text-dim);margin-bottom:18px;}
.final-table{width:100%;border-collapse:collapse;margin:8px 0 18px;}
.final-table th{
  padding:10px 12px;text-align:left;font-size:.8rem;
  color:var(--cyan);border-bottom:1px solid rgba(6,182,212,.15);
  font-weight:600;letter-spacing:1px;
}
.final-table td{
  padding:10px 12px;border-bottom:1px solid rgba(0,0,0,.04);
  font-size:.9rem;
}
.final-table tr:hover td{background:rgba(255,255,255,.3);}
.final-table .rank-num{color:var(--gold);font-weight:800;}
.final-table .rank-score{color:var(--purple);font-weight:700;}

/* ═══════════════════════════════════════
   9. 通用
   ═══════════════════════════════════════ */
.hidden{display:none!important;}

/* Toast */
.toast-container{
  position:fixed;top:20px;right:20px;z-index:1000;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  padding:12px 22px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.5);
  font-weight:600;font-size:.9rem;color:var(--text);
  animation:toast-in2 .4s cubic-bezier(.34,1.56,.64,1) forwards;
  display:flex;align-items:center;gap:10px;
  box-shadow:var(--glass-shadow);
}
.toast .toast-icon{font-size:1.2rem;}
.toast .toast-score{color:var(--gold);font-weight:800;}
.toast.out{animation:toast-out2 .3s ease-in forwards;}
@keyframes toast-in2{from{transform:translateX(100%) scale(.9);opacity:0} to{transform:translateX(0) scale(1);opacity:1}}
@keyframes toast-out2{from{opacity:1} to{transform:translateX(100%);opacity:0}}

/* 粒子 */
.particle-container{position:fixed;inset:0;pointer-events:none;z-index:999;}
.cele-particle{
  position:fixed;border-radius:50%;pointer-events:none;
  animation:particle-fly2 1.1s cubic-bezier(.25,.46,.45,.94) forwards;
}
@keyframes particle-fly2{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}
}

@media(max-width:640px){
  #app{padding:16px 12px 30px;}
  .glass-card{padding:20px 16px;}
  header.glass-card-header h1{font-size:.9rem;}
  .pick-name{font-size:2rem;}
  .pick-name.result{font-size:2.2rem;}
  .pick-glass-ring{width:140px;height:140px;}
  .pick-glass-ring:nth-child(2){width:110px;height:110px;}
  .pick-glass-ring:nth-child(3){width:170px;height:170px;}
  .options-grid{grid-template-columns:1fr;}
  .q-text{font-size:1rem;}
  .score-big{font-size:3.2rem;}
  .final-title{font-size:1.4rem;}
}

/* 错题解析 */
.review-section{text-align:left;margin-top:10px;border-top:1px solid rgba(255,255,255,.12);padding-top:14px;max-height:400px;overflow-y:auto}
.rev-empty{text-align:center;color:#4ecdc4;font-family:var(--font-mono);font-size:.75rem;padding:20px 0}
.rev-student{font-family:var(--font-mono);font-size:.85rem;font-weight:600;color:#d4a843;margin:10px 0 6px;padding-bottom:4px;border-bottom:1px dashed rgba(255,255,255,.1)}
.rev-item{padding:10px 12px;margin-bottom:8px;background:rgba(0,0,0,.15);border-left:3px solid #ff6b6b;border-radius:0 4px 4px 0}
.rev-q{font-size:.88rem;line-height:1.5;margin-bottom:6px}
.rev-princ{display:inline-block;font-family:var(--font-mono);font-size:.75rem;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1);padding:1px 6px;margin-bottom:6px}
.rev-opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.rev-opt{padding:6px 8px;font-size:.78rem;line-height:1.4;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.08);border-radius:2px;display:flex;align-items:flex-start;gap:6px;color:inherit}
.rev-opt .rev-opt-label{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.8rem;font-weight:700;flex-shrink:0;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.4)}
.rev-opt.rev-chosen{background:rgba(255,107,107,.1);border-color:#ff6b6b}
.rev-opt.rev-chosen .rev-opt-label{background:#ff6b6b;color:#fff;border-color:#ff6b6b}
.rev-opt.rev-right{background:rgba(78,205,196,.1);border-color:#4ecdc4}
.rev-opt.rev-right .rev-opt-label{background:#4ecdc4;color:#1a1a2e;border-color:#4ecdc4}


.gear-icon{display:none}/* hidden */
</style>
</head>
<body>

<!-- 装饰浮块 -->
<div class="floating-shape"></div>
<div class="floating-shape"></div>
<div class="floating-shape"></div>

<!-- Toast 容器 -->
<div class="toast-container" id="toastContainer"></div>
<div class="particle-container" id="particleContainer"></div>

<div id="app">

  <!-- 头部 -->
  <header class="glass-card glass-card-header">
    <h1>📚 未来教室 · 设计的一般过程</h1>
    <div class="round-indicator" id="roundIndicator"></div>
  </header>

  <!-- 场景0: 设置 -->
  <div class="glass-card" id="sceneSetup">
    <div class="scene-title">📖 课前准备</div>
    <div class="setup-group">
      <div class="setup-row">
        <label>🌍 年级</label>
        <select id="gradeSelect"><option value="高一">高一年级</option><option value="高二">高二年级</option></select>
      </div>
      <div class="setup-row">
        <label>🏫 班级</label>
        <select id="classSelect" disabled><option value="">-- 请选择 --</option></select>
      </div>
      <div class="setup-row" style="margin-top:6px">
        <button class="btn-primary" id="btnStart" disabled>📋 开始互动课堂</button>
      </div>
    </div>
  </div>

  <!-- 场景1: 点名 -->
  <div class="glass-card hidden" id="scenePick">
    <div class="scene-title" id="pickTitle">🎯 第 1 组 · 玻璃转盘</div>
    <div class="pick-section">
      <div class="pick-hint" id="pickHint">轻触转盘，抽取幸运同学...</div>
      <div class="pick-roll-area">
        <div class="pick-glass-ring"></div>
        <div class="pick-glass-ring"></div>
        <div class="pick-glass-ring"></div>
        <div class="pick-name" id="pickName">✨</div>
      </div>
      <div class="pick-class-tag hidden" id="pickClassTag"></div>
      <button class="btn-glass hidden" id="btnPickStart">🔄 抽取同学</button>
      <button class="btn-glass hidden" id="btnPickConfirm" style="background:linear-gradient(135deg,var(--gold),var(--purple))">✅ 确认开始</button>
    <button class="btn-glass hidden" id="btnRepick" style="background:linear-gradient(135deg,var(--gold),var(--purple))">↻ 重抽</button>
    </div>
  </div>

  <!-- 场景2: 答题 -->
  <div class="glass-card hidden" id="sceneQuiz">
    <div class="scene-title" id="quizTitle">📝 第 1 组 · 知识闯关</div>
    <div class="quiz-section">
      <div>
        <span class="q-number" id="qNumber">题目 1/2</span>
        <span class="q-principle" id="qPrinciple">设计过程</span>
      </div>
      <div class="q-text" id="qText">加载中...</div>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="feedback-box hidden" id="feedbackBox"></div>
      <button class="btn-next-glass hidden" id="btnNextQ">➡️ 下一题</button>
    </div>
  </div>

  <!-- 场景3: 计分 -->
  <div class="glass-card hidden" id="sceneScore">
    <div class="scene-title">🏆 本轮结果</div>
    <div class="score-section">
      <div class="score-label">🎓 被点名同学</div>
      <div style="font-size:1.4rem;font-weight:700;color:var(--text-bright);margin:4px 0 10px" id="scoreStudent"></div>
      <div class="score-big" id="scorePoints">+10</div>
      <div class="score-label" id="scoreLabel">答对 1 题 · 获得积分</div>
      <div class="score-detail" id="scoreDetail"></div>
      <div class="glass-bar-wrap">
        <div class="glass-bar-bg">
          <div class="glass-bar-fill" id="energyBar" style="width:0%"></div>
        </div>
        <div class="glass-bar-label"><span>📈 学习进度</span><span id="energyText">0%</span></div>
      </div>
      <button class="btn-next-glass" id="btnNextRound">📖 进入下一组</button>
    </div>
  </div>

  <!-- 场景4: 最终 -->
  <div class="glass-card hidden" id="sceneFinal">
    <div class="scene-title final-title">🎉 课堂完成</div>
    <div class="final-sub">所有组别挑战完成！以下是积分榜</div>
    <div style="overflow-x:auto">
      <table class="final-table">
        <thead><tr><th>#</th><th>姓名</th><th>班级</th><th>答对</th><th>积分</th></tr></thead>
        <tbody id="finalBody"></tbody>
      </table>
    </div>
        <button class="rev-btn" id="btnReview" style="padding:10px 36px;font-size:.8rem;margin-top:6px;cursor:pointer;border:2px solid #5bc0eb;background:transparent;color:#5bc0eb;font-family:var(--font-mono);border-radius:6px">📋 查看错题解析</button>
    <div class="review-section hidden" id="reviewSection"></div>
<button class="btn-primary" style="padding:12px 44px;font-size:.95rem;cursor:pointer;border:none;border-radius:var(--radius-sm);letter-spacing:2px;" onclick="location.reload()">🔄 再来一次</button>
  </div>
</div>

<script>

// 从 URL 路径自动提取教师用户名
const pathMatch = window.location.pathname.match(/\/api\/files\/([^\/]+)\/html\//);
const TEACHER = (pathMatch ? pathMatch[1] : '') || '';
// ═══════════════════════════════════════
// 题库：设计的一般过程 10 道
// ═══════════════════════════════════════
const QUESTION_BANK = [
  {question:"设计的一般过程的第一步是什么？",options:{A:"制订设计方案",B:"发现与明确问题",C:"制作模型或原型",D:"测试、评估及优化"},answer:"B",principle:"设计过程"},
  {question:"在设计'中学生使用的台灯'时，下列步骤中，属于'制订设计方案'环节的是",options:{A:"到各班进行问卷调查，了解同学们喜欢的造型和色彩",B:"制作台灯的原型",C:"对台灯进行稳定性、绝缘性能等方面的试验",D:"编写台灯的产品说明书"},answer:"A",principle:"设计方案"},
  {question:"在制订设计方案的过程中，下列排序最合理的是",options:{A:"收集信息→方案构思→设计分析→方案呈现→方案筛选",B:"收集信息→设计分析→方案构思→方案呈现→方案筛选",C:"设计分析→收集信息→方案构思→方案筛选→方案呈现",D:"方案构思→收集信息→设计分析→方案呈现→方案筛选"},answer:"B",principle:"设计方案"},
  {question:"在模型或原型制作完成后，一般需要对其进行（ ），以检验产品是否达到设计要求",options:{A:"评价",B:"优化",C:"测试",D:"编写说明书"},answer:"C",principle:"测试评价"},
  {question:"小张发现教室的雨伞无处放置，导致地面湿滑，于是他决定设计一个雨伞架。这属于设计一般过程中的哪个环节？",options:{A:"发现与明确问题",B:"制订设计方案",C:"制作模型或原型",D:"测试、评估及优化"},answer:"A",principle:"发现问题"},
  {question:"在设计过程中，将设计想法转化为视觉形象，通常采用",options:{A:"文字描述",B:"草图",C:"技术试验",D:"产品说明书"},answer:"B",principle:"方案构思"},
  {question:"下列选项中，属于'优化设计方案'环节的具体工作的是",options:{A:"收集与设计相关的专利、标准等资料",B:"用草图呈现多个构思方案",C:"根据测试和评价结果，对方案进行修改",D:"利用合适的材料和工具制作出模型"},answer:"C",principle:"测试评价"},
  {question:"设计的一般过程具有开放性，下列说法恰当的是",options:{A:"设计是一个单向进行的过程，不能循环",B:"所有产品的设计都必须严格按照五个步骤依次进行",C:"设计是一个动态往复的过程，有些步骤之间可能出现循环",D:"当测试发现问题后，必须从头开始所有工作"},answer:"C",principle:"设计过程"},
  {question:"编写产品说明书是设计一般过程中的最后一个环节，其基本要求不包括",options:{A:"语言通俗易懂",B:"突出产品的设计特点",C:"符合相关法律、法规",D:"尺寸标注必须美观"},answer:"D",principle:"产品说明书"},
  {question:"某小组设计了一款多功能工具钳，在制作出模型后，他们进行了剪切、拧螺丝等操作测试，并撰写了试验报告。这一过程属于",options:{A:"发现与明确问题",B:"制订设计方案",C:"制作模型或原型",D:"测试、评价及优化"},answer:"D",principle:"测试评价"}
];
const GROUPS=[];
for(let i=0;i<5;i++) GROUPS.push(QUESTION_BANK.slice(i*2,i*2+2));

// ═══════════════════════════════════════
// 状态
// ═══════════════════════════════════════
let state={grade:'高一',class:'',students:[],available:[],picks:[],currentRound:0,currentQ:0,selectedAnswer:'',answered:false,roundResults:[],totalScore:0};
let _correctCounter=0;

function $(id){return document.getElementById(id);}
function show(id){$(id).classList.remove('hidden');}
function hide(id){$(id).classList.add('hidden');}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function showToast(icon,msg,score=''){
  const tc=$('toastContainer');
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<span class="toast-icon">${icon}</span>${msg}${score?` <span class="toast-score">${score}</span>`:''}`;
  tc.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),350);},3000);
}
function fireParticles(x,y,color,count=40){
  const pc=$('particleContainer');
  for(let i=0;i<count;i++){
    const el=document.createElement('div');el.className='cele-particle';
    const a=Math.random()*Math.PI*2,d=80+Math.random()*160;
    el.style.cssText=`left:${x||innerWidth/2}px;top:${y||innerHeight/2}px;width:${4+Math.random()*8}px;height:${4+Math.random()*8}px;background:${color||'var(--gold)'};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;animation-duration:${.8+Math.random()*.6}s`;
    pc.appendChild(el);
    setTimeout(()=>el.remove(),1500);
  }
}
function updateRoundDots(){
  const ri=$('roundIndicator');ri.innerHTML='';
  for(let i=0;i<5;i++){
    const d=document.createElement('div');d.className='round-dot'+(i<state.currentRound?' done':i===state.currentRound?' active':' future');
    d.title=`第${i+1}组`;ri.appendChild(d);
  }
}
function saveRecord(g,c,s,cc,t,pts,ans,title){fetch('/rollcall-api/save-record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,student:s,type:'互动答题',teacher:TEACHER,title:title||'',correctCount:cc,totalQuestions:t,points:pts,answers:ans||[]})}).catch(()=>{})}
function saveScore(grade,cls,name,points){
  fetch('/score-api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade,class:cls,name,points})})
    .then(r=>r.ok?showToast('💰','积分已保存',`+${points}`):showToast('⚠️','积分存储异常')).then(()=>{fetch('/rollcall-api/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:state.grade,class:state.class,student:name,result:'quiz'})}).catch(()=>{});const cr=state.roundResults[state.currentRound];if(cr)saveRecord(state.grade,state.class,name,cr.correctCount||0,2,cr.points||5,cr.answers,'设计的一般过程-未来教室');})
    .catch(()=>{console.log(`[分数] ${grade}|${cls}|${name} +${points}`);showToast('📝','本地模式·分数已记录');});
}

// ═══════════════════════════════════════
// 数据加载
// ═══════════════════════════════════════
async function loadClasses(){
  const gRaw=$('gradeSelect').value;const g=gRaw.replace('年级','');state.grade=g;
  const cs=$('classSelect');cs.disabled=true;cs.innerHTML='<option value="">加载中...</option>';
  try{
    const r=await fetch('/rollcall-api/classes?grade='+encodeURIComponent(g)+'&teacher='+TEACHER);const data=await r.json();const cls=data;
    
    cs.innerHTML='<option value="">-- 请选择班级 --</option>';
    cls.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o);});
    cs.disabled=false;
  }catch(e){cs.innerHTML='<option value="">加载失败</option>';}
}
$('gradeSelect').addEventListener('change',loadClasses);
$('classSelect').addEventListener('change',async function(){
  const cls=this.value;state.class=cls;$('btnStart').disabled=!cls;
  if(cls){
    const resp=await fetch('/rollcall-api/students?grade='+encodeURIComponent(state.grade)+'&class='+encodeURIComponent(cls)+'&teacher='+TEACHER);
    state.students=await resp.json().then(d=>d.map(s=>s.name));
    ;
  }
});
$('btnStart').addEventListener('click',function(){
  if(!state.class||state.students.length<5){showToast('⚠️','学生不足5人');return;}
  state.available=shuffle(state.available);hide('sceneSetup');startRound(0);
});

// ═══════════════════════════════════════
// 游戏流程
// ═══════════════════════════════════════
function startRound(ri){state.currentRound=ri;state.currentQ=0;_correctCounter=0;if(!state.roundResults[ri])state.roundResults[ri]={correctCount:0,points:0,answers:[]};state.roundResults[ri].answers=[];updateRoundDots();startPick();}
function startPick(){
  show('scenePick');hide('sceneQuiz');hide('sceneScore');hide('sceneFinal');
  $('pickTitle').textContent=`🎯 第 ${state.currentRound+1} 组 · 玻璃转盘`;
  $('pickHint').textContent='轻触转盘，抽取幸运同学...';$('pickHint').classList.remove('hidden');
  $('pickClassTag').classList.add('hidden');$('btnPickStart').classList.remove('hidden');$('btnPickConfirm').classList.add('hidden');
  $('pickName').textContent='✨';$('pickName').className='pick-name';$('btnPickStart').disabled=false;$('btnPickStart').textContent='🔄 抽取同学';
}
function rp(){const pool=state.students.length>0?state.students:['---'];const pn=$('pickName');pn.className='pick-name rolling';$('pickHint').textContent='抽取中...';$('btnPickConfirm').classList.add('hidden');$('btnRepick').classList.add('hidden');$('btnPickStart').disabled=true;let rc=0,mx=18+Math.floor(Math.random()*10);let iv=setInterval(()=>{pn.textContent=pool[Math.floor(Math.random()*pool.length)];rc++;if(rc>=mx){clearInterval(iv);fetch('/rollcall-api/pick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:state.grade,class:state.class})}).then(d=>d.json()).then(d=>{if(d.error){showToast('⚠️',d.error);pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false;return}const c=d.student;pn.textContent=c;pn.className='pick-name result';$('pickHint').classList.add('hidden');$('pickClassTag').textContent=state.grade+' · '+state.class;$('pickClassTag').classList.remove('hidden');$('btnPickConfirm').classList.remove('hidden');$('btnRepick').classList.remove('hidden');fireParticles(innerWidth/2,innerHeight/2,'var(--gold)',60);showToast('🎯','已选',c);state.picks[state.currentRound]=c}).catch(()=>{showToast('⚠️','服务异常');pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false})}},60+Math.random()*40)}
$('btnPickStart').addEventListener('click',function(){this.disabled=true;rp()});
$('btnRepick').addEventListener('click',rp);
$('btnPickConfirm').addEventListener('click',function(){hide('scenePick');startQuiz();});
function startQuiz(){show('sceneQuiz');state.currentQ=0;showQuestion();}
function showQuestion(){
  const g=GROUPS[state.currentRound],q=g[state.currentQ];
  $('quizTitle').textContent=`📝 第 ${state.currentRound+1} 组 · 知识闯关`;
  $('qNumber').textContent=`题目 ${state.currentQ+1}/2`;$('qPrinciple').textContent=q.principle;$('qText').textContent=q.question;
  state.selectedAnswer='';state.answered=false;$('feedbackBox').classList.add('hidden');$('btnNextQ').classList.add('hidden');
  const grid=$('optionsGrid');grid.innerHTML='';
  ['A','B','C','D'].forEach(l=>{
    const b=document.createElement('button');b.className='option-btn';
    b.innerHTML=`<span class="opt-label">${l}</span><span>${q.options[l]}</span>`;b.dataset.label=l;
    b.addEventListener('click',()=>handleAnswer(l));grid.appendChild(b);
  });
}
function handleAnswer(l){
  if(state.answered) return;state.answered=true;
  const g=GROUPS[state.currentRound],q=g[state.currentQ],correct=q.answer,isCorrect=l===correct;
  if(isCorrect) _correctCounter++;
  state.roundResults[state.currentRound].correctCount=_correctCounter;
  let pts=5;if(_correctCounter===1)pts=10;else if(_correctCounter===2)pts=15;
  state.roundResults[state.currentRound].answers.push({question:q.question,options:q.options,correctAnswer:q.answer,yourAnswer:l,principle:q.principle,isCorrect:l===q.answer});state.roundResults[state.currentRound].points=pts;
  const btns=$('optionsGrid').querySelectorAll('.option-btn');
  btns.forEach(b=>{b.classList.add('disabled');if(b.dataset.label===correct)b.classList.add('correct');if(b.dataset.label===l&&!isCorrect)b.classList.add('wrong');if(b.dataset.label===l&&isCorrect)b.classList.add('selected');});
  const fb=$('feedbackBox');fb.classList.remove('hidden');
  if(isCorrect){fb.className='feedback-box correct-fb';fb.textContent=`✅ 回答正确！「${correct}. ${q.options[correct]}」`;fireParticles(innerWidth/2,innerHeight-80,'var(--green)',20);}
  else{fb.className='feedback-box wrong-fb';fb.textContent=`❌ 回答错误。正确答案是 ${correct}. ${q.options[correct]}`;}
  $('btnNextQ').classList.remove('hidden');$('btnNextQ').textContent=state.currentQ===0?'➡️ 下一题':'📊 查看得分';
}
$('btnNextQ').addEventListener('click',function(){if(state.currentQ===0){state.currentQ=1;showQuestion();}else{hide('sceneQuiz');showScore();}});
function showScore(){
  show('sceneScore');const s=state.picks[state.currentRound];
  $('scoreStudent').textContent=`${s} · ${state.class}`;
  const cr=state.roundResults[state.currentRound],cc=cr?.correctCount||0,pts=cr?.points||5;
  $('scorePoints').textContent=`+${pts}`;$('scoreLabel').textContent=`答对 ${cc} 题 · 获得积分`;
  $('scoreDetail').innerHTML=`<div class="score-stat">✅ 答对 <strong>${cc}</strong> 题</div><div class="score-stat">❌ 答错 <strong>${2-cc}</strong> 题</div><div class="score-stat">🏆 保底 <strong>5</strong> 分</div>`;
  const p=cc===0?25:cc===1?60:100;setTimeout(()=>{$('energyBar').style.width=p+'%';$('energyText').textContent=p+'%';},100);
  saveScore(state.grade,state.class,s,pts);state.totalScore+=pts;
  fireParticles(innerWidth/2,innerHeight/2-100,'var(--gold)',40);
  $('btnNextRound').textContent=state.currentRound<4?'📖 进入下一组':'🏁 查看总榜单';
}
$('btnNextRound').addEventListener('click',function(){if(state.currentRound<4){hide('sceneScore');startRound(state.currentRound+1);}else{hide('sceneScore');showFinal();}});
function showFinal(){$('reviewSection').classList.add('hidden');$('btnReview').textContent='\U0001F4CB \u67e5\u770b\u9519\u9898\u89e3\u6790';
  show('sceneFinal');
  const tb=$('finalBody');tb.innerHTML='';
  const rows=state.picks.map((n,i)=>{const cr=state.roundResults[i];return{name:n,class:state.class,correct:cr?.correctCount||0,points:cr?.points||5};}).sort((a,b)=>b.points-a.points);
  rows.forEach((r,i)=>{const tr=document.createElement('tr');tr.innerHTML=`<td class="rank-num">#${i+1}</td><td>${r.name}</td><td>${r.class}</td><td>${r.correct}/2</td><td class="rank-score">+${r.points}</td>`;tb.appendChild(tr);});
  fireParticles(innerWidth/2,innerHeight/2,'var(--gold)',60);
  setTimeout(()=>fireParticles(innerWidth/3,innerHeight/3,'var(--cyan)',30),400);
}
function buildReview(){const rs=$('reviewSection');rs.innerHTML='';let hw=false;const la=['A','B','C','D'];state.picks.forEach((n,ri)=>{const cr=state.roundResults[ri];if(!cr||!cr.answers)return;const w=cr.answers.filter(a=>!a.isCorrect);if(!w.length)return;hw=true;let h='<div class="rev-student">'+n+'</div>';w.forEach(a=>{h+='<div class="rev-item"><span class="rev-princ">'+a.principle+'</span><div class="rev-q">'+a.question+'</div><div class="rev-opt-grid">';la.forEach(l=>{let cls='rev-opt';if(l===a.yourAnswer)cls+=' rev-chosen';if(l===a.correctAnswer)cls+=' rev-right';h+='<div class="'+cls+'"><span class="rev-opt-label">'+l+'</span><span>'+a.options[l]+'</span></div>'});h+='</div></div>'});rs.innerHTML+=h});if(!hw)rs.innerHTML='<div class="rev-empty">\u2705 \u6240\u6709\u540c\u5b66\u5168\u90e8\u7b54\u5bf9\uff01</div>'}
$('btnReview').addEventListener('click',function(){const rs=$('reviewSection');if(!rs.classList.contains('hidden')){rs.classList.add('hidden');this.textContent='\U0001F4CB \u67e5\u770b\u9519\u9898\u89e3\u6790';return}this.textContent='\U0001F4CB \u6536\u8d77\u89e3\u6790';buildReview();rs.classList.remove('hidden')});
loadClasses();show('sceneSetup');updateRoundDots();
</script>
</body>
</html>
