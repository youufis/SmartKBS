<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 常用的构思方法 · 森系答题</title>
<style>
/* ═══════════════════════════════════════
   自然森系 Forest Nature
   绿色调 · 树叶纹理 · 木质暖色 · 柔和
   ═══════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: #f5f0e8;
  --bg-alt: #faf7ef;
  --surface: #fffbee;
  --wood: #8b7355;
  --wood-light: #c4a97b;
  --leaf: #4a8c5c;
  --leaf-light: #6db37b;
  --leaf-dark: #2d5a3e;
  --moss: #7ca67c;
  --bark: #6b5b4a;
  --text: #3a2e24;
  --text-dim: #8a7a6a;
  --text-bright: #2a1e14;
  --gold: #b8860b;
  --gold-light: #d4a843;
  --cream: #fff8ea;
  --shadow: rgba(60,50,40,.08);
  --radius: 12px;
  --font: 'Inter','Microsoft YaHei','PingFang SC',sans-serif;
  --font-serif: 'Noto Serif SC','STSong',serif;
}
html{font-size:20px}
body{
  font-family:var(--font);
  background:var(--bg);
  background-image:radial-gradient(ellipse at 20% 50%,rgba(74,140,92,.06) 0%,transparent 70%),
                   radial-gradient(ellipse at 80% 30%,rgba(196,169,123,.06) 0%,transparent 60%);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  justify-content:center;
}

#app{
  width:100%;max-width:880px;
  min-height:100vh;
  padding:32px 20px 50px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}

/* 树叶装饰 */
.leaf-deco{position:fixed;pointer-events:none;z-index:0;opacity:.12;font-size:3rem;}
.leaf-deco:nth-child(1){top:60px;left:30px;transform:rotate(-15deg);}
.leaf-deco:nth-child(2){top:200px;right:40px;transform:rotate(25deg);font-size:2.5rem;}
.leaf-deco:nth-child(3){bottom:120px;left:50px;transform:rotate(40deg);font-size:2rem;opacity:.08;}
.leaf-deco:nth-child(4){bottom:200px;right:30px;transform:rotate(-35deg);font-size:2.8rem;}

/* 木纹头部 */
.forest-header{
  position:relative;z-index:1;
  width:100%;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;
  background:var(--surface);
  border-radius:var(--radius);
  box-shadow:0 2px 12px var(--shadow);
  border-left:4px solid var(--leaf);
}
.forest-header h1{
  font-family:var(--font-serif);
  font-size:.95rem;font-weight:600;color:var(--leaf-dark);
}
.forest-header h1 span{color:var(--gold);}
.forest-stems{display:flex;gap:6px;}
.forest-stem{
  width:6px;height:20px;border-radius:2px;
  background:var(--wood-light);
  transition:all .4s ease;
}
.forest-stem.done{background:var(--leaf);height:24px;}
.forest-stem.active{background:var(--gold);height:28px;animation:stem-grow .6s ease;}
.forest-stem.future{background:rgba(139,115,85,.2);}
@keyframes stem-grow{0%{height:10px}50%{height:28px;opacity:.7}100%{height:24px;opacity:1}}

/* 卡片 */
.forest-card{
  position:relative;z-index:1;
  width:100%;
  padding:28px 24px;
  background:var(--surface);
  border-radius:var(--radius);
  box-shadow:0 2px 16px var(--shadow);
  animation:forest-in .45s ease-out;
  border:1px solid rgba(196,169,123,.2);
  border-bottom:2px solid rgba(139,115,85,.15);
}
@keyframes forest-in{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
.forest-title{
  font-family:var(--font-serif);
  font-size:.95rem;font-weight:600;text-align:center;margin-bottom:16px;
  color:var(--leaf-dark);letter-spacing:2px;
}
.forest-title:before,.forest-title:after{
  content:' · ';
  color:var(--wood-light);
}

/* 设置 */
.setup-group{display:flex;flex-direction:column;gap:14px;max-width:380px;margin:0 auto;}
.setup-row{display:flex;flex-direction:column;gap:4px;}
.setup-row label{font-size:.75rem;font-weight:600;color:var(--moss);letter-spacing:1px;}
.setup-row select,.setup-row button{
  width:100%;padding:11px 16px;
  background:var(--bg-alt);
  border:1.5px solid rgba(196,169,123,.3);
  color:var(--text);font-size:.88rem;font-family:var(--font);font-weight:400;
  cursor:pointer;transition:all .25s;outline:none;
  border-radius:8px;
}
.setup-row select:hover,.setup-row select:focus{border-color:var(--leaf);background:var(--cream);box-shadow:0 0 0 3px rgba(74,140,92,.1);}
.setup-row select option{background:var(--surface);color:var(--text);}
.btn-forest{
  background:var(--leaf)!important;
  border:1.5px solid var(--leaf-dark)!important;
  color:#fff!important;font-size:.82rem!important;
  font-weight:500!important;letter-spacing:2px;
  border-radius:8px!important;transition:all .2s!important;
}
.btn-forest:hover{background:var(--leaf-light)!important;box-shadow:0 4px 14px rgba(74,140,92,.25)!important;}
.btn-forest:disabled{opacity:.3;cursor:not-allowed;box-shadow:none!important;}

/* 点名 - 自然风 */
.pick-section{text-align:center;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pick-forest-area{position:relative;width:100%;max-width:400px;min-height:100px;display:flex;align-items:center;justify-content:center;margin:4px 0;}
.pick-forest-name{
  font-family:var(--font-serif);
  font-size:4rem;font-weight:600;z-index:2;
  color:var(--leaf-dark);letter-spacing:4px;
  transition:all .15s;
  text-shadow:0 1px 2px rgba(0,0,0,.04);
}
.pick-forest-name.rolling{animation:forest-flicker .12s infinite;}
@keyframes forest-flicker{50%{opacity:.1;transform:translateY(-2px)}}
.pick-forest-name.result{animation:forest-rise .5s cubic-bezier(.34,1.56,.64,1);color:var(--gold);
  text-shadow:0 2px 4px rgba(184,134,11,.2);
}
@keyframes forest-rise{0%{opacity:0;transform:translateY(20px) scale(.85)}100%{opacity:1;transform:translateY(0) scale(1)}}
.pick-hint{font-size:.78rem;color:var(--text-dim);margin-top:4px;font-weight:400;}
.pick-class-tag{font-size:.72rem;color:var(--moss);margin-top:2px;}
.btn-forest-pick{
  margin-top:10px;padding:9px 44px;
  background:var(--leaf);border:1.5px solid var(--leaf-dark);
  color:#fff;font-family:var(--font);font-size:.78rem;font-weight:500;
  cursor:pointer;letter-spacing:2px;transition:all .2s;border-radius:8px;
}
.btn-forest-pick:hover{background:var(--leaf-light);box-shadow:0 3px 10px rgba(74,140,92,.2);}
.btn-forest-pick:disabled{opacity:.25;cursor:not-allowed;}

/* 答题 */
.quiz-section{text-align:center;}
.q-forest-num{font-size:.72rem;color:var(--moss);font-weight:500;letter-spacing:1px;}
.q-forest-princ{font-size:.85rem;color:var(--wood-light);margin-left:8px;}
.q-forest-text{
  font-family:var(--font-serif);
  font-size:.92rem;line-height:1.8;margin:10px 0 16px;
  text-align:left;padding:16px 18px;
  background:var(--bg-alt);
  border-radius:8px;
  color:var(--text);
  border-left:3px solid var(--leaf-light);
}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.option-btn{
  padding:13px 16px;
  background:var(--bg-alt);
  border:1.5px solid rgba(196,169,123,.2);
  color:var(--text);font-size:.82rem;text-align:left;cursor:pointer;
  transition:all .25s;font-family:var(--font);font-weight:400;line-height:1.5;
  display:flex;align-items:flex-start;gap:10px;
  border-radius:8px;
}
.option-btn .opt-label{
  display:inline-flex;width:24px;height:24px;
  align-items:center;justify-content:center;
  font-size:.75rem;font-weight:500;flex-shrink:0;
  background:var(--cream);
  border-radius:6px;
  color:var(--text-dim);
}
.option-btn:hover{border-color:var(--leaf);background:var(--cream);}
.option-btn.selected{border-color:var(--leaf);background:rgba(74,140,92,.04);}
.option-btn.selected .opt-label{background:var(--leaf);color:#fff;}
.option-btn.correct{border-color:var(--leaf)!important;background:rgba(74,140,92,.06)!important;}
.option-btn.correct .opt-label{background:var(--leaf)!important;color:#fff!important;}
.option-btn.wrong{border-color:#e57373!important;background:rgba(229,115,115,.04)!important;}
.option-btn.wrong .opt-label{background:#e57373!important;color:#fff!important;}
.option-btn.disabled{pointer-events:none;opacity:.35;}
.feedback-box{margin-top:12px;padding:10px 16px;font-size:.82rem;animation:forest-fade .35s;background:var(--bg-alt);border-radius:8px;}
@keyframes forest-fade{from{opacity:0}to{opacity:1}}
.feedback-box.correct-fb{border-left:3px solid var(--leaf);color:var(--leaf-dark);}
.feedback-box.wrong-fb{border-left:3px solid #e57373;color:#b84343;}
.btn-forest-next{
  margin-top:12px;padding:9px 36px;
  background:var(--leaf);border:1.5px solid var(--leaf-dark);
  color:#fff;font-family:var(--font);font-size:.78rem;font-weight:500;
  cursor:pointer;letter-spacing:2px;transition:all .2s;border-radius:8px;
}
.btn-forest-next:hover{background:var(--leaf-light);box-shadow:0 3px 10px rgba(74,140,92,.2);}

/* 计分 */
.score-section{text-align:center;}
.score-big{
  font-family:var(--font-serif);
  font-size:3.6rem;font-weight:600;color:var(--gold);
  animation:forest-score .7s cubic-bezier(.34,1.56,.64,1);
  margin:4px 0;
}
@keyframes forest-score{0%{opacity:0;transform:scale(.6) rotate(-5deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.score-label{font-size:.78rem;color:var(--text-dim);font-weight:400;}
.score-detail{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
.score-stat{font-size:.78rem;color:var(--text-dim);}
.score-stat strong{color:var(--text);font-weight:600;font-size:.88rem;}
.forest-bar-wrap{width:100%;max-width:400px;margin:8px auto;}
.forest-bar-bg{width:100%;height:10px;background:var(--bg-alt);border-radius:5px;overflow:hidden;}
.forest-bar-fill{height:100%;background:linear-gradient(90deg,var(--leaf),var(--leaf-light));border-radius:5px;transition:width 1s cubic-bezier(.34,1.56,.64,1);}
.forest-bar-label{display:flex;justify-content:space-between;font-size:.7rem;color:var(--text-dim);margin-top:2px;font-weight:400;}

/* 最终 - 木纹排行榜 */
.final-section{text-align:center;}
.final-title{font-family:var(--font-serif);font-size:1.1rem;font-weight:600;color:var(--leaf-dark);margin-bottom:2px;}
.final-sub{color:var(--text-dim);margin-bottom:14px;font-size:.78rem;}
.final-table{width:100%;border-collapse:separate;border-spacing:0 4px;margin:4px 0 16px;}
.final-table th{padding:8px 10px;text-align:left;font-size:.7rem;font-weight:600;color:var(--moss);border-bottom:1.5px solid rgba(139,115,85,.15);letter-spacing:1px;}
.final-table td{padding:8px 10px;font-size:.82rem;font-weight:400;background:var(--bg-alt);border-radius:4px;}
.final-table tr:first-child td{background:rgba(184,134,11,.06);font-weight:500;}
.final-table .rank-num{font-weight:600;color:var(--wood);}
.final-table .rank-score{font-weight:600;color:var(--gold);font-family:var(--font-serif);}

.hidden{display:none!important;}
.toast-container{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.toast{padding:10px 18px;background:var(--surface);border:1px solid rgba(196,169,123,.3);border-radius:8px;font-family:var(--font);font-size:.78rem;color:var(--text);animation:forest-toast .35s forwards;display:flex;align-items:center;gap:8px;box-shadow:0 2px 10px var(--shadow);}
.toast .toast-icon{font-size:.9rem;}
.toast .toast-score{font-weight:600;color:var(--gold);}
.toast.out{animation:forest-toast-out .25s forwards;}
@keyframes forest-toast{from{transform:translateX(50px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes forest-toast-out{from{opacity:1}to{transform:translateX(50px);opacity:0}}
.particle-container{position:fixed;inset:0;pointer-events:none;z-index:999;}
.cele-particle{position:fixed;pointer-events:none;animation:forest-part .9s ease-out forwards;border-radius:40%;}
@keyframes forest-part{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg)}}

@media(max-width:640px){
  #app{padding:24px 12px 36px;}
  .forest-card{padding:22px 16px;}
  .forest-header h1{font-size:.78rem;}
  .pick-forest-name{font-size:3.2rem;}
  .options-grid{grid-template-columns:1fr;}
  .q-forest-text{font-size:.85rem;}
  .score-big{font-size:2.6rem;}
  .leaf-deco{display:none;}
}

/* 错题解析 */
.review-section{text-align:left;margin-top:10px;border-top:1px solid rgba(255,255,255,.12);padding-top:14px;max-height:400px;overflow-y:auto}
.rev-empty{text-align:center;color:#4ecdc4;font-family:var(--font-mono);font-size:.75rem;padding:20px 0}
.rev-student{font-family:var(--font-mono);font-size:.85rem;font-weight:600;color:#d4a843;margin:10px 0 6px;padding-bottom:4px;border-bottom:1px dashed rgba(255,255,255,.1)}
.rev-item{padding:10px 12px;margin-bottom:8px;background:rgba(0,0,0,.15);border-left:3px solid #ff6b6b;border-radius:0 4px 4px 0}
.rev-q{font-size:.88rem;line-height:1.5;margin-bottom:6px}
.rev-princ{display:inline-block;font-family:var(--font-mono);font-size:.75rem;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1);padding:1px 6px;margin-bottom:6px}
.rev-opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.rev-opt{padding:6px 8px;font-size:.78rem;line-height:1.4;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.08);border-radius:2px;display:flex;align-items:flex-start;gap:6px;color:inherit}
.rev-opt .rev-opt-label{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.8rem;font-weight:700;flex-shrink:0;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.4)}
.rev-opt.rev-chosen{background:rgba(255,107,107,.1);border-color:#ff6b6b}
.rev-opt.rev-chosen .rev-opt-label{background:#ff6b6b;color:#fff;border-color:#ff6b6b}
.rev-opt.rev-right{background:rgba(78,205,196,.1);border-color:#4ecdc4}
.rev-opt.rev-right .rev-opt-label{background:#4ecdc4;color:#1a1a2e;border-color:#4ecdc4}


.gear-icon{display:none}/* hidden */
</style>
</head>
<body>
<div class="leaf-deco">🍃</div><div class="leaf-deco">🌿</div><div class="leaf-deco">🍂</div><div class="leaf-deco">🌱</div>
<div class="toast-container" id="toastContainer"></div>
<div class="particle-container" id="particleContainer"></div>
<div id="app">
  <header class="forest-header">
    <h1>🌿 <span>常用的构思方法</span></h1>
    <div class="forest-stems" id="forestStems"></div>
  </header>
  <div class="forest-card" id="sceneSetup">
    <div class="forest-title">准备</div>
    <div class="setup-group">
      <div class="setup-row"><label>年级</label><select id="gradeSelect"><option value="高一">高一年级</option><option value="高二">高二年级</option></select></div>
      <div class="setup-row"><label>班级</label><select id="classSelect" disabled><option value="">—</option></select></div>
      <div class="setup-row" style="margin-top:6px"><button class="btn-forest" id="btnStart" disabled>开始</button></div>
    </div>
  </div>
  <div class="forest-card hidden" id="scenePick">
    <div class="forest-title" id="pickTitle">抽取</div>
    <div class="pick-section">
      <div class="pick-hint" id="pickHint">点击抽取</div>
      <div class="pick-forest-area"><div class="pick-forest-name" id="pickName">—</div></div>
      <div class="pick-class-tag hidden" id="pickClassTag"></div>
      <button class="btn-forest-pick hidden" id="btnPickStart">抽取</button>
      <button class="btn-forest-pick hidden" id="btnPickConfirm" style="background:var(--gold);border-color:var(--gold-light)">确认</button>
    <button class="btn-forest-pick hidden" id="btnRepick" style="background:var(--gold);border-color:var(--gold-light)">↻ 重抽</button>
    </div>
  </div>
  <div class="forest-card hidden" id="sceneQuiz">
    <div class="forest-title" id="quizTitle">答题</div>
    <div class="quiz-section">
      <div><span class="q-forest-num" id="qNumber">1/2</span><span class="q-forest-princ" id="qPrinciple">方法</span></div>
      <div class="q-forest-text" id="qText">—</div>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="feedback-box hidden" id="feedbackBox"></div>
      <button class="btn-forest-next hidden" id="btnNextQ">下一题</button>
    </div>
  </div>
  <div class="forest-card hidden" id="sceneScore">
    <div class="forest-title">结果</div>
    <div class="score-section">
      <div class="score-label">学生</div>
      <div style="font-size:1.1rem;font-weight:500;color:var(--leaf-dark);margin:3px 0 6px" id="scoreStudent"></div>
      <div class="score-big" id="scorePoints">+10</div>
      <div class="score-label" id="scoreLabel">答对 1 题</div>
      <div class="score-detail" id="scoreDetail"></div>
      <div class="forest-bar-wrap"><div class="forest-bar-bg"><div class="forest-bar-fill" id="energyBar" style="width:0%"></div></div><div class="forest-bar-label"><span>成长</span><span id="energyText">0%</span></div></div>
      <button class="btn-forest-next" id="btnNextRound">下一组</button>
    </div>
  </div>
  <div class="forest-card hidden" id="sceneFinal">
    <div class="forest-title"> 🌟 完美收成</div>
    <div class="final-sub">积分排行榜</div>
    <div style="overflow-x:auto"><table class="final-table"><thead><tr><th>#</th><th>姓名</th><th>班级</th><th>正确</th><th>积分</th></tr></thead><tbody id="finalBody"></tbody></table></div>
        <button class="rev-btn" id="btnReview" style="padding:10px 36px;font-size:.8rem;margin-top:6px;cursor:pointer;border:2px solid #5bc0eb;background:transparent;color:#5bc0eb;font-family:var(--font-mono);border-radius:6px">📋 查看错题解析</button>
    <div class="review-section hidden" id="reviewSection"></div>
<button class="btn-forest" style="padding:9px 36px;font-size:.82rem;cursor:pointer;border:none;border-radius:8px;" onclick="location.reload()">再来一次</button>
  </div>
</div>
<script>// 从 URL 路径自动提取教师用户名
const pathMatch = window.location.pathname.match(/\/api\/files\/([^\/]+)\/html\//);
const TEACHER = (pathMatch ? pathMatch[1] : '') || '';
const Q=[{question:"通过模仿生物界的结构和功能来获得设计灵感的构思方法称为",options:{A:"联想法",B:"仿生法",C:"形态分析法",D:"设问法"},answer:"B"},{question:"设计师看到荷叶表面上的水珠滚落，联想到开发自清洁涂料。这种构思方法属于",options:{A:"联想法",B:"仿生法",C:"头脑风暴法",D:"列举法"},answer:"B"},{question:"将现有产品的功能、形状、技术等特征列举出来，逐一分析寻求改进的构思方法称为",options:{A:"联想法",B:"仿生法",C:"形态分析法",D:"列举法"},answer:"D"},{question:"对某一事物列举缺点并提出改进方案的构思方法称为",options:{A:"缺点列举法",B:"联想法",C:"设问法",D:"形态分析法"},answer:"A"},{question:"通过5W1H（原因、对象、地点、时间、人员、方法）等提问方式来发现问题的构思方法称为",options:{A:"联想法",B:"仿生法",C:"设问法",D:"列举法"},answer:"C"},{question:"将不同事物的特征进行组合从而产生新方案的构思方法称为",options:{A:"组合法",B:"联想法",C:"形态分析法",D:"设问法"},answer:"A"},{question:"将产品分解为几个独立要素，然后分别列出每个要素的可能状态并进行排列组合的构思方法称为",options:{A:"组合法",B:"联想法",C:"形态分析法",D:"仿生法"},answer:"C"},{question:"奥斯本检核表法（9问法）属于以下哪种构思方法",options:{A:"设问法",B:"列举法",C:"联想法",D:"仿生法"},answer:"A"},{question:"以下哪项属于运用'联想法'进行构思",options:{A:"看到企鹅腹部脂肪厚而设计保暖羽绒服",B:"由圆珠笔联想到钢笔再联想到毛笔",C:"统计教室现有物品的不足之处",D:"将椅子的面板、椅腿、靠背分别分析后进行组合"},answer:"B"},{question:"在进行方案构思时，以下说法不正确的是",options:{A:"可以运用多种构思方法",B:"各种构思方法相互独立不可结合使用",C:"构思方法有助于激发创意",D:"在构思过程中可能需要反复修改和完善"},answer:"B"}];
const G=[];for(let i=0;i<5;i++)G.push(Q.slice(i*2,i*2+2));

let S={grade:'高一',class:'',students:[],available:[],picks:[],cr:0,cq:0,sa:'',ans:false,rr:[],total:0},_c=0;
function $(i){return document.getElementById(i)}
function sh(i){$(i).classList.remove('hidden')}
function hd(i){$(i).classList.add('hidden')}
function sf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}
function st(i,m,s){const t=document.createElement('div');t.className='toast';t.innerHTML='<span class="toast-icon">'+i+'</span>'+m+(s?' <span class="toast-pts">'+s+'</span>':'');$('toastContainer').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),250)},3000)}
function fp(x,y,c,cnt){const pc=$('particleContainer');for(let i=0;i<cnt;i++){const e=document.createElement('div');e.className='cele-particle';const a=Math.random()*Math.PI*2,d=60+Math.random()*130;e.style.cssText='left:'+(x||innerWidth/2)+'px;top:'+(y||innerHeight/2)+'px;width:'+(5+Math.random()*7)+'px;height:'+(5+Math.random()*7)+'px;background:'+(c||'var(--bp-cyan)')+';--dx:'+(Math.cos(a)*d)+'px;--dy:'+(Math.sin(a)*d)+'px';pc.appendChild(e);setTimeout(()=>e.remove(),1200)}}
function ud(){try{const h=$('bpBlocks')||$('memBlocks')||$('progressDots')||$('popDots');if(!h)return;h.innerHTML='';for(let i=0;i<5;i++){const e=document.createElement('div');e.className='bp-block'+(i<S.cr?' done':i===S.cr?' active':'');e.innerHTML='';h.appendChild(e)}}catch(e){}}
function sv(g,c,n,p){fetch('/score-api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,name:n,points:p,teacher:TEACHER})}).then(r=>r.ok?st('💰','保存','+'+p):st('⚠️','异常')).catch(()=>st('📝','本地'))}
function saveRecord(g,c,s,cc,t,pts,ans,title){fetch('/rollcall-api/save-record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,student:s,type:'互动答题',title:title||'',correctCount:cc,totalQuestions:t,points:pts,answers:ans||[],teacher:TEACHER})}).catch(()=>{})}
async function lc(){const g=$('gradeSelect').value;S.grade=g;const cs=$('classSelect');cs.disabled=true;cs.innerHTML='<option value="">...</option>';try{const r=await fetch('/rollcall-api/classes?grade='+encodeURIComponent(g)+'&teacher='+TEACHER);const cls=await r.json();cs.innerHTML='<option value="">— 选择 —</option>';cls.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o)});cs.disabled=false}catch(e){cs.innerHTML='<option value="">失败</option>'}}
$('gradeSelect').addEventListener('change',lc);$('classSelect').addEventListener('change',async function(){const c=this.value;S.class=c;$('btnStart').disabled=!c;if(c){try{const r=await fetch('/rollcall-api/students?grade='+encodeURIComponent(S.grade)+'&class='+encodeURIComponent(c)+'&teacher='+TEACHER);const data=await r.json();S.students=data.map(s=>s.name)}catch(e){S.students=[];st('⚠️','加载学生失败')}}});
$('btnStart').addEventListener('click',function(){if(!S.class||S.students.length<5){st('⚠️','人数不足');return}hd('sceneSetup');sr(0)});
function sr(ri){S.cr=ri;S.cq=0;_c=0;if(!S.rr[ri])S.rr[ri]={correctCount:0,points:0,answers:[]};S.rr[ri].answers=[];ud();sp()}
function sp(){sh('scenePick');hd('sceneQuiz');hd('sceneScore');hd('sceneFinal');$('pickTitle').textContent=(S.cr+1)+'/5';$('pickHint').textContent='点击抽取';$('pickHint').classList.remove('hidden');$('pickClassTag').classList.add('hidden');$('btnPickStart').classList.remove('hidden');$('btnPickConfirm').classList.add('hidden');$('btnRepick').classList.add('hidden');$('pickName').textContent='——';$('pickName').className='pick-name';$('btnPickStart').disabled=false;$('btnPickStart').textContent='🎲 抽取'}
function rp(){const pool=S.students.length>0?S.students:['---'];const pn=$('pickName');pn.className='pick-name rolling';$('pickHint').textContent='抽取中...';$('btnPickConfirm').classList.add('hidden');$('btnRepick').classList.add('hidden');$('btnPickStart').disabled=true;let rc=0,mx=18+Math.floor(Math.random()*10);let iv=setInterval(()=>{pn.textContent=pool[Math.floor(Math.random()*pool.length)];rc++;if(rc>=mx){clearInterval(iv);fetch('/rollcall-api/pick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,teacher:TEACHER})}).then(d=>d.json()).then(d=>{if(d.error){st('⚠️',d.error);pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false;return}const c=d.student;pn.textContent=c;pn.className='pick-name result';$('pickHint').classList.add('hidden');$('pickClassTag').textContent=S.grade+' · '+S.class;$('pickClassTag').classList.remove('hidden');$('btnPickConfirm').classList.remove('hidden');$('btnRepick').classList.remove('hidden');fp(innerWidth/2,innerHeight/2,'var(--bp-cyan)',30);st('🎯','已选',c);S.picks[S.cr]=c}).catch(()=>{st('⚠️','服务异常');pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false})}},60+Math.random()*40)}

$('btnPickStart').addEventListener('click',function(){this.disabled=true;rp()});
$('btnRepick').addEventListener('click',rp);

$('btnPickConfirm').addEventListener('click',function(){hd('scenePick');sq()});
function sq(){sh('sceneQuiz');S.cq=0;sQ()}
function sQ(){const g=G[S.cr],q=g[S.cq];$('quizTitle').textContent='第'+(S.cr+1)+'组';$('qNumber').textContent=(S.cq+1)+'/2';$('qPrinciple').textContent=q.principle;$('qText').textContent=q.question;S.sa='';S.ans=false;$('feedbackBox').classList.add('hidden');$('btnNextQ').classList.add('hidden');const grid=$('optionsGrid');grid.innerHTML='';['A','B','C','D'].forEach(l=>{const b=document.createElement('button');b.className='option-btn';b.innerHTML='<span class="opt-label">'+l+'</span><span>'+q.options[l]+'</span>';b.dataset.label=l;b.addEventListener('click',()=>hA(l));grid.appendChild(b)})}
function hA(l){if(S.ans)return;S.ans=true;const g=G[S.cr],q=g[S.cq],c=q.answer,ic=l===c;if(ic)_c++;S.rr[S.cr].correctCount=_c;let p=5;if(_c===1)p=10;else if(_c===2)p=15;S.rr[S.cr].points=p;S.rr[S.cr].answers.push({question:q.question,options:q.options,correctAnswer:c,yourAnswer:l,principle:q.principle,isCorrect:ic});const btns=$('optionsGrid').querySelectorAll('.option-btn');btns.forEach(b=>{b.classList.add('disabled');if(b.dataset.label===c)b.classList.add('correct');if(b.dataset.label===l&&!ic)b.classList.add('wrong');if(b.dataset.label===l&&ic)b.classList.add('selected')});const fb=$('feedbackBox');fb.classList.remove('hidden');if(ic){fb.className='feedback-box correct-fb';fb.textContent='✅ '+c+'. '+q.options[c];fp(innerWidth/2,innerHeight-80,'var(--bp-green)',12)}else{fb.className='feedback-box wrong-fb';fb.textContent='❌ 正确答案：'+c+'. '+q.options[c]}$('btnNextQ').classList.remove('hidden');$('btnNextQ').textContent=S.cq===0?'下一题 ▸':'结算'}
$('btnNextQ').addEventListener('click',function(){if(S.cq===0){S.cq=1;sQ()}else{hd('sceneQuiz');sSc()}});
function sSc(){sh('sceneScore');const s=S.picks[S.cr];$('scoreStudent').textContent=s+' · '+S.class;const cr=S.rr[S.cr],cc=cr?.correctCount||0,pts=cr?.points||5;$('scorePoints').textContent='+'+pts;$('scoreLabel').textContent='正确 '+cc+' 题';$('scoreDetail').innerHTML='<div class="score-stat">正确 <strong>'+cc+'</strong></div><div class="score-stat">错误 <strong>'+(2-cc)+'</strong></div><div class="score-stat">保底 <strong>5</strong></div>';sv(S.grade,S.class,s,pts);S.total+=pts;fetch('/rollcall-api/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,student:s,result:'quiz',teacher:TEACHER})}).catch(()=>{});saveRecord(S.grade,S.class,s,cc,2,pts,S.rr[S.cr]?.answers,'技术的发展-蓝图');fp(innerWidth/2,innerHeight/2-100,'var(--bp-gold)',25);$('btnNextRound').textContent=S.cr<4?'下一轮 ▸':'完成'}
$('btnNextRound').addEventListener('click',function(){if(S.cr<4){hd('sceneScore');sr(S.cr+1)}else{hd('sceneScore');sF()}});
function sF(){sh('sceneFinal');$('reviewSection').classList.add('hidden');$('btnReview').textContent='📋 查看错题解析';const tb=$('finalBody');tb.innerHTML='';const rows=S.picks.map((n,i)=>{const cr=S.rr[i];return{name:n,correct:cr?.correctCount||0,points:cr?.points||5}}).sort((a,b)=>b.points-a.points);rows.forEach((r,i)=>{const tr=document.createElement('tr');tr.innerHTML='<td class="rank-num">#'+(i+1)+'</td><td>'+r.name+'</td><td>'+r.correct+'/2</td><td class="rank-score">+'+r.points+'</td>';tb.appendChild(tr)});fp(innerWidth/2,innerHeight/2,'var(--bp-cyan)',50);setTimeout(()=>fp(innerWidth/2,innerHeight/2,'var(--bp-gold)',30),400)}
$('btnReview').addEventListener('click',function(){const rs=$('reviewSection');if(!rs.classList.contains('hidden')){rs.classList.add('hidden');this.textContent='📋 查看错题解析';return}this.textContent='📋 收起解析';buildReview();rs.classList.remove('hidden')});
function buildReview(){const rs=$('reviewSection');rs.innerHTML='';let hasWrong=false;const labels=['A','B','C','D'];S.picks.forEach((n,ri)=>{const cr=S.rr[ri];if(!cr||!cr.answers)return;const wrongs=cr.answers.filter(a=>!a.isCorrect);if(!wrongs.length)return;hasWrong=true;let h='<div class="rev-student">⚙ '+n+' · '+S.class+'</div>';wrongs.forEach(a=>{h+='<div class="rev-item"><span class="rev-princ">'+a.principle+'</span><div class="rev-q">'+a.question+'</div><div class="rev-opt-grid">';labels.forEach(l=>{let cls='rev-opt';if(l===a.yourAnswer)cls+=' rev-chosen';if(l===a.correctAnswer)cls+=' rev-right';h+='<div class="'+cls+'"><span class="rev-opt-label">'+l+'</span><span>'+a.options[l]+'</span></div>'});h+='</div></div>'});rs.innerHTML+=h});if(!hasWrong)rs.innerHTML='<div class="rev-empty">\u2705 \u6240\u6709\u540c\u5b66\u5168\u90e8\u7b54\u5bf9\uff01</div>'}
lc();sh('sceneSetup');ud();
</script>
</body>
</html>
