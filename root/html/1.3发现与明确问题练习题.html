            color: #f39c12;

            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

            display: block;
            padding: 15px;
            margin-bottom: 12px;

            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;

            align-items: center;
            margin-top: 15px;
        }

            font-weight: bold;

        }

            background: linear-gradient(to right, #7f8c8d, #95a5a6);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            display: none;
            animation: fadeIn 0.5s ease-out;
            margin-top: 10px;

            width: 0%;

            left: 0;

    // 动态生成题目HTML
    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        questions.forEach(question => {
            const questionEl = document.createElement('div');
            questionEl.className = 'question-card';
            questionEl.innerHTML = `
                <div class="question-number">Question #${question.id}</div>
                <div class="question-text">${question.text}</div>
                <div class="options">
                    ${question.options.map(opt => `
                        <label>
                            <input type="radio" name="q${question.id}" value="${opt.value}">
                            ${opt.text}
                        </label>
                    `).join('')}
                </div>
                <div class="action-row">
                    <button class="submit-btn" data-question-id="${question.id}">提交答案</button>
                    <div class="feedback" id="feedback-${question.id}"></div>
                </div>
            `;
            container.appendChild(questionEl);

            const submitBtn = questionEl.querySelector(`.submit-btn[data-question-id="${question.id}"]`);
            submitBtn.addEventListener('click', () => handleSingleSubmit(question.id));
        });
    }

    // 处理单个提交

        const questionData = questions.find(q => q.id === questionId);
        const feedbackEl = document.getElementById(`feedback-${questionId}`);
        const submitBtn = document.querySelector(`.submit-btn[data-question-id="${questionId}"]`);
        
        if (!selectedRadio) {
            alert("请先选择一个答案！");
            return;
        }

        const userChoice = selectedRadio.value;
        
        userAnswers[questionId] = userChoice;

        if (userChoice === questionData.correctAnswer) {
            feedbackEl.textContent = `正确！ ${questionData.explanation}`;
            feedbackEl.className = 'feedback correct';
            answerStatus[questionId] = 'correct';
        } else {
            feedbackEl.textContent = `错误！正确答案是 ${questionData.correctAnswer}。${questionData.explanation}`;
            feedbackEl.className = 'feedback incorrect';
            answerStatus[questionId] = 'incorrect';
        }
        
        feedbackEl.style.display = 'block';
        submitBtn.disabled = true;
        // 禁用该题的所有选项
        document.querySelectorAll(`input[name="q${questionId}"]`).forEach(radio => radio.disabled = true);

        updateProgressBar();
        checkAllAnswered();
    }

    // 更新进度条
    function updateProgressBar() {
        const total = questions.length;
        const answered = Object.keys(userAnswers).length;
        const percentage = (answered / total) * 100;
        document.getElementById('overall-progress-bar').style.width = `${percentage}%`;
    }

    // 检查是否全部回答完毕
    function checkAllAnswered() {
        if (Object.keys(userAnswers).length === questions.length) {
            document.getElementById('show-results-btn').style.display = 'block';
        }
    }

    // 显示最终结果
    function showResults() {
        let correctCount = 0;
        let incorrectCount = 0;
        let unansweredCount = 0;

        for (let i = 1; i <= questions.length; i++) {
            switch (answerStatus[i]) {
                case 'correct': correctCount++; break;
                case 'incorrect': incorrectCount++; break;
                default: unansweredCount++; break;
            }
        }

        const score = Math.round((correctCount / questions.length) * 100);

        document.getElementById('final-summary').innerHTML = `
            <p>总分: <strong style="color:#f1c40f; font-size: 2rem;">${score}</strong> / 100</p>
            <p>答对: ${correctCount} &nbsp;&nbsp; 答错: ${incorrectCount} &nbsp;&nbsp; 未答: ${unansweredCount}</p>
        `;

        // 创建图表
        const ctx = document.getElementById('results-chart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['答对', '答错', '未答'],
                datasets: [{
                    data: [correctCount, incorrectCount, unansweredCount],
                    backgroundColor: [
                        'rgba(46, 204, 113, 0.7)',
                        'rgba(231, 76, 60, 0.7)',
                        'rgba(243, 156, 18, 0.7)'
                    ],
                    borderColor: [
                        'rgb(46, 204, 113)',
                        'rgb(231, 76, 60)',
                        'rgb(243, 156, 18)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'top', labels: { color: '#ecf0f1' } },
                    title: {
                        display: true,
                        text: '答题统计',
                        color: '#ecf0f1',
                        font: { size: 18 }
                    }
                }
            }
        });

        // 填充详细结果
        const detailsContainer = document.getElementById('detailed-results');
        detailsContainer.innerHTML = '';
        questions.forEach(question => {
            const userAns = userAnswers[question.id];
            const status = answerStatus[question.id] || 'unanswered';
            let statusText = '未作答';
            let statusColor = '#f39c12';

            if (userAns) {
                statusText = userAns === question.correctAnswer ? '回答正确' : `回答错误 (你的答案: ${userAns})`;
                statusColor = userAns === question.correctAnswer ? '#2ecc71' : '#e74c3c';
            }

            const detailDiv = document.createElement('div');
            detailDiv.className = `detail-item ${status}`;
            detailDiv.innerHTML = `
                <p><strong>第 ${question.id} 题:</strong> <span style="color:${statusColor};">${statusText}</span></p>
                <p><em>${question.explanation}</em></p>
            `;
            detailsContainer.appendChild(detailDiv);
        });

        document.getElementById('results-overlay').style.display = 'flex';
    }

    // 页面初始化
    window.onload = function() {
        renderQuestions();

        document.getElementById('show-results-btn').addEventListener('click', showResults);
        document.getElementById('close-results-btn').addEventListener('click', () => {
            document.getElementById('results-overlay').style.display = 'none';
        });
    };
</script>

</body>
</html>
