<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>通用技术 | 方案构思挑战赛</title>
    <!-- 引入图表库 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 全局样式与科技感背景 */
        :root {
            --primary: #0ef;
            --primary-dark: #0be;
            --correct: #0f8;
            --incorrect: #f44;
            --bg-dark: #0a0c15;
            --card-bg: rgba(16, 24, 48, 0.5);
            --border-glow: 0 0 15px rgba(0, 239, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0a0c15 0%, #1a1f3c 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 闪烁光效 */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(15, 240, 255, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        /* 容器玻璃态效果 */
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(10, 15, 30, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(15, 240, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5), var(--border-glow);
            overflow: hidden;
            padding: 20px;
        }

        /* 头部样式 */
        header {
            text-align: center;
            padding: 30px 20px;
            border-bottom: 1px solid rgba(15, 240, 255, 0.2);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        h1 {
            font-size: 2.8rem;
            background: linear-gradient(90deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(15, 240, 255, 0.5);
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #aaa;
            opacity: 0.8;
        }

        /* 进度条 */
        .progress-container {
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        .progress-text {
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #0ef;
        }

        .progress-bar-outer {
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(15, 240, 255, 0.3);
        }

        .progress-bar-inner {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), #a0f);
            border-radius: 5px;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px var(--primary);
        }

        /* 题目卡片 */
        .question-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(15, 240, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .question-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
            opacity: 0.5;
        }

        .question-number {
            font-size: 1.1rem;
            color: var(--primary);
            margin-bottom: 10px;
            font-weight: bold;
        }

        .question-text {
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* 选项样式 */
        .options {
            margin: 20px 0;
        }

        .option {
            padding: 15px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(15, 240, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }

        .option:hover {
            background: rgba(15, 240, 255, 0.1);
            transform: translateX(5px);
            box-shadow: 0 0 15px rgba(15, 240, 255, 0.2);
        }

        .option.correct {
            background: rgba(0, 255, 136, 0.1) !important;
            border-color: var(--correct);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .option.incorrect {
            background: rgba(255, 68, 68, 0.1) !important;
            border-color: var(--incorrect);
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }

        .option-label {
            margin-left: 15px;
            font-size: 1.1rem;
            flex: 1;
        }

        .radio-circle {
            width: 25px;
            height: 25px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .radio-fill {
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .option.selected .radio-fill {
            opacity: 1;
        }

        /* 提交按钮 */
        .submit-btn {
            background: linear-gradient(90deg, var(--primary), #a0f);
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(15, 240, 255, 0.5);
            margin-top: 10px;
            display: block;
            width: 100%;
        }

        .submit-btn:hover:not(:disabled) {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 0 30px rgba(15, 240, 255, 0.8);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .submit-btn.correct {
            background: linear-gradient(90deg, var(--correct), #0f6);
        }

        .submit-btn.incorrect {
            background: linear-gradient(90deg, var(--incorrect), #c00);
        }

        /* 解析框 */
        .explanation {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border-left: 4px solid var(--primary);
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .explanation.show {
            display: block;
        }

        .explanation h4 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        /* 结果模态框 */
        .results-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .results-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .results-content {
            background: linear-gradient(135deg, #121525, #0a0c15);
            width: 90%;
            max-width: 800px;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 0 50px var(--primary);
            border: 1px solid var(--primary);
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        .results-title {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .final-score {
            font-size: 2rem;
            margin: 20px 0;
        }

        .chart-container {
            width: 100%;
            height: 300px;
            margin: 30px auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 10px;
        }

        .conclusion {
            font-size: 1.2rem;
            margin: 30px 0;
            color: #ccc;
        }

        .close-btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 15px 50px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(15, 240, 255, 0.5);
        }

        .close-btn:hover {
            transform: scale(1.05);
        }

        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .question-text { font-size: 1.1rem; }
            .container { padding: 10px; }
        }
    
.gear-icon{display:none}/* hidden */
</style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 方案构思挑战赛</h1>
            <p class="subtitle">通用技术必修一 · 第四章 课堂互动练习</p>
        </header>

        <div class="progress-container">
            <div class="progress-text">进度：<span id="progress-count">0/25</span></div>
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="main-progress-bar"></div>
            </div>
        </div>

        <form id="quizForm">
            <!-- 题目将由JS动态生成 -->
        </form>
    </div>

    <!-- 结果弹窗 -->
    <div class="results-overlay" id="resultsOverlay">
        <div class="results-content">
            <h2 class="results-title">🎉 挑战完成！</h2>
            <div class="final-score" id="finalScore">得分：0/25</div>
            
            <div class="chart-container">
                <canvas id="resultsChart"></canvas>
            </div>

            <div class="conclusion" id="conclusionText">加载中...</div>
            
            <button class="close-btn" onclick="closeResults()">返回复习</button>
        </div>
    </div>

    <script>
        // 题目数据 (来自文档 1.4方案的构思及方法.html)
        const questions = [
            {
                id: 1,
                text: "人机关系中的“机”不包括以下哪一项？",
                options: ["A. 机器", "B. 工具", "C. 自然环境", "D. 仪器设备"],
                answer: "C",
                explanation: "“机”指人使用的所有人造物，如工具、仪器、设备等，但不包括自然环境。"
            },
            {
                id: 2,
                text: "从人机关系角度看，盲人导购器通过耳机播报商品信息，主要体现了什么目标？",
                options: ["A. 安全", "B. 高效", "C. 信息交互", "D. 舒适"],
                answer: "C",
                explanation: "通过语音传递信息，实现人与产品之间的信息交互。"
            },
            {
                id: 3,
                text: "设计儿童自行车时，考虑车把高度与儿童手臂长度的关系，主要关注的是？",
                options: ["A. 动态尺寸", "B. 静态尺寸", "C. 心理需求", "D. 环境适应性"],
                answer: "B",
                explanation: "静态尺寸指人体在静止状态下的身体尺寸，如身高、臂长等。"
            },
            {
                id: 4,
                text: "电水壶设有加热指示灯，从人机关系角度主要考虑的是？",
                options: ["A. 安全", "B. 健康", "C. 信息交互", "D. 舒适"],
                answer: "C",
                explanation: "指示灯向用户传递工作状态信息，属于信息交互设计。"
            },
            {
                id: 5,
                text: "郁金香椅模仿花朵形态，采用圆足结构，其构思方法主要是？",
                options: ["A. 形态分析法", "B. 联想法", "C. 仿生法", "D. 设问法"],
                answer: "C",
                explanation: "仿生法是模仿自然界生物的结构、功能或形态进行设计。"
            },
            {
                id: 6,
                text: "微波炉的发明源于发现微波能使巧克力熔化，进而联想到加热食物，这种构思方法是？",
                options: ["A. 设问法", "B. 仿生法", "C. 联想法", "D. 头脑风暴法"],
                answer: "C",
                explanation: "由一个现象联想到另一个应用场景，属于典型的联想法。"
            },
            {
                id: 7,
                text: "从爆竹升空到运载火箭的设计，运用的构思方法是？",
                options: ["A. 联想法", "B. 设问法", "C. 仿生法", "D. 形态分析法"],
                answer: "A",
                explanation: "由传统爆竹爆炸升空的现象联想到火箭推进原理，属于联想法。"
            },
            {
                id: 8,
                text: "蜂巢结构被用于建筑中的蜂窝板设计，这种构思方法属于？",
                options: ["A. 联想法", "B. 仿生法", "C. 设问法", "D. 形态分析法"],
                answer: "B",
                explanation: "直接模仿蜂巢的六边形稳定结构，属于仿生法。"
            },
            {
                id: 9,
                text: "以下哪项不属于人机关系要实现的目标？",
                options: ["A. 高效", "B. 安全", "C. 经济", "D. 舒适"],
                answer: "C",
                explanation: "人机关系四大目标为：高效、安全、健康、舒适，不包括经济性。"
            },
            {
                id: 10,
                text: "“手表手机”便于查看信息，主要体现了人机关系中的？",
                options: ["A. 静态尺寸适配", "B. 信息交互", "C. 特殊人群需求", "D. 美观性"],
                answer: "B",
                explanation: "核心是通过小屏幕实现手机信息的快速获取，属于信息交互。"
            },
            {
                id: 11,
                text: "多色键盘用不同颜色区分功能区，主要目的是？",
                options: ["A. 提高输入效率", "B. 增加趣味性", "C. 保证安全", "D. 保护健康"],
                answer: "A",
                explanation: "通过视觉分区减少误操作，提高信息输入效率，体现高效目标。"
            },
            {
                id: 12,
                text: "身份证识别区设计为倾斜状，需用手扶住，主要体现人机关系的？",
                options: ["A. 安全目标", "B. 高效目标", "C. 健康目标", "D. 舒适目标"],
                answer: "A",
                explanation: "防止身份证滑落丢失，保障用户财产安全，属于安全目标。"
            },
            {
                id: 13,
                text: "关于设问法，下列说法正确的是？",
                options: ["A. 只能通过检核表法实施", "B. 是一种系统性提问方法", "C. 不能与其他方法结合", "D. 仅适用于艺术设计"],
                answer: "B",
                explanation: "设问法通过系统提问（如5W1H）激发创意，可结合检核表等多种形式。"
            },
            {
                id: 14,
                text: "设计分析应从哪三个方面进行？",
                options: ["A. 人、物、环境", "B. 成本、材料、工艺", "C. 功能、外观、价格", "D. 用户、市场、技术"],
                answer: "A",
                explanation: "设计分析的核心是从使用者（人）、产品本身（物）、使用环境（环境）三方面展开。"
            },
            {
                id: 15,
                text: "以下哪项体现了对特殊人群的考虑？",
                options: ["A. 普通课桌高度", "B. 盲道设计", "C. 手机多彩外壳", "D. 电梯速度调节"],
                answer: "B",
                explanation: "盲道专为视障人士设计，属于对特殊人群的人机关系考量。"
            },
            {
                id: 16,
                text: "下列不属于联想法的是？",
                options: ["A. 青蛙眼→电子蛙眼", "B. 潮汐→潮汐发电", "C. 甜瓜打顶→棉花打顶试验", "D. 鸟巢→国家体育场"],
                answer: "D",
                explanation: "鸟巢体育场是仿生法（模仿结构），而非由鸟巢联想到建筑功能。"
            },
            {
                id: 17,
                text: "人机关系中“静态的人”指的是？",
                options: ["A. 不会移动的人", "B. 人体静止状态下的尺寸", "C. 人的生理特性", "D. 人的心理特征"],
                answer: "B",
                explanation: "“静态的人”指人体在静止、自然状态下所测得的结构尺寸，如身高、臂长等。"
            },
            {
                id: 18,
                text: "在设计台灯时，从人机关系角度无需重点考虑的是？",
                options: ["A. 灯罩的造型是否美观", "B. 光线是否造成眩光", "C. 开关操作是否方便", "D. 灯架高度是否可调"],
                answer: "A",
                explanation: "美观属于设计的美学范畴，而非人机关系的核心目标（高效、安全、健康、舒适）。"
            },
            {
                id: 19,
                text: "设计汽车安全带时，首要考虑的人机关系目标是？",
                options: ["A. 高效", "B. 安全", "C. 舒适", "D. 健康"],
                answer: "B",
                explanation: "安全带的主要功能是在事故中保护乘员，首要目标是安全。"
            },
            {
                id: 20,
                text: "设计师提出“是否可以改变形状、颜色、声音、气味、高度、硬度？”等问题，这是运用了哪种构思方法？",
                options: ["A. 联想法", "B. 仿生法", "C. 设问法", "D. 形态分析法"],
                answer: "C",
                explanation: "这是典型的设问法，通过一系列问题引导思考，探索设计的可能性。"
            },
            {
                id: 21,
                text: "“能否使它更简单些？”“能否重复使用？”这类问题属于？",
                options: ["A. 联想法", "B. 仿生法", "C. 形态分析法", "D. 设问法"],
                answer: "D",
                explanation: "这些都是通过提问来激发改进思路的设问法。"
            },
            {
                id: 22,
                text: "设计儿童餐具时，将其做成卡通动物造型，主要考虑了？",
                options: ["A. 儿童的生理需求", "B. 儿童的心理需求", "C. 餐具的功能性", "D. 制造成本"],
                answer: "B",
                explanation: "可爱的造型能够吸引儿童，满足他们的心理偏好和情感需求。"
            },
            {
                id: 23,
                text: "在设计老年人使用的手机时，按键要大、字体要清晰，这主要考虑了？",
                options: ["A. 普通人群和特殊人群", "B. 静态的人和动态的人", "C. 人的生理需求和心理需求", "D. 信息交互"],
                answer: "A",
                explanation: "老年人视力下降是特殊生理特点，此设计针对特殊人群的需求。"
            },
            {
                id: 24,
                text: "“能否替代”“能否组合”“能否调整顺序”等问题属于？",
                options: ["A. 5W1H法", "B. 奥斯本检核表法", "C. 形态分析法", "D. 联想法"],
                answer: "B",
                explanation: "这些问题出自奥斯本检核表法，是设问法的一种具体形式。"
            },
            {
                id: 25,
                text: "下列哪项不属于设计中需要考虑的“环境因素”？",
                options: ["A. 温度", "B. 湿度", "C. 用户的性别", "D. 噪声"],
                answer: "C",
                explanation: "用户的性别属于“人”的因素，而非“环境”因素。环境因素指产品所处的物理环境。"
            }
        ];

        // 存储用户答案和状态
        const userAnswers = {};
        let answeredCount = 0;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            renderQuestions();
        });

        // 渲染所有题目
        function renderQuestions() {
            const form = document.getElementById('quizForm');
            form.innerHTML = '';

            questions.forEach(q => {
                const questionCard = document.createElement('div');
                questionCard.className = 'question-card';
                questionCard.id = `q-${q.id}`;

                questionCard.innerHTML = `
                    <div class="question-number">No.${q.id}</div>
                    <div class="question-text">${q.text}</div>
                    <div class="options">
                        ${q.options.map(option => `
                            <label class="option" data-value="${option.charAt(0)}">
                                <div class="radio-circle">
                                    <div class="radio-fill"></div>
                                </div>
                                <span class="option-label">${option}</span>
                            </label>
                        `).join('')}
                    </div>
                    <button class="submit-btn" id="submit-${q.id}" data-qid="${q.id}">提交答案</button>
                    <div class="explanation" id="exp-${q.id}">
                        <h4>解析：</h4>
                        <p>${q.explanation}</p>
                    </div>
                `;
                form.appendChild(questionCard);

                // 为每个选项添加点击事件
                questionCard.querySelectorAll('.option').forEach(optionEl => {
                    optionEl.addEventListener('click', () => {
                        // 检查是否已经提交过答案，如果已提交则不允许更改
                        if (document.getElementById(`submit-${q.id}`).disabled) return;

                        // 清除同题其他选项的选中状态
                        questionCard.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
                        // 为当前选项添加选中状态
                        optionEl.classList.add('selected');
                        
                        // 保存用户选择
                        userAnswers[q.id] = optionEl.dataset.value;
                    });
                });

                // 为提交按钮添加事件
                document.getElementById(`submit-${q.id}`).addEventListener('click', () => {
                    submitQuestion(q.id);
                });
            });
        }

        // 提交单道题
        function submitQuestion(qid) {
            const userAnswer = userAnswers[qid];
            const correctAnswer = questions.find(q => q.id == qid).answer;
            const submitBtn = document.getElementById(`submit-${qid}`);
            const explanationEl = document.getElementById(`exp-${qid}`);
            const questionCard = document.getElementById(`q-${qid}`);

            if (!userAnswer) {
                alert('请先选择一个选项！');
                return;
            }

            // 标记答案正误
            const options = questionCard.querySelectorAll('.option');
            options.forEach(opt => {
                if (opt.dataset.value === correctAnswer) {
                    opt.classList.add('correct');
                } else if (opt.dataset.value === userAnswer && userAnswer !== correctAnswer) {
                    opt.classList.add('incorrect');
                }
            });

            // 更新按钮状态
            if (userAnswer === correctAnswer) {
                submitBtn.classList.add('correct');
                submitBtn.textContent = '回答正确 ✓';
            } else {
                submitBtn.classList.add('incorrect');
                submitBtn.textContent = `回答错误 ✗ (正确答案: ${correctAnswer})`;
            }
            
            // 显示解析
            explanationEl.classList.add('show');
            
            // 禁用选项和按钮
            options.forEach(opt => opt.style.pointerEvents = 'none');
            submitBtn.disabled = true;

            // 更新全局计数
            if (!questions.find(q => q.id == qid).hasOwnProperty('_counted')) {
                questions.find(q => q.id == qid)._counted = true; // 使用一个临时属性标记已计入总数
                answeredCount++;
                updateProgress();
            }
        }

        // 更新进度条
        function updateProgress() {
            const total = questions.length;
            const percentage = (answeredCount / total) * 100;
            document.getElementById('main-progress-bar').style.width = `${percentage}%`;
            document.getElementById('progress-count').textContent = `${answeredCount}/${total}`;

            // 如果全部答完，显示结果按钮
            if (answeredCount === total) {
                setTimeout(() => {
                    showResults();
                }, 1000); // 延迟1秒，让用户看清最后一题的结果
            }
        }

        // 显示最终结果
        function showResults() {
            let correctCount = 0;
            questions.forEach(q => {
                if (userAnswers[q.id] === q.answer) {
                    correctCount++;
                }
            });

            const score = Math.round((correctCount / questions.length) * 100);
            document.getElementById('finalScore').textContent = `得分：${score}/100`;

            // 生成结论
            const conclusionText = document.getElementById('conclusionText');
            if (score >= 90) {
                conclusionText.textContent = "太棒了！你对‘方案的构思及方法’掌握得非常牢固，是一位出色的技术设计师！";
            } else if (score >= 70) {
                conclusionText.textContent = "做得不错！基础扎实，但还有一些细节需要注意，继续加油！";
            } else {
                conclusionText.textContent = "看来这部分内容还需要再复习一下哦，不要气馁，理论是实践的基础！";
            }

            // 创建图表
            const ctx = document.getElementById('resultsChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['答对', '答错'],
                    datasets: [{
                        data: [correctCount, questions.length - correctCount],
                        backgroundColor: [
                            'rgba(0, 255, 136, 0.7)',
                            'rgba(255, 68, 68, 0.7)'
                        ],
                        borderColor: [
                            'rgb(0, 255, 136)',
                            'rgb(255, 68, 68)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                color: '#fff',
                                font: { size: 14 }
                            }
                        },
                        title: {
                            display: true,
                            text: '答题结果统计',
                            color: '#0ef',
                            font: { size: 18 }
                        }
                    }
                }
            });

            // 显示模态框
            document.getElementById('resultsOverlay').classList.add('active');
        }

        // 关闭结果模态框
        function closeResults() {
            document.getElementById('resultsOverlay').classList.remove('active');
            // 可以在这里重置页面，以便再次练习
            // location.reload(); 
        }
    </script>
</body>
</html>
