<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技术与设计1 - 挑战答题</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        @keyframes gradientShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        @keyframes slideUp { from{opacity:0;transform:translateY(40px)} to{opacity:1;transform:translateY(0)} }
        @keyframes shake { 0%,100%{transform:translateX(0)} 10%{transform:translateX(-8px)} 20%{transform:translateX(8px)} 30%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 50%{transform:translateX(-4px)} 60%{transform:translateX(4px)} 70%{transform:translateX(-2px)} 80%{transform:translateX(2px)} 90%{transform:translateX(-1px)} }
        @keyframes comboPop { 0%{transform:scale(1)} 50%{transform:scale(1.6) rotate(-5deg)} 100%{transform:scale(1) rotate(0)} }
        @keyframes fadeInScale { from{opacity:0;transform:scale(.85)} to{opacity:1;transform:scale(1)} }
        @keyframes timerPulse { 0%,100%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.15)} }
        @keyframes floatSlow { 0%,100%{transform:translateY(0) translateX(0) rotate(0deg)} 25%{transform:translateY(-20px) translateX(10px) rotate(5deg)} 50%{transform:translateY(-10px) translateX(-5px) rotate(-3deg)} 75%{transform:translateY(-25px) translateX(8px) rotate(4deg)} }
        @keyframes floatMed { 0%,100%{transform:translateY(0) translateX(0) rotate(0deg)} 25%{transform:translateY(-15px) translateX(-12px) rotate(-8deg)} 50%{transform:translateY(-30px) translateX(5px) rotate(3deg)} 75%{transform:translateY(-8px) translateX(-8px) rotate(-5deg)} }
        @keyframes floatFast { 0%,100%{transform:translateY(0) rotate(0deg) scale(1)} 50%{transform:translateY(-35px) rotate(15deg) scale(1.1)} }
        @keyframes rotateSlow { to{transform:rotate(360deg)} }
        @keyframes rotateReverse { to{transform:rotate(0deg)} }
        @keyframes pulseGlow { 0%,100%{opacity:.3;transform:scale(1)} 50%{opacity:.6;transform:scale(1.08)} }
        @keyframes shimmerBorder { 0%{border-color:rgba(0,255,200,.3);box-shadow:0 0 20px rgba(0,255,200,.1)} 50%{border-color:rgba(0,180,216,.5);box-shadow:0 0 30px rgba(0,180,216,.2)} 100%{border-color:rgba(0,255,200,.3);box-shadow:0 0 20px rgba(0,255,200,.1)} }
        @keyframes iconBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
        @keyframes eliminateFade { 0%{opacity:1;transform:scale(.97)} 50%{opacity:.5;transform:scale(.97)} 100%{opacity:.35;transform:scale(.95)} }
        body { font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background:linear-gradient(-45deg,#0c0c1e,#1a1a3e,#0d2137,#162447); background-size:400% 400%; animation:gradientShift 15s ease infinite; color:#fff; min-height:100vh; overflow-x:hidden; }
        #particleCanvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }
        #confettiCanvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:9999; pointer-events:none; }

        /* === 首页几何装饰 === */
        .geo-decor { position:fixed; pointer-events:none; z-index:0; }
        .geo-ring { border-radius:50%; border:2px solid rgba(0,255,200,.15); }
        .geo-ring-1 { width:300px;height:300px; top:-50px;left:-80px; animation:floatSlow 12s ease-in-out infinite,rotateSlow 40s linear infinite; }
        .geo-ring-2 { width:200px;height:200px; bottom:10%;right:5%; border-color:rgba(123,47,247,.2); animation:floatMed 10s ease-in-out infinite,rotateReverse 30s linear infinite; }
        .geo-ring-3 { width:120px;height:120px; top:30%;right:15%; border-color:rgba(0,180,216,.15); animation:floatFast 8s ease-in-out infinite; }
        .geo-ring-4 { width:80px;height:80px; bottom:20%;left:12%; border-color:rgba(255,149,0,.12); animation:floatSlow 9s ease-in-out infinite,rotateSlow 20s linear infinite; }
        .geo-square { border:2px solid rgba(0,255,200,.12); border-radius:8px; }
        .geo-square-1 { width:60px;height:60px; top:15%;left:8%; animation:floatMed 11s ease-in-out infinite,rotateSlow 25s linear infinite; }
        .geo-square-2 { width:40px;height:40px; top:60%;right:10%; border-color:rgba(123,47,247,.15); animation:floatSlow 9s ease-in-out infinite,rotateReverse 18s linear infinite; }
        .geo-dot-grid { display:grid; grid-template-columns:repeat(3,8px); gap:12px; animation:floatSlow 14s ease-in-out infinite; }
        .geo-dot-grid .dot { width:4px;height:4px; background:rgba(0,255,200,.25); border-radius:50%; }
        .geo-dot-grid-1 { top:8%;right:20%; }
        .geo-dot-grid-2 { bottom:15%;left:20%; }
        .geo-triangle { width:0;height:0; border-left:30px solid transparent; border-right:30px solid transparent; border-bottom:52px solid rgba(255,149,0,.1); animation:floatFast 10s ease-in-out infinite,rotateSlow 35s linear infinite; }
        .geo-triangle-1 { top:20%;left:5%; }
        .geo-triangle-2 { bottom:25%;right:8%; border-bottom-color:rgba(0,255,200,.08); }
        .geo-hex { width:50px;height:29px; background:rgba(123,47,247,.08); position:relative; animation:floatMed 13s ease-in-out infinite; }
        .geo-hex::before,.geo-hex::after { content:'';position:absolute;width:0;border-left:25px solid transparent;border-right:25px solid transparent; }
        .geo-hex::before { bottom:100%;border-bottom:14px solid rgba(123,47,247,.08); }
        .geo-hex::after { top:100%;border-top:14px solid rgba(123,47,247,.08); }
        .geo-hex-1 { top:45%;left:3%; }
        .geo-hex-2 { top:70%;right:5%;background:rgba(0,180,216,.06); }
        .geo-hex-2::before { border-bottom-color:rgba(0,180,216,.06); }
        .geo-hex-2::after { border-top-color:rgba(0,180,216,.06); }
        .geo-line { height:1px; background:linear-gradient(90deg,transparent,rgba(0,255,200,.15),transparent); animation:pulseGlow 4s ease-in-out infinite; }
        .geo-line-1 { width:200px;top:35%;left:-30px; transform:rotate(30deg); }
        .geo-line-2 { width:150px;bottom:40%;right:-20px; transform:rotate(-25deg); background:linear-gradient(90deg,transparent,rgba(123,47,247,.12),transparent); animation-delay:2s; }
        .glow-orb { border-radius:50%; position:fixed; pointer-events:none; z-index:0; }
        .glow-orb-1 { width:400px;height:400px; background:radial-gradient(circle,rgba(0,255,200,.08),transparent 70%); top:-100px;right:-100px; animation:pulseGlow 6s ease-in-out infinite; }
        .glow-orb-2 { width:300px;height:300px; background:radial-gradient(circle,rgba(123,47,247,.08),transparent 70%); bottom:-50px;left:-80px; animation:pulseGlow 8s ease-in-out infinite 3s; }
        .glow-orb-3 { width:250px;height:250px; background:radial-gradient(circle,rgba(0,180,216,.06),transparent 70%); top:50%;left:50%; transform:translate(-50%,-50%); animation:pulseGlow 10s ease-in-out infinite 1.5s; }

        .game-wrapper { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px; }

        /* === 首页卡片 === */
        .intro-card { position:relative; background:rgba(255,255,255,.04); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.1); border-radius:32px; padding:45px 40px; max-width:680px; margin:0 auto; box-shadow:0 20px 60px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08); animation:shimmerBorder 4s ease-in-out infinite; overflow:hidden; }
        .intro-card::before { content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,rgba(0,255,200,.05),transparent,rgba(123,47,247,.05),transparent);animation:rotateSlow 15s linear infinite;z-index:-1; }
        .icon-tray { display:flex;justify-content:center;gap:20px;margin-bottom:25px;flex-wrap:wrap; }
        .icon-item { width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:24px;animation:iconBounce 3s ease-in-out infinite; }
        .icon-item:nth-child(1){animation-delay:0s} .icon-item:nth-child(2){animation-delay:.5s} .icon-item:nth-child(3){animation-delay:1s} .icon-item:nth-child(4){animation-delay:1.5s} .icon-item:nth-child(5){animation-delay:2s} .icon-item:nth-child(6){animation-delay:2.5s}
        .intro-card h1 { font-size:2.8em;font-weight:900;margin-bottom:8px;background:linear-gradient(135deg,#00ffc8,#00b4d8,#7b2ff7,#ff6b6b);background-size:300% 300%;animation:gradientShift 4s ease infinite;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px; }
        .subtitle-badge { display:inline-block;padding:6px 22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:30px;font-size:.95em;color:rgba(255,255,255,.7);margin-bottom:25px;letter-spacing:3px; }
        .divider { height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);margin:20px 0; }
        .rules-grid { display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:25px;text-align:left; }
        @media(max-width:500px){ .rules-grid{grid-template-columns:1fr} }
        .rule-card { background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;transition:all .3s ease;color:rgba(255,255,255,.8);font-size:.9em;line-height:1.4; }
        .rule-card:hover { background:rgba(255,255,255,.08);transform:translateY(-2px);box-shadow:0 4px 15px rgba(0,0,0,.2); }
        .rule-icon { font-size:1.5em;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
        .rule-icon.time{background:rgba(0,255,200,.15)} .rule-icon.combo{background:rgba(255,149,0,.15)} .rule-icon.tool{background:rgba(123,47,247,.15)} .rule-icon.goal{background:rgba(255,107,107,.15)}
        .warning-banner { background:rgba(255,68,68,.08);border:1px solid rgba(255,68,68,.2);border-radius:10px;padding:10px 16px;margin-bottom:22px;font-size:.9em;color:rgba(255,130,130,.9);display:flex;align-items:center;gap:8px;justify-content:center; }
        .start-btn-wrap { position:relative;display:inline-block; }
        .start-btn-wrap .btn-glow { position:absolute;inset:-4px;border-radius:20px;background:linear-gradient(135deg,#00ffc8,#00b4d8,#7b2ff7);filter:blur(15px);opacity:.4;animation:pulseGlow 2s ease-in-out infinite;z-index:-1; }
        .start-btn { font-size:1.3em;padding:18px 55px;background:linear-gradient(135deg,#00ffc8,#00b4d8);border:none;border-radius:16px;color:#0c0c1e;font-weight:800;cursor:pointer;letter-spacing:2px;transition:all .3s cubic-bezier(.22,.61,.36,1);position:relative;overflow:hidden; }
        .start-btn::after { content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(135deg,transparent,rgba(255,255,255,.2),transparent);transform:translateX(-100%);transition:transform .6s; }
        .start-btn:hover { transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,255,200,.3); }
        .start-btn:hover::after { transform:translateX(100%); }

        /* === 游戏界面 === */
        .header-bar { display:flex;align-items:center;justify-content:space-between;width:100%;max-width:800px;margin-bottom:15px; }
        .header-bar .rank-badge { padding:6px 16px;border-radius:20px;font-size:.9em;font-weight:700;text-transform:uppercase;letter-spacing:1px; }
        .rank-bronze{background:linear-gradient(135deg,#cd7f32,#a0522d);color:#fff} .rank-silver{background:linear-gradient(135deg,#c0c0c0,#808080);color:#333} .rank-gold{background:linear-gradient(135deg,#ffd700,#daa520);color:#333} .rank-diamond{background:linear-gradient(135deg,#00d4ff,#7b2ff7);color:#fff}
        .combo-display { font-size:1.5em;font-weight:900;color:#ff9500;opacity:0;transition:opacity .3s }
        .combo-display.active { opacity:1;animation:comboPop .5s ease; }
        .score-display { font-size:1.2em;font-weight:700 }
        .score-display span { color:#00ffc8; }
        .progress-bar-container { width:100%;max-width:800px;height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-bottom:15px; }
        .progress-bar-fill { height:100%;width:0%;background:linear-gradient(90deg,#00ffc8,#00b4d8,#7b2ff7);background-size:200% 100%;animation:gradientShift 3s linear infinite;transition:width .6s cubic-bezier(.22,.61,.36,1);border-radius:4px; }
        .timer-container { position:relative;width:80px;height:80px;margin-bottom:10px; }
        .timer-svg { transform:rotate(-90deg);width:80px;height:80px; }
        .timer-bg { fill:none;stroke:rgba(255,255,255,.1);stroke-width:4; }
        .timer-ring { fill:none;stroke:#00ffc8;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .1s linear,stroke .5s; }
        .timer-text { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.4em;font-weight:900; }
        .timer-text.urgent { animation:timerPulse .5s ease infinite; }
        .main-card { width:100%;max-width:800px;background:rgba(255,255,255,.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:35px 30px;box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1);animation:fadeInScale .6s ease; }
        .main-card.shake { animation:shake .6s ease; }
        .question-counter { font-size:.85em;color:rgba(255,255,255,.5);margin-bottom:10px;letter-spacing:1px;text-transform:uppercase; }
        .question-text { font-size:1.35em;line-height:1.6;margin-bottom:28px;text-align:left;text-shadow:0 2px 8px rgba(0,0,0,.3); }
        .options-grid { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
        @media(max-width:600px){ .options-grid{grid-template-columns:1fr} }
        .option-btn { position:relative;overflow:hidden;padding:16px 20px;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.15);border-radius:16px;color:#fff;font-size:1em;font-weight:500;cursor:pointer;text-align:left;transition:all .3s cubic-bezier(.22,.61,.36,1);line-height:1.4; }
        .option-btn::before { content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,rgba(0,255,200,.1),transparent);opacity:0;transition:opacity .3s; }
        .option-btn:hover { border-color:rgba(0,255,200,.5);transform:translateY(-3px);box-shadow:0 8px 25px rgba(0,255,200,.15); }
        .option-btn:hover::before { opacity:1; }
        .option-btn:active { transform:translateY(0) scale(.97); }
        .option-btn .opt-label { display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.15);font-weight:700;font-size:.85em;margin-right:12px;flex-shrink:0;vertical-align:middle; }
        .option-btn.correct { background:rgba(0,200,83,.3)!important;border-color:#4CAF50!important;box-shadow:0 0 30px rgba(76,175,80,.3); }
        .option-btn.wrong { background:rgba(244,67,54,.3)!important;border-color:#f44336!important;box-shadow:0 0 30px rgba(244,67,54,.3); }
        .option-btn.disabled { opacity:.35;pointer-events:none;transform:scale(.95); }
        .lifelines-bar { display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap; }
        .lifeline-btn { padding:10px 18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:12px;color:#fff;font-size:.9em;cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:6px; }
        .lifeline-btn:hover:not(.used) { background:rgba(255,255,255,.15);transform:translateY(-2px); }
        .lifeline-btn.used { opacity:.3;pointer-events:none;text-decoration:line-through; }
        .overlay { position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:10000;display:flex;align-items:center;justify-content:center;animation:fadeInScale .4s ease; }
        .modal-box { background:rgba(20,20,40,.95);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:40px;max-width:520px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:fadeInScale .5s ease; }
        .modal-box h2 { font-size:1.8em;margin-bottom:12px; }
        .modal-box p { font-size:1.1em;color:rgba(255,255,255,.7);margin-bottom:20px;line-height:1.5; }
        .modal-btn { padding:14px 36px;background:linear-gradient(135deg,#00ffc8,#00b4d8);border:none;border-radius:14px;color:#0c0c1e;font-size:1.1em;font-weight:700;cursor:pointer;margin:5px;transition:transform .2s,box-shadow .2s; }
        .modal-btn:hover { transform:translateY(-3px);box-shadow:0 8px 25px rgba(0,255,200,.3); }
        .modal-btn.secondary { background:rgba(255,255,255,.1);color:#fff; }
        .review-section { text-align:left;max-height:300px;overflow-y:auto;margin:15px 0;padding:15px;background:rgba(255,255,255,.05);border-radius:12px; }
        .review-section::-webkit-scrollbar { width:6px; }
        .review-section::-webkit-scrollbar-thumb { background:rgba(255,255,255,.2);border-radius:3px; }
        .review-item { padding:12px;margin-bottom:8px;border-radius:10px;background:rgba(244,67,54,.08);border-left:3px solid #f44336;font-size:.9em; }
        .review-item .review-q { font-weight:600;margin-bottom:4px; }
        .review-item .review-a { color:#4CAF50;font-weight:600; }

        .game-active .start-screen { display:none; }
        .start-screen .game-ui { display:none; }
        .game-active .game-ui { display:block; }
    
.gear-icon{display:none}/* hidden */
</style>
</head>
<body>
<canvas id="particleCanvas"></canvas>
<canvas id="confettiCanvas"></canvas>
<div class="geo-decor geo-ring geo-ring-1"></div>
<div class="geo-decor geo-ring geo-ring-2"></div>
<div class="geo-decor geo-ring geo-ring-3"></div>
<div class="geo-decor geo-ring geo-ring-4"></div>
<div class="geo-decor geo-square geo-square-1"></div>
<div class="geo-decor geo-square geo-square-2"></div>
<div class="geo-decor geo-triangle geo-triangle-1"></div>
<div class="geo-decor geo-triangle geo-triangle-2"></div>
<div class="geo-decor geo-hex geo-hex-1"></div>
<div class="geo-decor geo-hex geo-hex-2"></div>
<div class="geo-decor geo-line geo-line-1"></div>
<div class="geo-decor geo-line geo-line-2"></div>
<div class="geo-decor geo-dot-grid geo-dot-grid-1">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
</div>
<div class="geo-decor geo-dot-grid geo-dot-grid-2">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
</div>
<div class="glow-orb glow-orb-1"></div>
<div class="glow-orb glow-orb-2"></div>
<div class="glow-orb glow-orb-3"></div>

<div class="game-wrapper">
    <div class="start-screen" id="startScreen">
        <div class="intro-card">
            <div class="icon-tray">
                <div class="icon-item">&#x1F30D;</div>
                <div class="icon-item">&#x1F4A1;</div>
                <div class="icon-item">&#x2699;&#xFE0F;</div>
                <div class="icon-item">&#x1F527;</div>
                <div class="icon-item">&#x1F3F7;&#xFE0F;</div>
                <div class="icon-item">&#x1F680;</div>
            </div>
            <h1>&#x7B54;&#x9898;&#x7ADE;&#x6280;&#x573A;</h1>
            <div class="subtitle-badge">&#x1F525; &#x6280;&#x672F;&#x4E0E;&#x8BBE;&#x8BA1;1 &#x00B7; &#x77E5;&#x8BC6;&#x95EF;&#x5173; &#x1F525;</div>
            <div class="divider"></div>
            <div class="rules-grid">
                <div class="rule-card"><div class="rule-icon time">&#x23F1;&#xFE0F;</div><div>每题限时 <b style="color:#00ffc8;">120 &#x79D2;</b><br>&#x7B54;&#x5BF9;&#x5F97; <b style="color:#00ffc8;">10 &#x5206;</b></div></div>
                <div class="rule-card"><div class="rule-icon combo">&#x26A1;</div><div><b style="color:#FF9500;">&#x8FDE;&#x51FB;&#x52A0;&#x6210;</b><br>3&#x8FDE;&#x51FB; +<b>50%</b> / 5&#x8FDE;&#x51FB; +<b>100%</b></div></div>
                <div class="rule-card"><div class="rule-icon tool">&#x1F6E0;&#xFE0F;</div><div>&#x4E09;&#x79CD;&#x6C42;&#x52A9;&#x9053;&#x5177;<br>&#x5404;&#x9650;&#x7528; <b style="color:#7B2FF7;">1 &#x6B21;</b></div></div>
                <div class="rule-card"><div class="rule-icon goal">&#x1F3C6;</div><div>&#x7D2F;&#x8BA1; <b style="color:#FF6B6B;">150 &#x5206;</b> &#x901A;&#x5173;<br>&#x51B2;&#x51FB;&#x6700;&#x9AD8;&#x6BB5;&#x4F4D;&#xFF01;</div></div>
            </div>
            <div class="warning-banner"><span class="warn-icon">&#x26A0;&#xFE0F;</span><span>&#x5012;&#x8BA1;&#x65F6;&#x7ED3;&#x675F;&#x672A;&#x4F5C;&#x7B54; &#x2192; &#x6311;&#x6218;&#x7ED3;&#x675F;&#xFF01;</span></div>
            <div class="start-btn-wrap"><div class="btn-glow"></div><button class="start-btn" id="startBtn">&#x5F00;&#x59CB;&#x6311;&#x6218;</button></div>
        </div>
    </div>

    <div class="game-ui" id="gameUI" style="display:none;">
        <div class="header-bar">
            <div class="rank-badge rank-bronze" id="rankBadge">&#x9752;&#x94DC;</div>
            <div class="combo-display" id="comboDisplay">COMBO</div>
            <div class="score-display">&#x5206;&#x6570;: <span id="scoreText">0</span></div>
        </div>
        <div class="progress-bar-container"><div class="progress-bar-fill" id="progressFill"></div></div>
        <div style="text-align:center;">
            <div class="timer-container">
                <svg class="timer-svg" viewBox="0 0 80 80">
                    <circle class="timer-bg" cx="40" cy="40" r="35"></circle>
                    <circle class="timer-ring" id="timerRing" cx="40" cy="40" r="35" stroke-dasharray="219.91" stroke-dashoffset="0"></circle>
                </svg>
                <div class="timer-text" id="timerText">60</div>
            </div>
        </div>
        <div class="main-card" id="mainCard">
            <div class="question-counter" id="questionCounter">&#x7B2C; 1 &#x9898;</div>
            <div class="question-text" id="questionText">&#x9898;&#x76EE;&#x52A0;&#x8F7D;&#x4E2D;...</div>
            <div class="options-grid" id="optionsGrid"></div>
            <div class="lifelines-bar">
                <button class="lifeline-btn" id="btn5050" onclick="useLifeline('fiftyFifty')"><span class="lifeline-icon">&#x2702;&#xFE0F;</span> &#x6392;&#x9664;&#x4E24;&#x9879;</button>
                <button class="lifeline-btn" id="btnAudience" onclick="useLifeline('audiencePoll')"><span class="lifeline-icon">&#x1F4CA;</span> &#x89C2;&#x4F17;&#x6295;&#x7968;</button>
                <button class="lifeline-btn" id="btnPhone" onclick="useLifeline('phoneAFriend')"><span class="lifeline-icon">&#x1F4DE;</span> &#x6C42;&#x52A9;&#x597D;&#x53CB;</button>
            </div>
        </div>
    </div>
</div>

<script>
var audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playTone(f,d,v){if(!audioCtx)return;try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}
function playTickSound(){playTone(800,.06,.12)}
function playUrgentSound(){playTone(600,.1,.2)}
function playAlarmSound(){playTone(440,.15,.3)}
function playCorrectSound(){playTone(523,.1,.2);setTimeout(function(){playTone(659,.1,.2)},80);setTimeout(function(){playTone(784,.15,.25)},160)}
function playWrongSound(){playTone(330,.2,.2);setTimeout(function(){playTone(262,.3,.15)},150)}

(function(){var c=document.getElementById('particleCanvas'),ctx=c.getContext('2d'),ps=[],m={x:null,y:null};function rs(){c.width=window.innerWidth;c.height=window.innerHeight}rs();window.addEventListener('resize',rs);document.addEventListener('mousemove',function(e){m.x=e.clientX;m.y=e.clientY});function P(){this.reset()}P.prototype.reset=function(){this.x=Math.random()*c.width;this.y=Math.random()*c.height;this.size=Math.random()*2+.5;this.speedX=(Math.random()-.5)*.4;this.speedY=(Math.random()-.5)*.4;this.opacity=Math.random()*.5+.1};P.prototype.update=function(){this.x+=this.speedX;this.y+=this.speedY;if(m.x!==null){var dx=m.x-this.x,dy=m.y-this.y,di=Math.sqrt(dx*dx+dy*dy);if(di<150){var f=(150-di)/150;this.x-=dx*f*.01;this.y-=dy*f*.01}}if(this.x<0||this.x>c.width||this.y<0||this.y>c.height)this.reset()};P.prototype.draw=function(){ctx.fillStyle='rgba(0,255,200,'+this.opacity+')';ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill()};for(var i=0;i<100;i++)ps.push(new P());function dl(){for(var i=0;i<ps.length;i++)for(var j=i+1;j<ps.length;j++){var dx=ps[i].x-ps[j].x,dy=ps[i].y-ps[j].y,di=Math.sqrt(dx*dx+dy*dy);if(di<120){ctx.strokeStyle='rgba(0,255,200,'+(.15*(1-di/120))+')';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(ps[i].x,ps[i].y);ctx.lineTo(ps[j].x,ps[j].y);ctx.stroke()}}}function ap(){ctx.clearRect(0,0,c.width,c.height);ps.forEach(function(p){p.update();p.draw()});dl();requestAnimationFrame(ap)}ap()})();

(function(){var c=document.getElementById('confettiCanvas'),ctx=c.getContext('2d'),cf=[],r=false;function rs(){c.width=window.innerWidth;c.height=window.innerHeight}rs();window.addEventListener('resize',rs);function cc(x,y,n){var cs=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff922b','#e599f7','#00ffc8'];for(var i=0;i<n;i++){var a=(Math.PI*2*i)/n+(Math.random()-.5)*.5,s=Math.random()*8+4;cf.push({x:x||c.width/2,y:y||c.height/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,size:Math.random()*8+4,color:cs[Math.floor(Math.random()*cs.length)],rotation:Math.random()*360,rotSpeed:(Math.random()-.5)*12,life:1,gr:.12,shape:Math.random()>.5?'rect':'circle'})}if(!r){r=true;ac()}}function ac(){ctx.clearRect(0,0,c.width,c.height);cf=cf.filter(function(c){return c.life>0});if(cf.length===0){r=false;return}cf.forEach(function(c){c.x+=c.vx;c.y+=c.vy;c.vy+=c.gr;c.vx*=.99;c.rotation+=c.rotSpeed;c.life-=.008;ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rotation*Math.PI/180);ctx.globalAlpha=Math.max(0,c.life);ctx.fillStyle=c.color;if(c.shape==='rect')ctx.fillRect(-c.size/2,-c.size/4,c.size,c.size/2);else{ctx.beginPath();ctx.arc(0,0,c.size/2,0,Math.PI*2);ctx.fill()}ctx.restore()});requestAnimationFrame(ac)}window.triggerConfetti=cc})();

var QUESTION_JSON='qjson1.json',PASSING_SCORE=150,TIME_LIMIT=120,tc=219.91;
var questions=[],curIdx=0,answered=new Set(),score=0,combo=0,maxCombo=0,qCount=0,wrongAnswers=[],tInt=null,timeLeft=TIME_LIMIT,lastSec=TIME_LIMIT;
var lifelines={fiftyFifty:true,audiencePoll:true,phoneAFriend:true};
function $(s){return document.querySelector(s)}
var startScreen=$('#startScreen'),gameUI=$('#gameUI'),startBtn=$('#startBtn'),questionText=$('#questionText'),questionCounter=$('#questionCounter'),optionsGrid=$('#optionsGrid'),scoreText=$('#scoreText'),rankBadge=$('#rankBadge'),comboDisplay=$('#comboDisplay'),progressFill=$('#progressFill'),timerText=$('#timerText'),timerRing=$('#timerRing'),mainCard=$('#mainCard');

fetch(QUESTION_JSON).then(function(r){return r.json()}).then(function(d){questions=d}).catch(function(){alert('题目加载失败，请刷新页面重试。')});
startBtn.addEventListener('click',function(){initAudio();document.documentElement.classList.add('game-active');startScreen.style.display='none';gameUI.style.display='block';answered=new Set();score=0;combo=0;maxCombo=0;qCount=0;wrongAnswers=[];Object.keys(lifelines).forEach(function(k){lifelines[k]=true});updateLifelineButtons();updateRank();loadNext()});

function loadNext(){if(questions.length===0)return;var av=[];for(var i=0;i<questions.length;i++)if(!answered.has(i))av.push(i);if(av.length===0){answered=new Set();av=questions.map(function(_,i){return i})}var ri=Math.floor(Math.random()*av.length);curIdx=av[ri];var q=questions[curIdx];qCount++;questionCounter.textContent='第 '+qCount+' 题';questionText.innerHTML=q.question;var lb=['A','B','C','D'];optionsGrid.innerHTML='';q.options.forEach(function(opt,idx){var btn=document.createElement('button');btn.className='option-btn';btn.innerHTML='<span class="opt-label">'+lb[idx]+'</span>'+opt;btn.addEventListener('click',function(){selectAns(idx)});optionsGrid.appendChild(btn)});resetTimer()}

function resetTimer(){clearInterval(tInt);timeLeft=TIME_LIMIT;lastSec=TIME_LIMIT;timerText.textContent=timeLeft;timerRing.style.strokeDashoffset='0';timerRing.style.stroke='#00ffc8';timerText.style.color='#fff';timerText.classList.remove('urgent');tInt=setInterval(function(){timeLeft-=.1;if(timeLeft<=0){timeLeft=0;clearInterval(tInt);handleTimeout();return}timerText.textContent=Math.ceil(timeLeft);var off=tc*(1-timeLeft/TIME_LIMIT);timerRing.style.strokeDashoffset=off;var cs=Math.ceil(timeLeft);if(cs<=5){timerRing.style.stroke='#ff4444';timerText.style.color='#ff4444';timerText.classList.add('urgent');if(cs!==lastSec&&cs>0){playAlarmSound();lastSec=cs}}else if(cs<=10){timerRing.style.stroke='#ffaa00';timerText.style.color='#ffaa00';timerText.classList.remove('urgent');if(cs!==lastSec){playUrgentSound();lastSec=cs}}else{timerText.classList.remove('urgent');if(cs!==lastSec&&cs%5===0){playTickSound();lastSec=cs}}},100)}

function handleTimeout(){var q=questions[curIdx];answered.add(curIdx);combo=0;updateCombo();wrongAnswers.push({q:q.question,yourAns:'超时未答',correctAns:q.options[q.answer]});hlCorrect(q.answer);disOpts();playWrongSound();setTimeout(function(){showResult('timeout')},1500)}

function selectAns(si){clearInterval(tInt);var q=questions[curIdx];answered.add(curIdx);var obs=optionsGrid.querySelectorAll('.option-btn');if(si===q.answer){obs[si].classList.add('correct');combo++;if(combo>maxCombo)maxCombo=combo;score+=10;updateScore();updateCombo();updateRank();updateProg();playCorrectSound();window.triggerConfetti(window.innerWidth/2,window.innerHeight/2,40);disOpts();setTimeout(function(){if(score>=PASSING_SCORE)showResult('pass');else loadNext()},1200)}else{obs[si].classList.add('wrong');combo=0;updateCombo();mainCard.classList.add('shake');setTimeout(function(){mainCard.classList.remove('shake')},600);wrongAnswers.push({q:q.question,yourAns:q.options[si],correctAns:q.options[q.answer]});hlCorrect(q.answer);disOpts();playWrongSound();setTimeout(function(){showResult('timeout')},1500)}}

function hlCorrect(ci){var obs=optionsGrid.querySelectorAll('.option-btn');if(obs[ci]){obs[ci].classList.add('correct');obs[ci].style.boxShadow='0 0 30px rgba(76,175,80,.3)'}}
function disOpts(){optionsGrid.querySelectorAll('.option-btn').forEach(function(btn){btn.style.pointerEvents='none';btn.style.opacity=btn.classList.contains('correct')?'1':btn.classList.contains('wrong')?'0.7':'0.4'})}
function updateScore(){scoreText.textContent=score}
function updateCombo(){if(combo>=2){comboDisplay.textContent=combo+'x COMBO!';comboDisplay.classList.add('active')}else{comboDisplay.classList.remove('active')}}
function updateRank(){var r,cl;if(score>=120){r='钻石';cl='rank-diamond'}else if(score>=80){r='黄金';cl='rank-gold'}else if(score>=40){r='白银';cl='rank-silver'}else{r='青铜';cl='rank-bronze'}rankBadge.textContent=r;rankBadge.className='rank-badge '+cl}
function updateProg(){progressFill.style.width=Math.min(100,Math.round(score/PASSING_SCORE*100))+'%'}
function updateLifelineButtons(){document.getElementById('btn5050').classList.toggle('used',!lifelines.fiftyFifty);document.getElementById('btnAudience').classList.toggle('used',!lifelines.audiencePoll);document.getElementById('btnPhone').classList.toggle('used',!lifelines.phoneAFriend)}

function useLifeline(t){if(!lifelines[t])return;var q=questions[curIdx];if(!q)return;if(t==='fiftyFifty'){lifelines.fiftyFifty=false;updateLifelineButtons();var wo=[0,1,2,3].filter(function(i){return i!==q.answer});wo.sort(function(){return Math.random()-.5});var th=wo.slice(0,2),obs=optionsGrid.querySelectorAll('.option-btn'),lb=['A','B','C','D'];th.forEach(function(i){if(obs[i]){obs[i].classList.add('disabled');obs[i].innerHTML='<span class="opt-label" style="background:rgba(255,50,50,.4);">'+lb[i]+'</span><span style="text-decoration:line-through;opacity:.3;">'+q.options[i]+'</span>'}})}else if(t==='audiencePoll'){lifelines.audiencePoll=false;updateLifelineButtons();var rs=[0,0,0,0];rs[q.answer]=Math.floor(Math.random()*30+55);var rm=100-rs[q.answer];for(var i=0;i<4;i++)if(i!==q.answer){rs[i]=Math.floor(rm/3)+Math.floor(Math.random()*10-5);rm-=rs[i]}rs[q.answer===3?2:3]+=rm;var lb=['A','B','C','D'];showModal('观众投票结果',rs.map(function(v,i){return lb[i]+': '+v+'%'}).join('  '))}else if(t==='phoneAFriend'){lifelines.phoneAFriend=false;updateLifelineButtons();var lb=['A','B','C','D'],fa=Math.random()<.8?q.answer:Math.floor(Math.random()*4),cn=fa===q.answer?'比较确定':'不太确定';showModal('好友回复','我觉得选 '+lb[fa]+'...'+cn+'！')}}

function showModal(title,content){var ov=document.createElement('div');ov.className='overlay';ov.innerHTML='<div class="modal-box"><h2>'+title+'</h2><p>'+content+'</p><button class="modal-btn" id="modalClose">知道了</button></div>';document.body.appendChild(ov);ov.querySelector('#modalClose').addEventListener('click',function(){ov.remove()});ov.addEventListener('click',function(e){if(e.target===ov)ov.remove()})}

function showResult(t){clearInterval(tInt);var ov=document.createElement('div');ov.className='overlay';var isPass=t==='pass',isTimeout=t==='timeout',ti,msg;if(isPass){ti='恭喜通关！';msg='你已完成技术与设计1的挑战！';setTimeout(function(){window.triggerConfetti(window.innerWidth*.3,window.innerHeight*.4,60)},200);setTimeout(function(){window.triggerConfetti(window.innerWidth*.7,window.innerHeight*.4,60)},500)}else if(isTimeout){ti='时间到！';msg='倒计时结束，本轮挑战到此为止。别灰心，再接再厉！'}else{ti='挑战结束';msg='答错了，但别灰心，继续努力！'}var rh='';if(wrongAnswers.length>0){rh='<div class="review-section"><h3 style="margin-bottom:12px;color:#ff6b6b;">错题回顾</h3>';wrongAnswers.forEach(function(w){rh+='<div class="review-item"><div class="review-q">Q: '+w.q+'</div><div>你的答案: '+w.yourAns+'</div><div class="review-a">正确答案: '+w.correctAns+'</div></div>'});rh+='</div>'}ov.innerHTML='<div class="modal-box"><h2 style="font-size:2em;">'+ti+'</h2><p>'+msg+'</p><div style="display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:18px;"><div style="background:rgba(0,255,200,.1);padding:12px 20px;border-radius:12px;"><div style="font-size:.8em;color:rgba(255,255,255,.5);">最终得分</div><div style="font-size:1.8em;font-weight:900;color:#00ffc8;">'+score+'</div></div><div style="background:rgba(255,149,0,.1);padding:12px 20px;border-radius:12px;"><div style="font-size:.8em;color:rgba(255,255,255,.5);">最大连击</div><div style="font-size:1.8em;font-weight:900;color:#ff9500;">'+maxCombo+'x</div></div><div style="background:rgba(255,107,107,.1);padding:12px 20px;border-radius:12px;"><div style="font-size:.8em;color:rgba(255,255,255,.5);">错题数</div><div style="font-size:1.8em;font-weight:900;color:#ff6b6b;">'+wrongAnswers.length+'</div></div></div>'+rh+'<div style="margin-top:18px;"><button class="modal-btn" id="retryBtn">再来一局</button></div></div>';document.body.appendChild(ov);ov.querySelector('#retryBtn').addEventListener('click',function(){ov.remove();score=0;combo=0;maxCombo=0;qCount=0;wrongAnswers=[];answered=new Set();Object.keys(lifelines).forEach(function(k){lifelines[k]=true});updateLifelineButtons();updateScore();updateCombo();updateRank();progressFill.style.width='0%';loadNext()});ov.addEventListener('click',function(e){if(e.target===ov)ov.remove()})}
</script>
</body>
</html>
