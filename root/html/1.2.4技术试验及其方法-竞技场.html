<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 知识竞技场 · 技术试验及其方法 · 挑战答题</title>
<style>
/* ═══════════════════════════════════════
   0. CSS 变量 & 重置 · 游戏化竞技场
   ═══════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-dark: #0d0d1a;
  --bg-card: #1a1a30;
  --bg-card-hover: #222244;
  --gold: #ffd700;
  --gold-dim: rgba(255,215,0,.15);
  --cyan: #00f0ff;
  --cyan-dim: rgba(0,240,255,.15);
  --red: #ff3355;
  --red-dim: rgba(255,51,85,.15);
  --green: #00ff88;
  --green-dim: rgba(0,255,136,.12);
  --purple: #8833ff;
  --orange: #ff8800;
  --text: #e8e8f0;
  --text-dim: #8888aa;
  --border: rgba(255,255,255,.08);
  --border-glow: rgba(255,215,0,.2);
  --radius: 16px;
  --radius-sm: 10px;
  --font: 'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif;
}
html{font-size:20px}
body{
  font-family:var(--font);
  background:var(--bg-dark);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  justify-content:center;
  background-image:radial-gradient(ellipse at 20% 20%,rgba(136,51,255,.06) 0%,transparent 50%),
                   radial-gradient(ellipse at 80% 80%,rgba(255,215,0,.04) 0%,transparent 50%),
                   radial-gradient(ellipse at 50% 50%,rgba(0,240,255,.03) 0%,transparent 50%);
}

/* 像素网格叠加 */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
                  linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:32px 32px;
}

/* ═══════════════════════════════════════
   1. 主容器
   ═══════════════════════════════════════ */
#app{
  position:relative;z-index:1;
  width:100%;max-width:960px;
  min-height:100vh;
  padding:24px 20px 50px;
  display:flex;flex-direction:column;
  align-items:center;gap:16px;
}

/* ═══════════════════════════════════════
   2. 竞技场头部
   ═══════════════════════════════════════ */
.arena-header{
  width:100%;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;
  background:linear-gradient(135deg,rgba(255,215,0,.08),rgba(136,51,255,.06));
  border:1px solid var(--border);
  border-radius:var(--radius);
  position:relative;
  overflow:hidden;
}
.arena-header::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  animation:header-scan 3s ease-in-out infinite;
}
@keyframes header-scan{
  0%,100%{transform:translateX(-100%)}
  50%{transform:translateX(100%)}
}
.arena-header h1{
  font-size:1.1rem;font-weight:900;
  background:linear-gradient(135deg,var(--gold),var(--orange));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:2px;text-transform:uppercase;
}
.arena-level{
  display:inline-block;padding:3px 14px;border-radius:4px;
  background:rgba(255,215,0,.1);border:1px solid var(--border-glow);
  color:var(--gold);font-size:.75rem;font-weight:700;
  letter-spacing:2px;
}

/* 回合指示器 - 血量条风格 */
.hp-bar{display:flex;gap:6px;}
.hp-seg{
  width:22px;height:12px;border-radius:3px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
  transition:all .4s;
}
.hp-seg.done{background:var(--green);border-color:var(--green);box-shadow:0 0 10px var(--green-dim);}
.hp-seg.active{background:var(--gold);border-color:var(--gold);box-shadow:0 0 14px var(--gold-dim);animation:hp-pulse 1s ease infinite;}
.hp-seg.future{background:rgba(255,255,255,.04);}
@keyframes hp-pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ═══════════════════════════════════════
   3. 竞技场卡片
   ═══════════════════════════════════════ */
.arena-card{
  width:100%;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:28px 24px;
  position:relative;
  overflow:hidden;
  animation:card-enter .45s cubic-bezier(.34,1.56,.64,1);
}
@keyframes card-enter{from{opacity:0;transform:scale(.95) translateY(15px)}to{opacity:1;transform:scale(1) translateY(0)}}
.arena-card::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,215,0,.15),transparent);
}
.scene-title{
  font-size:1.3rem;font-weight:800;text-align:center;margin-bottom:16px;
  background:linear-gradient(135deg,var(--gold),var(--orange));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:2px;
  text-transform:uppercase;
}

/* ═══════════════════════════════════════
   4. 设置界面
   ═══════════════════════════════════════ */
.setup-group{display:flex;flex-direction:column;gap:14px;max-width:400px;margin:0 auto;}
.setup-row{display:flex;flex-direction:column;gap:6px;}
.setup-row label{
  font-size:.8rem;font-weight:700;color:var(--gold);letter-spacing:2px;
  text-transform:uppercase;
}
.setup-row select,.setup-row button{
  width:100%;padding:14px 18px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  color:var(--text);font-size:1rem;font-family:var(--font);
  cursor:pointer;transition:all .3s;outline:none;
}
.setup-row select:hover,.setup-row select:focus{
  border-color:var(--gold);background:rgba(255,215,0,.05);
  box-shadow:0 0 20px var(--gold-dim);
}
.setup-row select option{background:var(--bg-dark);color:var(--text);}
.btn-arena{
  background:linear-gradient(135deg,var(--gold),var(--orange))!important;
  border:none!important;color:var(--bg-dark)!important;font-weight:900!important;
  font-size:1.05rem!important;letter-spacing:3px;
  text-shadow:0 1px 4px rgba(255,255,255,.2);
  transition:all .3s!important;
}
.btn-arena:hover{
  transform:translateY(-2px) scale(1.02);
  box-shadow:0 0 40px var(--gold-dim),0 0 60px rgba(255,136,0,.15)!important;
}
.btn-arena:disabled{opacity:.3;cursor:not-allowed;transform:none!important;box-shadow:none!important;}

/* ═══════════════════════════════════════
   5. 点名 — 竞技轮盘
   ═══════════════════════════════════════ */
.pick-section{text-align:center;min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pick-arena-area{
  position:relative;width:100%;max-width:500px;
  min-height:160px;display:flex;align-items:center;justify-content:center;
  margin:8px 0;
}
.pick-arena-ring{
  position:absolute;width:200px;height:200px;border-radius:50%;
  border:3px dashed rgba(255,215,0,.1);
  animation:arena-spin 3s linear infinite;
}
.pick-arena-ring:nth-child(2){width:160px;height:160px;border-color:rgba(255,51,85,.15);animation-direction:reverse;animation-duration:4s;}
.pick-arena-ring:nth-child(3){width:240px;height:240px;border-color:rgba(0,240,255,.08);animation-duration:5s;border-style:dotted;}
@keyframes arena-spin{to{transform:rotate(360deg)}}
.pick-arena-name{
  font-size:3.2rem;font-weight:900;z-index:2;
  min-width:180px;text-align:center;letter-spacing:4px;
  text-shadow:0 0 30px var(--gold-dim),0 0 60px rgba(255,136,0,.15);
  transition:all .15s;
}
.pick-arena-name.rolling{animation:arena-flash .1s infinite;}
@keyframes arena-flash{0%,100%{opacity:1;filter:brightness(1)}50%{opacity:.3;filter:brightness(1.5)}}
.pick-arena-name.result{
  animation:arena-reveal .6s cubic-bezier(.34,1.56,.64,1);
  background:linear-gradient(135deg,var(--gold),#fff,var(--orange));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  font-size:3.8rem;
}
@keyframes arena-reveal{
  0%{transform:scale(.3) rotateZ(180deg);opacity:0;filter:blur(20px)}
  60%{transform:scale(1.15) rotateZ(-5deg)}
  100%{transform:scale(1) rotateZ(0);opacity:1;filter:blur(0)}
}
.pick-hint{color:var(--text-dim);font-size:.85rem;margin-top:4px;letter-spacing:1px;}
.pick-class-tag{
  display:inline-block;padding:3px 18px;border-radius:4px;
  background:rgba(255,215,0,.08);border:1px solid var(--border-glow);
  color:var(--gold);font-size:.75rem;font-weight:700;margin-top:6px;letter-spacing:2px;
}
.btn-arena-pick{
  margin-top:16px;padding:14px 48px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--gold),var(--orange));
  border:none;color:var(--bg-dark);font-size:1rem;font-weight:900;
  cursor:pointer;letter-spacing:2px;transition:all .3s;
}
.btn-arena-pick:hover{transform:translateY(-2px);box-shadow:0 0 30px var(--gold-dim);}
.btn-arena-pick:disabled{opacity:.3;cursor:not-allowed;transform:none;}

/* ═══════════════════════════════════════
   6. 答题 — 竞技场风格
   ═══════════════════════════════════════ */
.quiz-section{text-align:center;}
.q-number{
  display:inline-block;padding:3px 14px;border-radius:4px;
  background:rgba(255,51,85,.1);border:1px solid rgba(255,51,85,.2);
  color:var(--red);font-size:.75rem;font-weight:700;letter-spacing:1px;
  margin-bottom:8px;
}
.q-principle{
  display:inline-block;padding:3px 14px;border-radius:4px;
  background:var(--cyan-dim);border:1px solid rgba(0,240,255,.2);
  color:var(--cyan);font-size:.7rem;margin-left:8px;letter-spacing:1px;
}
.q-text{
  font-size:1.1rem;line-height:1.7;margin:10px 0 18px;
  text-align:left;padding:16px 20px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.03);
  border-left:3px solid var(--gold);
  color:var(--text);
}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.option-btn{
  padding:14px 16px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  color:var(--text);font-size:.92rem;text-align:left;cursor:pointer;
  transition:all .25s;font-family:var(--font);line-height:1.5;
  display:flex;align-items:flex-start;gap:10px;
  position:relative;overflow:hidden;
}
.option-btn::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,215,0,.03),transparent);
  transition:left .4s;
}
.option-btn:hover::before{left:100%;}
.option-btn .opt-label{
  display:inline-flex;width:28px;height:28px;
  background:rgba(255,215,0,.08);
  align-items:center;justify-content:center;
  font-weight:900;font-size:.8rem;flex-shrink:0;
  color:var(--gold);border:1px solid rgba(255,215,0,.2);
  transition:all .3s;
}
.option-btn:hover{
  background:rgba(255,255,255,.06);
  border-color:var(--gold);
  transform:translateX(4px);
}
.option-btn.selected{
  border-color:var(--gold);background:var(--gold-dim);
  box-shadow:0 0 15px var(--gold-dim);
}
.option-btn.selected .opt-label{background:var(--gold);color:var(--bg-dark);}
.option-btn.correct{
  border-color:var(--green)!important;
  background:var(--green-dim)!important;
  box-shadow:0 0 20px rgba(0,255,136,.2)!important;
}
.option-btn.correct .opt-label{background:var(--green);color:var(--bg-dark);border-color:var(--green);}
.option-btn.wrong{
  border-color:var(--red)!important;
  background:var(--red-dim)!important;
  box-shadow:0 0 20px rgba(255,51,85,.2)!important;
  animation:arena-shake .45s;
}
.option-btn.wrong .opt-label{background:var(--red);color:#fff;border-color:var(--red);}
.option-btn.disabled{pointer-events:none;opacity:.5;}
@keyframes arena-shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(6px)}
}
.feedback-box{
  margin-top:14px;padding:12px 20px;border-radius:var(--radius-sm);
  font-weight:700;font-size:.95rem;animation:arena-fade .35s;
}
@keyframes arena-fade{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.feedback-box.correct-fb{background:var(--green-dim);border:1px solid rgba(0,255,136,.25);color:var(--green);}
.feedback-box.wrong-fb{background:var(--red-dim);border:1px solid rgba(255,51,85,.25);color:var(--red);}
.btn-arena-next{
  margin-top:14px;padding:12px 36px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--gold),var(--orange));
  border:none;color:var(--bg-dark);font-size:1rem;font-weight:900;
  cursor:pointer;letter-spacing:2px;transition:all .3s;
}
.btn-arena-next:hover{transform:translateY(-2px);box-shadow:0 0 25px var(--gold-dim);}

/* ═══════════════════════════════════════
   7. 计分 — 竞技结算
   ═══════════════════════════════════════ */
.score-section{text-align:center;}
.score-big{
  font-size:5rem;font-weight:900;
  background:linear-gradient(135deg,var(--gold),var(--orange));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  animation:arena-score .8s cubic-bezier(.34,1.56,.64,1);
  margin:8px 0;
  text-shadow:0 0 40px var(--gold-dim);
}
@keyframes arena-score{
  0%{transform:scale(0) rotate(-30deg);opacity:0}
  60%{transform:scale(1.4) rotate(5deg)}
  100%{transform:scale(1) rotate(0);opacity:1}
}
.score-label{color:var(--text-dim);font-size:.85rem;letter-spacing:2px;text-transform:uppercase;}
.score-detail{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:12px 0;}
.score-stat{
  padding:8px 18px;border-radius:4px;
  background:rgba(255,255,255,.03);border:1px solid var(--border);
  color:var(--text-dim);font-size:.82rem;
}
.score-stat strong{color:var(--gold);font-size:1.1rem;}

/* 经验条 */
.exp-bar-wrap{width:100%;max-width:480px;margin:10px auto;}
.exp-bar-bg{
  width:100%;height:20px;border-radius:4px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  overflow:hidden;position:relative;
}
.exp-bar-fill{
  height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--gold),var(--orange),var(--red));
  transition:width 1s cubic-bezier(.34,1.56,.64,1);
  position:relative;
  box-shadow:0 0 20px var(--gold-dim);
}
.exp-bar-fill::after{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
  animation:exp-shine 1.5s ease-in-out infinite;
}
@keyframes exp-shine{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
.exp-label{
  display:flex;justify-content:space-between;
  font-size:.75rem;color:var(--text-dim);margin-top:3px;letter-spacing:1px;
}

/* ═══════════════════════════════════════
   8. 最终 — 领奖台
   ═══════════════════════════════════════ */
.final-section{text-align:center;}
.final-title{
  font-size:1.8rem;font-weight:900;margin-bottom:4px;
  background:linear-gradient(135deg,var(--gold),var(--orange),var(--red));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.final-sub{color:var(--text-dim);margin-bottom:18px;letter-spacing:1px;}
.final-table{width:100%;border-collapse:collapse;margin:8px 0 18px;}
.final-table th{
  padding:10px 12px;text-align:left;font-size:.78rem;
  color:var(--gold);border-bottom:1px solid rgba(255,215,0,.15);
  font-weight:700;letter-spacing:2px;text-transform:uppercase;
}
.final-table td{
  padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04);
  font-size:.88rem;
}
.final-table tr:hover td{background:rgba(255,215,0,.03);}
.final-table .rank-num{color:var(--gold);font-weight:900;font-size:1.05rem;}
.final-table .rank-score{color:var(--orange);font-weight:800;}

/* ═══════════════════════════════════════
   9. 通用
   ═══════════════════════════════════════ */
.hidden{display:none!important;}

.toast-container{
  position:fixed;top:20px;right:20px;z-index:1000;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  padding:12px 22px;border-radius:var(--radius-sm);
  background:rgba(26,26,48,.95);
  backdrop-filter:blur(16px);
  border:1px solid var(--border);
  font-weight:700;font-size:.88rem;color:var(--text);
  animation:toast-arena .4s cubic-bezier(.34,1.56,.64,1) forwards;
  display:flex;align-items:center;gap:10px;
  letter-spacing:1px;
}
.toast .toast-icon{font-size:1.2rem;}
.toast .toast-score{color:var(--gold);font-weight:900;font-size:1rem;}
.toast.out{animation:toast-out-a .3s ease-in forwards;}
@keyframes toast-arena{from{transform:translateX(120%) scale(.8);opacity:0}to{transform:translateX(0) scale(1);opacity:1}}
@keyframes toast-out-a{from{opacity:1}to{transform:translateX(120%);opacity:0}}

.particle-container{position:fixed;inset:0;pointer-events:none;z-index:999;}
.cele-particle{
  position:fixed;border-radius:50%;pointer-events:none;
  animation:particle-arena 1.2s cubic-bezier(.25,.46,.45,.94) forwards;
}
@keyframes particle-arena{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}
}

@media(max-width:640px){
  #app{padding:14px 10px 30px;}
  .arena-card{padding:20px 14px;}
  .arena-header h1{font-size:.85rem;}
  .pick-arena-name{font-size:2.6rem;}
  .pick-arena-name.result{font-size:3rem;}
  .pick-arena-ring{width:170px;height:170px;}
  .pick-arena-ring:nth-child(2){width:140px;height:140px;}
  .pick-arena-ring:nth-child(3){width:200px;height:200px;}
  .options-grid{grid-template-columns:1fr;}
  .q-text{font-size:.98rem;}
  .score-big{font-size:3.5rem;}
  .final-title{font-size:1.3rem;}
}

/* 错题解析 */
.review-section{text-align:left;margin-top:10px;border-top:1px solid rgba(255,255,255,.12);padding-top:14px;max-height:400px;overflow-y:auto}
.rev-empty{text-align:center;color:#4ecdc4;font-family:var(--font-mono);font-size:.75rem;padding:20px 0}
.rev-student{font-family:var(--font-mono);font-size:.85rem;font-weight:600;color:#d4a843;margin:10px 0 6px;padding-bottom:4px;border-bottom:1px dashed rgba(255,255,255,.1)}
.rev-item{padding:10px 12px;margin-bottom:8px;background:rgba(0,0,0,.15);border-left:3px solid #ff6b6b;border-radius:0 4px 4px 0}
.rev-q{font-size:.88rem;line-height:1.5;margin-bottom:6px}
.rev-princ{display:inline-block;font-family:var(--font-mono);font-size:.75rem;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1);padding:1px 6px;margin-bottom:6px}
.rev-opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.rev-opt{padding:6px 8px;font-size:.78rem;line-height:1.4;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.08);border-radius:2px;display:flex;align-items:flex-start;gap:6px;color:inherit}
.rev-opt .rev-opt-label{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.8rem;font-weight:700;flex-shrink:0;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.4)}
.rev-opt.rev-chosen{background:rgba(255,107,107,.1);border-color:#ff6b6b}
.rev-opt.rev-chosen .rev-opt-label{background:#ff6b6b;color:#fff;border-color:#ff6b6b}
.rev-opt.rev-right{background:rgba(78,205,196,.1);border-color:#4ecdc4}
.rev-opt.rev-right .rev-opt-label{background:#4ecdc4;color:#1a1a2e;border-color:#4ecdc4}


.gear-icon{display:none}/* hidden */
</style>
</head>
<body>

<!-- Toast & 粒子 -->
<div class="toast-container" id="toastContainer"></div>
<div class="particle-container" id="particleContainer"></div>

<div id="app">

  <!-- 竞技场头部 -->
  <header class="arena-header">
    <h1>🎮 知识竞技场 · 技术试验</h1>
    <div class="hp-bar" id="hpBar"></div>
  </header>

  <!-- 场景0: 设置 -->
  <div class="arena-card" id="sceneSetup">
    <div class="scene-title">⚔️ 选择战场</div>
    <div class="setup-group">
      <div class="setup-row">
        <label>🌍 年级</label>
        <select id="gradeSelect"><option value="高一">高一年级</option><option value="高二">高二年级</option></select>
      </div>
      <div class="setup-row">
        <label>🏫 班级</label>
        <select id="classSelect" disabled><option value="">-- 请选择 --</option></select>
      </div>
      <div class="setup-row" style="margin-top:6px">
        <button class="btn-arena" id="btnStart" disabled>⚔️ 进入竞技场</button>
      </div>
    </div>
  </div>

  <!-- 场景1: 点名 -->
  <div class="arena-card hidden" id="scenePick">
    <div class="scene-title" id="pickTitle">🎲 第 1 组 · 英雄抽选</div>
    <div class="pick-section">
      <div class="pick-hint" id="pickHint">转动命运轮盘...</div>
      <div class="pick-arena-area">
        <div class="pick-arena-ring"></div>
        <div class="pick-arena-ring"></div>
        <div class="pick-arena-ring"></div>
        <div class="pick-arena-name" id="pickName">✨</div>
      </div>
      <div class="pick-class-tag hidden" id="pickClassTag"></div>
      <button class="btn-arena-pick hidden" id="btnPickStart">🎰 抽选英雄</button>
      <button class="btn-arena-pick hidden" id="btnPickConfirm" style="background:linear-gradient(135deg,var(--green),var(--cyan));color:var(--bg-dark)">✅ 出战！</button>
    <button class="btn-arena-pick hidden" id="btnRepick" style="background:linear-gradient(135deg,var(--green),var(--cyan));color:var(--bg-dark)">↻ 重抽</button>
    </div>
  </div>

  <!-- 场景2: 答题 -->
  <div class="arena-card hidden" id="sceneQuiz">
    <div class="scene-title" id="quizTitle">⚡ 第 1 组 · 知识对决</div>
    <div class="quiz-section">
      <div>
        <span class="q-number" id="qNumber">ROUND 1/2</span>
        <span class="q-principle" id="qPrinciple">试验方法</span>
      </div>
      <div class="q-text" id="qText">加载中...</div>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="feedback-box hidden" id="feedbackBox"></div>
      <button class="btn-arena-next hidden" id="btnNextQ">➡️ 下一回合</button>
    </div>
  </div>

  <!-- 场景3: 计分 -->
  <div class="arena-card hidden" id="sceneScore">
    <div class="scene-title">🏆 战斗结算</div>
    <div class="score-section">
      <div class="score-label">🎖️ 出战英雄</div>
      <div style="font-size:1.4rem;font-weight:800;color:var(--gold);margin:4px 0 10px" id="scoreStudent"></div>
      <div class="score-big" id="scorePoints">+10</div>
      <div class="score-label" id="scoreLabel">答对 1 题 · 获得经验</div>
      <div class="score-detail" id="scoreDetail"></div>
      <div class="exp-bar-wrap">
        <div class="exp-bar-bg">
          <div class="exp-bar-fill" id="energyBar" style="width:0%"></div>
        </div>
        <div class="exp-label"><span>⚡ 经验值</span><span id="energyText">0%</span></div>
      </div>
      <button class="btn-arena-next" id="btnNextRound">⚔️ 下一轮战斗</button>
    </div>
  </div>

  <!-- 场景4: 最终 -->
  <div class="arena-card hidden" id="sceneFinal">
    <div class="scene-title final-title">🏆 竞技场霸主</div>
    <div class="final-sub">所有战斗结束！积分排行榜</div>
    <div style="overflow-x:auto">
      <table class="final-table">
        <thead><tr><th>#</th><th>英雄</th><th>班级</th><th>胜场</th><th>经验</th></tr></thead>
        <tbody id="finalBody"></tbody>
      </table>
    </div>
        <button class="rev-btn" id="btnReview" style="padding:10px 36px;font-size:.8rem;margin-top:6px;cursor:pointer;border:2px solid #5bc0eb;background:transparent;color:#5bc0eb;font-family:var(--font-mono);border-radius:6px">📋 查看错题解析</button>
    <div class="review-section hidden" id="reviewSection"></div>
<button class="btn-arena" style="padding:12px 44px;font-size:.95rem;cursor:pointer;border:none;border-radius:var(--radius-sm);letter-spacing:2px;" onclick="location.reload()">🔄 再战一次</button>
  </div>
</div>

<script>

// 从 URL 路径自动提取教师用户名
const pathMatch = window.location.pathname.match(/\/api\/files\/([^\/]+)\/html\//);
const TEACHER = (pathMatch ? pathMatch[1] : '') || '';
// ═══════════════════════════════════════
// 题库：技术试验及其方法 10 道
// ═══════════════════════════════════════
const QUESTION_BANK = [
  {question:"技术试验在技术设计过程中具有重要作用，其主要意义不包括以下哪一项？",options:{A:"发现问题，探究规律，优化技术",B:"改进和完善设计，将设计的风险和失误概率降到最低",C:"直接替代设计过程中的所有理论计算",D:"为设计的可靠性和安全性提供数据支持"},answer:"C",principle:"试验意义"},
  {question:"根据试验目的分类，测试某种新型材料在高温环境下的抗拉强度，属于哪一种技术试验？",options:{A:"优化试验",B:"性能试验",C:"预测试验",D:"农业试验"},answer:"B",principle:"试验分类"},
  {question:"袁隆平院士运用数理统计方法，对大量水稻品种进行筛选和对比，最终培育出高产优质的杂交水稻。这种技术试验方法属于",options:{A:"强化试验法",B:"模拟试验法",C:"优选试验法",D:"移植试验法"},answer:"C",principle:"试验方法"},
  {question:"某汽车公司为了测试新款车型的安全性能，在实验室中利用计算机模拟车辆在不同速度下正面碰撞的变形过程。该试验方法属于",options:{A:"虚拟试验法",B:"模拟试验法",C:"强化试验法",D:"移植试验法"},answer:"A",principle:"试验方法"},
  {question:"为了快速检测安全帽的极限抗冲击能力，技术人员使用标准质量的铁锤从远超正常使用高度的地方落下，反复冲击安全帽直至其破裂。这种试验方法属于",options:{A:"优选试验法",B:"模拟试验法",C:"虚拟试验法",D:"强化试验法"},answer:"D",principle:"试验方法"},
  {question:"在疫苗研发过程中，科学家先将临床前疫苗注射到小白鼠身上进行安全性测试。这种试验方法属于",options:{A:"模拟试验法",B:"优选试验法",C:"移植试验法",D:"虚拟试验法"},answer:"C",principle:"试验方法"},
  {question:"技术人员将新设计的桥梁模型放入风洞中，模拟不同强度的风力对桥梁稳定性的影响。这种试验方法属于",options:{A:"强化试验法",B:"模拟试验法",C:"虚拟试验法",D:"优选试验法"},answer:"B",principle:"试验方法"},
  {question:"关于技术试验的实施步骤，下列排序正确的是①进行试验②分析数据③制订试验方案④记录数据⑤得出结论⑥抽取样本",options:{A:"③→⑥→①→④→②→⑤",B:"③→①→⑥→④→②→⑤",C:"⑥→③→①→④→②→⑤",D:"③→⑥→①→②→④→⑤"},answer:"A",principle:"试验步骤"},
  {question:"下列选项中，属于技术试验报告基本内容的是",options:{A:"产品广告词",B:"试验目的和试验步骤",C:"产品价格对比",D:"设计师的个人简介"},answer:"B",principle:"试验报告"},
  {question:"神舟一号至四号飞船的发射，为后来的载人航天（神五、神六）开展了一系列技术试验。这说明技术试验",options:{A:"可以完全替代理论研究",B:"是技术研究不可或缺的基本方法和手段",C:"只适用于航天领域",D:"结果一定是成功的"},answer:"B",principle:"试验意义"}
];
const GROUPS=[];
for(let i=0;i<5;i++) GROUPS.push(QUESTION_BANK.slice(i*2,i*2+2));

// ═══════════════════════════════════════
// 状态
// ═══════════════════════════════════════
let state={grade:'高一',class:'',students:[],available:[],picks:[],currentRound:0,currentQ:0,selectedAnswer:'',answered:false,roundResults:[],totalScore:0};
let _correctCounter=0;

function $(id){return document.getElementById(id);}
function show(id){$(id).classList.remove('hidden');}
function hide(id){$(id).classList.add('hidden');}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function showToast(icon,msg,score=''){
  const tc=$('toastContainer');
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<span class="toast-icon">${icon}</span>${msg}${score?` <span class="toast-score">${score}</span>`:''}`;
  tc.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),350);},3000);
}
function fireParticles(x,y,color,count=40){
  const pc=$('particleContainer');
  for(let i=0;i<count;i++){
    const el=document.createElement('div');el.className='cele-particle';
    const a=Math.random()*Math.PI*2,d=80+Math.random()*160;
    el.style.cssText=`left:${x||innerWidth/2}px;top:${y||innerHeight/2}px;width:${4+Math.random()*8}px;height:${4+Math.random()*8}px;background:${color||'var(--gold)'};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;animation-duration:${.8+Math.random()*.6}s`;
    pc.appendChild(el);
    setTimeout(()=>el.remove(),1500);
  }
}
function updateHP(){
  const h=$('hpBar');h.innerHTML='';
  for(let i=0;i<5;i++){
    const d=document.createElement('div');d.className='hp-seg'+(i<state.currentRound?' done':i===state.currentRound?' active':' future');
    d.title=`第${i+1}组`;h.appendChild(d);
  }
}
function saveRecord(g,c,s,cc,t,pts,ans,title){fetch('/api/rollcall/save-record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,student:s,type:'互动答题',teacher:TEACHER,title:title||'',correctCount:cc,totalQuestions:t,points:pts,answers:ans||[]})}).catch(()=>{})}
function saveScore(grade,cls,name,points){
  fetch('/api/scores/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade,class:cls,name,points})})
    .then(r=>r.ok?showToast('💰','经验已存入','+'+points):showToast('⚠️','存储异常')).then(()=>{fetch('/api/rollcall/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:state.grade,class:state.class,student:name,result:'quiz'})}).catch(()=>{});const cr=state.roundResults[state.currentRound];if(cr)saveRecord(state.grade,state.class,name,cr.correctCount||0,2,cr.points||5,cr.answers,'技术试验及其方法-竞技场');})
    .catch(()=>{console.log(`[分数] ${grade}|${cls}|${name} +${points}`);showToast('📝','本地模式');});
}

// ═══════════════════════════════════════
// 数据加载
// ═══════════════════════════════════════
async function loadClasses(){
  const gRaw=$('gradeSelect').value;const g=gRaw.replace('年级','');state.grade=g;
  const cs=$('classSelect');cs.disabled=true;cs.innerHTML='<option value="">加载中...</option>';
  try{
    const r=await fetch('/api/rollcall/classes?grade='+encodeURIComponent(g)+'&teacher='+TEACHER);const data=await r.json();const cls=data;
    
    cs.innerHTML='<option value="">-- 请选择班级 --</option>';
    cls.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o);});
    cs.disabled=false;
  }catch(e){cs.innerHTML='<option value="">加载失败</option>';}
}
$('gradeSelect').addEventListener('change',loadClasses);
$('classSelect').addEventListener('change',async function(){
  const cls=this.value;state.class=cls;$('btnStart').disabled=!cls;
  if(cls){
    const resp=await fetch('/api/rollcall/students?grade='+encodeURIComponent(state.grade)+'&class='+encodeURIComponent(cls)+'&teacher='+TEACHER);
    state.students=await resp.json().then(d=>d.map(s=>s.name));
    ;
  }
});
$('btnStart').addEventListener('click',function(){
  if(!state.class||state.students.length<5){showToast('⚠️','学生不足5人');return;}
  state.available=shuffle(state.available);hide('sceneSetup');startRound(0);
});

// ═══════════════════════════════════════
// 游戏流程
// ═══════════════════════════════════════
function startRound(ri){state.currentRound=ri;state.currentQ=0;_correctCounter=0;if(!state.roundResults[ri])state.roundResults[ri]={correctCount:0,points:0,answers:[]};state.roundResults[ri].answers=[];updateHP();startPick();}
function startPick(){
  show('scenePick');hide('sceneQuiz');hide('sceneScore');hide('sceneFinal');
  $('pickTitle').textContent=`🎲 第 ${state.currentRound+1} 组 · 英雄抽选`;
  $('pickHint').textContent='转动命运轮盘...';$('pickHint').classList.remove('hidden');
  $('pickClassTag').classList.add('hidden');$('btnPickStart').classList.remove('hidden');$('btnPickConfirm').classList.add('hidden');
  $('pickName').textContent='✨';$('pickName').className='pick-arena-name';$('btnPickStart').disabled=false;$('btnPickStart').textContent='🎰 抽选英雄';
}
function rp(){const pool=state.students.length>0?state.students:['---'];const pn=$('pickName');pn.className='pick-arena-name rolling';$('pickHint').textContent='抽取中...';$('btnPickConfirm').classList.add('hidden');$('btnRepick').classList.add('hidden');$('btnPickStart').disabled=true;let rc=0,mx=18+Math.floor(Math.random()*10);let iv=setInterval(()=>{pn.textContent=pool[Math.floor(Math.random()*pool.length)];rc++;if(rc>=mx){clearInterval(iv);fetch('/api/rollcall/pick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:state.grade,class:state.class})}).then(d=>d.json()).then(d=>{if(d.error){showToast('⚠️',d.error);pn.textContent='——';pn.className='pick-arena-name';$('btnPickStart').disabled=false;return}const c=d.student;pn.textContent=c;pn.className='pick-arena-name result';$('pickHint').classList.add('hidden');$('pickClassTag').textContent=state.grade+' · '+state.class;$('pickClassTag').classList.remove('hidden');$('btnPickConfirm').classList.remove('hidden');$('btnRepick').classList.remove('hidden');fireParticles(innerWidth/2,innerHeight/2,'var(--gold)',60);showToast('🎯','已选',c);state.picks[state.currentRound]=c}).catch(()=>{showToast('⚠️','服务异常');pn.textContent='——';pn.className='pick-arena-name';$('btnPickStart').disabled=false})}},60+Math.random()*40)}
$('btnPickStart').addEventListener('click',function(){this.disabled=true;rp()});
$('btnRepick').addEventListener('click',rp);
$('btnPickConfirm').addEventListener('click',function(){hide('scenePick');startQuiz();});
function startQuiz(){show('sceneQuiz');state.currentQ=0;showQuestion();}
function showQuestion(){
  const g=GROUPS[state.currentRound],q=g[state.currentQ];
  $('quizTitle').textContent=`⚡ 第 ${state.currentRound+1} 组 · 知识对决`;
  $('qNumber').textContent=`ROUND ${state.currentQ+1}/2`;$('qPrinciple').textContent=q.principle;$('qText').textContent=q.question;
  state.selectedAnswer='';state.answered=false;$('feedbackBox').classList.add('hidden');$('btnNextQ').classList.add('hidden');
  const grid=$('optionsGrid');grid.innerHTML='';
  ['A','B','C','D'].forEach(l=>{
    const b=document.createElement('button');b.className='option-btn';
    b.innerHTML=`<span class="opt-label">${l}</span><span>${q.options[l]}</span>`;b.dataset.label=l;
    b.addEventListener('click',()=>handleAnswer(l));grid.appendChild(b);
  });
}
function handleAnswer(l){
  if(state.answered) return;state.answered=true;
  const g=GROUPS[state.currentRound],q=g[state.currentQ],correct=q.answer,isCorrect=l===correct;
  if(isCorrect) _correctCounter++;
  state.roundResults[state.currentRound].correctCount=_correctCounter;
  let pts=5;if(_correctCounter===1)pts=10;else if(_correctCounter===2)pts=15;
  state.roundResults[state.currentRound].answers.push({question:q.question,options:q.options,correctAnswer:q.answer,yourAnswer:l,principle:q.principle,isCorrect:l===q.answer});state.roundResults[state.currentRound].points=pts;
  const btns=$('optionsGrid').querySelectorAll('.option-btn');
  btns.forEach(b=>{b.classList.add('disabled');if(b.dataset.label===correct)b.classList.add('correct');if(b.dataset.label===l&&!isCorrect)b.classList.add('wrong');if(b.dataset.label===l&&isCorrect)b.classList.add('selected');});
  const fb=$('feedbackBox');fb.classList.remove('hidden');
  if(isCorrect){fb.className='feedback-box correct-fb';fb.textContent=`✅ 正确！「${correct}. ${q.options[correct]}」`;fireParticles(innerWidth/2,innerHeight-80,'var(--green)',20);}
  else{fb.className='feedback-box wrong-fb';fb.textContent=`❌ 错误！正确答案 ${correct}. ${q.options[correct]}`;}
  $('btnNextQ').classList.remove('hidden');$('btnNextQ').textContent=state.currentQ===0?'➡️ 下一回合':'📊 查看结算';
}
$('btnNextQ').addEventListener('click',function(){if(state.currentQ===0){state.currentQ=1;showQuestion();}else{hide('sceneQuiz');showScore();}});
function showScore(){
  show('sceneScore');const s=state.picks[state.currentRound];
  $('scoreStudent').textContent=`${s} · ${state.class}`;
  const cr=state.roundResults[state.currentRound],cc=cr?.correctCount||0,pts=cr?.points||5;
  $('scorePoints').textContent=`+${pts}`;$('scoreLabel').textContent=`答对 ${cc} 题 · 获得经验`;
  $('scoreDetail').innerHTML=`<div class="score-stat">✅ 胜 <strong>${cc}</strong> 场</div><div class="score-stat">❌ 败 <strong>${2-cc}</strong> 场</div><div class="score-stat">🏆 保底 <strong>5</strong> 经验</div>`;
  const p=cc===0?25:cc===1?60:100;setTimeout(()=>{$('energyBar').style.width=p+'%';$('energyText').textContent=p+'%';},100);
  saveScore(state.grade,state.class,s,pts);state.totalScore+=pts;
  fireParticles(innerWidth/2,innerHeight/2-100,'var(--gold)',40);
  $('btnNextRound').textContent=state.currentRound<4?'⚔️ 下一轮战斗':'🏁 查看霸主榜';
}
$('btnNextRound').addEventListener('click',function(){if(state.currentRound<4){hide('sceneScore');startRound(state.currentRound+1);}else{hide('sceneScore');showFinal();}});
function showFinal(){$('reviewSection').classList.add('hidden');$('btnReview').textContent='\U0001F4CB \u67e5\u770b\u9519\u9898\u89e3\u6790';
  show('sceneFinal');
  const tb=$('finalBody');tb.innerHTML='';
  const rows=state.picks.map((n,i)=>{const cr=state.roundResults[i];return{name:n,class:state.class,correct:cr?.correctCount||0,points:cr?.points||5};}).sort((a,b)=>b.points-a.points);
  rows.forEach((r,i)=>{const tr=document.createElement('tr');tr.innerHTML=`<td class="rank-num">#${i+1}</td><td>${r.name}</td><td>${r.class}</td><td>${r.correct}/2</td><td class="rank-score">+${r.points}</td>`;tb.appendChild(tr);});
  fireParticles(innerWidth/2,innerHeight/2,'var(--gold)',70);
  setTimeout(()=>fireParticles(innerWidth/3,innerHeight/3,'var(--orange)',40),400);
  setTimeout(()=>fireParticles(innerWidth*2/3,innerHeight/3,'var(--red)',40),800);
}
function buildReview(){const rs=$('reviewSection');rs.innerHTML='';let hw=false;const la=['A','B','C','D'];state.picks.forEach((n,ri)=>{const cr=state.roundResults[ri];if(!cr||!cr.answers)return;const w=cr.answers.filter(a=>!a.isCorrect);if(!w.length)return;hw=true;let h='<div class="rev-student">'+n+'</div>';w.forEach(a=>{h+='<div class="rev-item"><span class="rev-princ">'+a.principle+'</span><div class="rev-q">'+a.question+'</div><div class="rev-opt-grid">';la.forEach(l=>{let cls='rev-opt';if(l===a.yourAnswer)cls+=' rev-chosen';if(l===a.correctAnswer)cls+=' rev-right';h+='<div class="'+cls+'"><span class="rev-opt-label">'+l+'</span><span>'+a.options[l]+'</span></div>'});h+='</div></div>'});rs.innerHTML+=h});if(!hw)rs.innerHTML='<div class="rev-empty">\u2705 \u6240\u6709\u540c\u5b66\u5168\u90e8\u7b54\u5bf9\uff01</div>'}
$('btnReview').addEventListener('click',function(){const rs=$('reviewSection');if(!rs.classList.contains('hidden')){rs.classList.add('hidden');this.textContent='\U0001F4CB \u67e5\u770b\u9519\u9898\u89e3\u6790';return}this.textContent='\U0001F4CB \u6536\u8d77\u89e3\u6790';buildReview();rs.classList.remove('hidden')});
loadClasses();show('sceneSetup');updateHP();
</script>
</body>
</html>
