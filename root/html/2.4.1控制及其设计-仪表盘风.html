<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>控制及其设计 · 仪表盘风</title>
<style>

/* 仪表盘 Dashboard 风格 */
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--db-dark:#1a1a2e;--db-gray:#2a2a3e;--db-red:#e63946;--db-green:#2ec4b6;--db-yellow:#ffbe0b;--db-blue:#3a86ff;--db-orange:#fb5607;--db-bg:#12121e;--db-card:#1e1e32;--db-text:#e8e8f0;--db-text-dim:#6a6a8a;--db-line:rgba(255,255,255,.06);--font:'Space Grotesk','Segoe UI',sans-serif;--font-body:'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif}
html{font-size:20px}
body{font-family:var(--font-body);background:var(--db-bg);color:var(--db-text);min-height:100vh;overflow-x:hidden;display:flex;justify-content:center;position:relative}
#app{position:relative;z-index:1;width:100%;max-width:880px;min-height:100vh;padding:28px 18px 50px;display:flex;flex-direction:column;align-items:center;gap:14px}
.db-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--db-card);border:1px solid var(--db-line);border-radius:8px;position:relative}
.db-header h1{font-family:var(--font);font-size:.85rem;font-weight:700;color:var(--db-yellow);letter-spacing:2px}
.db-header h1 span{color:var(--db-blue)}
.db-blocks{display:flex;gap:4px}
.db-block{width:22px;height:22px;border:2px solid var(--db-line);border-radius:50%;background:transparent;transition:all .4s}
.db-block.done{background:var(--db-green);border-color:var(--db-green)}
.db-block.active{background:var(--db-yellow);border-color:var(--db-yellow);animation:db-pulse .8s ease infinite}
.db-block.future{border-color:var(--db-line)}
@keyframes db-pulse{0%,100%{box-shadow:0 0 4px var(--db-yellow)}50%{box-shadow:0 0 12px var(--db-yellow)}}
.db-card{width:100%;padding:26px 22px;background:var(--db-card);border:1px solid var(--db-line);border-radius:8px;position:relative}
.db-card::before{content:'';position:absolute;top:-1px;left:20px;right:20px;height:2px;background:linear-gradient(90deg,transparent,var(--db-yellow),var(--db-blue),transparent)}
.db-title{font-family:var(--font);font-size:.8rem;font-weight:700;text-align:center;margin-bottom:16px;color:var(--db-yellow);letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:8px}
.db-title .db-icon{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;background:var(--db-yellow);color:var(--db-dark);font-size:.7rem;border-radius:50%}
.setup-group{display:flex;flex-direction:column;gap:14px;max-width:380px;margin:0 auto}
.setup-row{display:flex;flex-direction:column;gap:4px}
.setup-row label{font-family:var(--font);font-size:.7rem;font-weight:600;color:var(--db-blue);letter-spacing:1px}
.setup-row select,.setup-row button{width:100%;padding:12px 16px;background:var(--db-gray);border:1px solid var(--db-line);color:var(--db-text);font-size:.9rem;font-family:var(--font-body);cursor:pointer;transition:all .2s;outline:none;border-radius:6px;font-weight:500}
.setup-row select:hover,.setup-row select:focus{border-color:var(--db-blue);background:rgba(58,134,255,.05)}
.setup-row select option{background:var(--db-card);color:var(--db-text)}
.btn-db{background:var(--db-blue)!important;border:none!important;color:#fff!important;font-size:.85rem!important;font-weight:700!important;letter-spacing:2px;border-radius:6px!important;transition:all .2s!important}
.btn-db:hover{background:var(--db-green)!important}
.btn-db:disabled{opacity:.15!important;cursor:not-allowed;transform:none!important}
.pick-section{text-align:center;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pick-db-area{width:100%;max-width:380px;min-height:100px;display:flex;align-items:center;justify-content:center;margin:4px 0;position:relative}
.pick-db-name{font-family:var(--font);font-size:3rem;font-weight:700;z-index:2;color:var(--db-text);letter-spacing:4px;transition:all .12s}
.pick-db-name.rolling{animation:db-roll .1s infinite}
@keyframes db-roll{0%,100%{transform:translateY(0)}25%{transform:translateY(-4px)}75%{transform:translateY(4px)}}
.pick-db-name.result{animation:db-pop .5s cubic-bezier(.34,1.56,.64,1);color:var(--db-yellow);text-shadow:0 0 20px rgba(255,190,11,.3)}
@keyframes db-pop{0%{opacity:0;transform:scale(.3)}50%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
.pick-hint{font-size:.78rem;color:var(--db-text-dim);margin-top:4px}
.pick-class-tag{font-size:.72rem;color:var(--db-orange);margin-top:2px;font-weight:500}
.btn-db-pick{margin-top:10px;padding:10px 40px;background:transparent;border:1px solid var(--db-yellow);color:var(--db-yellow);font-family:var(--font);font-size:.75rem;font-weight:700;cursor:pointer;letter-spacing:1px;border-radius:6px;transition:all .2s}
.btn-db-pick:hover{background:var(--db-yellow);color:var(--db-dark)}
.btn-db-pick:disabled{opacity:.15;cursor:not-allowed}
.quiz-section{text-align:center}
.q-db-num{font-family:var(--font);font-size:.85rem;font-weight:600;color:var(--db-blue);letter-spacing:1px}
.q-db-princ{font-size:.8rem;color:var(--db-green);margin-left:8px;font-weight:500}
.q-db-text{font-size:1rem;line-height:1.7;margin:10px 0 16px;text-align:left;padding:16px 18px;background:var(--db-gray);border-left:4px solid var(--db-yellow);color:var(--db-text);font-weight:400;border-radius:4px}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.option-btn{padding:13px 14px;background:var(--db-gray);border:1px solid transparent;color:var(--db-text);font-size:.9rem;text-align:left;cursor:pointer;transition:all .2s;font-family:var(--font-body);line-height:1.5;font-weight:400;display:flex;align-items:flex-start;gap:10px;border-radius:6px}
.option-btn .opt-label{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;font-family:var(--font);font-size:.7rem;font-weight:700;flex-shrink:0;background:rgba(0,0,0,.3);border:1px solid var(--db-line);border-radius:50%;color:var(--db-text-dim)}
.option-btn:hover{border-color:var(--db-blue);background:rgba(58,134,255,.05)}
.option-btn.selected{border-color:var(--db-blue);background:rgba(58,134,255,.08)}
.option-btn.selected .opt-label{background:var(--db-blue);color:#fff;border-color:var(--db-blue)}
.option-btn.correct{border-color:var(--db-green)!important;background:rgba(46,196,182,.05)!important}
.option-btn.correct .opt-label{background:var(--db-green)!important;color:var(--db-dark)!important;border-color:var(--db-green)!important}
.option-btn.wrong{border-color:var(--db-red)!important;background:rgba(230,57,70,.05)!important}
.option-btn.wrong .opt-label{background:var(--db-red)!important;color:#fff!important;border-color:var(--db-red)!important}
.option-btn.disabled{pointer-events:none;opacity:.25}
.feedback-box{margin-top:12px;padding:10px 16px;font-size:.88rem;animation:db-fade .3s;border-radius:6px;font-weight:500}
@keyframes db-fade{from{opacity:0}to{opacity:1}}
.feedback-box.correct-fb{background:rgba(46,196,182,.06);color:var(--db-green);border-left:4px solid var(--db-green)}
.feedback-box.wrong-fb{background:rgba(230,57,70,.04);color:var(--db-red);border-left:4px solid var(--db-red)}
.btn-db-next{margin-top:12px;padding:10px 36px;background:transparent;border:1px solid var(--db-green);color:var(--db-green);font-family:var(--font);font-size:.75rem;font-weight:700;cursor:pointer;letter-spacing:1px;border-radius:6px;transition:all .2s}
.btn-db-next:hover{background:var(--db-green);color:var(--db-dark)}
.score-section{text-align:center}
.score-big{font-family:var(--font);font-size:3.8rem;font-weight:700;color:var(--db-yellow);text-shadow:0 0 20px rgba(255,190,11,.3);animation:db-score .6s cubic-bezier(.34,1.56,.64,1);margin:4px 0}
@keyframes db-score{0%{opacity:0;transform:rotate(-15deg) scale(.5)}100%{opacity:1;transform:rotate(0) scale(1)}}
.score-label{font-family:var(--font);font-size:.7rem;font-weight:600;color:var(--db-text-dim);letter-spacing:1px}
.score-detail{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.score-stat{padding:6px 14px;background:var(--db-gray);border-radius:6px;font-size:.82rem;font-weight:500}
.score-stat strong{color:var(--db-yellow);font-weight:700;font-size:.95rem}
.db-bar-wrap{width:100%;max-width:400px;margin:8px auto}
.db-bar-bg{width:100%;height:10px;background:var(--db-gray);border-radius:5px;overflow:hidden}
.db-bar-fill{height:100%;background:linear-gradient(90deg,var(--db-yellow),var(--db-orange));border-radius:5px;transition:width 1s cubic-bezier(.34,1.56,.64,1)}
.db-bar-label{display:flex;justify-content:space-between;font-size:.7rem;color:var(--db-text-dim);margin-top:2px;font-weight:500}
.final-section{text-align:center}
.final-title{font-family:var(--font);font-size:1rem;font-weight:700;color:var(--db-yellow);margin-bottom:2px;letter-spacing:2px}
.final-sub{color:var(--db-text-dim);margin-bottom:14px;font-size:.78rem;font-weight:500}
.final-table{width:100%;border-collapse:separate;border-spacing:0 4px;margin:4px 0 16px}
.final-table th{padding:10px 12px;text-align:left;font-family:var(--font);font-size:.85rem;font-weight:700;color:var(--db-blue);border-bottom:2px solid var(--db-line);letter-spacing:1px}
.final-table td{padding:10px 12px;font-size:.85rem;font-weight:500;background:var(--db-gray);border-radius:6px}
.final-table tr:first-child td{background:rgba(255,190,11,.08);font-weight:700}
.final-table .rank-num{font-family:var(--font);font-weight:700;color:var(--db-orange)}
.final-table .rank-score{font-family:var(--font);font-weight:700;color:var(--db-yellow)}
.hidden{display:none!important}
.toast-container{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{padding:10px 18px;background:var(--db-card);border:1px solid var(--db-line);border-radius:6px;font-family:var(--font);font-size:.7rem;font-weight:600;color:var(--db-text);animation:db-toast .3s forwards;display:flex;align-items:center;gap:8px}
.toast .toast-icon{font-size:.9rem}
.toast .toast-score{color:var(--db-yellow)}
.toast.out{animation:db-toast-out .25s forwards}
@keyframes db-toast{from{transform:translateX(50px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes db-toast-out{from{opacity:1}to{transform:translateX(50px);opacity:0}}
.particle-container{position:fixed;inset:0;pointer-events:none;z-index:999}
.cele-particle{position:fixed;pointer-events:none;animation:db-part .9s ease-out forwards;border-radius:50%}
@keyframes db-part{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg)}}
@media(max-width:640px){.db-header h1{font-size:.7rem}.pick-db-name{font-size:2.4rem}.pick-db-name.result{font-size:2.6rem}.options-grid{grid-template-columns:1fr}.q-db-text{font-size:.9rem}.score-big{font-size:2.6rem}}
.review-section{text-align:left;margin-top:10px;border-top:1px solid var(--db-line);padding-top:14px;max-height:400px;overflow-y:auto}
.rev-empty{text-align:center;color:var(--db-green);font-family:var(--font);font-size:.75rem;padding:20px 0}
.rev-student{font-family:var(--font);font-size:.85rem;font-weight:600;color:var(--db-orange);margin:10px 0 6px;padding-bottom:4px;border-bottom:1px dashed var(--db-line)}
.rev-item{padding:10px 12px;margin-bottom:8px;background:var(--db-gray);border-left:3px solid var(--db-red);border-radius:0 4px 4px 0}
.rev-q{font-size:.88rem;line-height:1.5;margin-bottom:6px}
.rev-princ{display:inline-block;font-family:var(--font);font-size:.75rem;color:var(--db-text-dim);border:1px solid var(--db-line);padding:2px 8px;margin-bottom:6px}
.rev-opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.rev-opt{padding:6px 8px;font-size:.78rem;line-height:1.4;border:1px solid var(--db-line);background:rgba(0,0,0,.1);border-radius:4px;display:flex;align-items:flex-start;gap:6px;color:inherit}
.rev-opt .rev-opt-label{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;font-family:var(--font);font-size:.8rem;font-weight:700;flex-shrink:0;border:1px solid var(--db-line);border-radius:50%;color:var(--db-text-dim)}
.rev-opt.rev-chosen{background:rgba(230,57,70,.1);border-color:var(--db-red)}
.rev-opt.rev-chosen .rev-opt-label{background:var(--db-red);color:#fff;border-color:var(--db-red)}
.rev-opt.rev-right{background:rgba(46,196,182,.1);border-color:var(--db-green)}
.rev-opt.rev-right .rev-opt-label{background:var(--db-green);color:var(--db-dark);border-color:var(--db-green)}


.bp-block{width:22px;}/* block alias */
.bp-block.done{}
.bp-block.active{}

.gear-icon{display:none}/* hidden */
</style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>
<div class="particle-container" id="particleContainer"></div>
<div id="app">
  <header class="db-header">
    <h1>控制及其设计 <span>· 仪表盘</span></h1>
    <div class="db-blocks" id="memBlocks"></div>
  </header>
  <div class="db-card" id="sceneSetup">
    <div class="db-title"><span class="db-icon">✦</span> 设置</div>
    <div class="setup-group">
      <div class="setup-row"><label>年级</label><select id="gradeSelect"><option value="高一">高一</option><option value="高二">高二</option></select></div>
      <div class="setup-row"><label>班级</label><select id="classSelect" disabled><option value="">—</option></select></div>
      <div class="setup-row" style="margin-top:6px"><button class="btn-PX" id="btnStart" disabled>开始</button></div>
    </div>
  </div>
  <div class="db-card hidden" id="scenePick">
    <div class="db-title"><span class="db-icon">🎯</span> <span id="pickTitle">控制 · 抽取</span></div>
    <div class="pick-section">
      <div class="pick-hint" id="pickHint">点击抽取</div>
      <div class="pick-db-area"><div class="pick-db-name" id="pickName">—</div></div>
      <div class="pick-class-tag hidden" id="pickClassTag"></div>
      <button class="btn-db-pick hidden" id="btnPickStart">🎛️ 抽取</button>
      <button class="btn-db-pick hidden" id="btnPickConfirm" style="background:var(--db-green);color:var(--db-dark);border-color:var(--db-green)">确认</button>
    <button class="btn-db-pick hidden" id="btnRepick" style="background:var(--db-green);color:var(--db-dark);border-color:var(--db-green)">↻ 重抽</button>
    </div>
  </div>
  <div class="db-card hidden" id="sceneQuiz">
    <div class="db-title"><span class="db-icon">⚙️</span> <span id="quizTitle">答题</span></div>
    <div class="quiz-section">
      <div><span class="q-db-num" id="qNumber">1/2</span><span class="q-db-princ" id="qPrinciple">原理</span></div>
      <div class="q-db-text" id="qText">—</div>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="feedback-box hidden" id="feedbackBox"></div>
      <button class="btn-db-next hidden" id="btnNextQ">下一题</button>
    </div>
  </div>
  <div class="db-card hidden" id="sceneScore">
    <div class="db-title"><span class="db-icon">📟</span> 结果</div>
    <div class="score-section">
      <div class="score-label">学生</div>
      <div style="font-size:1rem;font-weight:600;color:var(--db-pink);margin:3px 0 6px" id="scoreStudent"></div>
      <div class="score-big" id="scorePoints">+10</div>
      <div class="score-label" id="scoreLabel">正确 1 题</div>
      <div class="score-detail" id="scoreDetail"></div>
      <div class="db-bar-wrap"><div class="db-bar-bg"><div class="db-bar-fill" id="energyBar" style="width:0%"></div></div><div class="db-bar-label"><span>进度</span><span id="energyText">0%</span></div></div>
      <button class="btn-db-next" id="btnNextRound">下一组</button>
    </div>
  </div>
  <div class="db-card hidden" id="sceneFinal">
    <div class="db-title"><span class="db-icon">🎯</span> 完成</div>
    <div class="final-sub">积分排行榜</div>
    <div style="overflow-x:auto"><table class="final-table"><thead><tr><th>#</th><th>姓名</th><th>班级</th><th>正确</th><th>积分</th></tr></thead><tbody id="finalBody"></tbody></table></div>
        <button class="rev-btn" id="btnReview" style="padding:10px 36px;font-size:.8rem;margin-top:6px;cursor:pointer;border:2px solid #5bc0eb;background:transparent;color:#5bc0eb;font-family:var(--font-mono);border-radius:6px">📋 查看错题解析</button>
    <div class="review-section hidden" id="reviewSection"></div>
<button class="btn-PX" style="padding:10px 36px;font-size:.8rem;cursor:pointer;border:none;border-radius:6px;" onclick="location.reload()">再来一次</button>
  </div>
</div>
<script>// 从 URL 路径自动提取教师用户名
const pathMatch = window.location.pathname.match(/\/api\/files\/([^\/]+)\/html\//);
const TEACHER = (pathMatch ? pathMatch[1] : '') || '';
const Q=[{"question": "人们按照自己的意愿或目的，通过一定的手段，使事物向期望的目标发展，这就是控制。下列现象中，属于自动控制的是（ ）", "options": {"A": "骑自行车上学", "B": "用气筒给自行车轮胎充气", "C": "用ATM机取款", "D": "农用灌溉时手动抽水"}, "answer": "C", "principle": "自动控制是指控制过程无人直接参与。ATM机取款的过程由机器自动完成，无需人直接干预控制过程，属于自动控制。"}, {"question": "某交通路口的红绿灯以设定的时间交替切换，指挥车辆的运行。在该控制系统中，被控对象是（ ）", "options": {"A": "控制电路", "B": "红绿灯", "C": "路面车辆", "D": "开关装置"}, "answer": "B", "principle": "被控对象是控制系统中所要求控制的装置或生产过程。红绿灯控制系统要控制的是红绿灯的亮灭，因此被控对象是红绿灯。"}, {"question": "如图所示为一款数字扭矩扳手，可以预设扭力值。当施加扭矩达到预设扭力值时，控制电路控制电子开关闭合，发出声音和灯光提示。该报警控制系统的控制方式属于（ ）", "options": {"A": "开环控制", "B": "闭环控制", "C": "人工控制", "D": "液压控制"}, "answer": "A", "principle": "开环控制系统的输出量不对系统的控制产生任何影响。该扳手报警系统预设扭力值后，当施加扭矩达到预设值即触发报警，系统不会检测实际报警效果并反馈调整，因此属于开环控制。"}, {"question": "电冰箱工作时，温度设定在一定范围值。当箱内温度变化超过设定范围时，热敏电阻阻值变化，通过电路带动继电器控制压缩机启动，实现温度控制。在该温度控制系统中，温度的变化量属于（ ）", "options": {"A": "输入量", "B": "输出量", "C": "控制量", "D": "干扰量"}, "answer": "B", "principle": "输出量（被控量）是控制系统所要控制的量。在电冰箱温度控制系统中，被控制的量是冰箱内的实际温度，因此温度的变化量是输出量。"}, {"question": "在校园农业大棚中，利用温度传感器检测大棚内的温度，当温度低于设定值时，控制系统自动启动加热装置。这种控制方式属于（ ）", "options": {"A": "开环控制", "B": "闭环控制", "C": "手动控制", "D": "程序控制"}, "answer": "B", "principle": "闭环控制系统的输出量会返回到输入端并与设定值进行比较，根据偏差进行控制。该系统中温度传感器检测实际温度（反馈）并与设定值比较，控制加热装置启停，属于闭环控制。"}, {"question": "在控制系统中，除输入量之外，引起被控量变化的各种因素称为（ ）", "options": {"A": "反馈量", "B": "控制量", "C": "干扰量", "D": "输出量"}, "answer": "C", "principle": "干扰量是指在控制系统中，除输入量以外，引起被控量变化的各种因素。例如，在电冰箱温度控制系统中，开关冰箱门、环境温度变化等都属于干扰量。"}, {"question": "下列控制系统中，属于开环控制系统的是（ ）", "options": {"A": "自动恒温热水器", "B": "家用空调温度控制", "C": "自动门（感应到人开门）", "D": "电冰箱温度控制"}, "answer": "C", "principle": "自动门控制系统：当传感器检测到人靠近时，控制器发出信号驱动电机开门。系统不检测门是否已打开到位并反馈调整，属于开环控制。其他选项均包含反馈环节，属于闭环控制。"}, {"question": "闭环控制系统与开环控制系统相比，最显著的特点是（ ）", "options": {"A": "结构更简单", "B": "成本更低", "C": "具有反馈环节", "D": "不需要控制器"}, "answer": "C", "principle": "闭环控制系统最显著的特点是具有反馈环节，即系统的输出量会返回到输入端与输入量进行比较，根据偏差进行控制。开环控制系统没有反馈环节。"}, {"question": "在闭环控制系统中，反馈环节的作用是（ ）", "options": {"A": "将输入量放大", "B": "检测被控量并返回与给定量比较", "C": "直接控制执行器", "D": "消除干扰量"}, "answer": "B", "principle": "反馈环节的作用是检测被控量（输出量）的实际值，并将其返回到输入端与给定量（设定值）进行比较，产生偏差信号用于控制。"}, {"question": "下列不属于控制系统基本组成环节的是（ ）", "options": {"A": "控制器", "B": "执行器", "C": "被控对象", "D": "显示器"}, "answer": "D", "principle": "控制系统的基本组成环节包括：控制器（比较和计算偏差）、执行器（执行控制指令）、被控对象（被控制的装置或过程）。显示器不是控制系统的基本组成环节。"}];
const G=[];for(let i=0;i<1;i++)G.push(Q.slice(i*2,i*2+2));

let S={grade:'高一',class:'',students:[],available:[],picks:[],cr:0,cq:0,sa:'',ans:false,rr:[],total:0},_c=0;
function $(i){return document.getElementById(i)}
function sh(i){$(i).classList.remove('hidden')}
function hd(i){$(i).classList.add('hidden')}
function sf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}
function st(i,m,s){const t=document.createElement('div');t.className='toast';t.innerHTML='<span class="toast-icon">'+i+'</span>'+m+(s?' <span class="toast-pts">'+s+'</span>':'');$('toastContainer').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),250)},3000)}
function fp(x,y,c,cnt){const pc=$('particleContainer');for(let i=0;i<cnt;i++){const e=document.createElement('div');e.className='cele-particle';const a=Math.random()*Math.PI*2,d=60+Math.random()*130;e.style.cssText='left:'+(x||innerWidth/2)+'px;top:'+(y||innerHeight/2)+'px;width:'+(5+Math.random()*7)+'px;height:'+(5+Math.random()*7)+'px;background:'+(c||'var(--bp-cyan)')+';--dx:'+(Math.cos(a)*d)+'px;--dy:'+(Math.sin(a)*d)+'px';pc.appendChild(e);setTimeout(()=>e.remove(),1200)}}
function ud(){try{const h=$('bpBlocks')||$('memBlocks')||$('progressDots')||$('popDots');if(!h)return;h.innerHTML='';for(let i=0;i<5;i++){const e=document.createElement('div');e.className='bp-block'+(i<S.cr?' done':i===S.cr?' active':'');e.innerHTML='';h.appendChild(e)}}catch(e){}}
function sv(g,c,n,p){fetch('/api/scores/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,name:n,points:p,teacher:TEACHER})}).then(r=>r.ok?st('💰','保存','+'+p):st('⚠️','异常')).catch(()=>st('📝','本地'))}
function saveRecord(g,c,s,cc,t,pts,ans,title){fetch('/api/rollcall/save-record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,student:s,type:'互动答题',title:title||'',correctCount:cc,totalQuestions:t,points:pts,answers:ans||[],teacher:TEACHER})}).catch(()=>{})}
async function lc(){const g=$('gradeSelect').value;S.grade=g;const cs=$('classSelect');cs.disabled=true;cs.innerHTML='<option value="">...</option>';try{const r=await fetch('/api/rollcall/classes?grade='+encodeURIComponent(g)+'&teacher='+TEACHER);const cls=await r.json();cs.innerHTML='<option value="">— 选择 —</option>';cls.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o)});cs.disabled=false}catch(e){cs.innerHTML='<option value="">失败</option>'}}
$('gradeSelect').addEventListener('change',lc);$('classSelect').addEventListener('change',async function(){const c=this.value;S.class=c;$('btnStart').disabled=!c;if(c){try{const r=await fetch('/api/rollcall/students?grade='+encodeURIComponent(S.grade)+'&class='+encodeURIComponent(c)+'&teacher='+TEACHER);const data=await r.json();S.students=data.map(s=>s.name)}catch(e){S.students=[];st('⚠️','加载学生失败')}}});
$('btnStart').addEventListener('click',function(){if(!S.class||S.students.length<5){st('⚠️','人数不足');return}hd('sceneSetup');sr(0)});
function sr(ri){S.cr=ri;S.cq=0;_c=0;if(!S.rr[ri])S.rr[ri]={correctCount:0,points:0,answers:[]};S.rr[ri].answers=[];ud();sp()}
function sp(){sh('scenePick');hd('sceneQuiz');hd('sceneScore');hd('sceneFinal');$('pickTitle').textContent=(S.cr+1)+'/5';$('pickHint').textContent='点击抽取';$('pickHint').classList.remove('hidden');$('pickClassTag').classList.add('hidden');$('btnPickStart').classList.remove('hidden');$('btnPickConfirm').classList.add('hidden');$('btnRepick').classList.add('hidden');$('pickName').textContent='——';$('pickName').className='pick-name';$('btnPickStart').disabled=false;$('btnPickStart').textContent='🎲 抽取'}
function rp(){const pool=S.students.length>0?S.students:['---'];const pn=$('pickName');pn.className='pick-name rolling';$('pickHint').textContent='抽取中...';$('btnPickConfirm').classList.add('hidden');$('btnRepick').classList.add('hidden');$('btnPickStart').disabled=true;let rc=0,mx=18+Math.floor(Math.random()*10);let iv=setInterval(()=>{pn.textContent=pool[Math.floor(Math.random()*pool.length)];rc++;if(rc>=mx){clearInterval(iv);fetch('/api/rollcall/pick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,teacher:TEACHER})}).then(d=>d.json()).then(d=>{if(d.error){st('⚠️',d.error);pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false;return}const c=d.student;pn.textContent=c;pn.className='pick-name result';$('pickHint').classList.add('hidden');$('pickClassTag').textContent=S.grade+' · '+S.class;$('pickClassTag').classList.remove('hidden');$('btnPickConfirm').classList.remove('hidden');$('btnRepick').classList.remove('hidden');fp(innerWidth/2,innerHeight/2,'var(--bp-cyan)',30);st('🎯','已选',c);S.picks[S.cr]=c}).catch(()=>{st('⚠️','服务异常');pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false})}},60+Math.random()*40)}

$('btnPickStart').addEventListener('click',function(){this.disabled=true;rp()});
$('btnRepick').addEventListener('click',rp);

$('btnPickConfirm').addEventListener('click',function(){hd('scenePick');sq()});
function sq(){sh('sceneQuiz');S.cq=0;sQ()}
function sQ(){const g=G[S.cr],q=g[S.cq];$('quizTitle').textContent='第'+(S.cr+1)+'组';$('qNumber').textContent=(S.cq+1)+'/2';$('qPrinciple').textContent=q.principle;$('qText').textContent=q.question;S.sa='';S.ans=false;$('feedbackBox').classList.add('hidden');$('btnNextQ').classList.add('hidden');const grid=$('optionsGrid');grid.innerHTML='';['A','B','C','D'].forEach(l=>{const b=document.createElement('button');b.className='option-btn';b.innerHTML='<span class="opt-label">'+l+'</span><span>'+q.options[l]+'</span>';b.dataset.label=l;b.addEventListener('click',()=>hA(l));grid.appendChild(b)})}
function hA(l){if(S.ans)return;S.ans=true;const g=G[S.cr],q=g[S.cq],c=q.answer,ic=l===c;if(ic)_c++;S.rr[S.cr].correctCount=_c;let p=5;if(_c===1)p=10;else if(_c===2)p=15;S.rr[S.cr].points=p;S.rr[S.cr].answers.push({question:q.question,options:q.options,correctAnswer:c,yourAnswer:l,principle:q.principle,isCorrect:ic});const btns=$('optionsGrid').querySelectorAll('.option-btn');btns.forEach(b=>{b.classList.add('disabled');if(b.dataset.label===c)b.classList.add('correct');if(b.dataset.label===l&&!ic)b.classList.add('wrong');if(b.dataset.label===l&&ic)b.classList.add('selected')});const fb=$('feedbackBox');fb.classList.remove('hidden');if(ic){fb.className='feedback-box correct-fb';fb.textContent='✅ '+c+'. '+q.options[c];fp(innerWidth/2,innerHeight-80,'var(--bp-green)',12)}else{fb.className='feedback-box wrong-fb';fb.textContent='❌ 正确答案：'+c+'. '+q.options[c]}$('btnNextQ').classList.remove('hidden');$('btnNextQ').textContent=S.cq===0?'下一题 ▸':'结算'}
$('btnNextQ').addEventListener('click',function(){if(S.cq===0){S.cq=1;sQ()}else{hd('sceneQuiz');sSc()}});
function sSc(){sh('sceneScore');const s=S.picks[S.cr];$('scoreStudent').textContent=s+' · '+S.class;const cr=S.rr[S.cr],cc=cr?.correctCount||0,pts=cr?.points||5;$('scorePoints').textContent='+'+pts;$('scoreLabel').textContent='正确 '+cc+' 题';$('scoreDetail').innerHTML='<div class="score-stat">正确 <strong>'+cc+'</strong></div><div class="score-stat">错误 <strong>'+(2-cc)+'</strong></div><div class="score-stat">保底 <strong>5</strong></div>';sv(S.grade,S.class,s,pts);S.total+=pts;fetch('/api/rollcall/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,student:s,result:'quiz',teacher:TEACHER})}).catch(()=>{});saveRecord(S.grade,S.class,s,cc,2,pts,S.rr[S.cr]?.answers,'技术的发展-蓝图');fp(innerWidth/2,innerHeight/2-100,'var(--bp-gold)',25);$('btnNextRound').textContent=S.cr<4?'下一轮 ▸':'完成'}
$('btnNextRound').addEventListener('click',function(){if(S.cr<4){hd('sceneScore');sr(S.cr+1)}else{hd('sceneScore');sF()}});
function sF(){sh('sceneFinal');$('reviewSection').classList.add('hidden');$('btnReview').textContent='📋 查看错题解析';const tb=$('finalBody');tb.innerHTML='';const rows=S.picks.map((n,i)=>{const cr=S.rr[i];return{name:n,correct:cr?.correctCount||0,points:cr?.points||5}}).sort((a,b)=>b.points-a.points);rows.forEach((r,i)=>{const tr=document.createElement('tr');tr.innerHTML='<td class="rank-num">#'+(i+1)+'</td><td>'+r.name+'</td><td>'+r.correct+'/2</td><td class="rank-score">+'+r.points+'</td>';tb.appendChild(tr)});fp(innerWidth/2,innerHeight/2,'var(--bp-cyan)',50);setTimeout(()=>fp(innerWidth/2,innerHeight/2,'var(--bp-gold)',30),400)}
$('btnReview').addEventListener('click',function(){const rs=$('reviewSection');if(!rs.classList.contains('hidden')){rs.classList.add('hidden');this.textContent='📋 查看错题解析';return}this.textContent='📋 收起解析';buildReview();rs.classList.remove('hidden')});
function buildReview(){const rs=$('reviewSection');rs.innerHTML='';let hasWrong=false;const labels=['A','B','C','D'];S.picks.forEach((n,ri)=>{const cr=S.rr[ri];if(!cr||!cr.answers)return;const wrongs=cr.answers.filter(a=>!a.isCorrect);if(!wrongs.length)return;hasWrong=true;let h='<div class="rev-student">⚙ '+n+' · '+S.class+'</div>';wrongs.forEach(a=>{h+='<div class="rev-item"><span class="rev-princ">'+a.principle+'</span><div class="rev-q">'+a.question+'</div><div class="rev-opt-grid">';labels.forEach(l=>{let cls='rev-opt';if(l===a.yourAnswer)cls+=' rev-chosen';if(l===a.correctAnswer)cls+=' rev-right';h+='<div class="'+cls+'"><span class="rev-opt-label">'+l+'</span><span>'+a.options[l]+'</span></div>'});h+='</div></div>'});rs.innerHTML+=h});if(!hasWrong)rs.innerHTML='<div class="rev-empty">\u2705 \u6240\u6709\u540c\u5b66\u5168\u90e8\u7b54\u5bf9\uff01</div>'}
lc();sh('sceneSetup');ud();
</script>
</body>
</html>
