<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通用技术必修二·结构及其设计 课堂练习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .header p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }

        .info-bar {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .info-item {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .question-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        .question-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.2);
        }

        .question-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            gap: 12px;
        }

        .question-type {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .question-number {
            background: #f0f0f0;
            color: #333;
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 14px;
        }

        .question-text {
            font-size: 17px;
            color: #333;
            line-height: 1.7;
            margin-bottom: 20px;
            padding-left: 10px;
            border-left: 4px solid #667eea;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option:hover {
            background: #e8f4fd;
            border-color: #667eea;
            transform: translateX(5px);
        }

        .option input {
            margin-right: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .option label {
            flex: 1;
            cursor: pointer;
            font-size: 15px;
            color: #444;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .feedback {
            display: none;
            margin-top: 15px;
            padding: 18px;
            border-radius: 10px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .feedback.incorrect {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .feedback-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feedback-content {
            font-size: 15px;
            line-height: 1.6;
        }

        .knowledge-point {
            background: rgba(102, 126, 234, 0.1);
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
            color: #667eea;
        }

        .result-panel {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .result-title {
            font-size: 24px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .score-display {
            font-size: 48px;
            font-weight: bold;
            color: #764ba2;
            margin: 20px 0;
        }

        .score-detail {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .score-item {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            border-radius: 10px;
        }

        .score-item .number {
            font-size: 28px;
            font-weight: bold;
        }

        .score-item .label {
            font-size: 14px;
            opacity: 0.9;
        }

        .submit-all-btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 15px 50px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 20px 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }

        .submit-all-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(40, 167, 69, 0.6);
        }

        .reset-btn {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
            border: none;
            padding: 15px 50px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 20px 0 20px 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
        }

        .reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(220, 53, 69, 0.6);
        }

        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            height: 20px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 22px;
            }
            
            .info-bar {
                flex-direction: column;
                align-items: center;
            }
            
            .question-text {
                font-size: 15px;
            }
            
            .option {
                padding: 12px 15px;
            }
        }
    
.gear-icon{display:none}/* hidden */
</style>

<style id="gt-enhanced-style">
/* ===== 全局变量 ===== */
:root {
    --primary: #6366f1;
    --secondary: #06b6d4;
    --accent: #f59e0b;
    --success: #10b981;
    --warning: #ef4444;
    --gradient-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --card-bg: #ffffff;
    --text-primary: #1f2937;
    --text-secondary: #6b7280;
}

/* ===== 背景动画 ===== */
body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--gradient-bg);
    z-index: -2;
    opacity: 0.95;
}

.floating-shapes {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
}

.float-circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    animation: float-shape 25s infinite ease-in-out;
}

@keyframes float-shape {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    20% { transform: translate(50px, -60px) rotate(72deg); }
    40% { transform: translate(-40px, 40px) rotate(144deg); }
    60% { transform: translate(-50px, -50px) rotate(216deg); }
    80% { transform: translate(40px, 60px) rotate(288deg); }
}

.pulse-ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.1);
    animation: pulse-ring 8s infinite;
}

@keyframes pulse-ring {
    0% { transform: scale(0.8); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
}

/* ===== 头部区域 ===== */
.gt-header {
    text-align: center;
    color: white;
    padding: 60px 30px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    margin: 30px auto;
    max-width: 1200px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    animation: header-slide-down 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes header-slide-down {
    from { opacity: 0; transform: translateY(-50px); }
    to { opacity: 1; transform: translateY(0); }
}

.gt-header h1 {
    font-size: 3.2em;
    font-weight: 700;
    margin-bottom: 15px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
    letter-spacing: -0.5px;
}

.gt-header p {
    font-size: 1.2em;
    opacity: 0.95;
    font-weight: 300;
}

.gt-badges {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 25px;
    flex-wrap: wrap;
}

.gt-badge {
    background: rgba(255,255,255,0.2);
    padding: 8px 20px;
    border-radius: 50px;
    font-size: 0.9em;
    font-weight: 500;
    backdrop-filter: blur(10px);
    transition: all 0.3s;
}

.gt-badge:hover {
    background: rgba(255,255,255,0.3);
    transform: translateY(-2px);
}

/* ===== 游戏化面板 ===== */
.gamification-panel {
    position: fixed;
    top: 30px;
    right: 30px;
    background: white;
    padding: 16px 30px;
    border-radius: 50px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 10000;
    animation: panel-bounce 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

@keyframes panel-bounce {
    from { opacity: 0; transform: scale(0); }
    to { opacity: 1; transform: scale(1); }
}

.score-icon {
    font-size: 1.7em;
    animation: icon-spin 8s linear infinite;
}

@keyframes icon-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.score-value {
    font-size: 1.6em;
    font-weight: 700;
    color: var(--primary);
    min-width: 50px;
    text-align: center;
}

/* ===== 知识卡片容器 ===== */
.knowledge-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(580px, 1fr));
    gap: 35px;
    margin: 30px auto;
    max-width: 1300px;
}

/* ===== 主知识卡片 ===== */
.knowledge-card {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 40px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    animation: card-fade-in 0.6s ease-out backwards;
}

.knowledge-card:nth-child(1) { animation-delay: 0.1s; }
.knowledge-card:nth-child(2) { animation-delay: 0.2s; }
.knowledge-card:nth-child(3) { animation-delay: 0.3s; }
.knowledge-card:nth-child(4) { animation-delay: 0.4s; }

@keyframes card-fade-in {
    from { opacity: 0; transform: translateY(50px); }
    to { opacity: 1; transform: translateY(0); }
}

.knowledge-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    transform: scaleX(0);
    transition: transform 0.4s ease;
}

.knowledge-card:hover {
    transform: translateY(-15px) scale(1.02);
    box-shadow: 0 25px 60px rgba(0,0,0,0.3);
}

.knowledge-card:hover::before {
    transform: scaleX(1);
}

.knowledge-card::after {
    content: '📖';
    position: absolute;
    top: 25px;
    right: 25px;
    font-size: 2.2em;
    opacity: 0.15;
    transition: all 0.3s;
}

.knowledge-card:hover::after {
    opacity: 0.3;
    transform: scale(1.2) rotate(10deg);
}

/* 已阅读状态 */
.knowledge-card.read {
    border: 3px solid var(--success);
}

.knowledge-card.read::before {
    background: linear-gradient(90deg, var(--success), #059669);
}

.knowledge-card.read .card-status {
    background: var(--success);
    color: white;
}

.enhanced-header {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 28px;
    padding-bottom: 22px;
    border-bottom: 2px dashed #e0e7ff;
}

.card-badge {
    width: 52px;
    height: 52px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4em;
    font-weight: 700;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    flex-shrink: 0;
}

.card-title {
    flex: 1;
    font-size: 1.6em;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.3;
}

.card-status {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 16px;
    background: var(--primary-50);
    border-radius: 50px;
    font-size: 0.85em;
    color: var(--primary);
    font-weight: 500;
    flex-shrink: 0;
}

.card-status.read {
    background: var(--success);
    color: white;
}

.enhanced-content {
    font-size: 1.05em;
    color: var(--text-primary);
    line-height: 1.9;
}

.enhanced-content p {
    margin-bottom: 20px;
    padding: 18px 20px;
    background: #f0f4ff;
    border-left: 4px solid var(--primary);
    border-radius: 10px;
    transition: all 0.3s;
    cursor: pointer;
}

.enhanced-content p:hover {
    background: #e0e7ff;
    padding-left: 30px;
    transform: translateX(10px);
}

.enhanced-content p.revealed {
    background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
    border-left-color: var(--success);
}

.highlight-tip {
    background: linear-gradient(135deg, #fef3c7, #fde68a);
    border-left: 5px solid var(--accent);
    padding: 20px 22px;
    border-radius: 12px;
    margin: 22px 0;
    position: relative;
    transition: all 0.3s;
    cursor: pointer;
}

.highlight-tip:hover {
    transform: translateX(10px);
    box-shadow: 0 5px 20px rgba(245, 158, 11, 0.2);
}

.highlight-tip::before {
    content: '💡';
    position: absolute;
    top: 15px;
    right: 18px;
    font-size: 1.9em;
    opacity: 0.2;
}

.highlight-text {
    font-weight: 600;
    color: #92400e;
}

/* ===== 彩带特效 ===== */
.confetti {
    position: fixed;
    width: 12px;
    height: 12px;
    z-index: 99999;
    pointer-events: none;
    animation: confetti-fall 4s linear forwards;
}

@keyframes confetti-fall {
    from { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* ===== 成就弹窗 ===== */
.achievement-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: white;
    padding: 35px 45px;
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    z-index: 10001;
    text-align: center;
    animation: popup-scale 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
    max-width: 380px;
}

@keyframes popup-scale {
    to { transform: translate(-50%, -50%) scale(1); }
}

.ach-emoji {
    font-size: 4.5em;
    margin-bottom: 20px;
    animation: ach-bounce 1s infinite;
}

@keyframes ach-bounce {
    from, to { transform: translateY(0); }
    50% { transform: translateY(-18px); }
}

.ach-title {
    font-size: 1.6em;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 12px;
}

.ach-score {
    font-size: 2.2em;
    font-weight: 800;
    color: var(--accent);
    margin: 18px 0;
}

.close-btn {
    margin-top: 22px;
    padding: 12px 35px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: white;
    border: none;
    border-radius: 30px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}

.close-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
}

/* ===== 底部导航点 ===== */
.nav-dots {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 50px;
    padding: 20px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(15px);
    border-radius: 60px;
    flex-wrap: wrap;
}

.nav-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
}

.nav-dot:hover, .nav-dot.active {
    background: white;
    transform: scale(1.4);
    box-shadow: 0 0 15px rgba(255,255,255,0.6);
}

.nav-dot.completed {
    background: var(--success);
}

.nav-dot::after {
    content: attr(data-label);
    position: absolute;
    bottom: -30px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    color: white;
    font-size: 0.8em;
    opacity: 0;
    transition: opacity 0.3s;
}

.nav-dot:hover::after { opacity: 1; }

/* ===== 响应式 ===== */
@media (max-width: 768px) {
    .gamification-panel {
        padding: 12px 20px;
        top: 15px;
        right: 15px;
    }
    .knowledge-container {
        grid-template-columns: 1fr;
    }
    .knowledge-card {
        padding: 28px;
    }
    .gt-header {
        padding: 40px 20px;
        margin: 20px 15px;
    }
    .gt-header h1 {
        font-size: 2em;
    }
}

/* ===== 答题结果详情区 ===== */
.results-section {
    background: white;
    border-radius: 20px;
    padding: 35px;
    margin: 30px 0;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    animation: fadeInUp 0.6s ease-out;
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.grade-tag {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 25px;
    letter-spacing: 1px;
}
.grade-tag.excellent { background: linear-gradient(135deg, #d4edda, #c3e6cb); color: #155724; }
.grade-tag.good { background: linear-gradient(135deg, #cce5ff, #b8daff); color: #004085; }
.grade-tag.pass { background: linear-gradient(135deg, #fff3cd, #ffeaa7); color: #856404; }
.grade-tag.poor { background: linear-gradient(135deg, #f8d7da, #f5c6cb); color: #721c24; }

.stat-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 15px;
    margin-bottom: 30px;
}

.stat-card {
    padding: 20px 15px;
    border-radius: 14px;
    text-align: center;
    transition: transform 0.3s;
}
.stat-card:hover { transform: translateY(-3px); }
.stat-card .stat-number {
    font-size: 36px;
    font-weight: 800;
    line-height: 1.2;
}
.stat-card .stat-label {
    font-size: 14px;
    margin-top: 6px;
    opacity: 0.8;
}
.stat-correct { background: linear-gradient(135deg, #d4edda, #c3e6cb); color: #155724; }
.stat-wrong { background: linear-gradient(135deg, #f8d7da, #f5c6cb); color: #721c24; }
.stat-answered { background: linear-gradient(135deg, #e2e3f0, #d1d2e8); color: #383d6e; }
.stat-total { background: linear-gradient(135deg, #cce5ff, #b8daff); color: #004085; }

.detail-table {
    margin-top: 5px;
}
.detail-table h3 {
    font-size: 20px;
    margin-bottom: 18px;

<script id="gt-enhanced-script">
(function() {
    // ===== 状态管理 =====
    const state = {
        score: 0,
        readSections: new Set(),
        revealedParagraphs: new Set()
    };
    
    // 从内联数据获取内容
    let sections = [];
    try {
        const dataEl = document.getElementById('gt-content-data');
        if (dataEl) {
            const data = JSON.parse(dataEl.textContent);
            sections = data.sections || [];
        }
    } catch(e) {
        console.warn('无法读取内容数据:', e);
    }
    
    // ===== 渲染背景动画 =====
    function renderBackground() {
        const bg = document.createElement('div');
        bg.className = 'floating-shapes';
        
        // 漂浮圆形
        for (let i = 0; i < 12; i++) {
            const circle = document.createElement('div');
            circle.className = 'float-circle';
            const size = Math.random() * 200 + 80;
            circle.style.cssText = 
                'width:' + size + 'px;height:' + size + 'px;' +
                'left:' + (Math.random()*100) + '%;' +
                'top:' + (Math.random()*100) + '%;' +
                'animation-delay:' + (Math.random()*10 - 5) + 's';
            bg.appendChild(circle);
        }
        
        // 脉冲圆圈
        for (let i = 0; i < 5; i++) {
            const ring = document.createElement('div');
            ring.className = 'pulse-ring';
            const size = Math.random() * 300 + 200;
            ring.style.cssText = 
                'width:' + size + 'px;height:' + size + 'px;' +
                'left:' + (Math.random()*100) + '%;' +
                'top:' + (Math.random()*100) + '%;' +
                'animation-delay:' + (Math.random()*5) + 's';
            bg.appendChild(ring);
        }
        
        document.body.prepend(bg);
    }
    
    // ===== 创建彩带 =====
    function createConfetti(isBig = false) {
        const colors = ['#6366f1', '#06b6d4', '#f59e0b', '#10b981', '#ef4444', '#ec4899'];
        const count = isBig ? 80 : 30;
        
        for (let i = 0; i < count; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.cssText = 
                'background:' + colors[Math.floor(Math.random()*colors.length)] + ';' +
                'left:' + (Math.random()*100) + 'vw;' +
                'top:-10px;' +
                'animation-duration:' + (Math.random()*2+3) + 's;' +
                'animation-delay:' + (Math.random()*2) + 's;' +
                'border-radius:' + (Math.random()>0.5?'50%':'0') + ';';
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 5500);
        }
    }
    
    // ===== 增加分数 =====
    function addPoints(points, title) {
        state.score += points;
        const el = document.querySelector('.score-value');
        if (el) {
            el.textContent = state.score;
            
            // 数字跳动动画
            el.style.transform = 'scale(1.5)';
            setTimeout(() => el.style.transform = 'scale(1)', 300);
        }
        createConfetti();
        console.log('[积分] +' + points + '分 | 总分：' + state.score);
    }
    
    // ===== 显示成就弹窗 =====
    function showAchievement(emoji, title, scoreText) {
        const html = 
            '<div class="achievement-popup">' +
                '<div class="ach-emoji">' + emoji + '</div>' +
                '<div class="ach-title">' + title + '</div>' +
                '<div class="ach-score">' + scoreText + '</div>' +
                '<button class="close-btn" onclick="this.parentElement.remove()">继续学习</button>' +
            '</div>';
        document.body.insertAdjacentHTML('beforeend', html);
        
        // 自动关闭
        setTimeout(() => {
            const popup = document.querySelector('.achievement-popup');
            if (popup) popup.remove();
        }, 3500);
    }
    
    // ===== 标记卡片为已读 =====
    function markCardAsRead(cardId) {
        if (!state.readSections.has(cardId)) {
            state.readSections.add(cardId);
            
            const card = document.querySelector('.knowledge-card[data-id="' + cardId + '"]');
            if (card) {
                card.classList.add('read');
                
                // 更新状态徽章
                const statusBadge = card.querySelector('.card-status');
                if (statusBadge) {
                    statusBadge.innerHTML = '✓ 已阅读';
                    statusBadge.classList.add('read');
                }
            }
            
            // 更新导航点
            const dot = document.querySelector('.nav-dot[data-section="' + cardId + '"]');
            if (dot) {
                dot.classList.add('completed');
            }
            
            return true;
        }
        return false;
    }
    
    // ===== 显示段落高亮 =====
    function revealParagraph(paraId) {
        if (!state.revealedParagraphs.has(paraId)) {
            state.revealedParagraphs.add(paraId);
            
            const para = document.querySelector('.enhanced-content p[data-id="' + paraId + '"]');
            if (para) {
                para.classList.add('revealed');
            }
            
            return true;
        }
        return false;
    }
    
    // ===== 处理卡片点击 =====
    function handleCardClick(cardId) {
        const isNew = markCardAsRead(cardId);
        
        if (isNew) {
            showAchievement('✨', '知识点解锁!', '+10 分');
        }
        addPoints(10);
    }
    
    // ===== 处理段落点击 =====
    function handleParagraphClick(paraId) {
        const isNew = revealParagraph(paraId);
        
        if (isNew) {
            addPoints(3);
            showAchievement('📚', '深入学习!', '+3 分');
        }
    }
    
    // ===== 处理提示框点击 =====
    function handleTipClick() {
        addPoints(5);
        showAchievement('💡', '发现要点!', '+5 分');
    }
    
    // ===== 初始化 =====
    function init() {
        renderBackground();
        setupEventListeners();
        createNavDots();
        console.log('[GT Enhanced] 页面加载完成! 🚀');
    }
    
    // ===== 设置事件监听 =====
    function setupEventListeners() {
        // 给所有卡片添加点击事件
        document.querySelectorAll('.knowledge-card').forEach((card, idx) => {
            card.dataset.id = 'section-' + idx;
            
            // 整卡点击
            card.addEventListener('click', function() {
                const cardId = this.dataset.id;
                handleCardClick(cardId);
            });
            
            // 段落点击
            const paragraphs = card.querySelectorAll('.enhanced-content p');
            paragraphs.forEach((para, pIdx) => {
                para.dataset.id = 'para-' + card.dataset.id + '-' + pIdx;
                
                const originalHandler = para.onclick;
                para.onclick = function(e) {
                    e.stopPropagation();
                    handleParagraphClick(this.dataset.id);
                    
                    // 保留原有行为
                    if (originalHandler) originalHandler.call(this, e);
                };
                
                // 悬停效果
                para.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateX(8px)';
                });
                para.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateX(0)';
                });
            });
            
            // 提示框点击
            const tips = card.querySelectorAll('.highlight-tip');
            tips.forEach(tip => {
                tip.addEventListener('click', function(e) {
                    e.stopPropagation();
                    handleTipClick();
                });
            });
        });
    }
    
    // ===== 创建导航点 =====
    function createNavDots() {
        const navDots = document.createElement('div');
        navDots.className = 'nav-dots';
        
        document.querySelectorAll('.knowledge-card').forEach((card, idx) => {
            const dot = document.createElement('div');
            dot.className = 'nav-dot';
            dot.dataset.section = card.dataset.id;
            dot.dataset.label = '第' + (idx+1) + '节';
            
            dot.addEventListener('click', function() {
                // 移除所有激活状态
                document.querySelectorAll('.nav-dot').forEach(d => d.classList.remove('active'));
                this.classList.add('active');
                
                // 滚动到目标卡片
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
            
            navDots.appendChild(dot);
        });
        
        // 插入到最后
        document.body.appendChild(navDots);
    }
    
    // ===== 启动 =====
    document.addEventListener('DOMContentLoaded', init);
})();
</script>

                number: 14,
                text: '结构具有抵抗被外力破坏的能力，这被称为结构的（ ）',
                options: ['A. 稳定性', 'B. 内力', 'C. 强度', 'D. 应力'],
                answer: 'C',
                analysis: '强度是指结构抵抗被外力破坏的能力；稳定性是指结构保持原有平衡状态的能力。',
                knowledge: '结构强度定义'
            },
            {
                type: '单选题',
                number: 15,
                text: '矿泉水瓶身上有凸起的横向纹路，从影响结构强度的主要因素出发，这种设计主要考虑了（ ）',
                options: ['A. 结构的形状', 'B. 结构的材料', 'C. 构件之间的连接方式', 'D. 手与瓶子间的摩擦力'],
                answer: 'A',
                analysis: '瓶身的纹路改变了结构的形状，增加了截面惯性矩，从而提高了瓶子的强度。',
                knowledge: '形状对强度的影响'
            },
            {
                type: '单选题',
                number: 16,
                text: '包装盒常采用瓦楞形状。这种设计主要考虑了（ ）',
                options: ['A. 节省材料', 'B. 包装盒的外观设计', 'C. 包装盒组装方式', 'D. 增加包装盒的强度'],
                answer: 'D',
                analysis: '瓦楞形状通过改变结构形状来增加包装盒的强度，使其能承受更大的压力。',
                knowledge: '形状对强度的影响'
            },
            {
                type: '单选题',
                number: 17,
                text: '钢筋混凝土比无钢筋的水泥梁的（ ）强度更强。',
                options: ['A. 抗弯', 'B. 抗压', 'C. 抗拉', 'D. 抗剪'],
                answer: 'C',
                analysis: '混凝土擅长抗压力，钢筋擅长抗拉力。加入钢筋主要提高了水泥梁的抗拉强度。',
                knowledge: '材料特性与结构强度'
            },
            {
                type: '单选题',
                number: 18,
                text: '钢筋混凝土横梁受力时，上部受压，下部受拉，为了合理利用钢筋，应（ ）',
                options: ['A. 上部布置粗钢筋，下部布置细钢筋', 'B. 上部和下部布置相同的钢筋', 'C. 上部布置细钢筋，下部布置粗钢筋', 'D. 不需要布置钢筋'],
                answer: 'C',
                analysis: '横梁受力时上部受压（混凝土擅长），下部受拉（需要钢筋），所以下部应布置粗钢筋，上部可布置细钢筋或不布置。',
                knowledge: '钢筋混凝土结构'
            },
            {
                type: '单选题',
                number: 19,
                text: '落地电风扇，下列说法不合理的是（ ）',
                options: ['A. 连接杆增加了支架的强度', 'B. 支架采用轻质铝合金材料制作，稳定性好', 'C. 风扇头与支架间采用铰连接，便于调节角度', 'D. 立柱与底座间夹角略小于90°，增强稳定性'],
                answer: 'B',
                analysis: '轻质材料会降低整体重量，反而可能降低稳定性。稳定性好的底座应该有一定重量来降低重心。',
                knowledge: '结构稳定性分析'
            },
            {
                type: '单选题',
                number: 20,
                text: '我国古代的塔大部分都是下宽上窄的结构，主要是为了能够增强塔的（ ）',
                options: ['A. 强度', 'B. 稳定性', 'C. 美观', 'D. 经济性'],
                answer: 'B',
                analysis: '下宽上窄的结构可以降低重心、增大支撑面积，从而提高结构的稳定性。',
                knowledge: '结构稳定性设计'
            },
            // 判断题 21-25
            {
                type: '判断题',
                number: 21,
                text: '实体结构是指结构体本身是实心的，外力分布在整个体积中。',
                options: ['A. 正确', 'B. 错误'],
                answer: 'A',
                analysis: '实体结构的定义就是结构体本身是实心的，外力分布在整个体积中，如实心墙、大坝等。',
                knowledge: '实体结构定义'
            },
            {
                type: '判断题',
                number: 22,
                text: '结构的稳定性与重心位置无关，只与支撑面积有关。',
                options: ['A. 正确', 'B. 错误'],
                answer: 'B',
                analysis: '结构的稳定性与重心位置和支撑面积都有关。重心越低、支撑面积越大，结构越稳定。',
                knowledge: '影响稳定性的因素'
            },
            {
                type: '判断题',
                number: 23,
                text: '三角形结构具有稳定性，四边形结构不具有稳定性。',
                options: ['A. 正确', 'B. 错误'],
                answer: 'A',
                analysis: '三角形是最基本的稳定结构，三边确定后形状就固定了；四边形容易变形，需要加斜撑才能稳定。',
                knowledge: '结构稳定性原理'
            },
            {
                type: '判断题',
                number: 24,
                text: '构件的连接方式不会影响结构的强度。',
                options: ['A. 正确', 'B. 错误'],
                answer: 'B',
                analysis: '构件的连接方式是影响结构强度的重要因素之一。刚连接比铰连接能承受更大的力。',
                knowledge: '影响强度的因素'
            },
            {
                type: '判断题',
                number: 25,
                text: '应力是单位面积上的内力，单位是帕斯卡(Pa)。',
                options: ['A. 正确', 'B. 错误'],
                answer: 'A',
                analysis: '应力=内力/横截面积，单位是帕斯卡(Pa)，1Pa=1N/m²。这是应力的基本定义。',
                knowledge: '应力概念'
            }
        ];

        let userAnswers = {};
        let submitted = false;

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `question-${index}`;

                let optionsHtml = '';
                q.options.forEach((opt, optIndex) => {
                    const optionId = `q${index}-opt${optIndex}`;
                    optionsHtml += `
                        <div class="option">
                            <input type="${q.type === '判断题' ? 'radio' : 'radio'}" 
                                   name="question${index}" 
                                   id="${optionId}" 
                                   value="${opt.charAt(0)}"
                                   onchange="updateProgress()">
                            <label for="${optionId}">${opt}</label>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="question-header">
                        <span class="question-type">${q.type}</span>
                        <span class="question-number">第${q.number}题</span>
                    </div>
                    <div class="question-text">${q.text}</div>
                    <div class="options">${optionsHtml}</div>
                    <button class="submit-btn" onclick="submitQuestion(${index})">💾 提交本题</button>
                    <div class="feedback" id="feedback-${index}"></div>
                `;

                container.appendChild(card);
            });

            updateProgress();
        }

        function submitQuestion(index) {
            if (submitted) return;

            const selected = document.querySelector(`input[name="question${index}"]:checked`);
            if (!selected) {
                alert('请先选择一个答案！');
                return;
            }

            const q = questions[index];
            const feedback = document.getElementById(`feedback-${index}`);
            const isCorrect = selected.value === q.answer;

            feedback.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedback.innerHTML = `
                <div class="feedback-title">
                    ${isCorrect ? '✅ 回答正确！' : '❌ 回答错误'}
                </div>
                <div class="feedback-content">
                    <strong>正确答案：</strong>${q.answer}<br>
                    <strong>解析：</strong>${q.analysis}
                </div>
                <div class="knowledge-point">
                    📖 知识点：${q.knowledge}
                </div>
            `;
            feedback.style.display = 'block';

            userAnswers[index] = selected.value;
            updateProgress();

            // 禁用本题的选项和按钮
            const options = document.querySelectorAll(`input[name="question${index}"]`);
            options.forEach(opt => opt.disabled = true);
            document.querySelector(`#question-${index} .submit-btn`).disabled = true;
        }

        // ===== 题目摘要映射（用于逐题详情表） =====
        const questionShortTexts = {
            1: '壳体结构判断（安全帽/书本/贝壳/脚手架）',
            2: '水管输送方式结构类型',
            3: '汽车引擎盖结构类型',
            4: '属于实体结构的是',
            5: '俄罗斯套娃结构类型',
            6: '安全头盔保护原理',
            7: '构件基本受力形式',
            8: '剪指甲和拧衣服的受力',
            9: '打气筒活塞杆受力形式',
            10: 'A形梯截面与强度关系',
            11: '三角形结构不易变形原因',
            12: '不能降低重心的措施',
            13: '提高衣帽架稳定性的不合理措施',
            14: '抵抗外力破坏的能力称为',
            15: '矿泉水瓶纹路设计考虑',
            16: '包装盒瓦楞形状考虑',
            17: '钢筋混凝土提高的强度',
            18: '钢筋混凝土横梁钢筋布置',
            19: '落地电风扇不合理说法',
            20: '塔下宽上窄增强的特性',
            21: '实体结构定义判断',
            22: '稳定性与重心位置关系',
            23: '三角形与四边形稳定性',
            24: '连接方式不影响强度',
            25: '应力单位是帕斯卡'
        };
        const correctAnswersMap = {
            1: 'B', 2: 'B', 3: 'C', 4: 'C', 5: 'B',
            6: 'B', 7: 'A', 8: 'A', 9: 'C', 10: 'B',
            11: 'A', 12: 'C', 13: 'B', 14: 'C', 15: 'A',
            16: 'D', 17: 'C', 18: 'C', 19: 'B', 20: 'B',
            21: 'A', 22: 'B', 23: 'A', 24: 'B', 25: 'A'
        };

        function getAnswerText(index, answer) {
            if (!answer || answer === '未作答') return '未作答';
            const q = questions[index];
            if (q.type === '判断题') return answer === 'A' ? '正确' : '错误';
            for (const opt of q.options) {
                if (opt.startsWith(answer + '.')) return opt;
            }
            return answer;
        }

        function submitAll() {
            if (submitted) {
                alert('已经提交过了！');
                return;
            }

            // 检查是否所有题目都已完成
            const unanswered = questions.filter((q, index) => !userAnswers[index]);
            if (unanswered.length > 0) {
                if (!confirm(`还有${unanswered.length}道题未作答，确定要提交吗？未作答的题目将计为错误。`)) {
                    return;
                }
            }

            try {
                submitted = true;
                let correctCount = 0;
                let singleCorrect = 0;
                let judgeCorrect = 0;
                let singleTotal = 0;
                let judgeTotal = 0;
                const answeredCount = Object.keys(userAnswers).length;

                questions.forEach((q, index) => {
                    const feedback = document.getElementById(`feedback-${index}`);
                    const userAnswer = userAnswers[index] || '';
                    const isCorrect = userAnswer === q.answer;

                    if (isCorrect) {
                        correctCount++;
                        if (q.type === '单选题') singleCorrect++;
                        if (q.type === '判断题') judgeCorrect++;
                    }

                    if (q.type === '单选题') singleTotal++;
                    if (q.type === '判断题') judgeTotal++;

                    // 显示所有题目的反馈
                    if (feedback) {
                        feedback.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
                        feedback.innerHTML = `
                            <div class="feedback-title">
                                ${isCorrect ? '✅ 回答正确！' : '❌ 回答错误'}
                            </div>
                            <div class="feedback-content">
                                <strong>你的答案：</strong>${userAnswer || '未作答'}<br>
                                <strong>正确答案：</strong>${q.answer}<br>
                                <strong>解析：</strong>${q.analysis}
                            </div>
                            <div class="knowledge-point">
                                📖 知识点：${q.knowledge}
                            </div>
                        `;
                        feedback.style.display = 'block';
                    }

                    // 禁用所有选项和按钮
                    const options = document.querySelectorAll(`input[name="question${index}"]`);
                    options.forEach(opt => opt.disabled = true);
                    const btn = document.querySelector(`#question-${index} .submit-btn`);
                    if (btn) btn.disabled = true;
                });

                // 计算分数
                const singleScore = Math.round((singleCorrect / Math.max(singleTotal, 1)) * 80);
                const judgeScore = Math.round((judgeCorrect / Math.max(judgeTotal, 1)) * 20);
                const totalScore = singleScore + judgeScore;
                const wrongCount = questions.length - correctCount;

                // --- 显示原有结果面板 ---
                const rp = document.getElementById('resultPanel');
                if (rp) rp.style.display = 'block';
                const sdEl = document.getElementById('scoreDisplay');
                if (sdEl) sdEl.textContent = totalScore + '分';
                const ccEl = document.getElementById('correctCount');
                if (ccEl) ccEl.textContent = correctCount;
                const wcEl = document.getElementById('wrongCount');
                if (wcEl) wcEl.textContent = wrongCount;
                const ssEl = document.getElementById('singleScore');
                if (ssEl) ssEl.textContent = singleScore;
                const jsEl = document.getElementById('judgeScore');
                if (jsEl) jsEl.textContent = judgeScore;

                // 显示等级
                let level = '';
                let levelColor = '';
                if (totalScore >= 90) {
                    level = '🌟 优秀！你对结构与设计知识掌握得非常扎实！';
                    levelColor = '#28a745';
                } else if (totalScore >= 70) {
                    level = '🎯 良好！基础知识掌握不错，继续加油！';
                    levelColor = '#667eea';
                } else if (totalScore >= 60) {
                    level = '📚 及格！建议复习薄弱知识点。';
                    levelColor = '#ffc107';
                } else {
                    level = '🔧 需努力！请认真复习第一单元内容。';
                    levelColor = '#dc3545';
                }
                const ldEl = document.getElementById('levelDisplay');
                if (ldEl) {
                    ldEl.textContent = level;
                    ldEl.style.color = levelColor;
                }

                // --- 显示详细结果区 ---
                const rSection = document.getElementById('resultsSection');
                if (!rSection) {
                    console.error('[反馈] 未找到 resultsSection 元素');
                    return;
                }
                rSection.style.display = 'block';

                // 等级标签
                const gradeTag = document.getElementById('gradeTag');
                if (gradeTag) {
                    let gradeText, gradeClass;
                    if (totalScore >= 90) {
                        gradeText = '🌟 优秀 (' + totalScore + '分) — 非常扎实！';
                        gradeClass = 'excellent';
                    } else if (totalScore >= 75) {
                        gradeText = '🎯 良好 (' + totalScore + '分) — 继续加油！';
                        gradeClass = 'good';
                    } else if (totalScore >= 60) {
                        gradeText = '📚 及格 (' + totalScore + '分) — 需要复习';
                        gradeClass = 'pass';
                    } else {
                        gradeText = '🔧 需努力 (' + totalScore + '分) — 认真复习！';
                        gradeClass = 'poor';
                    }
                    gradeTag.textContent = gradeText;
                    gradeTag.className = 'grade-tag ' + gradeClass;
                }

                // 统计卡片
                var stCorrect = document.getElementById('statCorrect');
                if (stCorrect) stCorrect.textContent = correctCount;
                var stWrong = document.getElementById('statWrong');
                if (stWrong) stWrong.textContent = wrongCount;
                var stAnswered = document.getElementById('statAnswered');
                if (stAnswered) stAnswered.textContent = answeredCount;
                var stScore = document.getElementById('statScore');
                if (stScore) stScore.textContent = totalScore;

                // 生成逐题详情表
                var tbody = document.getElementById('resultsTableBody');
                if (!tbody) {
                    console.error('[反馈] 未找到 resultsTableBody 元素');
                    return;
                }
                tbody.innerHTML = '';

                for (var i = 0; i < questions.length; i++) {
                    var qNum = questions[i].number;
                    var userAns = userAnswers[i] || '未作答';
                    var correctAns = correctAnswersMap[qNum];
                    var isCorrect = userAns === correctAns;
                    var shortText = questionShortTexts[qNum];
                    var safeTitle = (shortText || '').replace(/"/g, '&quot;');
                    var displayUser = getAnswerText(i, userAns);
                    var displayCorrect = getAnswerText(i, correctAns);

                    var tr = document.createElement('tr');
                    tr.innerHTML = 
                        '<td class="q-num">' + qNum + '</td>' +
                        '<td class="q-text-cell" title="' + safeTitle + '">' + shortText + '</td>' +
                        '<td><span class="answer-tag user">' + displayUser + '</span></td>' +
                        '<td><span class="answer-tag correct-answer">' + displayCorrect + '</span></td>' +
                        '<td><span class="result-icon ' + (isCorrect ? 'correct' : 'wrong') + '">' + (isCorrect ? '✅' : '❌') + '</span></td>';
                    tbody.appendChild(tr);
                }

                rSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                console.log('[反馈] 答题反馈已成功显示 ✅');
            } catch (e) {
                console.error('[反馈] 显示反馈时出错：', e);
                alert('显示答题反馈时出错，请确认浏览器控制台(F12)查看详情。错误：' + e.message);
            }
        }

        function resetQuiz() {
            if (!confirm('确定要重新开始吗？当前进度将丢失。')) {
                return;
            }

            userAnswers = {};
            submitted = false;
            var rp = document.getElementById('resultPanel');
            if (rp) rp.style.display = 'none';
            var rs = document.getElementById('resultsSection');
            if (rs) rs.style.display = 'none';
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateProgress() {
            const answered = Object.keys(userAnswers).length;
            const percentage = Math.round((answered / questions.length) * 100);
            document.getElementById('progressFill').style.width = `${percentage}%`;
            document.getElementById('progressFill').textContent = `${percentage}%`;
        }

        // 页面加载时渲染题目
        renderQuestions();
    </script>
</body>
</html>
