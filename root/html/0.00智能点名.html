<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 智能点名 · 公平版</title>
<style>
:root {
  --bg: #0a0e1a; --card: #121828; --border: #1e2940;
  --text: #e0e6f0; --muted: #6b7d9a;
  --accent: #4fc3f7; --success: #66bb6a; --danger: #ef5350; --warning: #ffa726;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body {
  font-family:'Microsoft YaHei','PingFang SC',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; padding:20px; user-select:none;
  overflow:hidden;
  background-image:radial-gradient(ellipse at 50% 0%,#121828 0%,#0a0e1a 70%);
}
.main-card {
  width:100%; max-width:920px;
  background:var(--card); border:1px solid var(--border); border-radius:24px;
  padding:32px 40px; box-shadow:0 20px 60px rgba(0,0,0,.5);
  position:relative; overflow:hidden;
  max-height:calc(100vh - 40px); display:flex; flex-direction:column;
}
.main-card::before {
  content:''; position:absolute; top:-50%; left:-50%;
  width:200%; height:200%;
  background:conic-gradient(from 0deg,transparent,rgba(79,195,247,.03),transparent);
  animation:spin 10s linear infinite; pointer-events:none;
}
.main-card > * { position:relative; z-index:1; }
.main-body { flex:1; overflow-y:auto; min-height:0; padding-right:4px; }
.main-body::-webkit-scrollbar { width:4px; }
.main-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
@keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

/* 头部 */
.header { display:flex; align-items:center; gap:16px; margin-bottom:20px; position:relative; z-index:1; }
.header h1 { font-size:28px; font-weight:700; background:linear-gradient(135deg,#4fc3f7,#7c4dff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

/* 选择器 */
.selector-row { display:flex; gap:12px; margin-bottom:20px; position:relative; z-index:1; flex-wrap:wrap; }
.selector-row select {
  background:#1a2240; border:1px solid var(--border); color:var(--text);
  padding:10px 16px; border-radius:10px; font-size:16px; cursor:pointer; min-width:140px; flex:1; max-width:260px;
}
.selector-row select:focus { outline:none; border-color:var(--accent); }
.btn-mini {
  background:#1e2940; border:none; color:var(--muted); padding:8px 16px;
  border-radius:8px; cursor:pointer; font-size:14px; transition:.2s;
}
.btn-mini:hover { background:#2a3a5a; color:var(--text); }

/* 展示区 */
.display-area { text-align:center; padding:20px 0; position:relative; z-index:1; }
.display-area .sub-status { font-size:16px; color:var(--muted); margin-bottom:8px; min-height:24px; }
.display-area .name {
  font-size:80px; font-weight:800; margin:12px 0; min-height:90px; transition:all .3s;
}
.display-area .name.rolling { animation:roll .08s infinite; color:var(--accent); }
@keyframes roll { 0%,100%{transform:translateX(-2px)} 50%{transform:translateX(2px)} }
.display-area .name.highlight { color:var(--accent); text-shadow:0 0 40px rgba(79,195,247,.4); animation:popIn .4s ease; }
@keyframes popIn { 0%{transform:scale(1.3);opacity:0} 60%{transform:scale(.95)} 100%{transform:scale(1);opacity:1} }
.display-area .name.correct { color:var(--success); text-shadow:0 0 40px rgba(102,187,106,.4); }
.display-area .name.participated { color:var(--warning); text-shadow:0 0 40px rgba(255,167,38,.4); }

/* 统计行 */
.stat-row { display:flex; justify-content:center; gap:40px; margin:16px 0; }
.stat-item { text-align:center; }
.stat-item .num { font-size:32px; font-weight:700; }
.stat-item .num.accent { color:var(--accent); }
.stat-item .num.success { color:var(--success); }
.stat-item .num.warning { color:var(--warning); }
.stat-item .lbl { font-size:13px; color:var(--muted); margin-top:2px; }

/* 按钮 */
.action-row { display:flex; justify-content:center; gap:12px; margin:20px 0; flex-wrap:wrap; }
.btn { display:inline-flex; align-items:center; gap:8px; padding:14px 28px; border:none; border-radius:12px; font-size:18px; font-weight:600; cursor:pointer; transition:.2s; }
.btn:hover { transform:translateY(-2px); }
.btn:active { transform:translateY(0); }
.btn:disabled { opacity:.3; cursor:not-allowed; transform:none; }
.btn-primary { background:linear-gradient(135deg,#4fc3f7,#2196f3); color:#fff; box-shadow:0 4px 20px rgba(79,195,247,.3); }
.btn-success { background:linear-gradient(135deg,#66bb6a,#43a047); color:#fff; box-shadow:0 4px 20px rgba(102,187,106,.3); }
.btn-danger { background:linear-gradient(135deg,#ef5350,#e53935); color:#fff; box-shadow:0 4px 20px rgba(239,83,80,.3); }
.btn-warning { background:linear-gradient(135deg,#ffa726,#ff9800); color:#fff; box-shadow:0 4px 20px rgba(255,167,38,.3); }
.btn-ghost { background:#1a2240; color:var(--muted); border:1px solid var(--border); }
.btn-ghost:hover { background:#2a3a5a; color:var(--text); }

/* 热键提示 */
.hotkey-bar { display:flex; gap:16px; justify-content:center; margin-top:12px; flex-wrap:wrap; position:relative; z-index:1; }
.hotkey-bar kbd { display:inline-flex; align-items:center; gap:6px; background:#1a2240; border:1px solid var(--border); border-radius:6px; padding:4px 10px; font-size:12px; font-family:inherit; color:var(--muted); }
.hotkey-bar kbd span { color:var(--accent); font-weight:600; }

/* 历史记录 */
.history-section { margin-top:20px; border-top:1px solid var(--border); padding-top:16px; position:relative; z-index:1; }
.history-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.history-header .title { font-size:16px; color:var(--muted); display:flex; align-items:center; gap:8px; }
.history-header .title:hover { color:var(--text); }
.history-header .arrow { font-size:12px; transition:transform .2s; display:inline-block; }
.history-header .arrow.open { transform:rotate(90deg); }
.history-list { max-height:420px; overflow-y:auto; scrollbar-width:thin; }
.history-list::-webkit-scrollbar { width:4px; }
.history-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.history-item {
  display:flex; align-items:center; padding:8px 12px; border-radius:8px;
  gap:12px; font-size:15px; animation:fadeSlide .3s ease;
}
.history-item:nth-child(odd) { background:rgba(255,255,255,.02); }
@keyframes fadeSlide { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:translateX(0)} }
.history-item .h-round { color:var(--muted); font-size:13px; width:30px; }
.history-item .h-name { font-weight:600; flex:1; }
.history-item .h-time { color:var(--muted); font-size:13px; }
.history-item .h-result { font-size:13px; padding:2px 8px; border-radius:6px; }
.history-item .h-result.correct { background:#1b3d2a; color:var(--success); }
.history-item .h-result.incorrect { background:#2a3a1a; color:var(--warning); }
.history-item .h-result.skip { background:var(--border); color:var(--muted); }
.history-item .h-points { font-weight:700; color:var(--success); min-width:30px; text-align:right; }
.history-empty { color:var(--muted); text-align:center; padding:20px; font-size:14px; }

/* Toast */
.toast {
  position:fixed; top:20px; right:20px; padding:12px 24px; border-radius:12px;
  font-size:16px; font-weight:500; z-index:999;
  transform:translateX(120%); transition:.4s cubic-bezier(.4,0,.2,1);
  box-shadow:0 8px 30px rgba(0,0,0,.4);
}
.toast.show { transform:translateX(0); }
.toast.success { background:#1b3d2a; color:var(--success); border:1px solid #2e7d32; }
.toast.error { background:#3d1b1b; color:var(--danger); border:1px solid #c62828; }
.toast.info { background:#1a2a4a; color:var(--accent); border:1px solid #1565c0; }

/* 纸屑 */
.confetti-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:998; overflow:hidden; }
.confetti-piece { position:absolute; top:-10px; width:10px; height:10px; border-radius:2px; animation:confettiFall linear forwards; }
@keyframes confettiFall { 0%{transform:translateY(0) rotate(0deg);opacity:1} 100%{transform:translateY(100vh) rotate(720deg);opacity:0} }

/* 星背景 */
.stars { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:-1; }
.star-dot { position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; animation:twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 0%,100%{opacity:.2} 50%{opacity:.8} }

@media (max-width:640px) {
  .main-card { padding:20px; }
  .display-area .name { font-size:48px; min-height:56px; }
  .btn { padding:12px 20px; font-size:16px; }
  .stat-row { gap:20px; }
}

.gear-icon{display:none}/* hidden */
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="toast" id="toast"></div>
<div class="confetti-container" id="confetti"></div>

<div class="main-card">
  <div class="header">
    <h1>🎯 智能随机点名</h1>
    <span style="font-size:12px;color:var(--muted);background:#1a2240;padding:3px 10px;border-radius:20px;border:1px solid var(--border)">公平算法 · 服务端持久化</span>
  </div>

  <div class="selector-row">
    <select id="gradeSelect"><option value="">— 选择年级 —</option></select>
    <select id="classSelect"><option value="">— 选择班级 —</option></select>
    <button class="btn-mini" onclick="resetHistory()">🔄 重置本班权重</button>
    <button class="btn-mini" onclick="refreshHistory()">🔄 刷新数据</button>
  </div>
<div class="main-body">

  <div class="display-area">
    <div class="sub-status" id="subStatus">请先选择年级和班级</div>
    <div class="name" id="nameDisplay">🎯</div>
    <div class="stat-row" id="statRow" style="display:none">
      <div class="stat-item"><div class="num accent" id="coveredCount">0</div><div class="lbl">已点人数</div></div>
      <div class="stat-item"><div class="num accent" id="totalCount">0</div><div class="lbl">全班人数</div></div>
      <div class="stat-item"><div class="num warning" id="rateCount">0%</div><div class="lbl">覆盖率</div></div>
      <div class="stat-item"><div class="num success" id="correctCount">0</div><div class="lbl">答对次数</div></div>
    </div>
  </div>

  <div class="action-row">
    <button class="btn btn-primary" id="btnPick" onclick="pickStudent()">🎲 开始点名</button>
    <button class="btn btn-success" id="btnCorrect" onclick="markResult('correct')" disabled>✅ 答对</button>
    <button class="btn btn-danger" id="btnIncorrect" onclick="markResult('incorrect')" disabled>💬 参与</button>
    <button class="btn btn-ghost" id="btnSkip" onclick="markResult('skip')" disabled>⏭ 跳过</button>
  </div>

  <div class="hotkey-bar">
    <kbd><span>Space</span> 抽人</kbd>
    <kbd><span>1</span> 答对</kbd>
    <kbd><span>2</span> 参与</kbd>
    <kbd><span>3</span> 跳过</kbd>
    <kbd><span>R</span> 重置</kbd>
    <kbd><span>F</span> 全屏</kbd>
  </div>

  <div class="history-section">
    <div class="history-header" onclick="toggleHistory()" style="cursor:pointer">
      <div class="title"><span id="historyArrow">▶</span> 📋 点名记录 <span id="historyCount" style="font-size:12px;color:var(--muted)"></span></div>
    </div>
    <div class="history-list" id="historyList" style="display:none">
      <div class="history-empty">暂无记录 🎯</div>
    </div>
  </div>
</div>
</div>

<script>
const API = '/api/rollcall';
// 从 URL 查询参数获取教师身份，用于数据隔离
const urlParams = new URLSearchParams(window.location.search);
// 从 URL 路径自动提取教师用户名（如 /api/files/youufis/html/... → youufis）
const pathMatch = window.location.pathname.match(/\/api\/files\/([^\/]+)\/html\//);
const TEACHER = (pathMatch ? pathMatch[1] : '') || urlParams.get('teacher') || '';
let currentGrade = '', currentClass = '';
let lastPicked = '';
let historyVisible = false;

function toggleHistory() {
  const list = document.getElementById('historyList');
  const arrow = document.getElementById('historyArrow');
  historyVisible = !historyVisible;
  list.style.display = historyVisible ? 'block' : 'none';
  arrow.textContent = historyVisible ? '▼' : '▶';
}

// ========== 初始化 ==========
document.addEventListener('DOMContentLoaded', async () => {
  createStars();
  await loadGrades();
  bindKeyboard();
});

// ========== 加载年级 ==========
async function loadGrades() {
  try {
    const r = await fetch(API + '/grades');
    const grades = await r.json();
    const sel = document.getElementById('gradeSelect');
    sel.innerHTML = '<option value="">— 选择年级 —</option>';
    grades.forEach(g => sel.innerHTML += `<option value="${g}">${g}</option>`);
    sel.onchange = onGradeChange;
    // 如果有 session 中保存的年级，恢复
  } catch(e) {
    showToast('加载年级失败: ' + e.message, 'error');
    // 降级：硬编码
    document.getElementById('gradeSelect').innerHTML =
      '<option value="">— 选择年级 —</option><option value="高一">高一</option><option value="高二">高二</option>';
    document.getElementById('gradeSelect').onchange = onGradeChange;
  }
}

async function onGradeChange() {
  const grade = document.getElementById('gradeSelect').value;
  const classSel = document.getElementById('classSelect');
  classSel.innerHTML = '<option value="">正在加载...</option>';
  classSel.disabled = true;
  if (!grade) {
    classSel.innerHTML = '<option value="">— 选择班级 —</option>';
    classSel.disabled = false;
    return;
  }
  try {
    const r = await fetch(API + '/classes?grade=' + encodeURIComponent(grade) + '&teacher=' + TEACHER);
    const classes = await r.json();
    classSel.innerHTML = '<option value="">— 选择班级 —</option>';
    classes.forEach(c => classSel.innerHTML += `<option value="${c}">${c}</option>`);
    classSel.onchange = onClassChange;
    classSel.disabled = false;
  } catch(e) {
    showToast('加载班级失败', 'error');
    classSel.disabled = false;
  }
}

// 缓存学生名单用于动画
let studentNameCache = [];

async function onClassChange() {
  currentGrade = document.getElementById('gradeSelect').value;
  currentClass = document.getElementById('classSelect').value;
  if (!currentGrade || !currentClass) return;
  // 加载学生名册到缓存（用于滚动动画）
  try {
    const r = await fetch(API + '/students?grade=' + encodeURIComponent(currentGrade) + '&class=' + encodeURIComponent(currentClass) + '&teacher=' + TEACHER);
    const students = await r.json();
    studentNameCache = students.map(s => s.name);
  } catch(e) { studentNameCache = []; }
  await refreshHistory();
  showToast(`📚 ${currentGrade} ${currentClass} 已就绪`, 'info');
}

// ========== 点名（老虎机式动画） ==========
async function pickStudent() {
  if (!currentGrade || !currentClass) { showToast('请先选择年级和班级', 'error'); return; }

  const nameEl = document.getElementById('nameDisplay');
  disableButtons(true);

  // ── 阶段1：先用缓存名字快速滚动（等API返回） ──
  const pool = studentNameCache.length > 0 ? studentNameCache
    : ['张同学','李同学','王同学','赵同学','刘同学','陈同学','杨同学','黄同学','周同学','吴同学'];

  nameEl.textContent = '🎲';
  nameEl.className = 'name rolling';
  let frame = 0;
  const FAST_MS = 50; // 起始速度50ms
  let rollInt = setInterval(() => {
    nameEl.textContent = pool[frame % pool.length];
    frame++;
  }, FAST_MS);

  // ── 发请求 ──
  const data = await postJSON(API + '/pick', { grade: currentGrade, class: currentClass, teacher: TEACHER });

  // ── 阶段2：减速（老虎机效果） ──
  // 先停掉快速滚动
  clearInterval(rollInt);

  if (!data || data.error) {
    nameEl.textContent = '😅';
    nameEl.className = 'name';
    showToast(data?.error || '抽取失败', 'error');
    disableButtons(false);
    return;
  }

  // 减速序列：逐渐拉长间隔，模拟老虎机停下来
  const decelSteps = [
    { ms: 120, count: 8 },   // 稍慢
    { ms: 200, count: 6 },   // 更慢
    { ms: 350, count: 4 },   // 很慢
    { ms: 600, count: 2 },   // 几乎停了
  ];

  let stepIdx = 0;
  let subFrame = 0;
  let decelRunning = true;

  function doDecelStep() {
    if (!decelRunning || stepIdx >= decelSteps.length) {
      // ── 阶段3：最终揭示 ──
      nameEl.textContent = data.student;
      nameEl.className = 'name highlight';
      // 加一个放大的微动画
      nameEl.style.transform = 'scale(1.3)';
      setTimeout(() => { nameEl.style.transform = 'scale(1)'; }, 200);

      lastPicked = data.student;
      disableButtons(false);
      document.getElementById('btnCorrect').disabled = false;
      document.getElementById('btnIncorrect').disabled = false;
      document.getElementById('btnSkip').disabled = false;
      showToast(`🎯 抽中：${data.student}`, 'info');
      updateStats(data.covered, data.total);
      loadHistory();
      return;
    }

    const step = decelSteps[stepIdx];
    // 在本速度下跑若干帧
    const timer = setInterval(() => {
      if (!decelRunning) { clearInterval(timer); return; }
      nameEl.textContent = pool[frame % pool.length];
      frame++;
      subFrame++;
      if (subFrame >= step.count) {
        clearInterval(timer);
        subFrame = 0;
        stepIdx++;
        doDecelStep();
      }
    }, step.ms);
  }

  // 启动减速
  doDecelStep();

  // 安全兜底：5秒后强制揭示
  setTimeout(() => {
    if (decelRunning) {
      decelRunning = false;
      nameEl.textContent = data.student;
      nameEl.className = 'name highlight';
      lastPicked = data.student;
      disableButtons(false);
      document.getElementById('btnCorrect').disabled = false;
      document.getElementById('btnIncorrect').disabled = false;
      document.getElementById('btnSkip').disabled = false;
      showToast(`🎯 抽中：${data.student}`, 'info');
      updateStats(data.covered, data.total);
      loadHistory();
    }
  }, 5000);
}

async function markResult(result) {
  if (!lastPicked) return;
  document.getElementById('btnCorrect').disabled = true;
  document.getElementById('btnIncorrect').disabled = true;
  document.getElementById('btnSkip').disabled = true;

  const data = await postJSON(API + '/mark', {
    grade: currentGrade, class: currentClass,
    student: lastPicked, result: result,
    teacher: TEACHER
  });

  const nameEl = document.getElementById('nameDisplay');
  if (result === 'correct') {
    nameEl.className = 'name correct';
    showToast(`✅ ${lastPicked} +5 ⭐`, 'success');
    launchConfetti();
  } else if (result === 'incorrect') {
    nameEl.className = 'name participated';
    showToast(`💬 ${lastPicked} 参与 +2`, 'info');
  } else {
    showToast(`⏭ 已跳过`, 'info');
  }

  lastPicked = '';
  await loadHistory();
  updateStatsFromHistory();
}

// ========== 历史记录 & 统计 ==========
async function refreshHistory() {
  if (!currentGrade || !currentClass) return;
  await loadHistory();
  updateStatsFromHistory();
}

async function loadHistory() {
  try {
    const r = await fetch(API + '/history?grade=' + encodeURIComponent(currentGrade) + '&class=' + encodeURIComponent(currentClass) + '&teacher=' + TEACHER);
    const data = await r.json();
    renderHistory(data.history || []);
  } catch(e) {
    console.error('加载历史失败:', e);
  }
}

async function updateStatsFromHistory() {
  try {
    const r = await fetch(API + '/history?grade=' + encodeURIComponent(currentGrade) + '&class=' + encodeURIComponent(currentClass) + '&teacher=' + TEACHER);
    const data = await r.json();
    if (data) updateStats(data.covered, data.total);
  } catch(e) {}
}

function updateStats(covered, total) {
  if (total > 0) {
    document.getElementById('statRow').style.display = 'flex';
    document.getElementById('coveredCount').textContent = covered;
    document.getElementById('totalCount').textContent = total;
    document.getElementById('rateCount').textContent = total > 0 ? Math.round(covered/total*100) + '%' : '0%';
  }
}

function renderHistory(history) {
  const list = document.getElementById('historyList');
  const countEl = document.getElementById('historyCount');

  if (!history || history.length === 0) {
    list.innerHTML = '<div class="history-empty">暂无记录 🎯</div>';
    countEl.textContent = '';
    return;
  }

  // 有记录时自动展开
  if (!historyVisible) {
    historyVisible = true;
    list.style.display = 'block';
    document.getElementById('historyArrow').textContent = '▼';
  }

  // 最新在前
  const items = [...history].reverse();

  const correctCount = history.filter(h => h.result === 'correct').length;
  countEl.textContent = `共 ${history.length} 次 · 答对 ${correctCount} 次`;

  list.innerHTML = items.map((r, i) => {
    const idx = history.length - i;
    const label = {correct:'✅ 答对', incorrect:'💬 参与', skip:'⏭ 跳过'}[r.result] || r.result;
    const pts = r.points ? `<span style="color:#66bb6a;font-weight:700">+${r.points}</span>` : '<span style="color:#6b7d9a">-</span>';
    return `<div class="history-item">
      <span class="h-round">#${idx}</span>
      <span class="h-name">${r.student}</span>
      <span class="h-time">${r.time || ''}</span>
      <span class="h-result ${r.result}">${label}</span>
      <span class="h-points">${pts}</span>
    </div>`;
  }).join('');
}

// ========== 重置 ==========
async function resetHistory() {
  if (!currentGrade || !currentClass) { showToast('请先选择班级', 'error'); return; }
  await postJSON(API + '/reset', { grade: currentGrade, class: currentClass, teacher: TEACHER });
  document.getElementById('nameDisplay').textContent = '🎯';
  document.getElementById('nameDisplay').className = 'name';
  document.getElementById('btnCorrect').disabled = true;
  document.getElementById('btnIncorrect').disabled = true;
  document.getElementById('btnSkip').disabled = true;
  lastPicked = '';
  await loadHistory();
  updateStats(0, 0);
  showToast('🔄 已重置', 'info');
}

// ========== 工具函数 ==========
async function postJSON(url, data) {
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    return await r.json();
  } catch(e) {
    console.error('请求失败:', url, e);
    return null;
  }
}

function disableButtons(disabled) {
  document.getElementById('btnPick').disabled = disabled;
  document.getElementById('btnCorrect').disabled = true;
  document.getElementById('btnIncorrect').disabled = true;
  document.getElementById('btnSkip').disabled = true;
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => t.classList.remove('show'), 2500);
}

function launchConfetti() {
  const container = document.getElementById('confetti');
  const colors = ['#4fc3f7','#66bb6a','#ffa726','#ef5350','#ab47bc','#ffd700','#7c4dff'];
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.width = (6 + Math.random() * 8) + 'px';
    p.style.height = (6 + Math.random() * 8) + 'px';
    p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    p.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    p.style.animationDelay = Math.random() * 0.5 + 's';
    container.appendChild(p);
    setTimeout(() => p.remove(), 4000);
  }
}

function createStars() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star-dot';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    s.style.animationDuration = (2 + Math.random() * 3) + 's';
    c.appendChild(s);
  }
}

function bindKeyboard() {
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT') return;
    switch(e.key) {
      case ' ': e.preventDefault(); pickStudent(); break;
      case '1': if (!document.getElementById('btnCorrect').disabled) markResult('correct'); break;
      case '2': if (!document.getElementById('btnIncorrect').disabled) markResult('incorrect'); break;
      case '3': if (!document.getElementById('btnSkip').disabled) markResult('skip'); break;
      case 'r': case 'R': resetHistory(); break;
      case 'f': case 'F':
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
        else document.exitFullscreen().catch(()=>{});
        break;
    }
  });
}
