<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流程及其设计 · 流程图风</title>
<style>

/* 流程图 Flowchart 风格 */
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--fl-green:#2d8f5c;--fl-teal:#1a9e8f;--fl-orange:#e8913a;--fl-red:#d94a4a;--fl-blue:#3a7bd5;--fl-bg:#f5f7fa;--fl-card:#ffffff;--fl-text:#1a2a3a;--fl-text-dim:#6a7a8a;--fl-line:rgba(45,143,92,.12);--font:'Space Grotesk','Segoe UI',sans-serif;--font-body:'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif}
html{font-size:20px}
body{font-family:var(--font-body);background:var(--fl-bg);color:var(--fl-text);min-height:100vh;overflow-x:hidden;display:flex;justify-content:center;position:relative}
#app{position:relative;z-index:1;width:100%;max-width:880px;min-height:100vh;padding:28px 18px 50px;display:flex;flex-direction:column;align-items:center;gap:14px}
.fl-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--fl-card);border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.06);position:relative;border-left:4px solid var(--fl-green)}
.fl-header h1{font-family:var(--font);font-size:.85rem;font-weight:700;color:var(--fl-text);letter-spacing:1px}
.fl-header h1 span{color:var(--fl-green)}
.fl-blocks{display:flex;gap:4px}
.fl-block{width:22px;height:22px;background:var(--fl-bg);clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);transition:all .4s}
.fl-block.done{background:var(--fl-green)}
.fl-block.active{background:var(--fl-orange);animation:fl-pulse .8s ease infinite}
.fl-block.future{background:var(--fl-line)}
@keyframes fl-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.fl-card{width:100%;padding:26px 22px;background:var(--fl-card);border-radius:8px;box-shadow:0 2px 16px rgba(0,0,0,.06);position:relative}
.fl-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--fl-green),var(--fl-teal),var(--fl-orange));border-radius:8px 8px 0 0}
.fl-title{font-family:var(--font);font-size:.8rem;font-weight:700;text-align:center;margin-bottom:16px;color:var(--fl-text);letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:8px}
.fl-title .fl-icon{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;background:var(--fl-green);color:#fff;font-size:.7rem;border-radius:50%}
.setup-group{display:flex;flex-direction:column;gap:14px;max-width:380px;margin:0 auto}
.setup-row{display:flex;flex-direction:column;gap:4px}
.setup-row label{font-family:var(--font);font-size:.7rem;font-weight:600;color:var(--fl-teal);letter-spacing:1px}
.setup-row select,.setup-row button{width:100%;padding:12px 16px;background:var(--fl-bg);border:2px solid transparent;color:var(--fl-text);font-size:.9rem;font-family:var(--font-body);cursor:pointer;transition:all .2s;outline:none;border-radius:6px;font-weight:500}
.setup-row select:hover,.setup-row select:focus{border-color:var(--fl-green);background:#fff}
.setup-row select option{background:#fff;color:var(--fl-text)}
.btn-fl{background:var(--fl-green)!important;border:none!important;color:#fff!important;font-size:.85rem!important;font-weight:700!important;letter-spacing:2px;border-radius:6px!important;transition:all .2s!important}
.btn-fl:hover{background:var(--fl-teal)!important}
.btn-fl:disabled{opacity:.25!important;cursor:not-allowed;transform:none!important}
.pick-section{text-align:center;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pick-fl-area{width:100%;max-width:380px;min-height:100px;display:flex;align-items:center;justify-content:center;margin:4px 0;position:relative}
.pick-fl-name{font-family:var(--font);font-size:3rem;font-weight:700;z-index:2;color:var(--fl-text);letter-spacing:4px;transition:all .12s}
.pick-fl-name.rolling{animation:fl-roll .1s infinite}
@keyframes fl-roll{0%,100%{transform:translateY(0)}25%{transform:translateY(-4px) rotate(-2deg)}75%{transform:translateY(4px) rotate(2deg)}}
.pick-fl-name.result{animation:fl-pop .5s cubic-bezier(.34,1.56,.64,1);color:var(--fl-green)}
@keyframes fl-pop{0%{opacity:0;transform:scale(.3)}50%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
.pick-hint{font-size:.78rem;color:var(--fl-text-dim);margin-top:4px}
.pick-class-tag{font-size:.72rem;color:var(--fl-orange);margin-top:2px;font-weight:500}
.btn-fl-pick{margin-top:10px;padding:10px 40px;background:var(--fl-orange);border:none;color:#fff;font-family:var(--font);font-size:.75rem;font-weight:700;cursor:pointer;letter-spacing:1px;border-radius:6px;transition:all .2s}
.btn-fl-pick:hover{background:var(--fl-teal)}
.btn-fl-pick:disabled{opacity:.25;cursor:not-allowed}
.quiz-section{text-align:center}
.q-fl-num{font-family:var(--font);font-size:.85rem;font-weight:600;color:var(--fl-teal);letter-spacing:1px}
.q-fl-princ{font-size:.8rem;color:var(--fl-green);margin-left:8px;font-weight:500}
.q-fl-text{font-size:1rem;line-height:1.7;margin:10px 0 16px;text-align:left;padding:16px 18px;background:var(--fl-bg);border-radius:6px;color:var(--fl-text);font-weight:400;border-left:4px solid var(--fl-green)}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.option-btn{padding:13px 14px;background:var(--fl-bg);border:2px solid transparent;color:var(--fl-text);font-size:.9rem;text-align:left;cursor:pointer;transition:all .2s;font-family:var(--font-body);line-height:1.5;font-weight:400;display:flex;align-items:flex-start;gap:10px;border-radius:6px}
.option-btn .opt-label{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;font-family:var(--font);font-size:.7rem;font-weight:700;flex-shrink:0;background:#fff;border-radius:50%;color:var(--fl-text-dim);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.option-btn:hover{border-color:var(--fl-teal);background:#fff}
.option-btn.selected{border-color:var(--fl-green);background:rgba(45,143,92,.04)}
.option-btn.selected .opt-label{background:var(--fl-green);color:#fff}
.option-btn.correct{border-color:var(--fl-green)!important;background:rgba(45,143,92,.04)!important}
.option-btn.correct .opt-label{background:var(--fl-green)!important;color:#fff!important}
.option-btn.wrong{border-color:var(--fl-red)!important;background:rgba(217,74,74,.04)!important}
.option-btn.wrong .opt-label{background:var(--fl-red)!important;color:#fff!important}
.option-btn.disabled{pointer-events:none;opacity:.35}
.feedback-box{margin-top:12px;padding:10px 16px;font-size:.88rem;animation:fl-fade .3s;border-radius:6px;font-weight:500}
@keyframes fl-fade{from{opacity:0}to{opacity:1}}
.feedback-box.correct-fb{background:rgba(45,143,92,.06);color:var(--fl-green);border-left:4px solid var(--fl-green)}
.feedback-box.wrong-fb{background:rgba(217,74,74,.04);color:var(--fl-red);border-left:4px solid var(--fl-red)}
.btn-fl-next{margin-top:12px;padding:10px 36px;background:var(--fl-blue);border:none;color:#fff;font-family:var(--font);font-size:.75rem;font-weight:700;cursor:pointer;letter-spacing:1px;border-radius:6px;transition:all .2s}
.btn-fl-next:hover{background:var(--fl-teal)}
.score-section{text-align:center}
.score-big{font-family:var(--font);font-size:3.8rem;font-weight:700;color:var(--fl-green);animation:fl-score .6s cubic-bezier(.34,1.56,.64,1);margin:4px 0}
@keyframes fl-score{0%{opacity:0;transform:rotate(-15deg) scale(.5)}100%{opacity:1;transform:rotate(0) scale(1)}}
.score-label{font-family:var(--font);font-size:.7rem;font-weight:600;color:var(--fl-text-dim);letter-spacing:1px}
.score-detail{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.score-stat{padding:6px 14px;background:var(--fl-bg);border-radius:6px;font-size:.82rem;font-weight:500}
.score-stat strong{color:var(--fl-green);font-weight:700;font-size:.95rem}
.fl-bar-wrap{width:100%;max-width:400px;margin:8px auto}
.fl-bar-bg{width:100%;height:10px;background:var(--fl-bg);border-radius:5px;overflow:hidden}
.fl-bar-fill{height:100%;background:linear-gradient(90deg,var(--fl-green),var(--fl-teal));border-radius:5px;transition:width 1s cubic-bezier(.34,1.56,.64,1)}
.fl-bar-label{display:flex;justify-content:space-between;font-size:.7rem;color:var(--fl-text-dim);margin-top:2px;font-weight:500}
.final-section{text-align:center}
.final-title{font-family:var(--font);font-size:1rem;font-weight:700;color:var(--fl-green);margin-bottom:2px;letter-spacing:2px}
.final-sub{color:var(--fl-text-dim);margin-bottom:14px;font-size:.78rem;font-weight:500}
.final-table{width:100%;border-collapse:separate;border-spacing:0 4px;margin:4px 0 16px}
.final-table th{padding:10px 12px;text-align:left;font-family:var(--font);font-size:.85rem;font-weight:700;color:var(--fl-teal);border-bottom:2px solid var(--fl-bg);letter-spacing:1px}
.final-table td{padding:10px 12px;font-size:.85rem;font-weight:500;background:var(--fl-bg);border-radius:6px}
.final-table tr:first-child td{background:rgba(232,145,58,.08);font-weight:700}
.final-table .rank-num{font-family:var(--font);font-weight:700;color:var(--fl-orange)}
.final-table .rank-score{font-family:var(--font);font-weight:700;color:var(--fl-green)}
.hidden{display:none!important}
.toast-container{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{padding:10px 18px;background:var(--fl-card);border-radius:6px;font-family:var(--font);font-size:.7rem;font-weight:600;color:var(--fl-text);animation:fl-toast .3s forwards;display:flex;align-items:center;gap:8px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.toast .toast-icon{font-size:.9rem}
.toast .toast-score{color:var(--fl-green)}
.toast.out{animation:fl-toast-out .25s forwards}
@keyframes fl-toast{from{transform:translateX(50px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fl-toast-out{from{opacity:1}to{transform:translateX(50px);opacity:0}}
.particle-container{position:fixed;inset:0;pointer-events:none;z-index:999}
.cele-particle{position:fixed;pointer-events:none;animation:fl-part .9s ease-out forwards;border-radius:50%}
@keyframes fl-part{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg)}}
@media(max-width:640px){.fl-header h1{font-size:.7rem}.pick-fl-name{font-size:2.4rem}.pick-fl-name.result{font-size:2.6rem}.options-grid{grid-template-columns:1fr}.q-fl-text{font-size:.9rem}.score-big{font-size:2.6rem}}
.review-section{text-align:left;margin-top:10px;border-top:1px solid var(--fl-line);padding-top:14px;max-height:400px;overflow-y:auto}
.rev-empty{text-align:center;color:var(--fl-green);font-family:var(--font);font-size:.75rem;padding:20px 0}
.rev-student{font-family:var(--font);font-size:.85rem;font-weight:600;color:var(--fl-orange);margin:10px 0 6px;padding-bottom:4px;border-bottom:1px dashed var(--fl-line)}
.rev-item{padding:10px 12px;margin-bottom:8px;background:var(--fl-bg);border-left:3px solid var(--fl-red);border-radius:0 4px 4px 0}
.rev-q{font-size:.88rem;line-height:1.5;margin-bottom:6px}
.rev-princ{display:inline-block;font-family:var(--font);font-size:.75rem;color:var(--fl-text-dim);border:1px solid var(--fl-line);padding:2px 8px;margin-bottom:6px}
.rev-opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.rev-opt{padding:6px 8px;font-size:.78rem;line-height:1.4;border:1px solid var(--fl-line);background:rgba(0,0,0,.02);border-radius:4px;display:flex;align-items:flex-start;gap:6px;color:inherit}
.rev-opt .rev-opt-label{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;font-family:var(--font);font-size:.8rem;font-weight:700;flex-shrink:0;border:1px solid var(--fl-line);border-radius:50%;color:var(--fl-text-dim)}
.rev-opt.rev-chosen{background:rgba(217,74,74,.08);border-color:var(--fl-red)}
.rev-opt.rev-chosen .rev-opt-label{background:var(--fl-red);color:#fff;border-color:var(--fl-red)}
.rev-opt.rev-right{background:rgba(45,143,92,.08);border-color:var(--fl-green)}
.rev-opt.rev-right .rev-opt-label{background:var(--fl-green);color:#fff;border-color:var(--fl-green)}


.bp-block{width:22px;}/* block alias */
.bp-block.done{}
.bp-block.active{}

.gear-icon{display:none}/* hidden */
</style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>
<div class="particle-container" id="particleContainer"></div>
<div id="app">
  <header class="fl-header">
    <h1>流程及其设计 <span>· 流程图</span></h1>
    <div class="fl-blocks" id="memBlocks"></div>
  </header>
  <div class="fl-card" id="sceneSetup">
    <div class="fl-title"><span class="fl-icon">✦</span> 设置</div>
    <div class="setup-group">
      <div class="setup-row"><label>年级</label><select id="gradeSelect"><option value="高一">高一</option><option value="高二">高二</option></select></div>
      <div class="setup-row"><label>班级</label><select id="classSelect" disabled><option value="">—</option></select></div>
      <div class="setup-row" style="margin-top:6px"><button class="btn-PX" id="btnStart" disabled>开始</button></div>
    </div>
  </div>
  <div class="fl-card hidden" id="scenePick">
    <div class="fl-title"><span class="fl-icon">🎯</span> <span id="pickTitle">流程 · 抽取</span></div>
    <div class="pick-section">
      <div class="pick-hint" id="pickHint">点击抽取</div>
      <div class="pick-fl-area"><div class="pick-fl-name" id="pickName">—</div></div>
      <div class="pick-class-tag hidden" id="pickClassTag"></div>
      <button class="btn-fl-pick hidden" id="btnPickStart">➡️ 抽取</button>
      <button class="btn-fl-pick hidden" id="btnPickConfirm" style="background:var(--fl-green);color:var(--fl-dark);border-color:var(--fl-green)">确认</button>
    <button class="btn-fl-pick hidden" id="btnRepick" style="background:var(--fl-green);color:var(--fl-dark);border-color:var(--fl-green)">↻ 重抽</button>
    </div>
  </div>
  <div class="fl-card hidden" id="sceneQuiz">
    <div class="fl-title"><span class="fl-icon">📋</span> <span id="quizTitle">答题</span></div>
    <div class="quiz-section">
      <div><span class="q-fl-num" id="qNumber">1/2</span><span class="q-fl-princ" id="qPrinciple">原理</span></div>
      <div class="q-fl-text" id="qText">—</div>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="feedback-box hidden" id="feedbackBox"></div>
      <button class="btn-fl-next hidden" id="btnNextQ">下一题</button>
    </div>
  </div>
  <div class="fl-card hidden" id="sceneScore">
    <div class="fl-title"><span class="fl-icon">📊</span> 结果</div>
    <div class="score-section">
      <div class="score-label">学生</div>
      <div style="font-size:1rem;font-weight:600;color:var(--fl-pink);margin:3px 0 6px" id="scoreStudent"></div>
      <div class="score-big" id="scorePoints">+10</div>
      <div class="score-label" id="scoreLabel">正确 1 题</div>
      <div class="score-detail" id="scoreDetail"></div>
      <div class="fl-bar-wrap"><div class="fl-bar-bg"><div class="fl-bar-fill" id="energyBar" style="width:0%"></div></div><div class="fl-bar-label"><span>进度</span><span id="energyText">0%</span></div></div>
      <button class="btn-fl-next" id="btnNextRound">下一组</button>
    </div>
  </div>
  <div class="fl-card hidden" id="sceneFinal">
    <div class="fl-title"><span class="fl-icon">🏁</span> 完成</div>
    <div class="final-sub">积分排行榜</div>
    <div style="overflow-x:auto"><table class="final-table"><thead><tr><th>#</th><th>姓名</th><th>班级</th><th>正确</th><th>积分</th></tr></thead><tbody id="finalBody"></tbody></table></div>
        <button class="rev-btn" id="btnReview" style="padding:10px 36px;font-size:.8rem;margin-top:6px;cursor:pointer;border:2px solid #5bc0eb;background:transparent;color:#5bc0eb;font-family:var(--font-mono);border-radius:6px">📋 查看错题解析</button>
    <div class="review-section hidden" id="reviewSection"></div>
<button class="btn-PX" style="padding:10px 36px;font-size:.8rem;cursor:pointer;border:none;border-radius:6px;" onclick="location.reload()">再来一次</button>
  </div>
</div>
<script>// 从 URL 路径自动提取教师用户名
const pathMatch = window.location.pathname.match(/\/api\/files\/([^\/]+)\/html\//);
const TEACHER = (pathMatch ? pathMatch[1] : '') || '';
const Q=[{"question": "下列关于流程的说法中，正确的是（ ）", "options": {"A": "流程就是一系列连续、有规律的事项，它只反映时序，不体现环节。", "B": "任何流程都反映一定的时序，体现一定的环节。", "C": "流程中的时序都是不可颠倒的，因为这反映了事物的内在规律。", "D": "流程的环节划分是固定不变的，不能根据实际情况进行调整。"}, "answer": "B", "principle": "任何流程都反映一定的时序，体现一定的环节。选项A错误，因为流程既反映时序也体现环节；选项C错误，因为有些时序是可以颠倒的；选项D错误，因为环节的划分是相对的，可以调整。"}, {"question": "在流程图中，通常用（ ）表示环节，用（ ）表示时序。", "options": {"A": "方框，单向箭头", "B": "圆框，双向箭头", "C": "菱形，单向箭头", "D": "方框，双向箭头"}, "answer": "A", "principle": "在流程图中，方框表示某个事项或活动，即环节；单向箭头表示事项或活动的顺序关系，即时序。"}, {"question": "公共汽车门口写有\"先下后上\"的字样，其道理是（ ）", "options": {"A": "提醒乘客注意安全", "B": "为了提高速度", "C": "减轻负载", "D": "请乘客遵守流程"}, "answer": "D", "principle": "\"先下后上\"是一个典型的流程规范，体现了时序和环节的安排，旨在让乘客按照合理的顺序上下车，从而提高效率和安全。"}, {"question": "流程设计应考虑的基本因素是（ ）", "options": {"A": "流程的环节", "B": "流程的时序", "C": "流程是否已优化", "D": "事件流动的内在属性和规律"}, "answer": "D", "principle": "流程设计首先要分析事物活动的内在属性和规律，这是确定流程中时序和环节的根本依据。"}, {"question": "小峰同学利用假日在他家后院种植一棵芒果树苗，其种植环节主要有：①放树苗培土，②挖坑，③浇水，④施农家肥，⑤覆土。正确的种植流程是（ ）", "options": {"A": "②→①→④→⑤→③", "B": "②→④→①→⑤→③", "C": "①→②→④→⑤→③", "D": "②→①→⑤→④→③"}, "answer": "B", "principle": "种植树苗的正确流程是：先挖坑，再施农家肥作为底肥，然后放树苗培土，接着覆土，最后浇水。"}, {"question": "下列选项中，属于流程优化的是（ ）", "options": {"A": "将原来的串联工序改为并联工序", "B": "增加生产环节以提高产品质量", "C": "延长加工时间使产品更精细", "D": "减少检测环节以降低成本"}, "answer": "A", "principle": "流程优化可以通过改变工序的时序关系来实现，如将串联改为并联可以缩短工期、提高效率。选项B、C增加了时间成本，选项D可能降低质量，均不属于优化。"}, {"question": "在制定一个科学实验流程时，首先要做的是（ ）", "options": {"A": "准备实验器材", "B": "明确实验目的", "C": "设计实验步骤", "D": "分析实验结果"}, "answer": "B", "principle": "任何流程设计的第一步都是明确目标和任务。在科学实验中，首先要明确实验目的，才能确定后续的环节和时序安排。"}, {"question": "以下关于流程优化的说法，不正确的是（ ）", "options": {"A": "流程优化可以提高工作效率", "B": "流程优化可以降低成本", "C": "流程优化一定会增加环节", "D": "流程优化可以改善质量"}, "answer": "C", "principle": "流程优化不一定增加环节，有时反而会减少或合并环节。优化的目的是提高效率、降低成本、改善质量，而不是增加环节。"}, {"question": "某快递公司对包裹分拣流程进行了优化，将原来的人工分拣改为自动分拣系统。这种优化属于（ ）", "options": {"A": "工期优化", "B": "工艺优化", "C": "成本优化", "D": "技术优化"}, "answer": "D", "principle": "技术优化是指通过引入新技术、新设备来改进流程。将人工分拣改为自动分拣系统，属于技术优化。"}, {"question": "下列流程中，时序可以颠倒的是（ ）", "options": {"A": "炒菜时先放油后放菜", "B": "组装电脑时先装CPU后装散热器", "C": "早上先刷牙后吃早餐", "D": "先设计后施工"}, "answer": "C", "principle": "早上先刷牙后吃早餐的时序可以颠倒（先吃早餐再刷牙也可以），而其他选项的时序反映了事物内在的规律或逻辑，不可颠倒。"}];
const G=[];for(let i=0;i<1;i++)G.push(Q.slice(i*2,i*2+2));

let S={grade:'高一',class:'',students:[],available:[],picks:[],cr:0,cq:0,sa:'',ans:false,rr:[],total:0},_c=0;
function $(i){return document.getElementById(i)}
function sh(i){$(i).classList.remove('hidden')}
function hd(i){$(i).classList.add('hidden')}
function sf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}
function st(i,m,s){const t=document.createElement('div');t.className='toast';t.innerHTML='<span class="toast-icon">'+i+'</span>'+m+(s?' <span class="toast-pts">'+s+'</span>':'');$('toastContainer').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),250)},3000)}
function fp(x,y,c,cnt){const pc=$('particleContainer');for(let i=0;i<cnt;i++){const e=document.createElement('div');e.className='cele-particle';const a=Math.random()*Math.PI*2,d=60+Math.random()*130;e.style.cssText='left:'+(x||innerWidth/2)+'px;top:'+(y||innerHeight/2)+'px;width:'+(5+Math.random()*7)+'px;height:'+(5+Math.random()*7)+'px;background:'+(c||'var(--bp-cyan)')+';--dx:'+(Math.cos(a)*d)+'px;--dy:'+(Math.sin(a)*d)+'px';pc.appendChild(e);setTimeout(()=>e.remove(),1200)}}
function ud(){try{const h=$('bpBlocks')||$('memBlocks')||$('progressDots')||$('popDots');if(!h)return;h.innerHTML='';for(let i=0;i<5;i++){const e=document.createElement('div');e.className='bp-block'+(i<S.cr?' done':i===S.cr?' active':'');e.innerHTML='';h.appendChild(e)}}catch(e){}}
function sv(g,c,n,p){fetch('/api/scores/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,name:n,points:p,teacher:TEACHER})}).then(r=>r.ok?st('💰','保存','+'+p):st('⚠️','异常')).catch(()=>st('📝','本地'))}
function saveRecord(g,c,s,cc,t,pts,ans,title){fetch('/api/rollcall/save-record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,student:s,type:'互动答题',title:title||'',correctCount:cc,totalQuestions:t,points:pts,answers:ans||[],teacher:TEACHER})}).catch(()=>{})}
async function lc(){const g=$('gradeSelect').value;S.grade=g;const cs=$('classSelect');cs.disabled=true;cs.innerHTML='<option value="">...</option>';try{const r=await fetch('/api/rollcall/classes?grade='+encodeURIComponent(g)+'&teacher='+TEACHER);const cls=await r.json();cs.innerHTML='<option value="">— 选择 —</option>';cls.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o)});cs.disabled=false}catch(e){cs.innerHTML='<option value="">失败</option>'}}
$('gradeSelect').addEventListener('change',lc);$('classSelect').addEventListener('change',async function(){const c=this.value;S.class=c;$('btnStart').disabled=!c;if(c){try{const r=await fetch('/api/rollcall/students?grade='+encodeURIComponent(S.grade)+'&class='+encodeURIComponent(c)+'&teacher='+TEACHER);const data=await r.json();S.students=data.map(s=>s.name)}catch(e){S.students=[];st('⚠️','加载学生失败')}}});
$('btnStart').addEventListener('click',function(){if(!S.class||S.students.length<5){st('⚠️','人数不足');return}hd('sceneSetup');sr(0)});
function sr(ri){S.cr=ri;S.cq=0;_c=0;if(!S.rr[ri])S.rr[ri]={correctCount:0,points:0,answers:[]};S.rr[ri].answers=[];ud();sp()}
function sp(){sh('scenePick');hd('sceneQuiz');hd('sceneScore');hd('sceneFinal');$('pickTitle').textContent=(S.cr+1)+'/5';$('pickHint').textContent='点击抽取';$('pickHint').classList.remove('hidden');$('pickClassTag').classList.add('hidden');$('btnPickStart').classList.remove('hidden');$('btnPickConfirm').classList.add('hidden');$('btnRepick').classList.add('hidden');$('pickName').textContent='——';$('pickName').className='pick-name';$('btnPickStart').disabled=false;$('btnPickStart').textContent='🎲 抽取'}
function rp(){const pool=S.students.length>0?S.students:['---'];const pn=$('pickName');pn.className='pick-name rolling';$('pickHint').textContent='抽取中...';$('btnPickConfirm').classList.add('hidden');$('btnRepick').classList.add('hidden');$('btnPickStart').disabled=true;let rc=0,mx=18+Math.floor(Math.random()*10);let iv=setInterval(()=>{pn.textContent=pool[Math.floor(Math.random()*pool.length)];rc++;if(rc>=mx){clearInterval(iv);fetch('/api/rollcall/pick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,teacher:TEACHER})}).then(d=>d.json()).then(d=>{if(d.error){st('⚠️',d.error);pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false;return}const c=d.student;pn.textContent=c;pn.className='pick-name result';$('pickHint').classList.add('hidden');$('pickClassTag').textContent=S.grade+' · '+S.class;$('pickClassTag').classList.remove('hidden');$('btnPickConfirm').classList.remove('hidden');$('btnRepick').classList.remove('hidden');fp(innerWidth/2,innerHeight/2,'var(--bp-cyan)',30);st('🎯','已选',c);S.picks[S.cr]=c}).catch(()=>{st('⚠️','服务异常');pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false})}},60+Math.random()*40)}

$('btnPickStart').addEventListener('click',function(){this.disabled=true;rp()});
$('btnRepick').addEventListener('click',rp);

$('btnPickConfirm').addEventListener('click',function(){hd('scenePick');sq()});
function sq(){sh('sceneQuiz');S.cq=0;sQ()}
function sQ(){const g=G[S.cr],q=g[S.cq];$('quizTitle').textContent='第'+(S.cr+1)+'组';$('qNumber').textContent=(S.cq+1)+'/2';$('qPrinciple').textContent=q.principle;$('qText').textContent=q.question;S.sa='';S.ans=false;$('feedbackBox').classList.add('hidden');$('btnNextQ').classList.add('hidden');const grid=$('optionsGrid');grid.innerHTML='';['A','B','C','D'].forEach(l=>{const b=document.createElement('button');b.className='option-btn';b.innerHTML='<span class="opt-label">'+l+'</span><span>'+q.options[l]+'</span>';b.dataset.label=l;b.addEventListener('click',()=>hA(l));grid.appendChild(b)})}
function hA(l){if(S.ans)return;S.ans=true;const g=G[S.cr],q=g[S.cq],c=q.answer,ic=l===c;if(ic)_c++;S.rr[S.cr].correctCount=_c;let p=5;if(_c===1)p=10;else if(_c===2)p=15;S.rr[S.cr].points=p;S.rr[S.cr].answers.push({question:q.question,options:q.options,correctAnswer:c,yourAnswer:l,principle:q.principle,isCorrect:ic});const btns=$('optionsGrid').querySelectorAll('.option-btn');btns.forEach(b=>{b.classList.add('disabled');if(b.dataset.label===c)b.classList.add('correct');if(b.dataset.label===l&&!ic)b.classList.add('wrong');if(b.dataset.label===l&&ic)b.classList.add('selected')});const fb=$('feedbackBox');fb.classList.remove('hidden');if(ic){fb.className='feedback-box correct-fb';fb.textContent='✅ '+c+'. '+q.options[c];fp(innerWidth/2,innerHeight-80,'var(--bp-green)',12)}else{fb.className='feedback-box wrong-fb';fb.textContent='❌ 正确答案：'+c+'. '+q.options[c]}$('btnNextQ').classList.remove('hidden');$('btnNextQ').textContent=S.cq===0?'下一题 ▸':'结算'}
$('btnNextQ').addEventListener('click',function(){if(S.cq===0){S.cq=1;sQ()}else{hd('sceneQuiz');sSc()}});
function sSc(){sh('sceneScore');const s=S.picks[S.cr];$('scoreStudent').textContent=s+' · '+S.class;const cr=S.rr[S.cr],cc=cr?.correctCount||0,pts=cr?.points||5;$('scorePoints').textContent='+'+pts;$('scoreLabel').textContent='正确 '+cc+' 题';$('scoreDetail').innerHTML='<div class="score-stat">正确 <strong>'+cc+'</strong></div><div class="score-stat">错误 <strong>'+(2-cc)+'</strong></div><div class="score-stat">保底 <strong>5</strong></div>';sv(S.grade,S.class,s,pts);S.total+=pts;fetch('/api/rollcall/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,student:s,result:'quiz',teacher:TEACHER})}).catch(()=>{});saveRecord(S.grade,S.class,s,cc,2,pts,S.rr[S.cr]?.answers,'技术的发展-蓝图');fp(innerWidth/2,innerHeight/2-100,'var(--bp-gold)',25);$('btnNextRound').textContent=S.cr<4?'下一轮 ▸':'完成'}
$('btnNextRound').addEventListener('click',function(){if(S.cr<4){hd('sceneScore');sr(S.cr+1)}else{hd('sceneScore');sF()}});
function sF(){sh('sceneFinal');$('reviewSection').classList.add('hidden');$('btnReview').textContent='📋 查看错题解析';const tb=$('finalBody');tb.innerHTML='';const rows=S.picks.map((n,i)=>{const cr=S.rr[i];return{name:n,correct:cr?.correctCount||0,points:cr?.points||5}}).sort((a,b)=>b.points-a.points);rows.forEach((r,i)=>{const tr=document.createElement('tr');tr.innerHTML='<td class="rank-num">#'+(i+1)+'</td><td>'+r.name+'</td><td>'+r.correct+'/2</td><td class="rank-score">+'+r.points+'</td>';tb.appendChild(tr)});fp(innerWidth/2,innerHeight/2,'var(--bp-cyan)',50);setTimeout(()=>fp(innerWidth/2,innerHeight/2,'var(--bp-gold)',30),400)}
$('btnReview').addEventListener('click',function(){const rs=$('reviewSection');if(!rs.classList.contains('hidden')){rs.classList.add('hidden');this.textContent='📋 查看错题解析';return}this.textContent='📋 收起解析';buildReview();rs.classList.remove('hidden')});
function buildReview(){const rs=$('reviewSection');rs.innerHTML='';let hasWrong=false;const labels=['A','B','C','D'];S.picks.forEach((n,ri)=>{const cr=S.rr[ri];if(!cr||!cr.answers)return;const wrongs=cr.answers.filter(a=>!a.isCorrect);if(!wrongs.length)return;hasWrong=true;let h='<div class="rev-student">⚙ '+n+' · '+S.class+'</div>';wrongs.forEach(a=>{h+='<div class="rev-item"><span class="rev-princ">'+a.principle+'</span><div class="rev-q">'+a.question+'</div><div class="rev-opt-grid">';labels.forEach(l=>{let cls='rev-opt';if(l===a.yourAnswer)cls+=' rev-chosen';if(l===a.correctAnswer)cls+=' rev-right';h+='<div class="'+cls+'"><span class="rev-opt-label">'+l+'</span><span>'+a.options[l]+'</span></div>'});h+='</div></div>'});rs.innerHTML+=h});if(!hasWrong)rs.innerHTML='<div class="rev-empty">\u2705 \u6240\u6709\u540c\u5b66\u5168\u90e8\u7b54\u5bf9\uff01</div>'}
lc();sh('sceneSetup');ud();
</script>
</body>
</html>
