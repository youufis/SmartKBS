<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>◆ 技术的价值 · 孟菲斯答题</title>
<style>
/* ═══════════════════════════════════════
   孟菲斯 Memphis 风格
   几何色块 · 活泼明亮 · 怪诞装饰
   ═══════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --m-blue: #226ce0;
  --m-yellow: #ffb703;
  --m-pink: #ff6b9d;
  --m-green: #06d6a0;
  --m-orange: #fb8500;
  --m-purple: #9b5de5;
  --m-red: #e63946;
  --m-bg: #f8f4e8;
  --m-card: #ffffff;
  --m-text: #1a1a2e;
  --m-text-dim: #7a7a8a;
  --m-shadow: rgba(34,108,224,.12);
  --font: 'Space Grotesk','Segoe UI',sans-serif;
  --font-body: 'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif;
}
html{font-size:20px}
body{
  font-family:var(--font-body);
  background:var(--m-bg);
  color:var(--m-text);
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  justify-content:center;
  position:relative;
}
/* 孟菲斯装饰元素 */
.mem-deco{position:fixed;pointer-events:none;z-index:0;opacity:.15;}
.mem-deco:nth-child(1){top:30px;left:20px;width:60px;height:60px;border:4px solid var(--m-pink);transform:rotate(20deg);border-radius:8px;}
.mem-deco:nth-child(2){top:120px;right:30px;width:40px;height:40px;background:var(--m-yellow);border-radius:50%;}
.mem-deco:nth-child(3){bottom:100px;left:40px;width:50px;height:50px;border:4px dashed var(--m-green);border-radius:50%;}
.mem-deco:nth-child(4){bottom:200px;right:20px;width:30px;height:30px;background:var(--m-pink);transform:rotate(45deg);}

#app{
  position:relative;z-index:1;
  width:100%;max-width:880px;
  min-height:100vh;
  padding:28px 18px 50px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}

/* 孟菲斯头部 */
.mem-header{
  width:100%;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;
  background:var(--m-card);
  border-radius:16px;
  box-shadow:0 4px 20px var(--m-shadow);
  position:relative;
  overflow:hidden;
}
.mem-header::before{
  content:'';position:absolute;top:0;right:0;
  width:80px;height:80px;
  background:repeating-linear-gradient(45deg,var(--m-yellow) 0,var(--m-yellow) 8px,transparent 8px,transparent 16px);
  opacity:.12;
}
.mem-header h1{
  font-family:var(--font);
  font-size:.85rem;font-weight:700;
  color:var(--m-blue);
  letter-spacing:1px;
}
.mem-header h1 span{color:var(--m-pink);}
.mem-blocks{display:flex;gap:4px;}
.mem-block{
  width:22px;height:22px;border-radius:4px;
  background:var(--m-bg);transition:all .4s;
}
.mem-block.done{background:var(--m-green);box-shadow:0 2px 8px rgba(6,208,160,.3);}
.mem-block.active{background:var(--m-yellow);box-shadow:0 2px 8px rgba(255,183,3,.3);animation:mem-pulse .8s ease infinite;}
.mem-block.future{background:rgba(0,0,0,.04);}
@keyframes mem-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

/* 孟菲斯卡片 */
.mem-card{
  width:100%;
  padding:26px 22px;
  background:var(--m-card);
  border-radius:16px;
  box-shadow:0 4px 24px var(--m-shadow);
  animation:mem-in .4s ease-out;
  position:relative;
  overflow:hidden;
}
.mem-card::after{
  content:'';position:absolute;bottom:0;right:0;
  width:50px;height:50px;
  background:radial-gradient(circle,var(--m-yellow) 4px,transparent 4px);
  background-size:10px 10px;
  opacity:.08;
  pointer-events:none;
}
@keyframes mem-in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.mem-title{
  font-family:var(--font);
  font-size:.8rem;font-weight:700;text-align:center;margin-bottom:16px;
  color:var(--m-blue);
  letter-spacing:2px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.mem-title .mem-icon{
  display:inline-flex;width:28px;height:28px;border-radius:6px;
  background:var(--m-yellow);align-items:center;justify-content:center;
  font-size:.7rem;
}

/* 设置 */
.setup-group{display:flex;flex-direction:column;gap:14px;max-width:380px;margin:0 auto;}
.setup-row{display:flex;flex-direction:column;gap:4px;}
.setup-row label{font-family:var(--font);font-size:.7rem;font-weight:600;color:var(--m-pink);letter-spacing:1px;}
.setup-row select,.setup-row button{
  width:100%;padding:12px 16px;
  background:var(--m-bg);
  border:2px solid transparent;
  color:var(--m-text);font-size:.9rem;font-family:var(--font-body);
  cursor:pointer;transition:all .2s;outline:none;border-radius:10px;font-weight:500;
}
.setup-row select:hover,.setup-row select:focus{border-color:var(--m-blue);background:#fff;box-shadow:0 0 0 3px rgba(34,108,224,.08);}
.setup-row select option{background:#fff;color:var(--m-text);}
.btn-mem{
  background:var(--m-blue)!important;
  border:none!important;color:#fff!important;font-size:.85rem!important;
  font-weight:700!important;letter-spacing:2px;
  border-radius:10px!important;transition:all .2s!important;
  box-shadow:0 4px 12px rgba(34,108,224,.25)!important;
}
.btn-mem:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(34,108,224,.3)!important;}
.btn-mem:active{transform:translateY(0);}
.btn-mem:disabled{opacity:.25!important;cursor:not-allowed;transform:none!important;box-shadow:none!important;}

/* 点名 */
.pick-section{text-align:center;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pick-mem-area{width:100%;max-width:380px;min-height:100px;display:flex;align-items:center;justify-content:center;margin:4px 0;position:relative;}
.pick-mem-name{
  font-family:var(--font);
  font-size:3rem;font-weight:700;z-index:2;
  color:var(--m-text);letter-spacing:4px;
  transition:all .12s;
}
.pick-mem-name.rolling{animation:mem-roll .1s infinite;}
@keyframes mem-roll{0%,100%{transform:translateY(0)}25%{transform:translateY(-4px) rotate(-2deg)}75%{transform:translateY(4px) rotate(2deg)}}
.pick-mem-name.result{
  animation:mem-pop .5s cubic-bezier(.34,1.56,.64,1);
  color:var(--m-blue);
}
@keyframes mem-pop{0%{opacity:0;transform:scale(.3)}50%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
.pick-hint{font-size:.78rem;color:var(--m-text-dim);margin-top:4px;}
.pick-class-tag{font-size:.72rem;color:var(--m-purple);margin-top:2px;font-weight:500;}
.btn-mem-pick{
  margin-top:10px;padding:10px 40px;
  background:var(--m-yellow);border:none;
  color:var(--m-text);font-family:var(--font);font-size:.75rem;font-weight:700;
  cursor:pointer;letter-spacing:1px;border-radius:10px;
  transition:all .2s;box-shadow:0 4px 12px rgba(255,183,3,.3);
}
.btn-mem-pick:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(255,183,3,.4);}
.btn-mem-pick:disabled{opacity:.25;cursor:not-allowed;transform:none;}

/* 答题 */
.quiz-section{text-align:center;}
.q-mem-num{font-family:var(--font);font-size:.8rem;font-weight:600;color:var(--m-purple);letter-spacing:1px;}
.q-mem-princ{font-size:.7rem;color:var(--m-green);margin-left:8px;font-weight:500;}
.q-mem-text{
  font-size:1rem;line-height:1.7;margin:10px 0 16px;
  text-align:left;padding:16px 18px;
  background:var(--m-bg);
  border-radius:10px;
  color:var(--m-text);font-weight:400;
  border-left:4px solid var(--m-blue);
}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.option-btn{
  padding:13px 14px;
  background:var(--m-bg);
  border:2px solid transparent;
  color:var(--m-text);font-size:.9rem;text-align:left;cursor:pointer;
  transition:all .2s;font-family:var(--font-body);line-height:1.5;font-weight:400;
  display:flex;align-items:flex-start;gap:10px;
  border-radius:10px;
}
.option-btn .opt-label{
  display:inline-flex;width:28px;height:28px;
  align-items:center;justify-content:center;
  font-family:var(--font);font-size:.7rem;font-weight:700;flex-shrink:0;
  background:#fff;
  border-radius:6px;
  color:var(--m-text-dim);box-shadow:0 1px 4px rgba(0,0,0,.04);
}
.option-btn:hover{border-color:var(--m-yellow);background:#fff;}
.option-btn.selected{border-color:var(--m-blue);background:rgba(34,108,224,.04);}
.option-btn.selected .opt-label{background:var(--m-blue);color:#fff;}
.option-btn.correct{border-color:var(--m-green)!important;background:rgba(6,208,160,.04)!important;}
.option-btn.correct .opt-label{background:var(--m-green)!important;color:#fff!important;}
.option-btn.wrong{border-color:var(--m-red)!important;background:rgba(230,57,70,.04)!important;}
.option-btn.wrong .opt-label{background:var(--m-red)!important;color:#fff!important;}
.option-btn.disabled{pointer-events:none;opacity:.35;}
.feedback-box{margin-top:12px;padding:10px 16px;font-size:.88rem;animation:mem-fade .3s;border-radius:8px;font-weight:500;}
@keyframes mem-fade{from{opacity:0}to{opacity:1}}
.feedback-box.correct-fb{background:rgba(6,208,160,.06);color:var(--m-green);border-left:4px solid var(--m-green);}
.feedback-box.wrong-fb{background:rgba(230,57,70,.04);color:var(--m-red);border-left:4px solid var(--m-red);}
.btn-mem-next{
  margin-top:12px;padding:10px 36px;
  background:var(--m-pink);border:none;
  color:#fff;font-family:var(--font);font-size:.75rem;font-weight:700;
  cursor:pointer;letter-spacing:1px;border-radius:10px;
  transition:all .2s;box-shadow:0 4px 12px rgba(255,107,157,.25);
}
.btn-mem-next:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(255,107,157,.35);}

/* 计分 */
.score-section{text-align:center;}
.score-big{
  font-family:var(--font);
  font-size:3.8rem;font-weight:700;
  color:var(--m-blue);
  animation:mem-score .6s cubic-bezier(.34,1.56,.64,1);
  margin:4px 0;
}
@keyframes mem-score{0%{opacity:0;transform:rotate(-15deg) scale(.5)}100%{opacity:1;transform:rotate(0) scale(1)}}
.score-label{font-family:var(--font);font-size:.7rem;font-weight:600;color:var(--m-text-dim);letter-spacing:1px;}
.score-detail{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
.score-stat{padding:6px 14px;background:var(--m-bg);border-radius:8px;font-size:.82rem;font-weight:500;}
.score-stat strong{color:var(--m-blue);font-weight:700;font-size:.95rem;}
.mem-bar-wrap{width:100%;max-width:400px;margin:8px auto;}
.mem-bar-bg{width:100%;height:10px;background:var(--m-bg);border-radius:5px;overflow:hidden;}
.mem-bar-fill{height:100%;background:linear-gradient(90deg,var(--m-blue),var(--m-purple));border-radius:5px;transition:width 1s cubic-bezier(.34,1.56,.64,1);}
.mem-bar-label{display:flex;justify-content:space-between;font-size:.7rem;color:var(--m-text-dim);margin-top:2px;font-weight:500;}

/* 最终 */
.final-section{text-align:center;}
.final-title{font-family:var(--font);font-size:1rem;font-weight:700;color:var(--m-blue);margin-bottom:2px;letter-spacing:2px;}
.final-sub{color:var(--m-text-dim);margin-bottom:14px;font-size:.78rem;font-weight:500;}
.final-table{width:100%;border-collapse:separate;border-spacing:0 4px;margin:4px 0 16px;}
.final-table th{padding:10px 12px;text-align:left;font-family:var(--font);font-size:.85rem;font-weight:700;color:var(--m-pink);border-bottom:2px solid var(--m-bg);letter-spacing:1px;}
.final-table td{padding:10px 12px;font-size:.85rem;font-weight:500;background:var(--m-bg);border-radius:8px;}
.final-table tr:first-child td{background:rgba(255,183,3,.08);font-weight:700;}
.final-table .rank-num{font-family:var(--font);font-weight:700;color:var(--m-purple);}
.final-table .rank-score{font-family:var(--font);font-weight:700;color:var(--m-blue);}

.hidden{display:none!important;}
.toast-container{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.toast{padding:10px 18px;background:var(--m-card);border-radius:10px;font-family:var(--font);font-size:.7rem;font-weight:600;color:var(--m-text);animation:mem-toast .3s forwards;display:flex;align-items:center;gap:8px;box-shadow:0 4px 16px var(--m-shadow);}
.toast .toast-icon{font-size:.9rem;}
.toast .toast-score{color:var(--m-blue);}
.toast.out{animation:mem-toast-out .25s forwards;}
@keyframes mem-toast{from{transform:translateX(50px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes mem-toast-out{from{opacity:1}to{transform:translateX(50px);opacity:0}}
.particle-container{position:fixed;inset:0;pointer-events:none;z-index:999;}
.cele-particle{position:fixed;pointer-events:none;animation:mem-part .9s ease-out forwards;border-radius:4px;}
@keyframes mem-part{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg)}}

@media(max-width:640px){
  .mem-header h1{font-size:.7rem;}
  .pick-mem-name{font-size:3.2rem;}
  .pick-mem-name.result{font-size:3.6rem;}
  .options-grid{grid-template-columns:1fr;}
  .q-mem-text{font-size:.9rem;}
  .score-big{font-size:2.6rem;}
}

/* 错题解析 */
.review-section{text-align:left;margin-top:10px;border-top:1px solid rgba(255,255,255,.12);padding-top:14px;max-height:400px;overflow-y:auto}
.rev-empty{text-align:center;color:#4ecdc4;font-family:var(--font-mono);font-size:.75rem;padding:20px 0}
.rev-student{font-family:var(--font-mono);font-size:.85rem;font-weight:600;color:#d4a843;margin:10px 0 6px;padding-bottom:4px;border-bottom:1px dashed rgba(255,255,255,.1)}
.rev-item{padding:10px 12px;margin-bottom:8px;background:rgba(0,0,0,.15);border-left:3px solid #ff6b6b;border-radius:0 4px 4px 0}
.rev-q{font-size:.88rem;line-height:1.5;margin-bottom:6px}
.rev-princ{display:inline-block;font-family:var(--font-mono);font-size:.75rem;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1);padding:1px 6px;margin-bottom:6px}
.rev-opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.rev-opt{padding:6px 8px;font-size:.78rem;line-height:1.4;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.08);border-radius:2px;display:flex;align-items:flex-start;gap:6px;color:inherit}
.rev-opt .rev-opt-label{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.8rem;font-weight:700;flex-shrink:0;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.4)}
.rev-opt.rev-chosen{background:rgba(255,107,107,.1);border-color:#ff6b6b}
.rev-opt.rev-chosen .rev-opt-label{background:#ff6b6b;color:#fff;border-color:#ff6b6b}
.rev-opt.rev-right{background:rgba(78,205,196,.1);border-color:#4ecdc4}
.rev-opt.rev-right .rev-opt-label{background:#4ecdc4;color:#1a1a2e;border-color:#4ecdc4}


.bp-block{width:22px;}/* block alias */
.bp-block.done{}
.bp-block.active{}

.gear-icon{display:none}/* hidden */
</style>
</head>
<body>
<div class="mem-deco"></div><div class="mem-deco"></div><div class="mem-deco"></div><div class="mem-deco"></div>
<div class="toast-container" id="toastContainer"></div>
<div class="particle-container" id="particleContainer"></div>
<div id="app">
  <header class="mem-header">
    <h1>◆ 技术的价值 <span>· 孟菲斯</span></h1>
    <div class="mem-blocks" id="memBlocks"></div>
  </header>
  <div class="mem-card" id="sceneSetup">
    <div class="mem-title"><span class="mem-icon">✦</span> 设置</div>
    <div class="setup-group">
      <div class="setup-row"><label>年级</label><select id="gradeSelect"><option value="高一">高一</option><option value="高二">高二</option></select></div>
      <div class="setup-row"><label>班级</label><select id="classSelect" disabled><option value="">—</option></select></div>
      <div class="setup-row" style="margin-top:6px"><button class="btn-mem" id="btnStart" disabled>开始</button></div>
    </div>
  </div>
  <div class="mem-card hidden" id="scenePick">
    <div class="mem-title"><span class="mem-icon">🎯</span> <span id="pickTitle">抽取</span></div>
    <div class="pick-section">
      <div class="pick-hint" id="pickHint">点击抽取</div>
      <div class="pick-mem-area"><div class="pick-mem-name" id="pickName">—</div></div>
      <div class="pick-class-tag hidden" id="pickClassTag"></div>
      <button class="btn-mem-pick hidden" id="btnPickStart">抽取</button>
      <button class="btn-mem-pick hidden" id="btnPickConfirm" style="background:var(--m-green);color:#fff">确认</button>
    <button class="btn-mem-pick hidden" id="btnRepick" style="background:var(--m-green);color:#fff">↻ 重抽</button>
    </div>
  </div>
  <div class="mem-card hidden" id="sceneQuiz">
    <div class="mem-title"><span class="mem-icon">📝</span> <span id="quizTitle">答题</span></div>
    <div class="quiz-section">
      <div><span class="q-mem-num" id="qNumber">1/2</span><span class="q-mem-princ" id="qPrinciple">价值</span></div>
      <div class="q-mem-text" id="qText">—</div>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="feedback-box hidden" id="feedbackBox"></div>
      <button class="btn-mem-next hidden" id="btnNextQ">下一题</button>
    </div>
  </div>
  <div class="mem-card hidden" id="sceneScore">
    <div class="mem-title"><span class="mem-icon">🏆</span> 结果</div>
    <div class="score-section">
      <div class="score-label">学生</div>
      <div style="font-size:1rem;font-weight:600;color:var(--m-pink);margin:3px 0 6px" id="scoreStudent"></div>
      <div class="score-big" id="scorePoints">+10</div>
      <div class="score-label" id="scoreLabel">正确 1 题</div>
      <div class="score-detail" id="scoreDetail"></div>
      <div class="mem-bar-wrap"><div class="mem-bar-bg"><div class="mem-bar-fill" id="energyBar" style="width:0%"></div></div><div class="mem-bar-label"><span>进度</span><span id="energyText">0%</span></div></div>
      <button class="btn-mem-next" id="btnNextRound">下一组</button>
    </div>
  </div>
  <div class="mem-card hidden" id="sceneFinal">
    <div class="mem-title"><span class="mem-icon">🌟</span> 完成</div>
    <div class="final-sub">积分排行榜</div>
    <div style="overflow-x:auto"><table class="final-table"><thead><tr><th>#</th><th>姓名</th><th>班级</th><th>正确</th><th>积分</th></tr></thead><tbody id="finalBody"></tbody></table></div>
        <button class="rev-btn" id="btnReview" style="padding:10px 36px;font-size:.8rem;margin-top:6px;cursor:pointer;border:2px solid #5bc0eb;background:transparent;color:#5bc0eb;font-family:var(--font-mono);border-radius:6px">📋 查看错题解析</button>
    <div class="review-section hidden" id="reviewSection"></div>
<button class="btn-mem" style="padding:10px 36px;font-size:.8rem;cursor:pointer;border:none;border-radius:10px;" onclick="location.reload()">再来一次</button>
  </div>
</div>
<script>// 从 URL 路径自动提取教师用户名
const pathMatch = window.location.pathname.match(/\/api\/files\/([^\/]+)\/html\//);
const TEACHER = (pathMatch ? pathMatch[1] : '') || '';
const Q=[{question:"小明在骑自行车时，佩戴了安全头盔。即使发生意外摔倒，头盔也能有效保护头部免受严重伤害。这主要体现了技术的什么价值？",options:{A:"保护人",B:"解放人",C:"发展人",D:"改造人"},answer:"A",principle:"技术保护人"},{question:"洗衣机能够自动完成洗涤、漂洗、脱水等步骤，让人们从繁重的手工洗衣劳动中解脱出来。这主要体现了技术的什么价值？",options:{A:"保护人",B:"解放人",C:"发展人",D:"满足人"},answer:"B",principle:"技术解放人"},{question:"大国工匠们在各自的专业领域中精益求精，通过攻克技术难题，不仅为国家做出了巨大贡献，也实现了自我价值。这主要体现了技术的什么价值？",options:{A:"保护人",B:"解放人",C:"发展人",D:"经济人"},answer:"C",principle:"技术发展人"},{question:"智能手机和移动互联网的普及，使得移动支付、在线购物、即时通讯等成为人们日常生活的一部分，极大地改变了人们的生活方式。这体现了技术对哪方面的价值？",options:{A:"技术与人",B:"技术与社会",C:"技术与自然",D:"技术与科学"},answer:"B",principle:"技术与社会"},{question:"疫苗的研制成功，使得接种者能够免遭某些致命病毒的侵害，保护了人类的生命安全。这主要体现了技术的什么价值？",options:{A:"保护人",B:"解放人",C:"发展人",D:"创新人"},answer:"A",principle:"技术保护人"},{question:"汽车的出现，让人们可以快速、便捷地到达远方，扩展了人类的活动空间，提高了出行效率。这主要体现了技术的什么价值？",options:{A:"保护人",B:"解放人",C:"发展人",D:"丰富人"},answer:"B",principle:"技术解放人"},{question:"在利用水力发电技术开发水电资源时，需要同时考虑对河流生态环境的影响，采取合理的措施保护生物多样性。这体现了处理技术与什么关系的正确态度？",options:{A:"技术与人",B:"技术与社会",C:"技术与自然",D:"技术与经济"},answer:"C",principle:"技术与自然"},{question:"人们通过学习电脑操作和编程知识，能够解决以前无法处理的数据分析问题，拓宽了自身的能力边界。这主要体现了技术的什么价值？",options:{A:"保护人",B:"解放人",C:"发展人",D:"替代人"},answer:"C",principle:"技术发展人"},{question:"福特T型车流水线生产方式的出现，大幅提高了汽车生产效率，降低了成本，使得汽车进入普通家庭。这主要体现了（ ）。",options:{A:"技术推动社会生产发展",B:"技术保护了劳动者的安全",C:"技术破坏了自然环境",D:"技术仅改变了交通方式"},answer:"A",principle:"技术与社会"},{question:"关于技术的价值，以下说法不正确的是（ ）。",options:{A:"技术既能保护人也能解放人",B:"技术发展人可以提升人的能力",C:"技术的价值只有积极作用没有负面作用",D:"技术的发展需要兼顾与自然的关系"},answer:"C",principle:"技术的价值综合"}];
const G=[];for(let i=0;i<5;i++)G.push(Q.slice(i*2,i*2+2));

let S={grade:'高一',class:'',students:[],available:[],picks:[],cr:0,cq:0,sa:'',ans:false,rr:[],total:0},_c=0;
function $(i){return document.getElementById(i)}
function sh(i){$(i).classList.remove('hidden')}
function hd(i){$(i).classList.add('hidden')}
function sf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}
function st(i,m,s){const t=document.createElement('div');t.className='toast';t.innerHTML='<span class="toast-icon">'+i+'</span>'+m+(s?' <span class="toast-pts">'+s+'</span>':'');$('toastContainer').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),250)},3000)}
function fp(x,y,c,cnt){const pc=$('particleContainer');for(let i=0;i<cnt;i++){const e=document.createElement('div');e.className='cele-particle';const a=Math.random()*Math.PI*2,d=60+Math.random()*130;e.style.cssText='left:'+(x||innerWidth/2)+'px;top:'+(y||innerHeight/2)+'px;width:'+(5+Math.random()*7)+'px;height:'+(5+Math.random()*7)+'px;background:'+(c||'var(--bp-cyan)')+';--dx:'+(Math.cos(a)*d)+'px;--dy:'+(Math.sin(a)*d)+'px';pc.appendChild(e);setTimeout(()=>e.remove(),1200)}}
function ud(){try{const h=$('bpBlocks')||$('memBlocks')||$('progressDots')||$('popDots');if(!h)return;h.innerHTML='';for(let i=0;i<5;i++){const e=document.createElement('div');e.className='bp-block'+(i<S.cr?' done':i===S.cr?' active':'');e.innerHTML='';h.appendChild(e)}}catch(e){}}
function sv(g,c,n,p){fetch('/api/scores/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,name:n,points:p,teacher:TEACHER})}).then(r=>r.ok?st('💰','保存','+'+p):st('⚠️','异常')).catch(()=>st('📝','本地'))}
function saveRecord(g,c,s,cc,t,pts,ans,title){fetch('/api/rollcall/save-record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,student:s,type:'互动答题',title:title||'',correctCount:cc,totalQuestions:t,points:pts,answers:ans||[],teacher:TEACHER})}).catch(()=>{})}
async function lc(){const g=$('gradeSelect').value;S.grade=g;const cs=$('classSelect');cs.disabled=true;cs.innerHTML='<option value="">...</option>';try{const r=await fetch('/api/rollcall/classes?grade='+encodeURIComponent(g)+'&teacher='+TEACHER);const cls=await r.json();cs.innerHTML='<option value="">— 选择 —</option>';cls.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o)});cs.disabled=false}catch(e){cs.innerHTML='<option value="">失败</option>'}}
$('gradeSelect').addEventListener('change',lc);$('classSelect').addEventListener('change',async function(){const c=this.value;S.class=c;$('btnStart').disabled=!c;if(c){try{const r=await fetch('/api/rollcall/students?grade='+encodeURIComponent(S.grade)+'&class='+encodeURIComponent(c)+'&teacher='+TEACHER);const data=await r.json();S.students=data.map(s=>s.name)}catch(e){S.students=[];st('⚠️','加载学生失败')}}});
$('btnStart').addEventListener('click',function(){if(!S.class||S.students.length<5){st('⚠️','人数不足');return}hd('sceneSetup');sr(0)});
function sr(ri){S.cr=ri;S.cq=0;_c=0;if(!S.rr[ri])S.rr[ri]={correctCount:0,points:0,answers:[]};S.rr[ri].answers=[];ud();sp()}
function sp(){sh('scenePick');hd('sceneQuiz');hd('sceneScore');hd('sceneFinal');$('pickTitle').textContent=(S.cr+1)+'/5';$('pickHint').textContent='点击抽取';$('pickHint').classList.remove('hidden');$('pickClassTag').classList.add('hidden');$('btnPickStart').classList.remove('hidden');$('btnPickConfirm').classList.add('hidden');$('btnRepick').classList.add('hidden');$('pickName').textContent='——';$('pickName').className='pick-name';$('btnPickStart').disabled=false;$('btnPickStart').textContent='🎲 抽取'}
function rp(){const pool=S.students.length>0?S.students:['---'];const pn=$('pickName');pn.className='pick-name rolling';$('pickHint').textContent='抽取中...';$('btnPickConfirm').classList.add('hidden');$('btnRepick').classList.add('hidden');$('btnPickStart').disabled=true;let rc=0,mx=18+Math.floor(Math.random()*10);let iv=setInterval(()=>{pn.textContent=pool[Math.floor(Math.random()*pool.length)];rc++;if(rc>=mx){clearInterval(iv);fetch('/api/rollcall/pick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,teacher:TEACHER})}).then(d=>d.json()).then(d=>{if(d.error){st('⚠️',d.error);pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false;return}const c=d.student;pn.textContent=c;pn.className='pick-name result';$('pickHint').classList.add('hidden');$('pickClassTag').textContent=S.grade+' · '+S.class;$('pickClassTag').classList.remove('hidden');$('btnPickConfirm').classList.remove('hidden');$('btnRepick').classList.remove('hidden');fp(innerWidth/2,innerHeight/2,'var(--bp-cyan)',30);st('🎯','已选',c);S.picks[S.cr]=c}).catch(()=>{st('⚠️','服务异常');pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false})}},60+Math.random()*40)}

$('btnPickStart').addEventListener('click',function(){this.disabled=true;rp()});
$('btnRepick').addEventListener('click',rp);

$('btnPickConfirm').addEventListener('click',function(){hd('scenePick');sq()});
function sq(){sh('sceneQuiz');S.cq=0;sQ()}
function sQ(){const g=G[S.cr],q=g[S.cq];$('quizTitle').textContent='第'+(S.cr+1)+'组';$('qNumber').textContent=(S.cq+1)+'/2';$('qPrinciple').textContent=q.principle;$('qText').textContent=q.question;S.sa='';S.ans=false;$('feedbackBox').classList.add('hidden');$('btnNextQ').classList.add('hidden');const grid=$('optionsGrid');grid.innerHTML='';['A','B','C','D'].forEach(l=>{const b=document.createElement('button');b.className='option-btn';b.innerHTML='<span class="opt-label">'+l+'</span><span>'+q.options[l]+'</span>';b.dataset.label=l;b.addEventListener('click',()=>hA(l));grid.appendChild(b)})}
function hA(l){if(S.ans)return;S.ans=true;const g=G[S.cr],q=g[S.cq],c=q.answer,ic=l===c;if(ic)_c++;S.rr[S.cr].correctCount=_c;let p=5;if(_c===1)p=10;else if(_c===2)p=15;S.rr[S.cr].points=p;S.rr[S.cr].answers.push({question:q.question,options:q.options,correctAnswer:c,yourAnswer:l,principle:q.principle,isCorrect:ic});const btns=$('optionsGrid').querySelectorAll('.option-btn');btns.forEach(b=>{b.classList.add('disabled');if(b.dataset.label===c)b.classList.add('correct');if(b.dataset.label===l&&!ic)b.classList.add('wrong');if(b.dataset.label===l&&ic)b.classList.add('selected')});const fb=$('feedbackBox');fb.classList.remove('hidden');if(ic){fb.className='feedback-box correct-fb';fb.textContent='✅ '+c+'. '+q.options[c];fp(innerWidth/2,innerHeight-80,'var(--bp-green)',12)}else{fb.className='feedback-box wrong-fb';fb.textContent='❌ 正确答案：'+c+'. '+q.options[c]}$('btnNextQ').classList.remove('hidden');$('btnNextQ').textContent=S.cq===0?'下一题 ▸':'结算'}
$('btnNextQ').addEventListener('click',function(){if(S.cq===0){S.cq=1;sQ()}else{hd('sceneQuiz');sSc()}});
function sSc(){sh('sceneScore');const s=S.picks[S.cr];$('scoreStudent').textContent=s+' · '+S.class;const cr=S.rr[S.cr],cc=cr?.correctCount||0,pts=cr?.points||5;$('scorePoints').textContent='+'+pts;$('scoreLabel').textContent='正确 '+cc+' 题';$('scoreDetail').innerHTML='<div class="score-stat">正确 <strong>'+cc+'</strong></div><div class="score-stat">错误 <strong>'+(2-cc)+'</strong></div><div class="score-stat">保底 <strong>5</strong></div>';sv(S.grade,S.class,s,pts);S.total+=pts;fetch('/api/rollcall/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,student:s,result:'quiz',teacher:TEACHER})}).catch(()=>{});saveRecord(S.grade,S.class,s,cc,2,pts,S.rr[S.cr]?.answers,'技术的发展-蓝图');fp(innerWidth/2,innerHeight/2-100,'var(--bp-gold)',25);$('btnNextRound').textContent=S.cr<4?'下一轮 ▸':'完成'}
$('btnNextRound').addEventListener('click',function(){if(S.cr<4){hd('sceneScore');sr(S.cr+1)}else{hd('sceneScore');sF()}});
function sF(){sh('sceneFinal');$('reviewSection').classList.add('hidden');$('btnReview').textContent='📋 查看错题解析';const tb=$('finalBody');tb.innerHTML='';const rows=S.picks.map((n,i)=>{const cr=S.rr[i];return{name:n,correct:cr?.correctCount||0,points:cr?.points||5}}).sort((a,b)=>b.points-a.points);rows.forEach((r,i)=>{const tr=document.createElement('tr');tr.innerHTML='<td class="rank-num">#'+(i+1)+'</td><td>'+r.name+'</td><td>'+r.correct+'/2</td><td class="rank-score">+'+r.points+'</td>';tb.appendChild(tr)});fp(innerWidth/2,innerHeight/2,'var(--bp-cyan)',50);setTimeout(()=>fp(innerWidth/2,innerHeight/2,'var(--bp-gold)',30),400)}
$('btnReview').addEventListener('click',function(){const rs=$('reviewSection');if(!rs.classList.contains('hidden')){rs.classList.add('hidden');this.textContent='📋 查看错题解析';return}this.textContent='📋 收起解析';buildReview();rs.classList.remove('hidden')});
function buildReview(){const rs=$('reviewSection');rs.innerHTML='';let hasWrong=false;const labels=['A','B','C','D'];S.picks.forEach((n,ri)=>{const cr=S.rr[ri];if(!cr||!cr.answers)return;const wrongs=cr.answers.filter(a=>!a.isCorrect);if(!wrongs.length)return;hasWrong=true;let h='<div class="rev-student">⚙ '+n+' · '+S.class+'</div>';wrongs.forEach(a=>{h+='<div class="rev-item"><span class="rev-princ">'+a.principle+'</span><div class="rev-q">'+a.question+'</div><div class="rev-opt-grid">';labels.forEach(l=>{let cls='rev-opt';if(l===a.yourAnswer)cls+=' rev-chosen';if(l===a.correctAnswer)cls+=' rev-right';h+='<div class="'+cls+'"><span class="rev-opt-label">'+l+'</span><span>'+a.options[l]+'</span></div>'});h+='</div></div>'});rs.innerHTML+=h});if(!hasWrong)rs.innerHTML='<div class="rev-empty">\u2705 \u6240\u6709\u540c\u5b66\u5168\u90e8\u7b54\u5bf9\uff01</div>'}
lc();sh('sceneSetup');ud();
</script>
</body>
</html>
