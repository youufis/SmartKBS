function renderCards(){const grid=document.getElementById('course-grid');courses.forEach(course=>{const card=document.createElement('div');card.className='course-card';card.innerHTML='<div class="course-header"><span class="course-num">第'+course.num+'课</span><span class="course-title">'+course.title+'</span></div>';card.innerHTML+='<div class="course-links">';if(course.ppt){card.innerHTML+='<a href="'+course.ppt+'" target="_blank" class="course-btn ppt-btn">📄 PPT</a>';}if(course.online){card.innerHTML+='<a href="'+course.online+'" target="_blank" class="course-btn online-btn">🌐 在线课程</a>';}course.interactive.forEach((file,idx)=>{card.innerHTML+='<a href="'+file+'" target="_blank" class="course-btn interactive-btn">🎮 交互'+(course.interactive.length>1?idx+1:'')+'</a>';});card.innerHTML+='</div>';grid.appendChild(card);});}

class NeuralNetwork{constructor(canvas){this.canvas=canvas;this.ctx=canvas.getContext('2d');this.particles=[];this.resize();this.initParticles();this.animate();}resize(){this.canvas.width=window.innerWidth;this.canvas.height=window.innerHeight;}initParticles(){const count=Math.min(80,Math.floor(this.canvas.width*this.canvas.height/20000));for(let i=0;i<count;i++){this.particles.push({x:Math.random()*this.canvas.width,y:Math.random()*this.canvas.height,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,radius:Math.random()*2+1,color:`hsla(${Math.random()*60+240},70%,60%,${Math.random()*0.5+0.2})`});}}animate(){this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);this.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>this.canvas.width)p.vx*=-1;if(p.y<0||p.y>this.canvas.height)p.vy*=-1;this.ctx.beginPath();this.ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);this.ctx.fillStyle=p.color;this.ctx.fill();});requestAnimationFrame(()=>this.animate());}}
new NeuralNetwork(document.getElementById('canvas'));
