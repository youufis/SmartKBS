<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梯度下降优化器 - 交互式学习</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; overflow-x: hidden; }
        .canvas-container { position: relative; width: 100%; height: 400px; background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        canvas { cursor: crosshair; }
        .formula-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(4px); }
    </style>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const katexOptions = {
        delimiters: [
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false},
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
        ],
        throwOnError: false,
        strict: false,
        trust: true
    };

    let renderTimeout;
    function safeRender() {
        if (renderTimeout) clearTimeout(renderTimeout);
        renderTimeout = setTimeout(() => {
            renderMathInElement(document.body, katexOptions);
        }, 100);
    }

    renderMathInElement(document.body, katexOptions);

    const observer = new MutationObserver((mutations) => {
        let shouldRender = false;
        mutations.forEach((mutation) => {
            if (mutation.target &&
                mutation.target.className &&
                typeof mutation.target.className === 'string' &&
                mutation.target.className.includes('katex')) {
                return;
            }
            shouldRender = true;
        });

        if (shouldRender) {
            safeRender();
        }
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true,
        characterData: true
    });

    setInterval(() => {
        const text = document.body.innerText;
        if (text.includes('\\(') || text.includes('$$')) {
            safeRender();
        }
    }, 2000);
});
</script>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="mb-6">
            <h1 class="text-3xl font-bold text-slate-800">梯度下降优化器 (Gradient Descent)</h1>
            <p class="text-slate-600 mt-2">调整学习率 \(\eta\)，观察模型如何沿着损失函数的负梯度方向寻找最小值。</p>
        </header>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- Controls Sidebar -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="font-semibold text-slate-700 mb-4 flex items-center">
                        <span class="w-2 h-5 bg-blue-500 rounded-full mr-2"></span> 参数设置
                    </h2>
                    
                    <div class="space-y-4">
                        <!-- Learning Rate -->
                        <div>
                            <div class="flex justify-between mb-1">
                                <label class="text-sm font-medium text-slate-600">学习率 \(\eta\)</label>
                                <span id="lr-val" class="text-sm font-mono font-bold text-blue-600">0.100</span>
                            </div>
                            <input type="range" id="lr-slider" min="0.01" max="1.1" step="0.01" value="0.1" 
                                class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                        </div>

                        <!-- Initial Position -->
                        <div>
                            <div class="flex justify-between mb-1">
                                <label class="text-sm font-medium text-slate-600">初始位置 \(x_0\)</label>
                                <span id="x0-val" class="text-sm font-mono font-bold text-slate-600">-1.50</span>
                            </div>
                            <input type="range" id="pos-slider" min="-2.1" max="2.1" step="0.01" value="-1.5" 
                                class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-slate-600">
                        </div>

                        <div class="pt-4 space-y-2">
                            <button id="btn-start" class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition-colors shadow-md active:scale-95">
                                开始训练
                            </button>
                            <button id="btn-reset" class="w-full py-2 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg transition-colors">
                                重置
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Info Display -->
                <div class="bg-blue-50 p-5 rounded-xl border border-blue-100">
                    <h3 class="text-xs font-bold text-blue-800 uppercase tracking-wider mb-2">实时状态</h3>
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        <div class="text-slate-500 text-xs">迭代步数:</div>
                        <div id="stat-steps" class="font-mono font-bold text-blue-900 text-right">0</div>
                        <div class="text-slate-500 text-xs">当前梯度:</div>
                        <div id="stat-grad" class="font-mono font-bold text-blue-900 text-right">0.000</div>
                        <div class="text-slate-500 text-xs">当前损失:</div>
                        <div id="stat-loss" class="font-mono font-bold text-blue-900 text-right">0.000</div>
                    </div>
                </div>
            </div>

            <!-- Visualization Area -->
            <div class="lg:col-span-3 space-y-4">
                <div class="canvas-container overflow-hidden">
                    <canvas id="main-canvas"></canvas>
                    <div class="absolute bottom-4 left-4 formula-card px-3 py-2 rounded-lg border border-slate-200 text-sm shadow-sm">
                        更新规则: \(\theta_{t+1} = \theta_t - \eta \cdot \nabla J(\theta_t)\)
                    </div>
                    <div id="status-tag" class="absolute top-4 right-4 hidden px-3 py-1 rounded-full text-xs font-bold uppercase tracking-widest shadow-sm">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Insights -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="p-4 bg-white rounded-lg border border-slate-100 shadow-sm">
                        <h4 class="text-sm font-bold text-slate-700 mb-1">学习率过小</h4>
                        <p class="text-xs text-slate-500">更新步长极短，收敛缓慢，容易陷入局部最优解。</p>
                    </div>
                    <div class="p-4 bg-white rounded-lg border border-slate-100 shadow-sm">
                        <h4 class="text-sm font-bold text-slate-700 mb-1">学习率适中</h4>
                        <p class="text-xs text-slate-500">步长随梯度减小而自动缩放，平稳收敛至最低点。</p>
                    </div>
                    <div class="p-4 bg-white rounded-lg border border-slate-100 shadow-sm">
                        <h4 class="text-sm font-bold text-slate-700 mb-1">学习率过大</h4>
                        <p class="text-xs text-slate-500">步长超过波谷跨度，产生震荡甚至导致损失值发散。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Setup Environment
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const lrSlider = document.getElementById('lr-slider');
        const posSlider = document.getElementById('pos-slider');
        const btnStart = document.getElementById('btn-start');
        const btnReset = document.getElementById('btn-reset');
        
        const lrValTxt = document.getElementById('lr-val');
        const x0ValTxt = document.getElementById('x0-val');
        const statSteps = document.getElementById('stat-steps');
        const statGrad = document.getElementById('stat-grad');
        const statLoss = document.getElementById('stat-loss');
        const statusTag = document.getElementById('status-tag');

        // 2. Physics & Logic Consts
        // Loss Function: f(x) = 0.5x^4 - 2x^2 + 0.3x + 2 (Non-convex with local/global minima)
        const f = (x) => 0.5 * Math.pow(x, 4) - 2 * Math.pow(x, 2) + 0.3 * x + 4;
        const df = (x) => 2 * Math.pow(x, 3) - 4 * x + 0.3;

        let state = {
            x: -1.5,
            lr: 0.1,
            steps: 0,
            isRunning: false,
            path: [],
            isDiverged: false,
            isConverged: false
        };

        // 3. Canvas Utilities
        const padding = 50;
        const getXPixel = (val) => padding + (val + 2.5) * (canvas.width - 2 * padding) / 5;
        const getYPixel = (val) => canvas.height - padding - (val * (canvas.height - 2 * padding) / 8);

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            draw();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 4. Interaction Handlers
        lrSlider.addEventListener('input', (e) => {
            state.lr = parseFloat(e.target.value);
            lrValTxt.textContent = state.lr.toFixed(3);
        });

        posSlider.addEventListener('input', (e) => {
            if (!state.isRunning) {
                state.x = parseFloat(e.target.value);
                x0ValTxt.textContent = state.x.toFixed(2);
                state.path = [{x: state.x, y: f(state.x)}];
                state.steps = 0;
                state.isDiverged = false;
                state.isConverged = false;
                draw();
            }
        });

        btnStart.addEventListener('click', () => {
            if (state.isDiverged || state.isConverged) resetSim();
            state.isRunning = !state.isRunning;
            btnStart.textContent = state.isRunning ? "暂停训练" : "继续训练";
            btnStart.classList.toggle('bg-blue-600');
            btnStart.classList.toggle('bg-amber-500');
            if (state.isRunning) loop();
        });

        btnReset.addEventListener('click', resetSim);

        function resetSim() {
            state.isRunning = false;
            state.x = parseFloat(posSlider.value);
            state.steps = 0;
            state.path = [{x: state.x, y: f(state.x)}];
            state.isDiverged = false;
            state.isConverged = false;
            btnStart.textContent = "开始训练";
            btnStart.className = "w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition-colors shadow-md active:scale-95";
            statusTag.classList.add('hidden');
            draw();
        }

        // 5. Simulation Logic
        function step() {
            if (state.isDiverged || state.isConverged) {
                state.isRunning = false;
                return;
            }

            const gradient = df(state.x);
            const stepSize = state.lr * gradient;
            
            // Apply Update Rule: θ_{t+1} = θ_t - η * ∇J
            state.x = state.x - stepSize;
            state.steps++;
            
            const currentY = f(state.x);
            state.path.push({x: state.x, y: currentY});

            // Convergence check (Gradient near zero)
            if (Math.abs(gradient) < 0.001) {
                state.isConverged = true;
                showStatus("已收敛", "bg-green-100 text-green-700");
            }

            // Divergence check (Value exploded or left bounds)
            if (Math.abs(state.x) > 3 || currentY > 15) {
                state.isDiverged = true;
                showStatus("发散 (LR过高)", "bg-red-100 text-red-700");
            }
            
            if (state.steps > 500) {
                state.isRunning = false;
            }
        }

        function showStatus(text, classes) {
            statusTag.textContent = text;
            statusTag.className = `absolute top-4 right-4 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-widest shadow-sm ${classes}`;
            statusTag.classList.remove('hidden');
        }

        function loop() {
            if (!state.isRunning) return;
            step();
            draw();
            setTimeout(() => requestAnimationFrame(loop), 50);
        }

        // 6. Drawing
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Grid
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i = -2; i <= 2; i += 1) {
                let px = getXPixel(i);
                ctx.moveTo(px, padding);
                ctx.lineTo(px, canvas.height - padding);
            }
            ctx.stroke();

            // Draw Loss Function Curve
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let i = -2.5; i <= 2.5; i += 0.05) {
                const px = getXPixel(i);
                const py = getYPixel(f(i));
                if (i === -2.5) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();

            // Draw Optimization Path
            if (state.path.length > 1) {
                ctx.strokeStyle = '#3b82f6';
                ctx.setLineDash([5, 5]);
                ctx.lineWidth = 2;
                ctx.beginPath();
                state.path.forEach((pt, idx) => {
                    const px = getXPixel(pt.x);
                    const py = getYPixel(pt.y);
                    if (idx === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                });
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Draw Gradient Vector (at current point)
            const g = df(state.x);
            const curX = getXPixel(state.x);
            const curY = getYPixel(f(state.x));
            
            if (!state.isDiverged) {
                // Gradient Direction Arrow
                ctx.strokeStyle = '#ef4444';
                ctx.fillStyle = '#ef4444';
                ctx.lineWidth = 2;
                const arrowLen = -g * 20; // Scale for visual
                ctx.beginPath();
                ctx.moveTo(curX, curY - 10);
                ctx.lineTo(curX + arrowLen, curY - 10);
                ctx.stroke();
                // Little arrow head
                ctx.beginPath();
                ctx.moveTo(curX + arrowLen, curY - 10);
                ctx.lineTo(curX + arrowLen - Math.sign(arrowLen)*5, curY - 15);
                ctx.lineTo(curX + arrowLen - Math.sign(arrowLen)*5, curY - 5);
                ctx.fill();

                // Draw Current Point (The Ball)
                ctx.fillStyle = '#1e293b';
                ctx.beginPath();
                ctx.arc(curX, curY, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Update UI Stats
            statSteps.textContent = state.steps;
            statGrad.textContent = g.toFixed(4);
            statLoss.textContent = f(state.x).toFixed(4);
        }

        // Init draw
        draw();
    </script>
</body>
</html>
