<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通用技术 · 必修二 · 互动答题</title>
<style>

/* 必修二 · 科技蓝风格 */
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--t2-blue:#1a5c9e;--t2-cyan:#1a9e8f;--t2-amber:#e8913a;--t2-red:#d94a4a;--t2-indigo:#3a5bd5;--t2-bg:#e8eef8;--t2-card:#ffffff;--t2-text:#1a2a3a;--t2-text-dim:#5a7a8a;--t2-line:rgba(26,92,158,.12);--font:'Space Grotesk','Segoe UI',sans-serif;--font-body:'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif}
html{font-size:20px}
body{font-family:var(--font-body);background:var(--t2-bg);color:var(--t2-text);min-height:100vh;overflow-x:hidden;display:flex;justify-content:center;position:relative}
#app{position:relative;z-index:1;width:100%;max-width:880px;min-height:100vh;padding:28px 18px 50px;display:flex;flex-direction:column;align-items:center;gap:14px}
.t2-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--t2-card);border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.06);position:relative;border-left:4px solid var(--t2-blue)}
.t2-header h1{font-family:var(--font);font-size:.85rem;font-weight:700;color:var(--t2-text);letter-spacing:1px}
.t2-header h1 span{color:var(--t2-amber)}
.t2-blocks{display:flex;gap:4px}
.t2-block{width:22px;height:22px;background:var(--t2-bg);border-radius:4px;transition:all .4s}
.t2-block.done{background:var(--t2-blue)}
.t2-block.active{background:var(--t2-amber);animation:t2-pulse .8s ease infinite}
.t2-block.future{background:var(--t2-line)}
@keyframes t2-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.t2-card{width:100%;padding:26px 22px;background:var(--t2-card);border-radius:10px;box-shadow:0 2px 16px rgba(0,0,0,.06);position:relative}
.t2-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--t2-blue),var(--t2-cyan),var(--t2-amber));border-radius:10px 10px 0 0}
.t2-title{font-family:var(--font);font-size:.8rem;font-weight:700;text-align:center;margin-bottom:16px;color:var(--t2-text);letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:8px}
.t2-title .t2-icon{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;background:var(--t2-blue);color:#fff;font-size:.7rem;border-radius:50%}
.setup-group{display:flex;flex-direction:column;gap:14px;max-width:380px;margin:0 auto}
.setup-row{display:flex;flex-direction:column;gap:4px}
.setup-row label{font-family:var(--font);font-size:.7rem;font-weight:600;color:var(--t2-cyan);letter-spacing:1px}
.setup-row select,.setup-row button{width:100%;padding:12px 16px;background:var(--t2-bg);border:2px solid transparent;color:var(--t2-text);font-size:.9rem;font-family:var(--font-body);cursor:pointer;transition:all .2s;outline:none;border-radius:6px;font-weight:500}
.setup-row select:hover,.setup-row select:focus{border-color:var(--t2-blue);background:#fff}
.setup-row select option{background:#fff;color:var(--t2-text)}
.btn-t2{background:var(--t2-blue)!important;border:none!important;color:#fff!important;font-size:.85rem!important;font-weight:700!important;letter-spacing:2px;border-radius:6px!important;transition:all .2s!important}
.btn-t2:hover{background:var(--t2-cyan)!important}
.btn-t2:disabled{opacity:.25!important;cursor:not-allowed;transform:none!important}
.pick-section{text-align:center;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pick-t2-area{width:100%;max-width:380px;min-height:100px;display:flex;align-items:center;justify-content:center;margin:4px 0;position:relative}
.pick-t2-name{font-family:var(--font);font-size:2.2rem;font-weight:700;z-index:2;color:var(--t2-text);letter-spacing:4px;transition:all .12s}
.pick-t2-name.rolling{animation:t2-roll .1s infinite}
@keyframes t2-roll{0%,100%{transform:translateY(0)}25%{transform:translateY(-4px) rotate(-2deg)}75%{transform:translateY(4px) rotate(2deg)}}
.pick-t2-name.result{animation:t2-pop .5s cubic-bezier(.34,1.56,.64,1);color:var(--t2-blue)}
@keyframes t2-pop{0%{opacity:0;transform:scale(.3)}50%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
.pick-hint{font-size:.78rem;color:var(--t2-text-dim);margin-top:4px}
.pick-class-tag{font-size:.72rem;color:var(--t2-amber);margin-top:2px;font-weight:500}
.btn-t2-pick{margin-top:10px;padding:10px 40px;background:var(--t2-amber);border:none;color:#fff;font-family:var(--font);font-size:.75rem;font-weight:700;cursor:pointer;letter-spacing:1px;border-radius:6px;transition:all .2s}
.btn-t2-pick:hover{background:var(--t2-cyan)}
.btn-t2-pick:disabled{opacity:.25;cursor:not-allowed}
.quiz-section{text-align:center}
.q-t2-num{font-family:var(--font);font-size:.6rem;font-weight:600;color:var(--t2-cyan);letter-spacing:1px}
.q-t2-princ{font-size:.7rem;color:var(--t2-blue);margin-left:8px;font-weight:500}
.q-t2-text{font-size:1rem;line-height:1.7;margin:10px 0 16px;text-align:left;padding:16px 18px;background:var(--t2-bg);border-radius:6px;color:var(--t2-text);font-weight:400;border-left:4px solid var(--t2-blue)}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.option-btn{padding:13px 14px;background:var(--t2-bg);border:2px solid transparent;color:var(--t2-text);font-size:.9rem;text-align:left;cursor:pointer;transition:all .2s;font-family:var(--font-body);line-height:1.5;font-weight:400;display:flex;align-items:flex-start;gap:10px;border-radius:6px}
.option-btn .opt-label{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;font-family:var(--font);font-size:.7rem;font-weight:700;flex-shrink:0;background:#fff;border-radius:50%;color:var(--t2-text-dim);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.option-btn:hover{border-color:var(--t2-cyan);background:#fff}
.option-btn.selected{border-color:var(--t2-blue);background:rgba(26,92,158,.04)}
.option-btn.selected .opt-label{background:var(--t2-blue);color:#fff}
.option-btn.correct{border-color:var(--t2-blue)!important;background:rgba(26,92,158,.04)!important}
.option-btn.correct .opt-label{background:var(--t2-blue)!important;color:#fff!important}
.option-btn.wrong{border-color:var(--t2-red)!important;background:rgba(217,74,74,.04)!important}
.option-btn.wrong .opt-label{background:var(--t2-red)!important;color:#fff!important}
.option-btn.disabled{pointer-events:none;opacity:.35}
.feedback-box{margin-top:12px;padding:10px 16px;font-size:.88rem;animation:t2-fade .3s;border-radius:6px;font-weight:500}
@keyframes t2-fade{from{opacity:0}to{opacity:1}}
.feedback-box.correct-fb{background:rgba(26,92,158,.06);color:var(--t2-blue);border-left:4px solid var(--t2-blue)}
.feedback-box.wrong-fb{background:rgba(217,74,74,.04);color:var(--t2-red);border-left:4px solid var(--t2-red)}
.btn-t2-next{margin-top:12px;padding:10px 36px;background:var(--t2-indigo);border:none;color:#fff;font-family:var(--font);font-size:.75rem;font-weight:700;cursor:pointer;letter-spacing:1px;border-radius:6px;transition:all .2s}
.btn-t2-next:hover{background:var(--t2-cyan)}
.score-section{text-align:center}
.score-big{font-family:var(--font);font-size:3.8rem;font-weight:700;color:var(--t2-blue);animation:t2-score .6s cubic-bezier(.34,1.56,.64,1);margin:4px 0}
@keyframes t2-score{0%{opacity:0;transform:rotate(-15deg) scale(.5)}100%{opacity:1;transform:rotate(0) scale(1)}}
.score-label{font-family:var(--font);font-size:.7rem;font-weight:600;color:var(--t2-text-dim);letter-spacing:1px}
.score-detail{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.score-stat{padding:6px 14px;background:var(--t2-bg);border-radius:6px;font-size:.82rem;font-weight:500}
.score-stat strong{color:var(--t2-blue);font-weight:700;font-size:.95rem}
.t2-bar-wrap{width:100%;max-width:400px;margin:8px auto}
.t2-bar-bg{width:100%;height:10px;background:var(--t2-bg);border-radius:5px;overflow:hidden}
.t2-bar-fill{height:100%;background:linear-gradient(90deg,var(--t2-blue),var(--t2-cyan));border-radius:5px;transition:width 1s cubic-bezier(.34,1.56,.64,1)}
.t2-bar-label{display:flex;justify-content:space-between;font-size:.7rem;color:var(--t2-text-dim);margin-top:2px;font-weight:500}
.final-section{text-align:center}
.final-title{font-family:var(--font);font-size:1rem;font-weight:700;color:var(--t2-blue);margin-bottom:2px;letter-spacing:2px}
.final-sub{color:var(--t2-text-dim);margin-bottom:14px;font-size:.78rem;font-weight:500}
.final-table{width:100%;border-collapse:separate;border-spacing:0 4px;margin:4px 0 16px}
.final-table th{padding:10px 12px;text-align:left;font-family:var(--font);font-size:.65rem;font-weight:700;color:var(--t2-cyan);border-bottom:2px solid var(--t2-bg);letter-spacing:1px}
.final-table td{padding:10px 12px;font-size:.85rem;font-weight:500;background:var(--t2-bg);border-radius:6px}
.final-table tr:first-child td{background:rgba(232,145,58,.08);font-weight:700}
.final-table .rank-num{font-family:var(--font);font-weight:700;color:var(--t2-amber)}
.final-table .rank-score{font-family:var(--font);font-weight:700;color:var(--t2-blue)}
.hidden{display:none!important}
.toast-container{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{padding:10px 18px;background:var(--t2-card);border-radius:6px;font-family:var(--font);font-size:.7rem;font-weight:600;color:var(--t2-text);animation:t2-toast .3s forwards;display:flex;align-items:center;gap:8px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.toast .toast-icon{font-size:.9rem}
.toast .toast-score{color:var(--t2-blue)}
.toast.out{animation:t2-toast-out .25s forwards}
@keyframes t2-toast{from{transform:translateX(50px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes t2-toast-out{from{opacity:1}to{transform:translateX(50px);opacity:0}}
.particle-container{position:fixed;inset:0;pointer-events:none;z-index:999}
.cele-particle{position:fixed;pointer-events:none;animation:t2-part .9s ease-out forwards;border-radius:50%}
@keyframes t2-part{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg)}}
@media(max-width:640px){.t2-header h1{font-size:.7rem}.pick-t2-name{font-size:1.5rem}.pick-t2-name.result{font-size:1.6rem}.options-grid{grid-template-columns:1fr}.q-t2-text{font-size:.9rem}.score-big{font-size:2.6rem}}
.review-section{text-align:left;margin-top:10px;border-top:1px solid var(--t2-line);padding-top:14px;max-height:400px;overflow-y:auto}
.rev-empty{text-align:center;color:var(--t2-blue);font-family:var(--font);font-size:.75rem;padding:20px 0}
.rev-student{font-family:var(--font);font-size:.65rem;font-weight:600;color:var(--t2-amber);margin:10px 0 6px;padding-bottom:4px;border-bottom:1px dashed var(--t2-line)}
.rev-item{padding:10px 12px;margin-bottom:8px;background:var(--t2-bg);border-left:3px solid var(--t2-red);border-radius:0 6px 6px 0}
.rev-q{font-size:.88rem;line-height:1.5;margin-bottom:6px}
.rev-princ{display:inline-block;font-family:var(--font);font-size:.55rem;color:var(--t2-text-dim);border:1px solid var(--t2-line);padding:1px 6px;margin-bottom:6px}
.rev-opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.rev-opt{padding:6px 8px;font-size:.78rem;line-height:1.4;border:1px solid var(--t2-line);background:rgba(0,0,0,.02);border-radius:6px;display:flex;align-items:flex-start;gap:6px;color:inherit}
.rev-opt .rev-opt-label{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;font-family:var(--font);font-size:.6rem;font-weight:700;flex-shrink:0;border:1px solid var(--t2-line);border-radius:50%;color:var(--t2-text-dim)}
.rev-opt.rev-chosen{background:rgba(217,74,74,.08);border-color:var(--t2-red)}
.rev-opt.rev-chosen .rev-opt-label{background:var(--t2-red);color:#fff;border-color:var(--t2-red)}
.rev-opt.rev-right{background:rgba(26,92,158,.08);border-color:var(--t2-blue)}
.rev-opt.rev-right .rev-opt-label{background:var(--t2-blue);color:#fff;border-color:var(--t2-blue)}


.bp-block{width:22px;}/* block alias */
.bp-block.done{}
.bp-block.active{}

.gear-icon{display:none}/* hidden */
</style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>
<div class="particle-container" id="particleContainer"></div>
<div id="app">
  <header class="t2-header">
    <h1>通用技术 · 必修二 <span>· 互动答题</span></h1>
    <div class="t2-blocks" id="memBlocks"></div>
  </header>
  <div class="t2-card" id="sceneSetup">
    <div class="t2-title"><span class="t2-icon">✦</span> 设置</div>
    <div class="setup-group">
      <div class="setup-row"><label>年级</label><select id="gradeSelect"><option value="高一">高一</option><option value="高二">高二</option></select></div>
      <div class="setup-row"><label>班级</label><select id="classSelect" disabled><option value="">—</option></select></div>
      <div class="setup-row" style="margin-top:6px"><button class="btn-t2" id="btnStart" disabled>开始答题</button></div>
    </div>
  </div>
  <div class="t2-card hidden" id="scenePick">
    <div class="t2-title"><span class="t2-icon">🎯</span> <span id="pickTitle">抽取 · 第1组</span></div>
    <div class="pick-section">
      <div class="pick-hint" id="pickHint">点击抽取</div>
      <div class="pick-t2-area"><div class="pick-t2-name" id="pickName">—</div></div>
      <div class="pick-class-tag hidden" id="pickClassTag"></div>
      <button class="btn-t2-pick hidden" id="btnPickStart">🔬 抽取</button>
      <button class="btn-t2-pick hidden" id="btnPickConfirm" style="background:var(--t2-blue)">确认</button>
    <button class="btn-t2-pick hidden" id="btnRepick" style="background:var(--t2-blue)">↻ 重抽</button>
    </div>
  </div>
  <div class="t2-card hidden" id="sceneQuiz">
    <div class="t2-title"><span class="t2-icon">📋</span> <span id="quizTitle">答题</span></div>
    <div class="quiz-section">
      <div><span class="q-t2-num" id="qNumber">1/2</span><span class="q-t2-princ" id="qPrinciple">知识点</span></div>
      <div class="q-t2-text" id="qText">—</div>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="feedback-box hidden" id="feedbackBox"></div>
      <button class="btn-t2-next hidden" id="btnNextQ">下一题</button>
    </div>
  </div>
  <div class="t2-card hidden" id="sceneScore">
    <div class="t2-title"><span class="t2-icon">📊</span> 结果</div>
    <div class="score-section">
      <div class="score-label">学生</div>
      <div style="font-size:1rem;font-weight:600;color:var(--t2-amber);margin:3px 0 6px" id="scoreStudent"></div>
      <div class="score-big" id="scorePoints">+10</div>
      <div class="score-label" id="scoreLabel">正确 1 题</div>
      <div class="score-detail" id="scoreDetail"></div>
      <div class="t2-bar-wrap"><div class="t2-bar-bg"><div class="t2-bar-fill" id="energyBar" style="width:0%"></div></div><div class="t2-bar-label"><span>进度</span><span id="energyText">0%</span></div></div>
      <button class="btn-t2-next" id="btnNextRound">下一组</button>
    </div>
  </div>
  <div class="t2-card hidden" id="sceneFinal">
    <div class="t2-title"><span class="t2-icon">🏁</span> 完成</div>
    <div class="final-sub">积分排行榜</div>
    <div style="overflow-x:auto"><table class="final-table"><thead><tr><th>#</th><th>姓名</th><th>班级</th><th>正确</th><th>积分</th></tr></thead><tbody id="finalBody"></tbody></table></div>
        <button class="rev-btn" id="btnReview" style="padding:10px 36px;font-size:.8rem;margin-top:6px;cursor:pointer;border:2px solid #5bc0eb;background:transparent;color:#5bc0eb;font-family:var(--font-mono);border-radius:6px">📋 查看错题解析</button>
    <div class="review-section hidden" id="reviewSection"></div>
<button class="btn-t2" style="padding:10px 36px;font-size:.8rem;cursor:pointer;border:none;border-radius:6px;" onclick="location.reload()">🔄 再来一次（重新抽题）</button>
  </div>
</div>
<script>

// 从 URL 路径自动提取教师用户名
const pathMatch = window.location.pathname.match(/\/api\/files\/([^\/]+)\/html\//);
const TEACHER = (pathMatch ? pathMatch[1] : '') || '';
// ═══════════════════════════════════════════════════════════
// 题库配置：每次打开页面从 JSON 中随机抽取 10 题
// 必修二使用 qjson1（技术基础）+ qjson2（技术与设计）合并题库
// ═══════════════════════════════════════════════════════════
const QUIZ_BANK_FILES = ['qjson1.json', 'qjson2.json'];  // 121题 + 56题 = 177题
const QUESTIONS_PER_ROUND = 2;
const TOTAL_GROUPS = 5;
const TOTAL_QUESTIONS = TOTAL_GROUPS * QUESTIONS_PER_ROUND;

let Q = [];
let G = [];
let S = {grade:'高一',class:'',students:[],available:[],picks:[],cr:0,cq:0,sa:'',ans:false,rr:[],total:0}, _c=0;

function $(i){return document.getElementById(i)}
function sh(i){$(i).classList.remove('hidden')}
function hd(i){$(i).classList.add('hidden')}

function st(icon,msg,score){
  const t=document.createElement('div');t.className='toast';
  t.innerHTML='<span class="toast-icon">'+icon+'</span>'+msg+(score?' <span class="toast-score">'+score+'</span>':'');
  $('toastContainer').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),250)},3000)
}

function fp(x,y,c,cnt){
  const pc=$('particleContainer');
  for(let i=0;i<cnt;i++){
    const e=document.createElement('div');e.className='cele-particle';
    const a=Math.random()*Math.PI*2,d=60+Math.random()*130;
    e.style.cssText='left:'+(x||innerWidth/2)+'px;top:'+(y||innerHeight/2)+'px;width:'+(5+Math.random()*7)+'px;height:'+(5+Math.random()*7)+'px;background:'+(c||'var(--t2-blue)')+';--dx:'+(Math.cos(a)*d)+'px;--dy:'+(Math.sin(a)*d)+'px';
    pc.appendChild(e);setTimeout(()=>e.remove(),1200)
  }
}

function ud(){
  const h=$('memBlocks');h.innerHTML='';
  for(let i=0;i<TOTAL_GROUPS;i++){
    const e=document.createElement('div');
    e.className='t2-block'+(i<S.cr?' done':i===S.cr?' active':' future');
    h.appendChild(e)
  }
}

function sv(g,c,n,p){
  fetch('/score-api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,name:n,points:p,teacher:TEACHER})})
    .then(r=>r.ok?st('💰','保存','+'+p):st('⚠️','异常')).catch(()=>st('📝','本地'))
}

function saveRecord(g,c,s,cc,t,pts,ans,title){
  fetch('/rollcall-api/save-record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,student:s,type:'互动答题',teacher:TEACHER,title:title||'',correctCount:cc,totalQuestions:t,points:pts,answers:ans||[]})}).catch(()=>{})
}

// ═══════════════════════════════════════════════════════════
// 核心：从多个题库 JSON 随机抽取题目并转换格式
// ═══════════════════════════════════════════════════════════
const LABELS = ['A','B','C','D'];

function convertQuestion(q) {
  const opts = {};
  for (let i = 0; i < Math.min(q.options.length, 4); i++) {
    opts[LABELS[i]] = q.options[i];
  }
  for (let i = q.options.length; i < 4; i++) {
    opts[LABELS[i]] = '——';
  }
  return {
    question: q.question,
    options: opts,
    answer: LABELS[q.answer] || 'A',
    principle: q.principle || '通用技术 · 必修二知识点'
  };
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function loadAndShuffleQuestions() {
  try {
    // 从多个题库文件加载并合并
    let allQuestions = [];
    for (const file of QUIZ_BANK_FILES) {
      const resp = await fetch(file);
      const bank = await resp.json();
      allQuestions = allQuestions.concat(bank);
    }
    // 随机打乱
    const shuffled = shuffle(allQuestions);
    // 取前 TOTAL_QUESTIONS 题
    const picked = shuffled.slice(0, TOTAL_QUESTIONS);
    Q = picked.map(convertQuestion);
    // 分组
    G = [];
    for (let i = 0; i < TOTAL_GROUPS; i++) {
      G.push(Q.slice(i * QUESTIONS_PER_ROUND, (i + 1) * QUESTIONS_PER_ROUND));
    }
    st('📚','题库加载完成',Q.length+'题 / '+allQuestions.length+'题库');
    return true;
  } catch(e) {
    console.error('题库加载失败:', e);
    st('⚠️','题库加载失败，请刷新重试');
    return false;
  }
}

// ═══════════════════════════════════════════════════════════
// 页面交互逻辑
// ═══════════════════════════════════════════════════════════
async function lc(){
  const g=$('gradeSelect').value;S.grade=g;
  const cs=$('classSelect');cs.disabled=true;cs.innerHTML='<option value="">...</option>';
  try{
    const r=await fetch('/rollcall-api/classes?grade='+encodeURIComponent(g)+'&teacher='+TEACHER);
    const cls=await r.json();
    cs.innerHTML='<option value="">— 选择 —</option>';
    cls.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o)});
    cs.disabled=false
  }catch(e){cs.innerHTML='<option value="">失败</option>'}
}

$('gradeSelect').addEventListener('change',lc);
$('classSelect').addEventListener('change',async function(){
  const c=this.value;S.class=c;$('btnStart').disabled=!c;
  if(c){
    const resp=await fetch('/rollcall-api/students?grade='+encodeURIComponent(S.grade)+'&class='+encodeURIComponent(c)+'&teacher='+TEACHER);const data=await resp.json();S.students=data.map(s=>s.name)
  }
});

$('btnStart').addEventListener('click',async function(){
  if(!S.class||S.students.length<5){st('⚠️','人数不足');return}
  this.disabled=true;this.textContent='加载题库中...';
  const ok = await loadAndShuffleQuestions();
  this.disabled=false;this.textContent='开始答题';
  if(!ok) return;
  hd('sceneSetup');sr(0)
});

function sr(ri){
  S.cr=ri;S.cq=0;_c=0;
  if(!S.rr[ri])S.rr[ri]={correctCount:0,points:0,answers:[]};
  S.rr[ri].answers=[];ud();sp()
}

function sp(){
  sh('scenePick');hd('sceneQuiz');hd('sceneScore');hd('sceneFinal');
  $('pickTitle').textContent='抽取 '+(S.cr+1);
  $('pickHint').textContent='点击抽取';
  $('pickHint').classList.remove('hidden');
  $('pickClassTag').classList.add('hidden');
  $('btnPickStart').classList.remove('hidden');
  $('btnPickConfirm').classList.add('hidden');
  $('btnRepick').classList.add('hidden');
  $('pickName').textContent='—';
  $('pickName').className='pick-t2-name';
  $('btnPickStart').disabled=false;
  $('btnPickStart').textContent='🔬 抽取'
}

function rp(){
  const pool=S.students.length>0?S.students:['---'];
  const pn=$('pickName');pn.className='pick-t2-name rolling';
  $('pickHint').textContent='抽取中...';
  $('btnPickConfirm').classList.add('hidden');
  $('btnRepick').classList.add('hidden');
  $('btnPickStart').disabled=true;
  let rc=0,mx=18+Math.floor(Math.random()*10);
  let iv=setInterval(()=>{
    pn.textContent=pool[Math.floor(Math.random()*pool.length)];
    rc++;
    if(rc>=mx){
      clearInterval(iv);
      fetch('/rollcall-api/pick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,teacher:TEACHER})})
        .then(d=>d.json()).then(d=>{
          if(d.error){st('⚠️',d.error);pn.textContent='——';pn.className='pick-t2-name';$('btnPickStart').disabled=false;return}
          const c=d.student;pn.textContent=c;pn.className='pick-t2-name result';
          $('pickHint').classList.add('hidden');
          $('pickClassTag').textContent=S.grade+' · '+S.class;
          $('pickClassTag').classList.remove('hidden');
          $('btnPickConfirm').classList.remove('hidden');
          $('btnRepick').classList.remove('hidden');
          fp(innerWidth/2,innerHeight/2,'var(--t2-blue)',30);
          st('🎯','已选',c);S.picks[S.cr]=c
        }).catch(()=>{st('⚠️','服务异常');pn.textContent='——';pn.className='pick-t2-name';$('btnPickStart').disabled=false})
    }
  },60+Math.random()*40)
}

$('btnPickStart').addEventListener('click',function(){this.disabled=true;rp()});
$('btnRepick').addEventListener('click',rp);
$('btnPickConfirm').addEventListener('click',function(){hd('scenePick');sq()});

function sq(){sh('sceneQuiz');S.cq=0;sQ()}

function sQ(){
  const g=G[S.cr],q=g[S.cq];
  $('quizTitle').textContent='第 '+(S.cr+1)+' 组';
  $('qNumber').textContent=(S.cq+1)+'/'+QUESTIONS_PER_ROUND;
  $('qPrinciple').textContent=q.principle;
  $('qText').textContent=q.question;
  S.sa='';S.ans=false;
  $('feedbackBox').classList.add('hidden');
  $('btnNextQ').classList.add('hidden');
  const grid=$('optionsGrid');grid.innerHTML='';
  LABELS.forEach(l=>{
    const b=document.createElement('button');b.className='option-btn';
    b.innerHTML='<span class="opt-label">'+l+'</span><span>'+(q.options[l]||'')+'</span>';
    b.dataset.label=l;b.addEventListener('click',()=>hA(l));grid.appendChild(b)
  })
}

function hA(l){
  if(S.ans)return;S.ans=true;
  const g=G[S.cr],q=g[S.cq],c=q.answer,ic=l===c;
  if(ic)_c++;
  S.rr[S.cr].correctCount=_c;
  let p=5;if(_c===1)p=10;else if(_c===2)p=15;
  S.rr[S.cr].points=p;
  S.rr[S.cr].answers.push({question:q.question,options:q.options,correctAnswer:c,yourAnswer:l,principle:q.principle,isCorrect:ic});
  const btns=$('optionsGrid').querySelectorAll('.option-btn');
  btns.forEach(b=>{
    b.classList.add('disabled');
    if(b.dataset.label===c)b.classList.add('correct');
    if(b.dataset.label===l&&!ic)b.classList.add('wrong');
    if(b.dataset.label===l&&ic)b.classList.add('selected')
  });
  const fb=$('feedbackBox');fb.classList.remove('hidden');
  if(ic){fb.className='feedback-box correct-fb';fb.textContent='✅ '+c+'. '+(q.options[c]||'');fp(innerWidth/2,innerHeight-80,'var(--t2-blue)',12)}
  else{fb.className='feedback-box wrong-fb';fb.textContent='❌ 正确答案：'+c+'. '+(q.options[c]||'')}
  $('btnNextQ').classList.remove('hidden');
  $('btnNextQ').textContent=S.cq===0?'下一题':'结算'
}

$('btnNextQ').addEventListener('click',function(){
  if(S.cq===0){S.cq=1;sQ()}
  else{hd('sceneQuiz');sSc()}
});

function sSc(){
  sh('sceneScore');
  const s=S.picks[S.cr];
  $('scoreStudent').textContent=s+' · '+S.class;
  const cr=S.rr[S.cr],cc=cr?.correctCount||0,pts=cr?.points||5;
  $('scorePoints').textContent='+'+pts;
  $('scoreLabel').textContent='正确 '+cc+' 题';
  $('scoreDetail').innerHTML='<div class="score-stat">正确 <strong>'+cc+'</strong></div><div class="score-stat">错误 <strong>'+(QUESTIONS_PER_ROUND-cc)+'</strong></div><div class="score-stat">保底 <strong>5</strong></div>';
  const p=cc===0?25:cc===1?60:100;
  setTimeout(()=>{$('energyBar').style.width=p+'%';$('energyText').textContent=p+'%'},100);
  sv(S.grade,S.class,s,pts);S.total+=pts;
  fetch('/rollcall-api/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,student:s,result:'quiz',teacher:TEACHER})}).catch(()=>{});
  saveRecord(S.grade,S.class,s,cc,QUESTIONS_PER_ROUND,pts,S.rr[S.cr]?.answers,'通用技术·必修二');
  fp(innerWidth/2,innerHeight/2-100,'var(--t2-blue)',25);
  $('btnNextRound').textContent=S.cr<4?'下一组':'完成'
}

$('btnNextRound').addEventListener('click',function(){
  if(S.cr<4){hd('sceneScore');sr(S.cr+1)}
  else{hd('sceneScore');sF()}
});

function sF(){
  $('reviewSection').classList.add('hidden');
  $('btnReview').textContent='📋 查看错题解析';
  sh('sceneFinal');
  const tb=$('finalBody');tb.innerHTML='';
  const rows=S.picks.map((n,i)=>{const cr=S.rr[i];return{name:n,class:S.class,correct:cr?.correctCount||0,points:cr?.points||5}}).sort((a,b)=>b.points-a.points);
  rows.forEach((r,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML='<td class="rank-num">#'+(i+1)+'</td><td>'+r.name+'</td><td>'+r.class+'</td><td>'+r.correct+'/'+QUESTIONS_PER_ROUND+'</td><td class="rank-score">+'+r.points+'</td>';
    tb.appendChild(tr)
  });
  fp(innerWidth/2,innerHeight/2,'var(--t2-blue)',50);
  setTimeout(()=>fp(innerWidth/2,innerHeight/2,'var(--t2-amber)',30),400)
}

function buildReview(){
  const rs=$('reviewSection');rs.innerHTML='';
  let hw=false;const la=LABELS;
  S.picks.forEach((n,ri)=>{
    const cr=S.rr[ri];
    if(!cr||!cr.answers)return;
    const w=cr.answers.filter(a=>!a.isCorrect);
    if(!w.length)return;
    hw=true;
    let h='<div class="rev-student">'+n+'</div>';
    w.forEach(a=>{
      h+='<div class="rev-item"><span class="rev-princ">'+a.principle+'</span><div class="rev-q">'+a.question+'</div><div class="rev-opt-grid">';
      la.forEach(l=>{
        let cls='rev-opt';
        if(l===a.yourAnswer)cls+=' rev-chosen';
        if(l===a.correctAnswer)cls+=' rev-right';
        h+='<div class="'+cls+'"><span class="rev-opt-label">'+l+'</span><span>'+(a.options[l]||'')+'</span></div>'
      });
      h+='</div></div>'
    });
    rs.innerHTML+=h
  });
  if(!hw)rs.innerHTML='<div class="rev-empty">✅ 所有同学全部答对！</div>'
}

$('btnReview').addEventListener('click',function(){
  const rs=$('reviewSection');
  if(!rs.classList.contains('hidden')){rs.classList.add('hidden');this.textContent='📋 查看错题解析';return}
  this.textContent='📋 收起解析';buildReview();rs.classList.remove('hidden')
});

lc();sh('sceneSetup');ud();
</script>
