<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统及其设计 · 电路板风</title>
<style>

/* 电路板 Circuit Board 风格 */
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cb-dark:#0d1b2a;--cb-green:#00ff41;--cb-cyan:#00d4ff;--cb-purple:#7b2d8e;--cb-orange:#ff9500;--cb-red:#ff3355;--cb-bg:#0f1923;--cb-card:#1a2d3d;--cb-text:#e0e8f0;--cb-text-dim:#6a8a9a;--cb-line:rgba(0,255,65,.08);--font:'Space Grotesk','Segoe UI',sans-serif;--font-body:'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif}
html{font-size:20px}
body{font-family:var(--font-body);background:var(--cb-bg);color:var(--cb-text);min-height:100vh;overflow-x:hidden;display:flex;justify-content:center;position:relative}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle at 20% 30%, rgba(0,255,65,.03) 0, transparent 50%),radial-gradient(circle at 80% 70%, rgba(0,212,255,.03) 0, transparent 50%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;width:100%;max-width:880px;min-height:100vh;padding:28px 18px 50px;display:flex;flex-direction:column;align-items:center;gap:14px}
.cb-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--cb-card);border:1px solid var(--cb-line);border-radius:4px;position:relative}
.cb-header h1{font-family:var(--font);font-size:.85rem;font-weight:700;color:var(--cb-green);letter-spacing:2px}
.cb-header h1 span{color:var(--cb-cyan)}
.cb-blocks{display:flex;gap:4px}
.cb-block{width:22px;height:22px;border:1px solid var(--cb-line);background:transparent;transition:all .4s;position:relative}
.cb-block::after{content:'';position:absolute;inset:4px;background:transparent;transition:all .4s}
.cb-block.done{border-color:var(--cb-green)}
.cb-block.done::after{background:var(--cb-green)}
.cb-block.active{border-color:var(--cb-cyan);animation:cb-pulse .8s ease infinite}
.cb-block.active::after{background:var(--cb-cyan)}
.cb-block.future{border-color:var(--cb-line)}
@keyframes cb-pulse{0%,100%{box-shadow:0 0 4px var(--cb-cyan)}50%{box-shadow:0 0 12px var(--cb-cyan)}}
.cb-card{width:100%;padding:26px 22px;background:var(--cb-card);border:1px solid var(--cb-line);border-radius:4px;position:relative}
.cb-card::before{content:'';position:absolute;top:-1px;left:20px;right:20px;height:2px;background:linear-gradient(90deg,transparent,var(--cb-green),transparent)}
.cb-title{font-family:var(--font);font-size:.8rem;font-weight:700;text-align:center;margin-bottom:16px;color:var(--cb-cyan);letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:8px}
.cb-title .cb-icon{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;background:var(--cb-green);color:var(--cb-dark);font-size:.7rem;border-radius:50%}
.setup-group{display:flex;flex-direction:column;gap:14px;max-width:380px;margin:0 auto}
.setup-row{display:flex;flex-direction:column;gap:4px}
.setup-row label{font-family:var(--font);font-size:.7rem;font-weight:600;color:var(--cb-cyan);letter-spacing:1px}
.setup-row select,.setup-row button{width:100%;padding:12px 16px;background:rgba(0,0,0,.3);border:1px solid var(--cb-line);color:var(--cb-text);font-size:.9rem;font-family:var(--font-body);cursor:pointer;transition:all .2s;outline:none;border-radius:2px;font-weight:500}
.setup-row select:hover,.setup-row select:focus{border-color:var(--cb-green);background:rgba(0,0,0,.4)}
.setup-row select option{background:var(--cb-card);color:var(--cb-text)}
.btn-cb{background:var(--cb-green)!important;border:none!important;color:var(--cb-dark)!important;font-size:.85rem!important;font-weight:700!important;letter-spacing:2px;border-radius:2px!important;transition:all .2s!important}
.btn-cb:hover{background:var(--cb-cyan)!important;color:var(--cb-dark)!important}
.btn-cb:disabled{opacity:.15!important;cursor:not-allowed;transform:none!important}
.pick-section{text-align:center;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pick-cb-area{width:100%;max-width:380px;min-height:100px;display:flex;align-items:center;justify-content:center;margin:4px 0;position:relative}
.pick-cb-name{font-family:var(--font);font-size:3rem;font-weight:700;z-index:2;color:var(--cb-text);letter-spacing:4px;transition:all .12s}
.pick-cb-name.rolling{animation:cb-roll .1s infinite}
@keyframes cb-roll{0%,100%{transform:translateY(0)}25%{transform:translateY(-4px)}75%{transform:translateY(4px)}}
.pick-cb-name.result{animation:cb-pop .5s cubic-bezier(.34,1.56,.64,1);color:var(--cb-green);text-shadow:0 0 20px rgba(0,255,65,.3)}
@keyframes cb-pop{0%{opacity:0;transform:scale(.3)}50%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
.pick-hint{font-size:.78rem;color:var(--cb-text-dim);margin-top:4px}
.pick-class-tag{font-size:.72rem;color:var(--cb-orange);margin-top:2px;font-weight:500}
.btn-cb-pick{margin-top:10px;padding:10px 40px;background:transparent;border:1px solid var(--cb-cyan);color:var(--cb-cyan);font-family:var(--font);font-size:.75rem;font-weight:700;cursor:pointer;letter-spacing:1px;border-radius:2px;transition:all .2s}
.btn-cb-pick:hover{background:var(--cb-cyan);color:var(--cb-dark)}
.btn-cb-pick:disabled{opacity:.15;cursor:not-allowed}
.quiz-section{text-align:center}
.q-cb-num{font-family:var(--font);font-size:.85rem;font-weight:600;color:var(--cb-purple);letter-spacing:1px}
.q-cb-princ{font-size:.8rem;color:var(--cb-green);margin-left:8px;font-weight:500}
.q-cb-text{font-size:1rem;line-height:1.7;margin:10px 0 16px;text-align:left;padding:16px 18px;background:rgba(0,0,0,.2);border-left:4px solid var(--cb-cyan);color:var(--cb-text);font-weight:400}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.option-btn{padding:13px 14px;background:rgba(0,0,0,.2);border:1px solid transparent;color:var(--cb-text);font-size:.9rem;text-align:left;cursor:pointer;transition:all .2s;font-family:var(--font-body);line-height:1.5;font-weight:400;display:flex;align-items:flex-start;gap:10px;border-radius:2px}
.option-btn .opt-label{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;font-family:var(--font);font-size:.7rem;font-weight:700;flex-shrink:0;background:rgba(0,0,0,.3);border:1px solid var(--cb-line);color:var(--cb-text-dim)}
.option-btn:hover{border-color:var(--cb-cyan);background:rgba(0,212,255,.05)}
.option-btn.selected{border-color:var(--cb-cyan);background:rgba(0,212,255,.08)}
.option-btn.selected .opt-label{background:var(--cb-cyan);color:var(--cb-dark);border-color:var(--cb-cyan)}
.option-btn.correct{border-color:var(--cb-green)!important;background:rgba(0,255,65,.05)!important}
.option-btn.correct .opt-label{background:var(--cb-green)!important;color:var(--cb-dark)!important;border-color:var(--cb-green)!important}
.option-btn.wrong{border-color:var(--cb-red)!important;background:rgba(255,51,85,.05)!important}
.option-btn.wrong .opt-label{background:var(--cb-red)!important;color:#fff!important;border-color:var(--cb-red)!important}
.option-btn.disabled{pointer-events:none;opacity:.25}
.feedback-box{margin-top:12px;padding:10px 16px;font-size:.88rem;animation:cb-fade .3s;border-radius:2px;font-weight:500}
@keyframes cb-fade{from{opacity:0}to{opacity:1}}
.feedback-box.correct-fb{background:rgba(0,255,65,.06);color:var(--cb-green);border-left:4px solid var(--cb-green)}
.feedback-box.wrong-fb{background:rgba(255,51,85,.04);color:var(--cb-red);border-left:4px solid var(--cb-red)}
.btn-cb-next{margin-top:12px;padding:10px 36px;background:transparent;border:1px solid var(--cb-green);color:var(--cb-green);font-family:var(--font);font-size:.75rem;font-weight:700;cursor:pointer;letter-spacing:1px;border-radius:2px;transition:all .2s}
.btn-cb-next:hover{background:var(--cb-green);color:var(--cb-dark)}
.score-section{text-align:center}
.score-big{font-family:var(--font);font-size:3.8rem;font-weight:700;color:var(--cb-green);text-shadow:0 0 20px rgba(0,255,65,.3);animation:cb-score .6s cubic-bezier(.34,1.56,.64,1);margin:4px 0}
@keyframes cb-score{0%{opacity:0;transform:rotate(-15deg) scale(.5)}100%{opacity:1;transform:rotate(0) scale(1)}}
.score-label{font-family:var(--font);font-size:.7rem;font-weight:600;color:var(--cb-text-dim);letter-spacing:1px}
.score-detail{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.score-stat{padding:6px 14px;background:rgba(0,0,0,.2);font-size:.82rem;font-weight:500}
.score-stat strong{color:var(--cb-green);font-weight:700;font-size:.95rem}
.cb-bar-wrap{width:100%;max-width:400px;margin:8px auto}
.cb-bar-bg{width:100%;height:10px;background:rgba(0,0,0,.3);overflow:hidden}
.cb-bar-fill{height:100%;background:linear-gradient(90deg,var(--cb-green),var(--cb-cyan));transition:width 1s cubic-bezier(.34,1.56,.64,1)}
.cb-bar-label{display:flex;justify-content:space-between;font-size:.7rem;color:var(--cb-text-dim);margin-top:2px;font-weight:500}
.final-section{text-align:center}
.final-title{font-family:var(--font);font-size:1rem;font-weight:700;color:var(--cb-cyan);margin-bottom:2px;letter-spacing:2px}
.final-sub{color:var(--cb-text-dim);margin-bottom:14px;font-size:.78rem;font-weight:500}
.final-table{width:100%;border-collapse:separate;border-spacing:0 4px;margin:4px 0 16px}
.final-table th{padding:10px 12px;text-align:left;font-family:var(--font);font-size:.85rem;font-weight:700;color:var(--cb-cyan);border-bottom:2px solid var(--cb-line);letter-spacing:1px}
.final-table td{padding:10px 12px;font-size:.85rem;font-weight:500;background:rgba(0,0,0,.2)}
.final-table tr:first-child td{background:rgba(0,212,255,.08);font-weight:700}
.final-table .rank-num{font-family:var(--font);font-weight:700;color:var(--cb-orange)}
.final-table .rank-score{font-family:var(--font);font-weight:700;color:var(--cb-green)}
.hidden{display:none!important}
.toast-container{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{padding:10px 18px;background:var(--cb-card);border:1px solid var(--cb-line);font-family:var(--font);font-size:.7rem;font-weight:600;color:var(--cb-text);animation:cb-toast .3s forwards;display:flex;align-items:center;gap:8px}
.toast .toast-icon{font-size:.9rem}
.toast .toast-score{color:var(--cb-green)}
.toast.out{animation:cb-toast-out .25s forwards}
@keyframes cb-toast{from{transform:translateX(50px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes cb-toast-out{from{opacity:1}to{transform:translateX(50px);opacity:0}}
.particle-container{position:fixed;inset:0;pointer-events:none;z-index:999}
.cele-particle{position:fixed;pointer-events:none;animation:cb-part .9s ease-out forwards;border-radius:2px}
@keyframes cb-part{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg)}}
@media(max-width:640px){.cb-header h1{font-size:.7rem}.pick-cb-name{font-size:2.4rem}.pick-cb-name.result{font-size:2.6rem}.options-grid{grid-template-columns:1fr}.q-cb-text{font-size:.9rem}.score-big{font-size:2.6rem}}
.review-section{text-align:left;margin-top:10px;border-top:1px solid var(--cb-line);padding-top:14px;max-height:400px;overflow-y:auto}
.rev-empty{text-align:center;color:var(--cb-green);font-family:var(--font);font-size:.75rem;padding:20px 0}
.rev-student{font-family:var(--font);font-size:.85rem;font-weight:600;color:var(--cb-orange);margin:10px 0 6px;padding-bottom:4px;border-bottom:1px dashed var(--cb-line)}
.rev-item{padding:10px 12px;margin-bottom:8px;background:rgba(0,0,0,.2);border-left:3px solid var(--cb-red)}
.rev-q{font-size:.88rem;line-height:1.5;margin-bottom:6px}
.rev-princ{display:inline-block;font-family:var(--font);font-size:.75rem;color:var(--cb-text-dim);border:1px solid var(--cb-line);padding:2px 8px;margin-bottom:6px}
.rev-opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.rev-opt{padding:6px 8px;font-size:.78rem;line-height:1.4;border:1px solid var(--cb-line);background:rgba(0,0,0,.1);display:flex;align-items:flex-start;gap:6px;color:inherit}
.rev-opt .rev-opt-label{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;font-family:var(--font);font-size:.8rem;font-weight:700;flex-shrink:0;border:1px solid var(--cb-line);color:var(--cb-text-dim)}
.rev-opt.rev-chosen{background:rgba(255,51,85,.1);border-color:var(--cb-red)}
.rev-opt.rev-chosen .rev-opt-label{background:var(--cb-red);color:#fff;border-color:var(--cb-red)}
.rev-opt.rev-right{background:rgba(0,255,65,.1);border-color:var(--cb-green)}
.rev-opt.rev-right .rev-opt-label{background:var(--cb-green);color:var(--cb-dark);border-color:var(--cb-green)}


.bp-block{width:22px;}/* block alias */
.bp-block.done{}
.bp-block.active{}

.gear-icon{display:none}/* hidden */
</style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>
<div class="particle-container" id="particleContainer"></div>
<div id="app">
  <header class="cb-header">
    <h1>系统及其设计 <span>· 电路板</span></h1>
    <div class="cb-blocks" id="memBlocks"></div>
  </header>
  <div class="cb-card" id="sceneSetup">
    <div class="cb-title"><span class="cb-icon">✦</span> 设置</div>
    <div class="setup-group">
      <div class="setup-row"><label>年级</label><select id="gradeSelect"><option value="高一">高一</option><option value="高二">高二</option></select></div>
      <div class="setup-row"><label>班级</label><select id="classSelect" disabled><option value="">—</option></select></div>
      <div class="setup-row" style="margin-top:6px"><button class="btn-PX" id="btnStart" disabled>开始</button></div>
    </div>
  </div>
  <div class="cb-card hidden" id="scenePick">
    <div class="cb-title"><span class="cb-icon">🎯</span> <span id="pickTitle">系统 · 抽取</span></div>
    <div class="pick-section">
      <div class="pick-hint" id="pickHint">点击抽取</div>
      <div class="pick-cb-area"><div class="pick-cb-name" id="pickName">—</div></div>
      <div class="pick-class-tag hidden" id="pickClassTag"></div>
      <button class="btn-cb-pick hidden" id="btnPickStart">🔌 抽取</button>
      <button class="btn-cb-pick hidden" id="btnPickConfirm" style="background:var(--cb-green);color:var(--cb-dark);border-color:var(--cb-green)">确认</button>
    <button class="btn-cb-pick hidden" id="btnRepick" style="background:var(--cb-green);color:var(--cb-dark);border-color:var(--cb-green)">↻ 重抽</button>
    </div>
  </div>
  <div class="cb-card hidden" id="sceneQuiz">
    <div class="cb-title"><span class="cb-icon">⚡</span> <span id="quizTitle">答题</span></div>
    <div class="quiz-section">
      <div><span class="q-cb-num" id="qNumber">1/2</span><span class="q-cb-princ" id="qPrinciple">原理</span></div>
      <div class="q-cb-text" id="qText">—</div>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="feedback-box hidden" id="feedbackBox"></div>
      <button class="btn-cb-next hidden" id="btnNextQ">下一题</button>
    </div>
  </div>
  <div class="cb-card hidden" id="sceneScore">
    <div class="cb-title"><span class="cb-icon">🔋</span> 结果</div>
    <div class="score-section">
      <div class="score-label">学生</div>
      <div style="font-size:1rem;font-weight:600;color:var(--cb-pink);margin:3px 0 6px" id="scoreStudent"></div>
      <div class="score-big" id="scorePoints">+10</div>
      <div class="score-label" id="scoreLabel">正确 1 题</div>
      <div class="score-detail" id="scoreDetail"></div>
      <div class="cb-bar-wrap"><div class="cb-bar-bg"><div class="cb-bar-fill" id="energyBar" style="width:0%"></div></div><div class="cb-bar-label"><span>进度</span><span id="energyText">0%</span></div></div>
      <button class="btn-cb-next" id="btnNextRound">下一组</button>
    </div>
  </div>
  <div class="cb-card hidden" id="sceneFinal">
    <div class="cb-title"><span class="cb-icon">💠</span> 完成</div>
    <div class="final-sub">积分排行榜</div>
    <div style="overflow-x:auto"><table class="final-table"><thead><tr><th>#</th><th>姓名</th><th>班级</th><th>正确</th><th>积分</th></tr></thead><tbody id="finalBody"></tbody></table></div>
        <button class="rev-btn" id="btnReview" style="padding:10px 36px;font-size:.8rem;margin-top:6px;cursor:pointer;border:2px solid #5bc0eb;background:transparent;color:#5bc0eb;font-family:var(--font-mono);border-radius:6px">📋 查看错题解析</button>
    <div class="review-section hidden" id="reviewSection"></div>
<button class="btn-PX" style="padding:10px 36px;font-size:.8rem;cursor:pointer;border:none;border-radius:6px;" onclick="location.reload()">再来一次</button>
  </div>
</div>
<script>// 从 URL 路径自动提取教师用户名
const pathMatch = window.location.pathname.match(/\/api\/files\/([^\/]+)\/html\//);
const TEACHER = (pathMatch ? pathMatch[1] : '') || '';
const Q=[{"question": "下列各项中，属于自然系统的是（ ）", "options": {"A": "塑料大棚", "B": "一片森林", "C": "智能大楼", "D": "一架飞机"}, "answer": "B", "principle": "系统可分为自然系统和人造系统。自然系统是由自然物自然形成的，如一片森林、生态系统等；人造系统是由人工设计、制造而成的。"}, {"question": "FAST系统又称\"中国天眼\"，它属于（ ）", "options": {"A": "自然抽象系统", "B": "自然实体系统", "C": "人造实体系统", "D": "人造抽象系统"}, "answer": "C", "principle": "FAST（500米口径球面射电望远镜）是由人类设计、建造的实体装置，属于人造实体系统。"}, {"question": "下列不属于系统的是（ ）", "options": {"A": "液晶电视", "B": "链条链轮", "C": "拉线木偶", "D": "一盒茶叶"}, "answer": "D", "principle": "系统是由两个或两个以上相互联系、相互作用的要素构成的具有特定功能的有机整体。一盒茶叶中的茶叶之间没有相互联系、相互作用，也没有形成特定功能，因此不属于系统。"}, {"question": "家用电饭锅由于传感器损坏导致不能正常使用，这反映了系统的（ ）", "options": {"A": "相关性", "B": "整体性", "C": "目的性", "D": "环境适应性"}, "answer": "B", "principle": "系统的整体性是指系统是一个整体，各要素之间相互联系，任何一个要素出现故障都会影响整体功能的实现。传感器损坏导致电饭锅整体不能正常使用，体现了整体性。"}, {"question": "飞机在空中飞行时，时常受到大气对流的影响而产生颠簸，当飞机的检测装置接收到这一信号后，经过控制器的调节，能在很短的时间内调整好飞行状态。这个现象说明了系统的什么基本特性？", "options": {"A": "整体性", "B": "相关性", "C": "环境适应性", "D": "动态性"}, "answer": "C", "principle": "环境适应性是指系统具有适应外部环境变化的能力。飞机通过检测和调节机制克服大气对流的影响，保持平稳飞行，体现了系统对外部环境变化的适应能力。"}, {"question": "\"丢卒保车\"、\"一招不慎，全盘皆输\"主要反映了系统基本特性中的（ ）", "options": {"A": "整体性", "B": "相关性", "C": "动态性", "D": "目的性"}, "answer": "A", "principle": "\"丢卒保车\"体现了系统整体性中局部服从整体的思想；\"一招不慎，全盘皆输\"说明系统中一个要素的变化会影响整体功能的实现，也体现了整体性。"}, {"question": "系统优化的目标是（ ）", "options": {"A": "使系统中每个要素都达到最优", "B": "使系统整体功能达到最优", "C": "使系统的成本最低", "D": "使系统的速度最快"}, "answer": "B", "principle": "系统优化追求的是整体功能的最优，而不是每个要素的局部最优。有时为了整体最优，需要牺牲某些局部要素的性能。"}, {"question": "在系统分析中，不能只考虑部分而忽视整体，这体现了系统分析的（ ）", "options": {"A": "整体性原则", "B": "科学性原则", "C": "综合性原则", "D": "动态性原则"}, "answer": "A", "principle": "系统分析的整体性原则要求我们着眼于系统整体，先分析整体再分析部分，先看全局后看局部，不能只考虑部分而忽视整体。"}, {"question": "城市交通系统是一个复杂的系统，要解决城市交通拥堵问题，以下做法符合系统思想的是（ ）", "options": {"A": "只增加道路数量", "B": "只限制车辆购买", "C": "综合考虑道路、公交、管理等多方面因素", "D": "只提高停车费"}, "answer": "C", "principle": "系统思想要求从整体出发，综合考虑各要素之间的相互联系。解决交通拥堵需要综合考虑道路建设、公共交通、交通管理等多方面因素，而不是只采取单一措施。"}, {"question": "关于系统的特性，下列说法不正确的是（ ）", "options": {"A": "系统具有整体性，各要素缺一不可", "B": "系统具有相关性，各要素相互影响", "C": "系统具有独立性，不受外部环境影响", "D": "系统具有目的性，每个系统都有特定功能"}, "answer": "C", "principle": "系统具有环境适应性，会受到外部环境的影响，而不是独立于环境之外。系统需要适应环境变化才能保持其功能。"}];
const G=[];for(let i=0;i<1;i++)G.push(Q.slice(i*2,i*2+2));

let S={grade:'高一',class:'',students:[],available:[],picks:[],cr:0,cq:0,sa:'',ans:false,rr:[],total:0},_c=0;
function $(i){return document.getElementById(i)}
function sh(i){$(i).classList.remove('hidden')}
function hd(i){$(i).classList.add('hidden')}
function sf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}
function st(i,m,s){const t=document.createElement('div');t.className='toast';t.innerHTML='<span class="toast-icon">'+i+'</span>'+m+(s?' <span class="toast-pts">'+s+'</span>':'');$('toastContainer').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),250)},3000)}
function fp(x,y,c,cnt){const pc=$('particleContainer');for(let i=0;i<cnt;i++){const e=document.createElement('div');e.className='cele-particle';const a=Math.random()*Math.PI*2,d=60+Math.random()*130;e.style.cssText='left:'+(x||innerWidth/2)+'px;top:'+(y||innerHeight/2)+'px;width:'+(5+Math.random()*7)+'px;height:'+(5+Math.random()*7)+'px;background:'+(c||'var(--bp-cyan)')+';--dx:'+(Math.cos(a)*d)+'px;--dy:'+(Math.sin(a)*d)+'px';pc.appendChild(e);setTimeout(()=>e.remove(),1200)}}
function ud(){try{const h=$('bpBlocks')||$('memBlocks')||$('progressDots')||$('popDots');if(!h)return;h.innerHTML='';for(let i=0;i<5;i++){const e=document.createElement('div');e.className='bp-block'+(i<S.cr?' done':i===S.cr?' active':'');e.innerHTML='';h.appendChild(e)}}catch(e){}}
function sv(g,c,n,p){fetch('/api/scores/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,name:n,points:p,teacher:TEACHER})}).then(r=>r.ok?st('💰','保存','+'+p):st('⚠️','异常')).catch(()=>st('📝','本地'))}
function saveRecord(g,c,s,cc,t,pts,ans,title){fetch('/api/rollcall/save-record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,student:s,type:'互动答题',title:title||'',correctCount:cc,totalQuestions:t,points:pts,answers:ans||[],teacher:TEACHER})}).catch(()=>{})}
async function lc(){const g=$('gradeSelect').value;S.grade=g;const cs=$('classSelect');cs.disabled=true;cs.innerHTML='<option value="">...</option>';try{const r=await fetch('/api/rollcall/classes?grade='+encodeURIComponent(g)+'&teacher='+TEACHER);const cls=await r.json();cs.innerHTML='<option value="">— 选择 —</option>';cls.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o)});cs.disabled=false}catch(e){cs.innerHTML='<option value="">失败</option>'}}
$('gradeSelect').addEventListener('change',lc);$('classSelect').addEventListener('change',async function(){const c=this.value;S.class=c;$('btnStart').disabled=!c;if(c){try{const r=await fetch('/api/rollcall/students?grade='+encodeURIComponent(S.grade)+'&class='+encodeURIComponent(c)+'&teacher='+TEACHER);const data=await r.json();S.students=data.map(s=>s.name)}catch(e){S.students=[];st('⚠️','加载学生失败')}}});
$('btnStart').addEventListener('click',function(){if(!S.class||S.students.length<5){st('⚠️','人数不足');return}hd('sceneSetup');sr(0)});
function sr(ri){S.cr=ri;S.cq=0;_c=0;if(!S.rr[ri])S.rr[ri]={correctCount:0,points:0,answers:[]};S.rr[ri].answers=[];ud();sp()}
function sp(){sh('scenePick');hd('sceneQuiz');hd('sceneScore');hd('sceneFinal');$('pickTitle').textContent=(S.cr+1)+'/5';$('pickHint').textContent='点击抽取';$('pickHint').classList.remove('hidden');$('pickClassTag').classList.add('hidden');$('btnPickStart').classList.remove('hidden');$('btnPickConfirm').classList.add('hidden');$('btnRepick').classList.add('hidden');$('pickName').textContent='——';$('pickName').className='pick-name';$('btnPickStart').disabled=false;$('btnPickStart').textContent='🎲 抽取'}
function rp(){const pool=S.students.length>0?S.students:['---'];const pn=$('pickName');pn.className='pick-name rolling';$('pickHint').textContent='抽取中...';$('btnPickConfirm').classList.add('hidden');$('btnRepick').classList.add('hidden');$('btnPickStart').disabled=true;let rc=0,mx=18+Math.floor(Math.random()*10);let iv=setInterval(()=>{pn.textContent=pool[Math.floor(Math.random()*pool.length)];rc++;if(rc>=mx){clearInterval(iv);fetch('/api/rollcall/pick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,teacher:TEACHER})}).then(d=>d.json()).then(d=>{if(d.error){st('⚠️',d.error);pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false;return}const c=d.student;pn.textContent=c;pn.className='pick-name result';$('pickHint').classList.add('hidden');$('pickClassTag').textContent=S.grade+' · '+S.class;$('pickClassTag').classList.remove('hidden');$('btnPickConfirm').classList.remove('hidden');$('btnRepick').classList.remove('hidden');fp(innerWidth/2,innerHeight/2,'var(--bp-cyan)',30);st('🎯','已选',c);S.picks[S.cr]=c}).catch(()=>{st('⚠️','服务异常');pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false})}},60+Math.random()*40)}

$('btnPickStart').addEventListener('click',function(){this.disabled=true;rp()});
$('btnRepick').addEventListener('click',rp);

$('btnPickConfirm').addEventListener('click',function(){hd('scenePick');sq()});
function sq(){sh('sceneQuiz');S.cq=0;sQ()}
function sQ(){const g=G[S.cr],q=g[S.cq];$('quizTitle').textContent='第'+(S.cr+1)+'组';$('qNumber').textContent=(S.cq+1)+'/2';$('qPrinciple').textContent=q.principle;$('qText').textContent=q.question;S.sa='';S.ans=false;$('feedbackBox').classList.add('hidden');$('btnNextQ').classList.add('hidden');const grid=$('optionsGrid');grid.innerHTML='';['A','B','C','D'].forEach(l=>{const b=document.createElement('button');b.className='option-btn';b.innerHTML='<span class="opt-label">'+l+'</span><span>'+q.options[l]+'</span>';b.dataset.label=l;b.addEventListener('click',()=>hA(l));grid.appendChild(b)})}
function hA(l){if(S.ans)return;S.ans=true;const g=G[S.cr],q=g[S.cq],c=q.answer,ic=l===c;if(ic)_c++;S.rr[S.cr].correctCount=_c;let p=5;if(_c===1)p=10;else if(_c===2)p=15;S.rr[S.cr].points=p;S.rr[S.cr].answers.push({question:q.question,options:q.options,correctAnswer:c,yourAnswer:l,principle:q.principle,isCorrect:ic});const btns=$('optionsGrid').querySelectorAll('.option-btn');btns.forEach(b=>{b.classList.add('disabled');if(b.dataset.label===c)b.classList.add('correct');if(b.dataset.label===l&&!ic)b.classList.add('wrong');if(b.dataset.label===l&&ic)b.classList.add('selected')});const fb=$('feedbackBox');fb.classList.remove('hidden');if(ic){fb.className='feedback-box correct-fb';fb.textContent='✅ '+c+'. '+q.options[c];fp(innerWidth/2,innerHeight-80,'var(--bp-green)',12)}else{fb.className='feedback-box wrong-fb';fb.textContent='❌ 正确答案：'+c+'. '+q.options[c]}$('btnNextQ').classList.remove('hidden');$('btnNextQ').textContent=S.cq===0?'下一题 ▸':'结算'}
$('btnNextQ').addEventListener('click',function(){if(S.cq===0){S.cq=1;sQ()}else{hd('sceneQuiz');sSc()}});
function sSc(){sh('sceneScore');const s=S.picks[S.cr];$('scoreStudent').textContent=s+' · '+S.class;const cr=S.rr[S.cr],cc=cr?.correctCount||0,pts=cr?.points||5;$('scorePoints').textContent='+'+pts;$('scoreLabel').textContent='正确 '+cc+' 题';$('scoreDetail').innerHTML='<div class="score-stat">正确 <strong>'+cc+'</strong></div><div class="score-stat">错误 <strong>'+(2-cc)+'</strong></div><div class="score-stat">保底 <strong>5</strong></div>';sv(S.grade,S.class,s,pts);S.total+=pts;fetch('/api/rollcall/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,student:s,result:'quiz',teacher:TEACHER})}).catch(()=>{});saveRecord(S.grade,S.class,s,cc,2,pts,S.rr[S.cr]?.answers,'技术的发展-蓝图');fp(innerWidth/2,innerHeight/2-100,'var(--bp-gold)',25);$('btnNextRound').textContent=S.cr<4?'下一轮 ▸':'完成'}
$('btnNextRound').addEventListener('click',function(){if(S.cr<4){hd('sceneScore');sr(S.cr+1)}else{hd('sceneScore');sF()}});
function sF(){sh('sceneFinal');$('reviewSection').classList.add('hidden');$('btnReview').textContent='📋 查看错题解析';const tb=$('finalBody');tb.innerHTML='';const rows=S.picks.map((n,i)=>{const cr=S.rr[i];return{name:n,correct:cr?.correctCount||0,points:cr?.points||5}}).sort((a,b)=>b.points-a.points);rows.forEach((r,i)=>{const tr=document.createElement('tr');tr.innerHTML='<td class="rank-num">#'+(i+1)+'</td><td>'+r.name+'</td><td>'+r.correct+'/2</td><td class="rank-score">+'+r.points+'</td>';tb.appendChild(tr)});fp(innerWidth/2,innerHeight/2,'var(--bp-cyan)',50);setTimeout(()=>fp(innerWidth/2,innerHeight/2,'var(--bp-gold)',30),400)}
$('btnReview').addEventListener('click',function(){const rs=$('reviewSection');if(!rs.classList.contains('hidden')){rs.classList.add('hidden');this.textContent='📋 查看错题解析';return}this.textContent='📋 收起解析';buildReview();rs.classList.remove('hidden')});
function buildReview(){const rs=$('reviewSection');rs.innerHTML='';let hasWrong=false;const labels=['A','B','C','D'];S.picks.forEach((n,ri)=>{const cr=S.rr[ri];if(!cr||!cr.answers)return;const wrongs=cr.answers.filter(a=>!a.isCorrect);if(!wrongs.length)return;hasWrong=true;let h='<div class="rev-student">⚙ '+n+' · '+S.class+'</div>';wrongs.forEach(a=>{h+='<div class="rev-item"><span class="rev-princ">'+a.principle+'</span><div class="rev-q">'+a.question+'</div><div class="rev-opt-grid">';labels.forEach(l=>{let cls='rev-opt';if(l===a.yourAnswer)cls+=' rev-chosen';if(l===a.correctAnswer)cls+=' rev-right';h+='<div class="'+cls+'"><span class="rev-opt-label">'+l+'</span><span>'+a.options[l]+'</span></div>'});h+='</div></div>'});rs.innerHTML+=h});if(!hasWrong)rs.innerHTML='<div class="rev-empty">\u2705 \u6240\u6709\u540c\u5b66\u5168\u90e8\u7b54\u5bf9\uff01</div>'}
lc();sh('sceneSetup');ud();
</script>
</body>
</html>
