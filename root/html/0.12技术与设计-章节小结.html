<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教学图片展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px 0;
            background-color: #2c3e50;
            color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        h1 {
            font-size: 1.5em;
            margin: 5px 0;
        }
        
        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .sidebar {
            flex: 0 0 180px; /* 固定宽度 */
            background-color: white;
            border-radius: 5px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .sidebar h2 {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
            color: #2c3e50;
            font-size: 1.2em;
        }
        
        .thumbnail-list {
            list-style: none;
        }
        
        .thumbnail-item {
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 6px;
            border-radius: 4px;
        }
        
        .thumbnail-item:hover {
            background-color: #f0f0f0;
        }
        
        .thumbnail-item.active {
            background-color: #3498db;
            color: white;
        }
        
        .thumbnail-item img {
            width: 100%;
            height: auto;
            border-radius: 3px;
            margin-bottom: 4px;
        }
        
        .thumbnail-item p {
            text-align: center;
            font-size: 0.8em;
            margin: 0;
        }
        
        .main-view {
            flex: 1;
            min-width: 300px;
            background-color: white;
            border-radius: 5px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .image-display {
            max-width: 100%;
            max-height: 70vh;
            margin-bottom: 15px;
            border-radius: 5px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
        
        .image-info {
            width: 100%;
            padding: 12px;
            background-color: #f9f9f9;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        
        .image-info h3 {
            margin-bottom: 8px;
            color: #2c3e50;
            font-size: 1.1em;
        }
        
        .image-info p {
            font-size: 0.9em;
            margin: 0;
        }
        
        .navigation {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
        }
        
        .nav-btn {
            padding: 8px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 0.9em;
        }
        
        .nav-btn:hover {
            background-color: #2980b9;
        }
        
        .nav-btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        
        #imageCounter {
            font-size: 0.9em;
            align-self: center;
        }
        
        footer {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            color: #7f8c8d;
            font-size: 0.8em;
        }
        
        @media (max-width: 768px) {
            .gallery-container {
                flex-direction: column;
            }
            
            .sidebar {
                max-height: 200px;
                margin-bottom: 15px;
                flex: 1;
            }
        }
    
.gear-icon{display:none}/* hidden */
</style>
</head>
<body>
    <div class="container">
        <header>
            <h1>技术与设计章节小结</h1>
        </header>
        
        <div class="gallery-container">
            <div class="sidebar">
                <h2>图片目录</h2>
                <ul class="thumbnail-list" id="thumbnailList">
                    <!-- 缩略图将通过JavaScript动态加载 -->
                </ul>
            </div>
            
            <div class="main-view">
                <img src="" alt="当前展示的图片" class="image-display" id="mainImage">
                
                <div class="image-info">
                    <h3 id="imageTitle">图片信息</h3>
                    <p id="imageDescription">请从左侧选择一张图片</p>
                </div>
                
                <div class="navigation">
                    <button class="nav-btn" id="prevBtn" disabled>上一张</button>
                    <span id="imageCounter">0/0</span>
                    <button class="nav-btn" id="nextBtn" disabled>下一张</button>
                </div>
            </div>
        </div>
        
        <footer>
            <p>章节小结展示系统 &copy; 2023</p>
        </footer>
    </div>

    <script>
        // 图像数据数组 - 用户可以自定义修改这部分
        const imageData = [
            { 
                filename: '11.png', 
                title: '技术', 
                description: '第一章 走进技术世界。'
            },
            { 
                filename: '12.png', 
                title: '设计', 
                description: '第二章 技术世界中的设计。'
            },
            { 
                filename: '13.png', 
                title: '问题', 
                description: '第三章 发现与明确问题。'
            },
            { 
                filename: '14.png', 
                title: '方案', 
                description: '第四章 方案的构思及方法。'
            },
            { 
                filename: '15.png', 
                title: '图样', 
                description: '第五章 设计图样的绘制。'
            },
            { 
                filename: '16.png', 
                title: '模型', 
                description: '第六章 模型或原型的制作。'
            },
            { 
                filename: '17.png', 
                title: '评价', 
                description: '第七章 技术交流与评价。'
            },
            { 
                filename: '21.png', 
                title: '结构', 
                description: '第一单元 结构及其设计。'
            },
            { 
                filename: '22.png', 
                title: '流程', 
                description: '第二单元 流程及其设计。'
            },
            { 
                filename: '23.png', 
                title: '系统', 
                description: '第三单元 系统及其设计。'
            },
            { 
                filename: '24.png', 
                title: '控制', 
                description: '第四单元 控制及其设计。'
            }
        ];

        // DOM元素
        const thumbnailList = document.getElementById('thumbnailList');
        const mainImage = document.getElementById('mainImage');
        const imageTitle = document.getElementById('imageTitle');
        const imageDescription = document.getElementById('imageDescription');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const imageCounter = document.getElementById('imageCounter');

        // 当前选中的图片索引
        let currentIndex = -1;

        // 初始化画廊
        function initGallery() {
            // 清空缩略图列表
            thumbnailList.innerHTML = '';
            
            // 为每张图片创建缩略图
            imageData.forEach((image, index) => {
                const li = document.createElement('li');
                li.className = 'thumbnail-item';
                li.innerHTML = `
                    <img src="imgs/${image.filename}" alt="${image.title}">
                    <p>${image.title}</p>
                `;
                
                // 点击缩略图显示大图
                li.addEventListener('click', () => {
                    showImage(index);
                });
                
                thumbnailList.appendChild(li);
            });
            
            // 如果有图片，默认显示第一张
            if (imageData.length > 0) {
                showImage(0);
            }
            
            // 设置导航按钮事件
            prevBtn.addEventListener('click', () => {
                if (currentIndex > 0) {
                    showImage(currentIndex - 1);
                }
            });
            
            nextBtn.addEventListener('click', () => {
                if (currentIndex < imageData.length - 1) {
                    showImage(currentIndex + 1);
                }
            });
        }

        // 显示指定索引的图片
        function showImage(index) {
            if (index < 0 || index >= imageData.length) return;
            
            const image = imageData[index];
            
            // 更新主图
            mainImage.src = `imgs/${image.filename}`;
            mainImage.alt = image.title;
            
            // 更新信息
            imageTitle.textContent = image.title;
            imageDescription.textContent = image.description;
            
            // 更新计数器
            imageCounter.textContent = `${index + 1}/${imageData.length}`;
            
            // 更新当前索引
            currentIndex = index;
            
            // 更新导航按钮状态
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === imageData.length - 1;
            
            // 更新缩略图选中状态
            updateThumbnailSelection(index);
        }

        // 更新缩略图选中状态
        function updateThumbnailSelection(index) {
            const thumbnails = document.querySelectorAll('.thumbnail-item');
            
            thumbnails.forEach((thumb, i) => {
                if (i === index) {
                    thumb.classList.add('active');
                } else {
                    thumb.classList.remove('active');
                }
            });
        }

        // 键盘导航
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && !prevBtn.disabled) {
                showImage(currentIndex - 1);
            } else if (e.key === 'ArrowRight' && !nextBtn.disabled) {
                showImage(currentIndex + 1);
            }
        });

        // 初始化画廊
        window.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
