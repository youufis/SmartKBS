<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技术与设计 | 课堂挑战</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #2c3e50);
            color: #ecf0f1;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 1s ease-out;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            color: #3498db;
            text-shadow: 0 0 10px rgba(52, 152, 219, 0.7);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-top: 10px;
        }

        .question-card {
            background: rgba(30, 40, 60, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(52, 152, 219, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .question-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 20px rgba(52, 152, 219, 0.4);
        }

        .question-number {
            font-family: 'Orbitron', sans-serif;
            color: #f39c12;
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .options label {
            display: block;
            padding: 15px;
            margin-bottom: 12px;
            background: rgba(40, 50, 70, 0.7);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .options label:hover {
            background: rgba(50, 60, 80, 0.9);
            border-color: #3498db;
        }

        .options input[type="radio"] {
            margin-right: 15px;
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .submit-btn {
            background: linear-gradient(to right, #27ae60, #2ecc71);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }

        .submit-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.5);
        }

        .submit-btn:disabled {
            background: linear-gradient(to right, #7f8c8d, #95a5a6);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .feedback {
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .feedback.correct {
            background-color: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }

        .feedback.incorrect {
            background-color: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }

        .progress-bar-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            height: 20px;
            margin: 30px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, #3498db, #f39c12);
            border-radius: 10px;
            width: 0%;
            transition: width 0.4s ease;
        }

        .results-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .results-content {
            background: linear-gradient(135deg, #2c3e50, #1a2a6c);
            width: 90%;
            max-width: 800px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(52, 152, 219, 0.5);
            border: 1px solid #3498db;
            max-height: 90vh;
            overflow-y: auto;
        }

        .results-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .results-title {
            font-family: 'Orbitron', sans-serif;
            color: #f1c40f;
            font-size: 2.5rem;
        }

        .summary-stats {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .chart-container {
            width: 100%;
            height: 300px;
            margin: 20px auto;
        }

        .close-btn {
            display: block;
            margin: 30px auto 0;
            background: linear-gradient(to right, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.5);
        }

        .detailed-results {
            margin-top: 20px;
        }

        .detail-item {
            background: rgba(40, 50, 70, 0.7);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #3498db;
        }

        .detail-item.correct {
            border-left-color: #2ecc71;
        }

        .detail-item.incorrect {
            border-left-color: #e74c3c;
        }

        .detail-item.unanswered {
            border-left-color: #f39c12;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .question-card { padding: 15px; }
            .action-row { flex-direction: column; gap: 10px; }
        }
    
.gear-icon{display:none}/* hidden */
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>TECH DESIGN CHALLENGE</h1>
        <p class="subtitle">通用技术必修一 第二章 课堂练习</p>
    </header>

    <div class="progress-bar-container">
        <div class="progress-bar" id="overall-progress-bar"></div>
    </div>

    <div id="questions-container">
        <!-- 题目将由JavaScript动态生成 -->
    </div>

    <button id="show-results-btn" class="submit-btn" style="display: none; width: 100%; margin-top: 20px;">查看最终成绩</button>
</div>

<div id="results-overlay" class="results-overlay">
    <div class="results-content">
        <div class="results-header">
            <h2 class="results-title">挑战完成！</h2>
            <div class="summary-stats" id="final-summary"></div>
        </div>
        
        <div class="chart-container">
            <canvas id="results-chart"></canvas>
        </div>

        <h3 style="margin-top: 30px; color: #3498db;">题目解析</h3>
        <div id="detailed-results"></div>

        <button class="close-btn" id="close-results-btn">关闭</button>
    </div>
</div>

<script>
// 题目数据
const questions = [
    {
        id: 1,
        text: "设计在技术中的作用是什么？",
        options: [
            {text: "A. 设计是技术发展的阻碍", value: "A"},
            {text: "B. 设计是技术成果转化为产品的桥梁", value: "B"},
            {text: "C. 设计与技术无关", value: "C"},
            {text: "D. 设计只是美化产品", value: "D"}
        ],
        correctAnswer: "B",
        explanation: "设计是技术成果与人的需求之间联系的纽带，是技术成果转化为技术产品的桥梁。"
    },
    {
        id: 2,
        text: "下列属于技术负面影响的是（ ）",
        options: [
            {text: "A. 互联网使信息传播更快捷", value: "A"},
            {text: "B. 汽车的大量使用导致交通拥堵", value: "B"},
            {text: "C. 洗衣机减轻了人们的劳动强度", value: "C"},
            {text: "D. 空调让人们在夏天更舒适", value: "D"}
        ],
        correctAnswer: "B",
        explanation: "汽车的大量使用导致交通拥堵、空气污染等负面影响，体现了技术的两面性。"
    },
    {
        id: 3,
        text: "设计的一般过程包括：①发现与明确问题；②制订设计方案；③制作模型或原型；④测试、评价及优化；⑤编写产品说明书。正确的顺序是（ ）",
        options: [
            {text: "A. ①②③④⑤", value: "A"},
            {text: "B. ①③②④⑤", value: "B"},
            {text: "C. ②①③④⑤", value: "C"},
            {text: "D. ②③①④⑤", value: "D"}
        ],
        correctAnswer: "A",
        explanation: "设计的一般过程按照逻辑顺序为：发现与明确问题→制订设计方案→制作模型或原型→测试、评价及优化→编写产品说明书。"
    },
    {
        id: 4,
        text: "某同学设计了一款多功能台灯，在设计过程中，他对台灯的功能、结构、材料等进行了分析。这属于设计过程中的（ ）",
        options: [
            {text: "A. 发现与明确问题", value: "A"},
            {text: "B. 制订设计方案", value: "B"},
            {text: "C. 制作模型或原型", value: "C"},
            {text: "D. 测试、评价及优化", value: "D"}
        ],
        correctAnswer: "B",
        explanation: "对功能、结构、材料等进行分析属于制订设计方案阶段中的设计分析环节。"
    },
    {
        id: 5,
        text: "下列设计中，主要体现了设计的实用原则的是（ ）",
        options: [
            {text: "A. 一款手机具有多种颜色可供选择", value: "A"},
            {text: "B. 一款椅子的设计符合人体工程学原理", value: "B"},
            {text: "C. 一款灯具采用了新颖的造型", value: "C"},
            {text: "D. 一款产品的包装设计精美", value: "D"}
        ],
        correctAnswer: "B",
        explanation: "符合人体工程学原理的设计能更好地满足人的使用需求，体现了实用原则。"
    },
    {
        id: 6,
        text: "技术试验是技术活动中的重要环节，下列属于技术试验的是（ ）",
        options: [
            {text: "A. 用计算机模拟飞机的飞行过程", value: "A"},
            {text: "B. 对新研发的药物进行临床试验", value: "B"},
            {text: "C. 绘制建筑图纸", value: "C"},
            {text: "D. 撰写技术报告", value: "D"}
        ],
        correctAnswer: "B",
        explanation: "临床试验是对新药在实际应用中的效果和安全性进行测试，属于真实的技术试验。"
    },
    {
        id: 7,
        text: "三视图是表达物体形状和结构的重要技术图样，三视图不包括（ ）",
        options: [
            {text: "A. 主视图", value: "A"},
            {text: "B. 俯视图", value: "B"},
            {text: "C. 左视图", value: "C"},
            {text: "D. 仰视图", value: "D"}
        ],
        correctAnswer: "D",
        explanation: "三视图包括主视图、俯视图和左视图，不包括仰视图。"
    },
    {
        id: 8,
        text: "在设计图样的绘制中，尺寸标注的基本要求不包括（ ）",
        options: [
            {text: "A. 正确", value: "A"},
            {text: "B. 完整", value: "B"},
            {text: "C. 美观", value: "C"},
            {text: "D. 清晰", value: "D"}
        ],
        correctAnswer: "C",
        explanation: "尺寸标注的基本要求是正确、完整、清晰，美观不是基本要求。"
    },
    {
        id: 9,
        text: "关于技术与设计，下列选项中说法不正确的是（ ）",
        options: [
            {text: "A. 技术是设计表现和实现的平台", value: "A"},
            {text: "B. 设计促进技术革新", value: "B"},
            {text: "C. 技术更新使设计主题更加丰富", value: "C"},
            {text: "D. 技术与设计没有关系", value: "D"}
        ],
        correctAnswer: "D",
        explanation: "技术与设计密切相关，相互促进，D选项明显错误。"
    },
    {
        id: 10,
        text: "据江南某报纸报道，手工设计的老式家用缝纫机价格只有500多元，而某民营企业家与中科院计算所合作，利用先进的电脑技术，设计了一款家用电脑缝纫机，可以卖到8000多元。这个案例说明了（ ）",
        options: [
            {text: "A. 技术的发展离不开设计", value: "A"},
            {text: "B. 技术更新对设计产生重要影响", value: "B"},
            {text: "C. 设计具有丰富的内涵", value: "C"},
            {text: "D. 技术进步制约设计的发展", value: "D"}
        ],
        correctAnswer: "B",
        explanation: "先进的电脑技术使得缝纫机设计更加智能化，体现了技术更新对设计的重要影响。"
    },
    {
        id: 11,
        text: "下列选项中，能实现人机关系健康目标的是（ ）",
        options: [
            {text: "A. 打开正在脱水的洗衣机盖子时，洗衣机马上停止运转", value: "A"},
            {text: "B. 电风扇翻倒，电机的电源马上被切断", value: "B"},
            {text: "C. 根据学生不同的身高，设计不同高度的课桌", value: "C"},
            {text: "D. 电梯门没关好时，上行与下行所有的命令都无效", value: "D"}
        ],
        correctAnswer: "C",
        explanation: "不同高度的课桌符合人体工程学，有利于学生身体健康，体现了人机关系的健康目标。"
    },
    {
        id: 12,
        text: "一款非常简约的MP3，它所有的控制按钮都采用了凸起式设计，以方便盲人操作。这种按钮设计主要考虑到（ ）",
        options: [
            {text: "A. 信息的交互", value: "A"},
            {text: "B. 人机关系的安全目标", value: "B"},
            {text: "C. 静态的人和动态的人的不同需求", value: "C"},
            {text: "D. 人的心理需求", value: "D"}
        ],
        correctAnswer: "A",
        explanation: "凸起式设计便于盲人通过触觉获取信息，体现了良好的信息交互。"
    },
    {
        id: 13,
        text: "水利大坝从理论设计到开工建设都要进行多次试验，一般采用下列的什么方法（ ）",
        options: [
            {text: "A. 优选试验法", value: "A"},
            {text: "B. 模拟试验法", value: "B"},
            {text: "C. 虚拟试验法", value: "C"},
            {text: "D. 强化试验法", value: "D"}
        ],
        correctAnswer: "B",
        explanation: "水利大坝通常通过建立缩小比例的模型进行水流、压力等模拟试验。"
    },
    {
        id: 14,
        text: "某厂生产一种抗拉能力为2000N的钢丝，要生产出一部分样品进行技术测试，下列方法最合理的是（ ）",
        options: [
            {text: "A. 用2000N的拉力作用在钢丝上，看钢丝是否被拉断", value: "A"},
            {text: "B. 用2500N的拉力作用在钢丝上，看钢丝是否被拉断", value: "B"},
            {text: "C. 用钢丝剪测试是否容易被剪断", value: "C"},
            {text: "D. 看弯曲后是否容易恢复形变", value: "D"}
        ],
        correctAnswer: "B",
        explanation: "为了确保安全系数，通常会用超过额定值的力进行测试，2500N大于2000N，更合理。"
    },
    {
        id: 15,
        text: "盲人导购器由指环和耳机组成，指环上有扫描仪，能获得商品名称、保质期等信息，并由耳机发出相应的语音信息。从人机关系的角度看，该设计主要考虑到（ ）",
        options: [
            {text: "A. 使用的安全性", value: "A"},
            {text: "B. 盲人的动态尺寸", value: "B"},
            {text: "C. 信息交互", value: "C"},
            {text: "D. 降低成本", value: "D"}
        ],
        correctAnswer: "C",
        explanation: "通过扫描和语音反馈实现信息传递，主要考虑了信息交互的需求。"
    },
    {
        id: 16,
        text: "大型商场超市都使用扶手电梯，这主要实现人机关系（ ）目标",
        options: [
            {text: "A. 高效", value: "A"},
            {text: "B. 健康", value: "B"},
            {text: "C. 舒适", value: "C"},
            {text: "D. 安全", value: "D"}
        ],
        correctAnswer: "A",
        explanation: "扶手电梯提高了人流运输效率，主要体现了高效目标。"
    },
    {
        id: 17,
        text: "小明设计了一个旅行路由器，该路由器可以绕开wifi的密码验证，方便网络使用者获取资源。该设计违反技术设计的（ ）",
        options: [
            {text: "A. 经济性原则", value: "A"},
            {text: "B. 道德性原则", value: "B"},
            {text: "C. 规范性原则", value: "C"},
            {text: "D. 可持续发展原则", value: "D"}

        correctAnswer: "B",
        explanation: "绕开密码验证侵犯他人网络安全，违反了道德性原则。"
    },
    {
        id: 18,
        text: "即便有了抽油烟机的帮忙，人们在炒菜时仍不能完全避免油烟的困扰。设计师们设计出这款会'吸'油烟的锅，其手柄中内置了碳过滤器和风扇，能最大程度地吸取油烟。这款会'吸'油烟的锅的设计，主要体现了设计的（ ）",
        options: [
            {text: "A. 创新原则和实用原则", value: "A"},
            {text: "B. 美观原则和经济原则", value: "B"},

    {
        id: 19,
        text: "如图所示是一款以水为材料的氢燃料电池车。氢燃料电池应用可再生资源转换技术，将水转化为氢燃料并储存起来。工作时利用水电解的逆反应原理将化学能转化为电能，实现零排放。电池指示灯会根据电池的容量显示不同颜色。该车还配置了多项安全技术保障氢燃料在转化中出现的安全问题。从设计的一般原则的角度分析，下列说法不正确的是（ ）",
        options: [
            {text: "A. 以水为原料，结合多项高新技术，符合创新原则", value: "A"},
            {text: "B. 指示灯能根据电池容量显示不同颜色，符合美观原则", value: "B"},
            {text: "C. 汽车配置有多项安全技术，符合安全原则", value: "C"},
            {text: "D. 采用可再生资源转换技术，符合可持续发展原则", value: "D"}

let userAnswers = {};
let answerStatus = {}; // 记录每道题的回答状态: 'correct', 'incorrect', 'unanswered'

// 动态生成题目HTML
function renderQuestions() {
    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    questions.forEach(q => {
        const questionEl = document.createElement('div');
        questionEl.className = 'question-card';
        questionEl.innerHTML = `
            <div class="question-number">Question #${q.id}</div>
            <div class="question-text">${q.text}</div>
            <div class="options">
                ${q.options.map(opt => `
                    <label>
                        <input type="radio" name="q${q.id}" value="${opt.value}">
                        ${opt.text}
                    </label>
                `).join('')}
            </div>
            <div class="action-row">
                <button class="submit-btn" data-question-id="${q.id}">提交答案</button>
                <div class="feedback" id="feedback-${q.id}"></div>
            </div>
        `;
        container.appendChild(questionEl);

        const submitBtn = questionEl.querySelector(`.submit-btn[data-question-id="${q.id}"]`);
        submitBtn.addEventListener('click', () => handleSingleSubmit(q.id));
    });
}

// 处理单个提交
function handleSingleSubmit(questionId) {
    const selectedRadio = document.querySelector(`input[name="q${questionId}"]:checked`);
    const feedbackEl = document.getElementById(`feedback-${questionId}`);
    const submitBtn = document.querySelector(`.submit-btn[data-question-id="${questionId}"]`);
    
    if (!selectedRadio) {
        alert("请先选择一个答案！");
        return;
    }

    const userChoice = selectedRadio.value;
    const questionData = questions.find(q => q.id === questionId);
    
    userAnswers[questionId] = userChoice;

    if (userChoice === questionData.correctAnswer) {
        feedbackEl.textContent = `正确！ ${questionData.explanation}`;
        feedbackEl.className = 'feedback correct';
        answerStatus[questionId] = 'correct';
    } else {
        feedbackEl.textContent = `错误！正确答案是 ${questionData.correctAnswer}。${questionData.explanation}`;
        feedbackEl.className = 'feedback incorrect';
        answerStatus[questionId] = 'incorrect';
    }
    
    feedbackEl.style.display = 'block';
    submitBtn.disabled = true;
    // 禁用该题的所有选项
    document.querySelectorAll(`input[name="q${questionId}"]`).forEach(radio => radio.disabled = true);

    updateProgressBar();
    checkAllAnswered();
}

// 更新进度条
function updateProgressBar() {
    const total = questions.length;
    const answered = Object.keys(userAnswers).length;
    const percentage = (answered / total) * 100;
    document.getElementById('overall-progress-bar').style.width = `${percentage}%`;
}

// 检查是否全部回答完毕
function checkAllAnswered() {
    if (Object.keys(userAnswers).length === questions.length) {
        document.getElementById('show-results-btn').style.display = 'block';
    }
}

// 显示最终结果
function showResults() {
    let correctCount = 0;
    let incorrectCount = 0;
    let unansweredCount = 0;

    for (let i = 1; i <= questions.length; i++) {
        switch (answerStatus[i]) {
            case 'correct': correctCount++; break;
            case 'incorrect': incorrectCount++; break;
            default: unansweredCount++; break;
        }
    }

    const score = Math.round((correctCount / questions.length) * 100);

    document.getElementById('final-summary').innerHTML = `
        <p>总分: <strong style="color:#f1c40f; font-size: 2rem;">${score}</strong> / 100</p>
        <p>答对: ${correctCount} &nbsp;&nbsp; 答错: ${incorrectCount} &nbsp;&nbsp; 未答: ${unansweredCount}</p>
    `;

    // 创建图表
    const ctx = document.getElementById('results-chart').getContext('2d');
    new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['答对', '答错', '未答'],
            datasets: [{
                data: [correctCount, incorrectCount, unansweredCount],
                backgroundColor: [
                    'rgba(46, 204, 113, 0.7)',
                    'rgba(231, 76, 60, 0.7)',
                    'rgba(243, 156, 18, 0.7)'
                ],
                borderColor: [
                    'rgb(46, 204, 113)',
                    'rgb(231, 76, 60)',
                    'rgb(243, 156, 18)'
                ],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'top', labels: { color: '#ecf0f1' } },
                title: {
                    display: true,
                    text: '答题统计',
                    color: '#ecf0f1',
                    font: { size: 18 }
                }
            }
        }
    });

    // 填充详细结果
    const detailsContainer = document.getElementById('detailed-results');
    detailsContainer.innerHTML = '';
    questions.forEach(q => {
        const userAns = userAnswers[q.id];
        const status = answerStatus[q.id] || 'unanswered';
        let statusText = '未作答';
        let statusColor = '#f39c12';

        if (userAns) {
            statusText = userAns === q.correctAnswer ? '回答正确' : `回答错误 (你的答案: ${userAns})`;
            statusColor = userAns === q.correctAnswer ? '#2ecc71' : '#e74c3c';
        }

        const detailDiv = document.createElement('div');
        detailDiv.className = `detail-item ${status}`;
        detailDiv.innerHTML = `
            <p><strong>第 ${q.id} 题:</strong> <span style="color:${statusColor};">${statusText}</span></p>
            <p><em>${q.explanation}</em></p>
        `;
        detailsContainer.appendChild(detailDiv);
    });

    document.getElementById('results-overlay').style.display = 'flex';
}

// 页面初始化
window.onload = function() {
    renderQuestions();

    document.getElementById('show-results-btn').addEventListener('click', showResults);
    document.getElementById('close-results-btn').addEventListener('click', () => {
        document.getElementById('results-overlay').style.display = 'none';
    });
};
