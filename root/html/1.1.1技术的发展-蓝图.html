<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚙ 技术的发展 · 工业蓝图</title>
<style>
/* ═══════════════════════════════════════════
   工业蓝图风 Industrial Blueprint
   工程图纸 · 精密机械 · 齿轮传动
   深蓝底 + 白线格 + 黄铜点缀
   ═══════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bp-dark:#0d1b3e;
  --bp-mid:#142850;
  --bp-light:#1e3a5f;
  --bp-grid:rgba(255,255,255,.06);
  --bp-line:rgba(255,255,255,.18);
  --bp-gold:#d4a843;
  --bp-gold-dim:#a88633;
  --bp-cyan:#5bc0eb;
  --bp-text:#e8e4d8;
  --bp-text-dim:#9a9aaa;
  --bp-card:rgba(20,40,80,.7);
  --bp-green:#4ecdc4;
  --bp-red:#ff6b6b;
  --font-mono:'JetBrains Mono','Cascadia Code','Consolas',monospace;
  --font-body:'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif;
}
html{font-size:20px}
body{
  font-family:var(--font-body);
  background:var(--bp-dark);
  color:var(--bp-text);
  min-height:100vh;
  overflow-x:hidden;
  display:flex;
  justify-content:center;
  position:relative;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(var(--bp-grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--bp-grid) 1px,transparent 1px);
  background-size:30px 30px;
  pointer-events:none;z-index:0;
}
.gear-deco{position:fixed;pointer-events:none;z-index:0;opacity:.06;}
.gear-deco svg{width:100%;height:100%}
.gear-1{top:40px;left:20px;width:120px;height:120px;animation:spin 20s linear infinite}
.gear-2{bottom:60px;right:30px;width:100px;height:100px;animation:spin-rev 25s linear infinite}
.gear-3{top:45%;right:60px;width:70px;height:70px;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin-rev{to{transform:rotate(-360deg)}}
.corner-deco{position:fixed;z-index:0;pointer-events:none;opacity:.15}
.corner-deco::before,.corner-deco::after{content:'';position:absolute;background:var(--bp-gold)}
.corner-tl{top:0;left:0;width:50px;height:50px}
.corner-tl::before{top:0;left:0;width:3px;height:50px}
.corner-tl::after{top:0;left:0;width:50px;height:3px}
.corner-br{bottom:0;right:0;width:50px;height:50px}
.corner-br::before{bottom:0;right:0;width:3px;height:50px}
.corner-br::after{bottom:0;right:0;width:50px;height:3px}
#app{position:relative;z-index:1;width:100%;max-width:880px;min-height:100vh;padding:28px 18px 50px;display:flex;flex-direction:column;align-items:center;gap:14px}
.bp-header{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;background:var(--bp-card);border:1px solid var(--bp-line);position:relative
}
.bp-header::after{content:'';position:absolute;bottom:-1px;left:10%;right:10%;height:1px;background:var(--bp-gold)}
.bp-header h1{font-family:var(--font-mono);font-size:.82rem;font-weight:700;color:var(--bp-gold);letter-spacing:2px;text-transform:uppercase}
.bp-header h1::before{content:'⚙ ';color:var(--bp-cyan)}
.bp-header .bp-stamp{font-family:var(--font-mono);font-size:.8rem;color:var(--bp-text-dim);border:1px solid var(--bp-line);padding:3px 10px;letter-spacing:1px}
.bp-blocks{display:flex;gap:5px}
.bp-block{width:24px;height:24px;border:1px solid var(--bp-line);background:transparent;transition:all .4s;position:relative}
.bp-block.done{background:var(--bp-gold);border-color:var(--bp-gold);opacity:.7}
.bp-block.active{background:var(--bp-cyan);border-color:var(--bp-cyan);opacity:.9}
.bp-block .gear-icon{position:absolute;inset:3px;border-radius:50%;border:1.5px solid var(--bp-gold-dim)}
.bp-block.done .gear-icon{border-color:var(--bp-dark)}
.bp-card{width:100%;background:var(--bp-card);border:1px solid var(--bp-line);padding:22px 24px;backdrop-filter:blur(6px)}
.bp-card-title{font-family:var(--font-mono);font-size:.85rem;font-weight:600;color:var(--bp-gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--bp-line)}
.bp-card-title span{color:var(--bp-cyan)}
.bp-select-group{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bp-select-group select{flex:1;min-width:160px;padding:10px 14px;background:var(--bp-dark);border:1px solid var(--bp-line);color:var(--bp-text);font-family:var(--font-mono);font-size:.75rem;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none}
.bp-select-group select:focus{border-color:var(--bp-gold)}
.bp-select-group select option{background:var(--bp-dark);color:var(--bp-text)}
.pick-area{text-align:center}
.pick-name{font-family:var(--font-mono);font-size:2.8rem;font-weight:700;color:var(--bp-gold);letter-spacing:2px}
.pick-class-tag{font-family:var(--font-mono);font-size:.85rem;color:var(--bp-cyan);margin-top:4px;font-weight:500}
.bp-btn{
  padding:12px 44px;background:transparent;border:2px solid var(--bp-gold);
  color:var(--bp-gold);font-family:var(--font-mono);font-size:.72rem;font-weight:700;
  cursor:pointer;letter-spacing:2px;text-transform:uppercase;transition:all .25s
}
.bp-btn:hover{background:var(--bp-gold);color:var(--bp-dark)}
.bp-btn:disabled{opacity:.2;cursor:not-allowed;border-color:var(--bp-text-dim)}
.bp-btn:disabled:hover{background:transparent;color:var(--bp-text-dim)}
.bp-btn-cyan{border-color:var(--bp-cyan);color:var(--bp-cyan)}
.bp-btn-cyan:hover{background:var(--bp-cyan);color:var(--bp-dark)}
.quiz-section{text-align:center}
.q-idx{font-family:var(--font-mono);font-size:.8rem;font-weight:600;color:var(--bp-cyan);letter-spacing:1px}
.q-pr{i-font-family:var(--font-mono);font-size:.82rem;color:var(--bp-gold-dim);margin-left:8px;border:1px solid var(--bp-line);padding:2px 8px}
.q-text{font-size:1.05rem;line-height:1.75;margin:12px 0 18px;text-align:left;padding:16px 18px;background:rgba(13,27,62,.5);border-left:3px solid var(--bp-gold);color:var(--bp-text);font-weight:400}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.option-btn{
  padding:14px 16px;background:rgba(13,27,62,.4);border:1px solid var(--bp-line);
  color:var(--bp-text);font-size:.92rem;text-align:left;cursor:pointer;
  transition:all .2s;font-family:var(--font-body);line-height:1.55;
  display:flex;align-items:flex-start;gap:12px
}
.option-btn .opt-label{
  display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:.85rem;font-weight:700;flex-shrink:0;
  border:1px solid var(--bp-line);color:var(--bp-text-dim)
}
.option-btn:hover{border-color:var(--bp-gold);background:rgba(212,168,67,.06)}
.option-btn.selected{border-color:var(--bp-cyan);background:rgba(91,192,235,.06)}
.option-btn.selected .opt-label{background:var(--bp-cyan);color:var(--bp-dark);border-color:var(--bp-cyan)}
.option-btn.correct{border-color:var(--bp-green)!important;background:rgba(78,205,196,.06)!important}
.option-btn.correct .opt-label{background:var(--bp-green)!important;color:var(--bp-dark)!important;border-color:var(--bp-green)!important}
.option-btn.wrong{border-color:var(--bp-red)!important;background:rgba(255,107,107,.06)!important}
.option-btn.wrong .opt-label{background:var(--bp-red)!important;color:#fff!important;border-color:var(--bp-red)!important}
.option-btn.disabled{pointer-events:none;opacity:.35}
.feedback-box{margin-top:14px;padding:12px 18px;font-size:.9rem;animation:fade .3s;border-left:3px solid transparent;text-align:left;font-weight:500}
@keyframes fade{from{opacity:0}to{opacity:1}}
.feedback-box.correct-fb{background:rgba(78,205,196,.06);color:var(--bp-green);border-left-color:var(--bp-green)}
.feedback-box.wrong-fb{background:rgba(255,107,107,.06);color:var(--bp-red);border-left-color:var(--bp-red)}
.score-section{text-align:center}
.score-big{font-family:var(--font-mono);font-size:2.2rem;font-weight:700;color:var(--bp-gold);animation:pop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
.score-label{font-family:var(--font-mono);font-size:.85rem;color:var(--bp-text-dim);letter-spacing:1px}
.score-detail{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.score-stat{padding:6px 14px;background:rgba(13,27,62,.4);font-size:.82rem;font-weight:500;border:1px solid var(--bp-line)}
.score-stat strong{color:var(--bp-gold);font-weight:700}
.final-section{text-align:center}
.final-title{font-family:var(--font-mono);font-size:1rem;font-weight:700;color:var(--bp-gold);margin-bottom:2px;letter-spacing:2px}
.final-sub{color:var(--bp-text-dim);margin-bottom:14px;font-size:.78rem}
.final-table{width:100%;border-collapse:collapse;margin:4px 0 16px}
.final-table th{padding:10px 12px;text-align:left;font-family:var(--font-mono);font-size:.85rem;font-weight:700;color:var(--bp-cyan);border-bottom:2px solid var(--bp-gold);letter-spacing:1px}
.final-table td{padding:10px 12px;font-size:.85rem;border-bottom:1px solid var(--bp-line)}
.final-table tr:hover td{background:rgba(212,168,67,.04)}
.rank-num{color:var(--bp-gold-dim)}
.rank-score{font-family:var(--font-mono);font-weight:700;color:var(--bp-cyan)}
/* 错题解析 */
.review-section{text-align:left;margin-top:10px;border-top:1px solid var(--bp-line);padding-top:14px;max-height:400px;overflow-y:auto}
.rev-empty{text-align:center;color:var(--bp-green);font-family:var(--font-mono);font-size:.75rem;padding:20px 0}
.rev-student{font-family:var(--font-mono);font-size:.85rem;font-weight:600;color:var(--bp-gold);margin:10px 0 6px;padding-bottom:4px;border-bottom:1px dashed var(--bp-line)}
.rev-item{padding:10px 12px;margin-bottom:8px;background:rgba(13,27,62,.4);border-left:3px solid var(--bp-red);border-radius:0 4px 4px 0}
.rev-item.correct{border-left-color:var(--bp-green)}
.rev-q{font-size:.88rem;line-height:1.5;margin-bottom:6px}
.rev-princ{display:inline-block;font-family:var(--font-mono);font-size:.75rem;color:var(--bp-gold-dim);border:1px solid var(--bp-line);padding:1px 6px;margin-bottom:6px}
.rev-opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.rev-opt{padding:6px 8px;font-size:.78rem;line-height:1.4;border:1px solid var(--bp-line);background:rgba(13,27,62,.2);border-radius:2px;display:flex;align-items:flex-start;gap:6px}
.rev-opt .rev-opt-label{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.8rem;font-weight:700;flex-shrink:0;border:1px solid var(--bp-line);color:var(--bp-text-dim)}
.rev-opt.rev-chosen{background:rgba(255,107,107,.08);border-color:var(--bp-red)}
.rev-opt.rev-chosen .rev-opt-label{background:var(--bp-red);color:#fff;border-color:var(--bp-red)}
.rev-opt.rev-right{background:rgba(78,205,196,.08);border-color:var(--bp-green)}
.rev-opt.rev-right .rev-opt-label{background:var(--bp-green);color:var(--bp-dark);border-color:var(--bp-green)}
.hidden{display:none!important}
.toast-container{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{padding:10px 18px;background:var(--bp-card);border:1px solid var(--bp-line);font-family:var(--font-mono);font-size:.7rem;font-weight:600;color:var(--bp-text);animation:toast-in .3s forwards;display:flex;align-items:center;gap:8px}
.toast .toast-icon{font-size:.9rem}
.toast .toast-pts{color:var(--bp-gold)}
.toast.out{animation:toast-out .25s forwards}
@keyframes toast-in{from{transform:translateX(50px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toast-out{from{opacity:1}to{transform:translateX(50px);opacity:0}}
.particle-container{position:fixed;inset:0;pointer-events:none;z-index:999}
.cele-particle{position:fixed;pointer-events:none;animation:part .9s ease-out forwards}
@keyframes part{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg)}}
@media(max-width:640px){
  .options-grid{grid-template-columns:1fr}
  .bp-header{padding:12px 14px;flex-wrap:wrap;gap:8px}
  .bp-header h1{font-size:.7rem}
  .bp-select-group{flex-direction:column}
  .bp-card{padding:16px 14px}
  .q-text{font-size:.95rem}
}
</style>
</head>
<body>

<div class="gear-deco gear-2"><svg viewBox="0 0 100 100"><path d="M50 10c-3 0-5.5 2.2-6 5l-1 5c-2 .8-4 1.8-5.8 3l-4.5-2.3c-2.7-1.4-6-.4-7.3 2.3l-2.5 4.5c-1.4 2.7-.4 6 2.3 7.3l4.5 2.3c-.4 1-.7 2-.8 3l.8 3-4.5 2.3c-2.7 1.4-3.7 4.7-2.3 7.3l2.5 4.5c1.4 2.7 4.6 3.7 7.3 2.3l4.5-2.3c1.8 1.2 3.7 2.2 5.8 3l1 5c.5 2.7 3 5 6 5h5c3 0 5.5-2.2 6-5l1-5c2-.8 4-1.8 5.8-3l4.5 2.3c2.7 1.4 6 .4 7.3-2.3l2.5-4.5c1.4-2.7.4-6-2.3-7.3l-4.5-2.3c.4-1 .7-2 .8-3l-.8-3 4.5-2.3c2.7-1.4 3.7-4.7 2.3-7.3l-2.5-4.5c-1.4-2.7-4.6-3.7-7.3-2.3l-4.5 2.3c-1.8-1.2-3.7-2.2-5.8-3l-1-5c-.5-2.8-3-5-6-5h-5zM50 35c8.3 0 15 6.7 15 15s-6.7 15-15 15-15-6.7-15-15 6.7-15 15-15z" fill="none" stroke="currentColor" stroke-width=".5"/><circle cx="50" cy="50" r="10" fill="none" stroke="currentColor" stroke-width=".5"/></svg></div>
<div class="gear-deco gear-3"><svg viewBox="0 0 100 100"><path d="M50 15c-2.5 0-4.6 1.8-5 4.2l-.8 4.2c-1.7.7-3.3 1.5-4.8 2.5l-3.8-2c-2.2-1.2-5-.3-6 2l-2 3.8c-1.2 2.2-.3 5 2 6l3.8 2c-.3.8-.5 1.6-.6 2.5l.6 2.5-3.8 2c-2.2 1.2-3.2 4-2 6l2 3.8c1.2 2.2 4 3.2 6 2l3.8-2c1.5 1 3.1 1.8 4.8 2.5l.8 4.2c.4 2.4 2.5 4.2 5 4.2h4c2.5 0 4.6-1.8 5-4.2l.8-4.2c1.7-.7 3.3-1.5 4.8-2.5l3.8 2c2.2 1.2 5 .3 6-2l2-3.8c1.2-2.2.3-5-2-6l-3.8-2c.3-.8.5-1.6.6-2.5l-.6-2.5 3.8-2c2.2-1.2 3.2-4 2-6l-2-3.8c-1.2-2.2-4-3.2-6-2l-3.8 2c-1.5-1-3.1-1.8-4.8-2.5l-.8-4.2c-.4-2.4-2.5-4.2-5-4.2h-4zM50 38c6.6 0 12 5.4 12 12s-5.4 12-12 12-12-5.4-12-12 5.4-12 12-12z" fill="none" stroke="currentColor" stroke-width=".5"/><circle cx="50" cy="50" r="8" fill="none" stroke="currentColor" stroke-width=".5"/></svg></div>
<div class="corner-deco corner-tl"></div>
<div class="corner-deco corner-br"></div>
<div class="toast-container" id="toastContainer"></div>
<div class="particle-container" id="particleContainer"></div>
<div id="app">
  <div class="bp-header">
    <h1>技术的发展</h1>
    <span class="bp-stamp">REV.01</span>
    <div class="bp-blocks" id="bpBlocks"></div>
  </div>
  <div class="bp-card" id="sceneSetup">
    <div class="bp-card-title"><span>▶</span> INITIALIZE</div>
    <div class="bp-select-group">
      <select id="gradeSelect"><option value="高一">高一</option><option value="高二">高二</option></select>
      <select id="classSelect" disabled><option value="">— 选择班级 —</option></select>
    </div>
    <button class="bp-btn" id="btnStart" disabled>▶ 启动系统</button>
  </div>
  <div class="bp-card hidden" id="scenePick">
    <div class="bp-card-title"><span>▶</span> RANDOM PICK · <span id="pickTitle">0/5</span></div>
    <div class="pick-area">
      <div class="pick-hint" id="pickHint" style="font-size:.78rem;color:var(--bp-text-dim);margin-bottom:4px">点击抽取</div>
      <div class="pick-name" id="pickName">——</div>
      <div class="pick-class-tag hidden" id="pickClassTag"></div>
      <button class="bp-btn" id="btnPickStart" style="margin-top:12px">🎲 抽取</button>
      <button class="bp-btn bp-btn-cyan hidden" id="btnPickConfirm" style="margin-top:12px">✓ 确认</button>
    <button class="bp-btn bp-btn-cyan hidden" id="btnRepick" style="margin-top:12px">↻ 重抽</button>
    </div>
  </div>
  <div class="bp-card hidden" id="sceneQuiz">
    <div class="bp-card-title"><span>▶</span> QUIZ · <span id="quizTitle">第1组</span></div>
    <div class="quiz-section">
      <div><span class="q-idx" id="qNumber">1/2</span><span class="q-pr" id="qPrinciple" style="font-family:var(--font-mono);font-size:.82rem;color:var(--bp-gold-dim);margin-left:8px;border:1px solid var(--bp-line);padding:2px 8px"></span></div>
      <div class="q-text" id="qText">—</div>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="feedback-box hidden" id="feedbackBox"></div>
      <button class="bp-btn bp-btn-cyan hidden" id="btnNextQ" style="margin-top:10px">下一题 ▸</button>
    </div>
  </div>
  <div class="bp-card hidden" id="sceneScore">
    <div class="bp-card-title"><span>▶</span> SCORE</div>
    <div class="score-section">
      <div class="score-label">学生</div>
      <div style="font-size:1rem;font-weight:600;color:var(--bp-gold);margin:3px 0 6px" id="scoreStudent"></div>
      <div class="score-big" id="scorePoints">+10</div>
      <div class="score-label" id="scoreLabel">正确 1 题</div>
      <div class="score-detail" id="scoreDetail"></div>
      <button class="bp-btn bp-btn-cyan" id="btnNextRound" style="margin-top:10px">下一轮 ▸</button>
    </div>
  </div>
  <div class="bp-card hidden" id="sceneFinal">
    <div class="bp-card-title"><span>■</span> FINAL RANKING</div>
    <div class="final-sub">积分排行榜</div>
    <div style="overflow-x:auto"><table class="final-table"><thead><tr><th>#</th><th>姓名</th><th>答对</th><th>积分</th></tr></thead><tbody id="finalBody"></tbody></table></div>
    <button class="bp-btn bp-btn-cyan" id="btnReview" style="margin-top:6px">📋 查看错题解析</button>
    <div class="review-section hidden" id="reviewSection"></div>
    <button class="bp-btn" onclick="location.reload()" style="margin-top:10px">⟳ 重新开始</button>
  </div>
</div>
<script>
// 从 URL 路径自动提取教师用户名
const pathMatch = window.location.pathname.match(/\/api\/files\/([^\/]+)\/html\//);
const TEACHER = (pathMatch ? pathMatch[1] : '') || '';

const Q=[{question:"技术产生的根本原因是什么？",options:{A:"科学理论的突破",B:"人类的需求",C:"自然环境的改变",D:"偶然的发现"},answer:"B",principle:"技术发展动力"},{question:"人类社会历史发展依据生产工具的变革，先后经历了多个时代。下列排列顺序正确的是（ ）。",options:{A:"石器时代→青铜时代→铁器时代→蒸汽时代→电气时代→信息时代",B:"石器时代→铁器时代→青铜时代→蒸汽时代→电气时代→信息时代",C:"青铜时代→石器时代→铁器时代→蒸汽时代→电气时代→信息时代",D:"石器时代→青铜时代→蒸汽时代→铁器时代→电气时代→信息时代"},answer:"A",principle:"技术发展历程"},{question:"瓦特对蒸汽机的改良，使人类进入了哪个时代？",options:{A:"电气时代",B:"信息时代",C:"蒸汽时代",D:"铁器时代"},answer:"C",principle:"技术革新与发明"},{question:"下列哪项发明标志着人类开始进入信息时代？",options:{A:"蒸汽机",B:"发电机",C:"计算机与高速通信网",D:"内燃机"},answer:"C",principle:"技术发展历程"},{question:"下列选项中，属于中国古代四大发明的是（ ）。",options:{A:"造纸术、火药、指南针、印刷术",B:"造纸术、火药、地动仪、印刷术",C:"造纸术、指南针、浑天仪、印刷术",D:"火药、指南针、印刷术、纺织术"},answer:"A",principle:"中国成就"},{question:"从人类掌握钻木取火技术开始，人类历史便拉开了文明的序幕。这主要体现了技术的什么作用？",options:{A:"保护人",B:"解放人",C:"发展人",D:"满足人类需求并推动文明进步"},answer:"D",principle:"技术发展动力"},{question:"1970年，我国自行设计、制造的第一颗人造地球卫星成功发射，它是（ ）。",options:{A:"神舟一号",B:"东方红一号",C:"嫦娥一号",D:"天宫一号"},answer:"B",principle:"中国成就"},{question:"袁隆平院士选育出的杂交水稻新品种南优二号，主要体现了技术对哪方面的贡献？",options:{A:"航天技术",B:"计算机技术",C:"农业技术",D:"通信技术"},answer:"C",principle:"中国成就"},{question:"从火把、油灯到白炽灯、LED灯，照明技术的发展历程说明了什么？",options:{A:"技术的创新是偶然的",B:"人的需求推动了技术的不断发展",C:"技术发展不需要科学理论的支撑",D:"照明技术已经停止发展"},answer:"B",principle:"技术发展动力"},{question:"当前，以5G通信、人工智能、高铁等为代表的先进技术，正在推动中国进入一个新的发展阶段。这体现了（ ）。",options:{A:"技术发展是孤立的",B:"技术发展与社会进步相互促进",C:"只有西方国家才能引领技术发展",D:"技术发展不需要满足人类需求"},answer:"B",principle:"技术发展动力"}];
const G=[];for(let i=0;i<5;i++)G.push(Q.slice(i*2,i*2+2));
let S={grade:'高一',class:'',students:[],available:[],picks:[],cr:0,cq:0,sa:'',ans:false,rr:[],total:0},_c=0;
function $(i){return document.getElementById(i)}
function sh(i){$(i).classList.remove('hidden')}
function hd(i){$(i).classList.add('hidden')}
function sf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}
function st(i,m,s){const t=document.createElement('div');t.className='toast';t.innerHTML='<span class="toast-icon">'+i+'</span>'+m+(s?' <span class="toast-pts">'+s+'</span>':'');$('toastContainer').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),250)},3000)}
function fp(x,y,c,cnt){const pc=$('particleContainer');for(let i=0;i<cnt;i++){const e=document.createElement('div');e.className='cele-particle';const a=Math.random()*Math.PI*2,d=60+Math.random()*130;e.style.cssText='left:'+(x||innerWidth/2)+'px;top:'+(y||innerHeight/2)+'px;width:'+(5+Math.random()*7)+'px;height:'+(5+Math.random()*7)+'px;background:'+(c||'var(--bp-cyan)')+';--dx:'+(Math.cos(a)*d)+'px;--dy:'+(Math.sin(a)*d)+'px';pc.appendChild(e);setTimeout(()=>e.remove(),1200)}}
function ud(){try{const h=$('bpBlocks')||$('memBlocks')||$('progressDots')||$('popDots');if(!h)return;h.innerHTML='';for(let i=0;i<5;i++){const e=document.createElement('div');e.className='bp-block'+(i<S.cr?' done':i===S.cr?' active':'');e.innerHTML='<div class="gear-icon"></div>';h.appendChild(e)}}catch(e){}}
function sv(g,c,n,p){fetch('/api/scores/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,name:n,points:p,teacher:TEACHER})}).then(r=>r.ok?st('💰','保存','+'+p):st('⚠️','异常')).catch(()=>st('📝','本地'))}
function saveRecord(g,c,s,cc,t,pts,ans,title){fetch('/api/rollcall/save-record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,student:s,type:'互动答题',title:title||'',correctCount:cc,totalQuestions:t,points:pts,answers:ans||[],teacher:TEACHER})}).catch(()=>{})}
async function lc(){const g=$('gradeSelect').value;S.grade=g;const cs=$('classSelect');cs.disabled=true;cs.innerHTML='<option value="">...</option>';try{const r=await fetch('/api/rollcall/classes?grade='+encodeURIComponent(g)+'&teacher='+TEACHER);const cls=await r.json();cs.innerHTML='<option value="">— 选择 —</option>';cls.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o)});cs.disabled=false}catch(e){cs.innerHTML='<option value="">失败</option>'}}
$('gradeSelect').addEventListener('change',lc);$('classSelect').addEventListener('change',async function(){const c=this.value;S.class=c;$('btnStart').disabled=!c;if(c){try{const r=await fetch('/api/rollcall/students?grade='+encodeURIComponent(S.grade)+'&class='+encodeURIComponent(c)+'&teacher='+TEACHER);const data=await r.json();S.students=data.map(s=>s.name)}catch(e){S.students=[];st('⚠️','加载学生失败')}}});
$('btnStart').addEventListener('click',function(){if(!S.class||S.students.length<5){st('⚠️','人数不足');return}hd('sceneSetup');sr(0)});
function sr(ri){S.cr=ri;S.cq=0;_c=0;if(!S.rr[ri])S.rr[ri]={correctCount:0,points:0,answers:[]};S.rr[ri].answers=[];ud();sp()}
function sp(){sh('scenePick');hd('sceneQuiz');hd('sceneScore');hd('sceneFinal');$('pickTitle').textContent=(S.cr+1)+'/5';$('pickHint').textContent='点击抽取';$('pickHint').classList.remove('hidden');$('pickClassTag').classList.add('hidden');$('btnPickStart').classList.remove('hidden');$('btnPickConfirm').classList.add('hidden');$('btnRepick').classList.add('hidden');$('pickName').textContent='——';$('pickName').className='pick-name';$('btnPickStart').disabled=false;$('btnPickStart').textContent='🎲 抽取'}
function rp(){const pool=S.students.length>0?S.students:['---'];const pn=$('pickName');pn.className='pick-name rolling';$('pickHint').textContent='抽取中...';$('btnPickConfirm').classList.add('hidden');$('btnRepick').classList.add('hidden');$('btnPickStart').disabled=true;let rc=0,mx=18+Math.floor(Math.random()*10);let iv=setInterval(()=>{pn.textContent=pool[Math.floor(Math.random()*pool.length)];rc++;if(rc>=mx){clearInterval(iv);fetch('/api/rollcall/pick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,teacher:TEACHER})}).then(d=>d.json()).then(d=>{if(d.error){st('⚠️',d.error);pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false;return}const c=d.student;pn.textContent=c;pn.className='pick-name result';$('pickHint').classList.add('hidden');$('pickClassTag').textContent=S.grade+' · '+S.class;$('pickClassTag').classList.remove('hidden');$('btnPickConfirm').classList.remove('hidden');$('btnRepick').classList.remove('hidden');fp(innerWidth/2,innerHeight/2,'var(--bp-cyan)',30);st('🎯','已选',c);S.picks[S.cr]=c}).catch(()=>{st('⚠️','服务异常');pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false})}},60+Math.random()*40)}

$('btnPickStart').addEventListener('click',function(){this.disabled=true;rp()});
$('btnRepick').addEventListener('click',rp);

$('btnPickConfirm').addEventListener('click',function(){hd('scenePick');sq()});
function sq(){sh('sceneQuiz');S.cq=0;sQ()}
function sQ(){const g=G[S.cr],q=g[S.cq];$('quizTitle').textContent='第'+(S.cr+1)+'组';$('qNumber').textContent=(S.cq+1)+'/2';$('qPrinciple').textContent=q.principle;$('qText').textContent=q.question;S.sa='';S.ans=false;$('feedbackBox').classList.add('hidden');$('btnNextQ').classList.add('hidden');const grid=$('optionsGrid');grid.innerHTML='';['A','B','C','D'].forEach(l=>{const b=document.createElement('button');b.className='option-btn';b.innerHTML='<span class="opt-label">'+l+'</span><span>'+q.options[l]+'</span>';b.dataset.label=l;b.addEventListener('click',()=>hA(l));grid.appendChild(b)})}
function hA(l){if(S.ans)return;S.ans=true;const g=G[S.cr],q=g[S.cq],c=q.answer,ic=l===c;if(ic)_c++;S.rr[S.cr].correctCount=_c;let p=5;if(_c===1)p=10;else if(_c===2)p=15;S.rr[S.cr].points=p;S.rr[S.cr].answers.push({question:q.question,options:q.options,correctAnswer:c,yourAnswer:l,principle:q.principle,isCorrect:ic});const btns=$('optionsGrid').querySelectorAll('.option-btn');btns.forEach(b=>{b.classList.add('disabled');if(b.dataset.label===c)b.classList.add('correct');if(b.dataset.label===l&&!ic)b.classList.add('wrong');if(b.dataset.label===l&&ic)b.classList.add('selected')});const fb=$('feedbackBox');fb.classList.remove('hidden');if(ic){fb.className='feedback-box correct-fb';fb.textContent='✅ '+c+'. '+q.options[c];fp(innerWidth/2,innerHeight-80,'var(--bp-green)',12)}else{fb.className='feedback-box wrong-fb';fb.textContent='❌ 正确答案：'+c+'. '+q.options[c]}$('btnNextQ').classList.remove('hidden');$('btnNextQ').textContent=S.cq===0?'下一题 ▸':'结算'}
$('btnNextQ').addEventListener('click',function(){if(S.cq===0){S.cq=1;sQ()}else{hd('sceneQuiz');sSc()}});
function sSc(){sh('sceneScore');const s=S.picks[S.cr];$('scoreStudent').textContent=s+' · '+S.class;const cr=S.rr[S.cr],cc=cr?.correctCount||0,pts=cr?.points||5;$('scorePoints').textContent='+'+pts;$('scoreLabel').textContent='正确 '+cc+' 题';$('scoreDetail').innerHTML='<div class="score-stat">正确 <strong>'+cc+'</strong></div><div class="score-stat">错误 <strong>'+(2-cc)+'</strong></div><div class="score-stat">保底 <strong>5</strong></div>';sv(S.grade,S.class,s,pts);S.total+=pts;fetch('/api/rollcall/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,student:s,result:'quiz',teacher:TEACHER})}).catch(()=>{});saveRecord(S.grade,S.class,s,cc,2,pts,S.rr[S.cr]?.answers,'技术的发展-蓝图');fp(innerWidth/2,innerHeight/2-100,'var(--bp-gold)',25);$('btnNextRound').textContent=S.cr<4?'下一轮 ▸':'完成'}
$('btnNextRound').addEventListener('click',function(){if(S.cr<4){hd('sceneScore');sr(S.cr+1)}else{hd('sceneScore');sF()}});
function sF(){sh('sceneFinal');$('reviewSection').classList.add('hidden');$('btnReview').textContent='📋 查看错题解析';const tb=$('finalBody');tb.innerHTML='';const rows=S.picks.map((n,i)=>{const cr=S.rr[i];return{name:n,correct:cr?.correctCount||0,points:cr?.points||5}}).sort((a,b)=>b.points-a.points);rows.forEach((r,i)=>{const tr=document.createElement('tr');tr.innerHTML='<td class="rank-num">#'+(i+1)+'</td><td>'+r.name+'</td><td>'+r.correct+'/2</td><td class="rank-score">+'+r.points+'</td>';tb.appendChild(tr)});fp(innerWidth/2,innerHeight/2,'var(--bp-cyan)',50);setTimeout(()=>fp(innerWidth/2,innerHeight/2,'var(--bp-gold)',30),400)}
$('btnReview').addEventListener('click',function(){const rs=$('reviewSection');if(!rs.classList.contains('hidden')){rs.classList.add('hidden');this.textContent='📋 查看错题解析';return}this.textContent='📋 收起解析';buildReview();rs.classList.remove('hidden')});
function buildReview(){const rs=$('reviewSection');rs.innerHTML='';let hasWrong=false;const labels=['A','B','C','D'];S.picks.forEach((n,ri)=>{const cr=S.rr[ri];if(!cr||!cr.answers)return;const wrongs=cr.answers.filter(a=>!a.isCorrect);if(!wrongs.length)return;hasWrong=true;let h='<div class="rev-student">⚙ '+n+' · '+S.class+'</div>';wrongs.forEach(a=>{h+='<div class="rev-item"><span class="rev-princ">'+a.principle+'</span><div class="rev-q">'+a.question+'</div><div class="rev-opt-grid">';labels.forEach(l=>{let cls='rev-opt';if(l===a.yourAnswer)cls+=' rev-chosen';if(l===a.correctAnswer)cls+=' rev-right';h+='<div class="'+cls+'"><span class="rev-opt-label">'+l+'</span><span>'+a.options[l]+'</span></div>'});h+='</div></div>'});rs.innerHTML+=h});if(!hasWrong)rs.innerHTML='<div class="rev-empty">\u2705 \u6240\u6709\u540c\u5b66\u5168\u90e8\u7b54\u5bf9\uff01</div>'}
lc();sh('sceneSetup');ud();
</script>
</body>
</html>
