<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>技术交流与评价 · 发布会</title>
<style>
:root{
  --st-bg:#0a0a12; --st-card:#14141e;
  --st-text:#eaeaea; --st-dim:#6a6a7a;
  --st-gold:#d4a843; --st-red:#e85050;
  --st-green:#46b88c; --st-blue:#5b9ae0;
  --st-purple:#a074d9;
  --font:'Inter','Segoe UI',system-ui,sans-serif;
  --font-body:'Inter','Segoe UI',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--font-body);background:var(--st-bg);
  color:var(--st-text);min-height:100vh;padding:20px;
  background-image:radial-gradient(ellipse at 50% 0%,rgba(212,168,67,.03) 0%,transparent 60%);
}
.container{max-width:680px;margin:0 auto}
/* 舞台聚光灯效果 */
.st-spotlight{position:fixed;top:-100px;left:50%;transform:translateX(-50%);width:300px;height:300px;background:radial-gradient(ellipse,rgba(212,168,67,.04) 0%,transparent 70%);pointer-events:none;z-index:0}
/* 头部 */
.st-header{text-align:center;padding:28px 0 14px;position:relative;z-index:1}
.st-header h1{
  font-family:var(--font);font-size:1.6rem;font-weight:700;
  color:var(--st-gold);letter-spacing:3px;
  text-transform:uppercase;
}
.st-header .st-line{width:60px;height:2px;background:var(--st-gold);margin:6px auto}
.st-header .st-sub{font-size:.65rem;color:var(--st-dim);letter-spacing:4px;font-family:var(--font-mono)}
/* 卡片 = 幻灯片 */
.st-card{
  background:var(--st-card);border:1px solid rgba(255,255,255,.06);
  border-radius:8px;padding:22px 24px;margin-bottom:12px;
  position:relative;z-index:1;
  box-shadow:0 4px 30px rgba(0,0,0,.3);
}
.st-card::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg,transparent,var(--st-gold),transparent)}
.st-title{
  font-family:var(--font);font-size:.9rem;font-weight:600;
  color:var(--st-gold);margin-bottom:14px;letter-spacing:2px;
  display:flex;align-items:center;gap:8px;
}
.st-title .st-badge{
  font-family:var(--font-mono);font-size:.45rem;color:var(--st-dim);
  border:1px solid rgba(255,255,255,.08);padding:1px 8px;
  letter-spacing:1px;
}
/* 设置 */
.setup-group{display:flex;flex-direction:column;gap:10px}
.setup-row{display:flex;align-items:center;gap:10px}
.setup-row label{font-family:var(--font-mono);font-size:.65rem;font-weight:600;min-width:50px;color:var(--st-dim);letter-spacing:1px}
.setup-row select,.setup-row button{
  flex:1;padding:9px 12px;font-family:var(--font-body);font-size:.8rem;
  border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:var(--st-text);
  border-radius:4px;cursor:pointer;outline:none;
}
.setup-row select:focus,.setup-row button:focus{border-color:var(--st-gold)}
.setup-row select:disabled{opacity:.3}
.st-btn{
  padding:10px 36px;font-family:var(--font);font-size:.78rem;font-weight:600;
  border:1px solid var(--st-gold);background:transparent;color:var(--st-gold);
  cursor:pointer;transition:all .2s;border-radius:4px;
  letter-spacing:1px;
}
.st-btn:hover{background:var(--st-gold);color:var(--st-bg)}
.st-btn:active{transform:scale(.97)}
.st-btn:disabled{opacity:.2;cursor:not-allowed;transform:none}
.st-btn-primary{background:var(--st-gold);color:var(--st-bg)}
.st-btn-primary:hover{background:#e0b550}
.st-btn-green{background:var(--st-green);color:var(--st-bg);border-color:var(--st-green)}
.st-btn-green:hover{background:#52c898;border-color:#52c898}
.hidden{display:none!important}
/* 点名 = 聚光灯下登场 */
.pick-area{text-align:center;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pick-name{
  font-family:var(--font);font-size:2.8rem;font-weight:700;
  color:var(--st-gold);transition:all .12s;letter-spacing:4px;
  text-shadow:0 0 30px rgba(212,168,67,.15);
}
.pick-name.rolling{animation:st-flicker .06s infinite}
@keyframes st-flicker{0%,100%{opacity:1}50%{opacity:.3}}
.pick-name.result{animation:st-reveal .5s ease;color:#fff}
@keyframes st-reveal{0%{opacity:0;transform:scale(.5)translateY(20px);text-shadow:0 0 60px var(--st-gold)}100%{opacity:1;transform:scale(1)translateY(0);text-shadow:0 0 30px rgba(212,168,67,.15)}}
.pick-hint,.pick-class{font-size:.7rem;color:var(--st-dim);margin-top:4px;letter-spacing:1px}
.pick-class{color:var(--st-green);font-weight:500}
/* 答题 = 大屏演示 */
.quiz-area{text-align:center}
.q-info{font-size:.85rem;color:var(--st-dim);margin-bottom:6px;letter-spacing:1px}
.q-princ{color:var(--st-green);font-weight:500}
.q-text{
  font-size:1.1rem;line-height:1.8;text-align:left;
  padding:18px 20px;border:1px solid rgba(255,255,255,.1);
  margin:8px 0 16px;border-radius:8px;
  background:rgba(255,255,255,.04);
}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt-btn{
  padding:14px 16px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);text-align:left;cursor:pointer;
  font-family:var(--font-body);font-size:.95rem;line-height:1.5;
  display:flex;align-items:flex-start;gap:12px;transition:all .15s;
  border-radius:6px;color:var(--st-text);
}
.opt-btn .ol{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.6rem;font-weight:700;flex-shrink:0;border:1px solid rgba(255,255,255,.1);color:var(--st-dim);border-radius:2px}
.opt-btn:hover{border-color:var(--st-gold);background:rgba(212,168,67,.04)}
.opt-btn.disabled{opacity:.5;pointer-events:none}
.opt-btn.correct{border-color:var(--st-green);background:rgba(70,184,140,.06)}
.opt-btn.correct .ol{background:var(--st-green);color:var(--st-bg);border-color:var(--st-green)}
.opt-btn.wrong{border-color:var(--st-red);background:rgba(232,80,80,.06)}
.opt-btn.wrong .ol{background:var(--st-red);color:#fff;border-color:var(--st-red)}
.opt-btn.selected{border-color:var(--st-gold)}
.feedback{font-size:.78rem;padding:8px 14px;margin-top:8px;font-weight:500;border-radius:4px}
.feedback.correct{background:rgba(70,184,140,.08);color:var(--st-green);border:1px solid rgba(70,184,140,.15)}
.feedback.wrong{background:rgba(232,80,80,.08);color:var(--st-red);border:1px solid rgba(232,80,80,.15)}
/* 计分 */
.score-section{text-align:center}
.score-student{font-family:var(--font);font-size:1rem;color:var(--st-gold);letter-spacing:2px}
.score-points{font-family:var(--font);font-size:2.5rem;font-weight:700;color:#fff;margin:8px 0;text-shadow:0 0 40px rgba(212,168,67,.2)}
.score-label{font-size:.7rem;color:var(--st-dim);letter-spacing:1px}
.bar-wrap{display:flex;align-items:center;gap:8px;margin-top:12px}
.bar-bg{flex:1;height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--st-gold),var(--st-green));transition:width .5s;border-radius:2px}
.bar-text{font-size:.55rem;color:var(--st-dim);min-width:30px;font-family:var(--font-mono)}
/* 排名 */
.final-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.8rem}
.final-table th{background:rgba(255,255,255,.04);color:var(--st-gold);padding:8px 10px;font-family:var(--font-mono);font-size:.6rem;text-align:left;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,.06)}
.final-table td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.03)}
.rank-num{font-family:var(--font-mono);font-weight:700;color:var(--st-dim)}
.rank-score{font-weight:700;color:var(--st-gold)}
/* 粒子 */
.particle-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
.particle{position:absolute;border-radius:50%;pointer-events:none}
/* 错题解析 */
.review-section{text-align:left;margin-top:10px;border-top:1px solid rgba(255,255,255,.06);padding-top:14px;max-height:400px;overflow-y:auto}
.rev-empty{text-align:center;color:var(--st-green);font-family:var(--font);font-size:.78rem;padding:20px 0}
.rev-student{font-family:var(--font);font-size:.8rem;font-weight:600;color:var(--st-gold);margin:10px 0 6px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.06)}
.rev-item{padding:10px 12px;margin-bottom:8px;background:rgba(255,255,255,.02);border-left:3px solid var(--st-red);border-radius:4px}
.rev-q{font-size:.8rem;line-height:1.5;margin-bottom:6px}
.rev-princ{display:inline-block;font-family:var(--font-mono);font-size:.5rem;color:var(--st-dim);border:1px solid rgba(255,255,255,.08);padding:1px 6px;margin-bottom:6px}
.rev-opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.rev-opt{padding:5px 8px;font-size:.7rem;line-height:1.4;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);display:flex;align-items:flex-start;gap:6px;border-radius:2px}
.rev-opt .rol{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.5rem;font-weight:700;flex-shrink:0;border:1px solid rgba(255,255,255,.1);color:var(--st-dim)}
.rev-opt.rev-chosen{background:rgba(232,80,80,.06);border-color:var(--st-red)}
.rev-opt.rev-chosen .rol{background:var(--st-red);color:#fff;border-color:var(--st-red)}
.rev-opt.rev-right{background:rgba(70,184,140,.06);border-color:var(--st-green)}
.rev-opt.rev-right .rol{background:var(--st-green);color:var(--st-bg);border-color:var(--st-green)}

.gear-icon{display:none}/* hidden */
</style>
</head>
<body>
<div class="st-spotlight"></div>
<div class="container" id="app">
<div class="st-header">
  <div class="st-line"></div>
  <h1>技术交流与评价</h1>
  <div class="st-sub">PRESENTATION &bull; EVALUATION</div>
</div>
<div class="st-card" id="sceneSetup">
  <div class="st-title"><span class="st-badge">SETUP</span> 设置</div>
  <div class="setup-group">
    <div class="setup-row"><label>年级</label><select id="gradeSelect"><option value="高一">高一</option><option value="高二">高二</option></select></div>
    <div class="setup-row"><label>班级</label><select id="classSelect" disabled><option value="">—</option></select></div>
    <div class="setup-row" style="margin-top:6px"><button class="st-btn st-btn-primary" id="btnStart" disabled>开始</button></div>
  </div>
</div>
<div class="st-card hidden" id="scenePick">
  <div class="st-title"><span class="st-badge">STAGE</span> <span id="pickTitle">登场</span></div>
  <div class="pick-area">
    <div class="pick-hint" id="pickHint">点击抽取</div>
    <div class="pick-name" id="pickName">—</div>
    <div class="pick-class hidden" id="pickClassTag"></div>
    <button class="st-btn hidden" id="btnPickStart" style="margin-top:8px">🎟 抽取</button>
    <button class="st-btn st-btn-green hidden" id="btnPickConfirm" style="margin-top:4px">✔ 确认</button>
    <button class="st-btn st- hidden" id="btnRepick" style="margin-top:4px">↻ 重抽</button>
  </div>
</div>
<div class="st-card hidden" id="sceneQuiz">
  <div class="st-title" id="quizTitle"><span class="st-badge">SLIDE</span> 答题</div>
  <div class="quiz-area">
    <div class="q-info"><span id="qNumber">1/2</span> &middot; <span class="q-princ" id="qPrinciple"></span></div>
    <div class="q-text" id="qText">—</div>
    <div class="opt-grid" id="optionsGrid"></div>
    <div class="feedback hidden" id="feedbackBox"></div>
    <button class="st-btn hidden" id="btnNextQ" style="margin-top:8px">下一题</button>
  </div>
</div>
<div class="st-card hidden" id="sceneScore">
  <div class="st-title"><span class="st-badge">SCORE</span> 成绩</div>
  <div class="score-section">
    <div class="score-label">学生</div>
    <div class="score-student" id="scoreStudent"></div>
    <div class="score-points" id="scorePoints">+10</div>
    <div class="score-label" id="scoreLabel">正确 1 题</div>
    <div class="score-label" id="scoreDetail" style="margin-top:2px;font-size:.65rem"></div>
    <div class="bar-wrap"><div class="bar-bg"><div class="bar-fill" id="energyBar" style="width:0%"></div></div><span class="bar-text" id="energyText">0%</span></div>
    <button class="st-btn" id="btnNextRound" style="margin-top:8px">下一组</button>
  </div>
</div>
<div class="st-card hidden" id="sceneFinal">
  <div class="st-title"><span class="st-badge">RANKING</span> 排名榜</div>
  <div style="overflow-x:auto"><table class="final-table"><thead><tr><th>#</th><th>姓名</th><th>班级</th><th>答对</th><th>积分</th></tr></thead><tbody id="finalBody"></tbody></table></div>
  <button class="st-btn st-btn-primary" id="btnReview" style="margin-top:8px">📋 查看错题解析</button>
  <div class="review-section hidden" id="reviewSection"></div>
  <button class="st-btn" onclick="location.reload()" style="margin-top:10px">🔄 重新开始</button>
</div>
</div>
<div class="particle-container" id="particleContainer"></div>
<script>// 从 URL 路径自动提取教师用户名
const pathMatch = window.location.pathname.match(/\/api\/files\/([^\/]+)\/html\//);
const TEACHER = (pathMatch ? pathMatch[1] : '') || '';
const Q=[
  {question:"技术试验是检验产品性能和质量的重要手段。某化工厂生产一种抗拉能力为300N的尼龙丝，下面测试方法最合理的是？",options:{A:"用300N拉力测试",B:"用350N拉力测试",C:"剪切试验",D:"弯曲试验"},answer:"B",principle:"技术试验方法"},
  {question:"许丽购买椅子时，不合适的试验方法是？",options:{A:"坐上去感受舒适度",B:"手摇晃检查稳定性",C:"放重物检查承载能力",D:"摩擦穿刷检验防滑性"},answer:"D",principle:"技术试验合理性"},
  {question:"对产品原型进行试验后，主要评价依据是？",options:{A:"使用寿命",B:"功能数量",C:"安全环保",D:"设计基本原则"},answer:"D",principle:"设计评价依据"},
  {question:"材料弯曲测试，通过逐一增加码码磁观测弯曲程度，这属于？",options:{A:"性能试验",B:"优化试验",C:"信息试验",D:"预测试验"},answer:"A",principle:"性能试验分类"},
  {question:"某电热水器投放市场前，你认为最重要的试验是？",options:{A:"外观审美",B:"安全绝缘测试",C:"价格竞争力",D:"包装设计"},answer:"B",principle:"产品安全试验"},
  {question:"下列关于技术试验的说法正确的是？",options:{A:"只能在产品完成后进行",B:"可以在设计过程中多次进行",C:"只需要一次就可以",D:"只有专业人员才能做"},answer:"B",principle:"技术试验特点"},
  {question:"在设计评价中，从使用者角度进行的评价称为？",options:{A:"专家评价",B:"内部评价",C:"客观评价",D:"用户评价"},answer:"D",principle:"设计评价角度"},
  {question:"一件产品的设计是否成功，最有发言权的评价者是？",options:{A:"设计师",B:"生产厂商",C:"使用者",D:"广告商"},answer:"C",principle:"用户为中心"},
  {question:"下列属于技术文档交流方式的是？",options:{A:"口头交流",B:"图纸交流",C:"模型交流",D:"以上都是"},answer:"D",principle:"技术交流方式"},
  {question:"技术试验报告中，不必包含的内容是？",options:{A:"试验目的",B:"试验过程",C:"试验结果",D:"产品广告词"},answer:"D",principle:"技术文档规范"}
];
const G=[];for(let i=0;i<5;i++)G.push(Q.slice(i*2,i*2+2));

let S={grade:'高一',class:'',students:[],available:[],picks:[],cr:0,cq:0,sa:'',ans:false,rr:[],total:0},_c=0;
function $(i){return document.getElementById(i)}
function sh(i){$(i).classList.remove('hidden')}
function hd(i){$(i).classList.add('hidden')}
function sf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b}
function st(i,m,s){const t=document.createElement('div');t.className='toast';t.innerHTML='<span class="toast-icon">'+i+'</span>'+m+(s?' <span class="toast-pts">'+s+'</span>':'');$('toastContainer').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),250)},3000)}
function fp(x,y,c,cnt){const pc=$('particleContainer');for(let i=0;i<cnt;i++){const e=document.createElement('div');e.className='cele-particle';const a=Math.random()*Math.PI*2,d=60+Math.random()*130;e.style.cssText='left:'+(x||innerWidth/2)+'px;top:'+(y||innerHeight/2)+'px;width:'+(5+Math.random()*7)+'px;height:'+(5+Math.random()*7)+'px;background:'+(c||'var(--bp-cyan)')+';--dx:'+(Math.cos(a)*d)+'px;--dy:'+(Math.sin(a)*d)+'px';pc.appendChild(e);setTimeout(()=>e.remove(),1200)}}
function ud(){try{const h=$('bpBlocks')||$('memBlocks')||$('progressDots')||$('popDots');if(!h)return;h.innerHTML='';for(let i=0;i<5;i++){const e=document.createElement('div');e.className='bp-block'+(i<S.cr?' done':i===S.cr?' active':'');e.innerHTML='';h.appendChild(e)}}catch(e){}}
function sv(g,c,n,p){fetch('/api/scores/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,name:n,points:p,teacher:TEACHER})}).then(r=>r.ok?st('💰','保存','+'+p):st('⚠️','异常')).catch(()=>st('📝','本地'))}
function saveRecord(g,c,s,cc,t,pts,ans,title){fetch('/api/rollcall/save-record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:g,class:c,student:s,type:'互动答题',title:title||'',correctCount:cc,totalQuestions:t,points:pts,answers:ans||[],teacher:TEACHER})}).catch(()=>{})}
async function lc(){const g=$('gradeSelect').value;S.grade=g;const cs=$('classSelect');cs.disabled=true;cs.innerHTML='<option value="">...</option>';try{const r=await fetch('/api/rollcall/classes?grade='+encodeURIComponent(g)+'&teacher='+TEACHER);const cls=await r.json();cs.innerHTML='<option value="">— 选择 —</option>';cls.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o)});cs.disabled=false}catch(e){cs.innerHTML='<option value="">失败</option>'}}
$('gradeSelect').addEventListener('change',lc);$('classSelect').addEventListener('change',async function(){const c=this.value;S.class=c;$('btnStart').disabled=!c;if(c){try{const r=await fetch('/api/rollcall/students?grade='+encodeURIComponent(S.grade)+'&class='+encodeURIComponent(c)+'&teacher='+TEACHER);const data=await r.json();S.students=data.map(s=>s.name)}catch(e){S.students=[];st('⚠️','加载学生失败')}}});
$('btnStart').addEventListener('click',function(){if(!S.class||S.students.length<5){st('⚠️','人数不足');return}hd('sceneSetup');sr(0)});
function sr(ri){S.cr=ri;S.cq=0;_c=0;if(!S.rr[ri])S.rr[ri]={correctCount:0,points:0,answers:[]};S.rr[ri].answers=[];ud();sp()}
function sp(){sh('scenePick');hd('sceneQuiz');hd('sceneScore');hd('sceneFinal');$('pickTitle').textContent=(S.cr+1)+'/5';$('pickHint').textContent='点击抽取';$('pickHint').classList.remove('hidden');$('pickClassTag').classList.add('hidden');$('btnPickStart').classList.remove('hidden');$('btnPickConfirm').classList.add('hidden');$('btnRepick').classList.add('hidden');$('pickName').textContent='——';$('pickName').className='pick-name';$('btnPickStart').disabled=false;$('btnPickStart').textContent='🎲 抽取'}
function rp(){const pool=S.students.length>0?S.students:['---'];const pn=$('pickName');pn.className='pick-name rolling';$('pickHint').textContent='抽取中...';$('btnPickConfirm').classList.add('hidden');$('btnRepick').classList.add('hidden');$('btnPickStart').disabled=true;let rc=0,mx=18+Math.floor(Math.random()*10);let iv=setInterval(()=>{pn.textContent=pool[Math.floor(Math.random()*pool.length)];rc++;if(rc>=mx){clearInterval(iv);fetch('/api/rollcall/pick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,teacher:TEACHER})}).then(d=>d.json()).then(d=>{if(d.error){st('⚠️',d.error);pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false;return}const c=d.student;pn.textContent=c;pn.className='pick-name result';$('pickHint').classList.add('hidden');$('pickClassTag').textContent=S.grade+' · '+S.class;$('pickClassTag').classList.remove('hidden');$('btnPickConfirm').classList.remove('hidden');$('btnRepick').classList.remove('hidden');fp(innerWidth/2,innerHeight/2,'var(--bp-cyan)',30);st('🎯','已选',c);S.picks[S.cr]=c}).catch(()=>{st('⚠️','服务异常');pn.textContent='——';pn.className='pick-name';$('btnPickStart').disabled=false})}},60+Math.random()*40)}

$('btnPickStart').addEventListener('click',function(){this.disabled=true;rp()});
$('btnRepick').addEventListener('click',rp);

$('btnPickConfirm').addEventListener('click',function(){hd('scenePick');sq()});
function sq(){sh('sceneQuiz');S.cq=0;sQ()}
function sQ(){const g=G[S.cr],q=g[S.cq];$('quizTitle').textContent='第'+(S.cr+1)+'组';$('qNumber').textContent=(S.cq+1)+'/2';$('qPrinciple').textContent=q.principle;$('qText').textContent=q.question;S.sa='';S.ans=false;$('feedbackBox').classList.add('hidden');$('btnNextQ').classList.add('hidden');const grid=$('optionsGrid');grid.innerHTML='';['A','B','C','D'].forEach(l=>{const b=document.createElement('button');b.className='option-btn';b.innerHTML='<span class="opt-label">'+l+'</span><span>'+q.options[l]+'</span>';b.dataset.label=l;b.addEventListener('click',()=>hA(l));grid.appendChild(b)})}
function hA(l){if(S.ans)return;S.ans=true;const g=G[S.cr],q=g[S.cq],c=q.answer,ic=l===c;if(ic)_c++;S.rr[S.cr].correctCount=_c;let p=5;if(_c===1)p=10;else if(_c===2)p=15;S.rr[S.cr].points=p;S.rr[S.cr].answers.push({question:q.question,options:q.options,correctAnswer:c,yourAnswer:l,principle:q.principle,isCorrect:ic});const btns=$('optionsGrid').querySelectorAll('.option-btn');btns.forEach(b=>{b.classList.add('disabled');if(b.dataset.label===c)b.classList.add('correct');if(b.dataset.label===l&&!ic)b.classList.add('wrong');if(b.dataset.label===l&&ic)b.classList.add('selected')});const fb=$('feedbackBox');fb.classList.remove('hidden');if(ic){fb.className='feedback-box correct-fb';fb.textContent='✅ '+c+'. '+q.options[c];fp(innerWidth/2,innerHeight-80,'var(--bp-green)',12)}else{fb.className='feedback-box wrong-fb';fb.textContent='❌ 正确答案：'+c+'. '+q.options[c]}$('btnNextQ').classList.remove('hidden');$('btnNextQ').textContent=S.cq===0?'下一题 ▸':'结算'}
$('btnNextQ').addEventListener('click',function(){if(S.cq===0){S.cq=1;sQ()}else{hd('sceneQuiz');sSc()}});
function sSc(){sh('sceneScore');const s=S.picks[S.cr];$('scoreStudent').textContent=s+' · '+S.class;const cr=S.rr[S.cr],cc=cr?.correctCount||0,pts=cr?.points||5;$('scorePoints').textContent='+'+pts;$('scoreLabel').textContent='正确 '+cc+' 题';$('scoreDetail').innerHTML='<div class="score-stat">正确 <strong>'+cc+'</strong></div><div class="score-stat">错误 <strong>'+(2-cc)+'</strong></div><div class="score-stat">保底 <strong>5</strong></div>';sv(S.grade,S.class,s,pts);S.total+=pts;fetch('/api/rollcall/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({grade:S.grade,class:S.class,student:s,result:'quiz',teacher:TEACHER})}).catch(()=>{});saveRecord(S.grade,S.class,s,cc,2,pts,S.rr[S.cr]?.answers,'技术的发展-蓝图');fp(innerWidth/2,innerHeight/2-100,'var(--bp-gold)',25);$('btnNextRound').textContent=S.cr<4?'下一轮 ▸':'完成'}
$('btnNextRound').addEventListener('click',function(){if(S.cr<4){hd('sceneScore');sr(S.cr+1)}else{hd('sceneScore');sF()}});
function sF(){sh('sceneFinal');$('reviewSection').classList.add('hidden');$('btnReview').textContent='📋 查看错题解析';const tb=$('finalBody');tb.innerHTML='';const rows=S.picks.map((n,i)=>{const cr=S.rr[i];return{name:n,correct:cr?.correctCount||0,points:cr?.points||5}}).sort((a,b)=>b.points-a.points);rows.forEach((r,i)=>{const tr=document.createElement('tr');tr.innerHTML='<td class="rank-num">#'+(i+1)+'</td><td>'+r.name+'</td><td>'+r.correct+'/2</td><td class="rank-score">+'+r.points+'</td>';tb.appendChild(tr)});fp(innerWidth/2,innerHeight/2,'var(--bp-cyan)',50);setTimeout(()=>fp(innerWidth/2,innerHeight/2,'var(--bp-gold)',30),400)}
$('btnReview').addEventListener('click',function(){const rs=$('reviewSection');if(!rs.classList.contains('hidden')){rs.classList.add('hidden');this.textContent='📋 查看错题解析';return}this.textContent='📋 收起解析';buildReview();rs.classList.remove('hidden')});
function buildReview(){const rs=$('reviewSection');rs.innerHTML='';let hasWrong=false;const labels=['A','B','C','D'];S.picks.forEach((n,ri)=>{const cr=S.rr[ri];if(!cr||!cr.answers)return;const wrongs=cr.answers.filter(a=>!a.isCorrect);if(!wrongs.length)return;hasWrong=true;let h='<div class="rev-student">⚙ '+n+' · '+S.class+'</div>';wrongs.forEach(a=>{h+='<div class="rev-item"><span class="rev-princ">'+a.principle+'</span><div class="rev-q">'+a.question+'</div><div class="rev-opt-grid">';labels.forEach(l=>{let cls='rev-opt';if(l===a.yourAnswer)cls+=' rev-chosen';if(l===a.correctAnswer)cls+=' rev-right';h+='<div class="'+cls+'"><span class="rev-opt-label">'+l+'</span><span>'+a.options[l]+'</span></div>'});h+='</div></div>'});rs.innerHTML+=h});if(!hasWrong)rs.innerHTML='<div class="rev-empty">\u2705 \u6240\u6709\u540c\u5b66\u5168\u90e8\u7b54\u5bf9\uff01</div>'}
lc();sh('sceneSetup');ud();
</script>
<div class="toast-container" id="toastContainer"></div>
</body>
</html>
