# ═══════════════════════════════════════════════════════
# SmartKBS Desktop - electron-builder 打包配置
#
# 打包策略（白名单机制）：
#   files          → Electron ASAR 中包含的文件
#   extraResources → 复制到 resources/ 目录的额外文件
#   未在以上两项中列出的文件 → 一律不打包
# ═══════════════════════════════════════════════════════

appId: com.smartkbs.desktop
productName: SmartKBS
copyright: "Copyright © 2026 SmartKBS Team"

directories:
  buildResources: resources
  output: release

# ── 进入 ASAR 的文件（Electron 应用代码） ──
# 仅包含桌面应用本身的脚本，不含任何项目源文件
files:
  - main.js
  - preload.js
  - package.json

# ── 额外资源（放在 resources/ 下，不进入 ASAR） ──
# 这里是白名单：只有显式列出的文件才会被打包
extraResources:
  # ① Python 后端（PyInstaller 打包后的完整目录）
  - from: ./backend-dist/smartkb-backend
    to: backend
    filter:
      - "**/*"

  # ② 前端构建产物（Vite 构建后的静态文件）
  - from: ../frontend/dist
    to: static/frontend
    filter:
      - "**/*"

  # ③ 版本信息
  - from: ../version.json
    to: version.json

  # ④ 软件许可
  - from: ../LICENSE
    to: LICENSE

  # ⑤ 用户文档（中英文 README）
  - from: ../README.md
    to: README.md
  - from: ../README.en.md
    to: README.en.md

# ── Windows 安装包配置 ──
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: "${productName}-Setup-${version}.${ext}"

# ── NSIS 安装程序配置 ──
nsis:
  oneClick: false                  # 向导模式安装
  allowToChangeInstallationDirectory: true   # 允许用户选择安装目录
  createDesktopShortcut: true      # 创建桌面快捷方式
  createStartMenuShortcut: true    # 创建开始菜单快捷方式
  shortcutName: SmartKBS
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  license: ../LICENSE
  language: 2052                   # 中文（简体）

# ── macOS 打包配置 ──
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.education

# ── Linux 打包配置 ──
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Education
